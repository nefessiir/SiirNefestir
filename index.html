<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:#17120e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia,serif;
}


/* =====================================================
   KAPALI KITAP
===================================================== */

.closed-book{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            ellipse at center,
            #4b3322 0%,
            #25180e 65%,
            #100a06 100%
        );

    cursor:pointer;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.closed-book.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* =====================================================
   KAPAK
===================================================== */

.cover{
    position:relative;

    width:min(72vw,520px);
    aspect-ratio:.70;

    border-radius:
        7px
        15px
        15px
        7px;

    background:
        linear-gradient(
            135deg,
            #432716 0%,
            #704528 38%,
            #8b5a32 52%,
            #4a2b19 100%
        );

    box-shadow:
        22px 28px 50px rgba(0,0,0,.62),
        inset 7px 0 14px rgba(255,255,255,.08),
        inset -12px 0 22px rgba(0,0,0,.30);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#e8d3a7;

    text-align:center;

    overflow:hidden;
}


/* =====================================================
   KAPAK DIS CERCEVE
===================================================== */

.cover::before{
    content:"";

    position:absolute;

    inset:18px;

    border:
        1px solid rgba(232,211,167,.35);

    border-radius:4px;

    pointer-events:none;
}


/* =====================================================
   KAPAK PENCERESI
===================================================== */

.cover-window{
    position:absolute;

    left:14%;
    right:14%;
    top:12%;
    bottom:17%;

    overflow:hidden;

    border:
        5px solid #392116;

    border-radius:3px;

    background:
        linear-gradient(
            to bottom,
            #b96750 0%,
            #e6a16e 38%,
            #d8bd8b 50%,
            #537481 51%,
            #23495a 100%
        );

    box-shadow:
        inset 0 0 0 2px rgba(232,211,167,.55),
        inset 0 0 25px rgba(0,0,0,.40),
        0 4px 12px rgba(0,0,0,.38);

    pointer-events:none;
}


/* GUNES */

.cover-window span{
    position:absolute;

    width:23%;
    aspect-ratio:1;

    left:53%;
    top:37%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#ffe1a0;

    box-shadow:
        0 0 25px rgba(255,225,160,.75);
}


/* PENCERE DIKEY CERCEVE */

.cover-window::before{
    content:"";

    position:absolute;

    top:0;
    bottom:0;
    left:50%;

    width:3px;

    transform:translateX(-50%);

    background:
        rgba(50,27,17,.78);

    z-index:2;
}


/* PENCERE YATAY CERCEVE */

.cover-window::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:50%;

    height:3px;

    transform:translateY(-50%);

    background:
        rgba(50,27,17,.78);

    z-index:2;
}


/* =====================================================
   KAPAK YAZISI
===================================================== */

.cover-content{
    position:absolute;

    left:0;
    right:0;
    bottom:7%;

    z-index:5;

    padding:0 25px;
}

.cover h1{
    margin:0;

    font-size:
        clamp(28px,5vw,52px);

    letter-spacing:4px;

    font-weight:normal;

    text-shadow:
        0 2px 4px rgba(0,0,0,.45);
}

.cover p{
    margin-top:16px;

    font-size:16px;

    line-height:1.5;

    opacity:.82;
}


/* =====================================================
   KITAP
===================================================== */

.book{
    position:relative;

    /*
       HER SAYFA = 0.70
       ACIK KITAP = 1.40
    */

    width:min(
        94vw,
        calc(84vh * 1.40),
        1350px
    );

    aspect-ratio:1.40;

    height:auto;

    perspective:3200px;

    transform-style:preserve-3d;
}


/* =====================================================
   SOL SABIT SAYFA
===================================================== */

.page-left{
    position:absolute;

    left:0;
    top:0;

    width:50%;
    height:100%;

    overflow:hidden;

    border-radius:
        28px
        5px
        5px
        28px;

    background:
        radial-gradient(
            ellipse at 40% 40%,
            #fff7dc 0%,
            #ead5a7 70%,
            #c4a16d 100%
        );

    box-shadow:
        -14px 18px 35px rgba(0,0,0,.38),
        inset -20px 0 28px rgba(0,0,0,.13);

    transform-origin:right center;

    transform:
        rotateY(4deg)
        translateZ(-5px);

    z-index:10;
}


/* =====================================================
   GUN BATIMI
===================================================== */

.sunset{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            #d98662 0%,
            #edb27e 35%,
            #e6c48d 49%,
            #78929b 50%,
            #456c7b 72%,
            #1c4454 100%
        );
}

.sunset::before{
    content:"";

    position:absolute;

    width:88px;
    height:88px;

    left:52%;
    top:39%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#ffe2a0;

    box-shadow:
        0 0 35px rgba(255,225,160,.75);
}

.sunset::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:49%;

    height:2px;

    background:rgba(255,240,190,.7);
}


/* =====================================================
   SAG SABIT SAYFA
===================================================== */

.page-right{
    position:absolute;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    overflow:hidden;

    border-radius:
        5px
        28px
        28px
        5px;

    background:
        radial-gradient(
            ellipse at 60% 40%,
            #fff9e5 0%,
            #ead8ae 72%,
            #c6a575 100%
        );

    box-shadow:
        14px 18px 35px rgba(0,0,0,.38),
        inset 20px 0 28px rgba(0,0,0,.13);

    transform-origin:left center;

    transform:
        rotateY(-4deg)
        translateZ(-5px);

    z-index:10;
}


/* =====================================================
   ICINDEKILER
===================================================== */

.contents{
    position:absolute;
    inset:0;

    padding:
        clamp(30px,4vw,65px)
        clamp(30px,4.5vw,75px);

    color:#463522;
}

.contents h2{
    margin:
        0 0 30px;

    text-align:center;

    font-size:
        clamp(26px,3vw,40px);

    font-weight:normal;

    letter-spacing:2px;
}

.contents ol{
    margin:0;

    padding-left:30px;

    font-size:
        clamp(17px,1.8vw,23px);

    line-height:1.8;
}

.contents li{
    border-bottom:
        1px solid rgba(80,55,30,.18);
}


/* =====================================================
   CILT
===================================================== */

.binding{
    position:absolute;

    left:50%;
    top:0;

    width:20px;
    height:100%;

    transform:
        translateX(-50%)
        translateZ(18px);

    z-index:80;

    pointer-events:none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.48),
            rgba(255,255,255,.20),
            rgba(0,0,0,.48)
        );

    border-radius:50%;

    box-shadow:
        0 0 14px rgba(0,0,0,.28);
}


/* =====================================================
   CEVRILEN SAYFA
===================================================== */

.turn-page{
    position:absolute;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    z-index:100;

    transform-style:preserve-3d;

    transform-origin:
        left center;

    cursor:grab;

    touch-action:none;

    will-change:transform;

    /*
       Sayfa kesinlikle
       cildin icinden gecmez.
    */

    isolation:isolate;
}

.turn-page.dragging{
    cursor:grabbing;
}


/* =====================================================
   CEVRILEN SAYFA ON
===================================================== */

.page-front{
    position:absolute;

    inset:0;

    overflow:hidden;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    border-radius:
        5px
        28px
        28px
        5px;

    background:
        radial-gradient(
            ellipse at 60% 40%,
            #fff9e5 0%,
            #ead8ae 72%,
            #c6a575 100%
        );

    box-shadow:
        8px 12px 25px rgba(0,0,0,.25),
        inset 15px 0 22px rgba(0,0,0,.08);

    z-index:2;
}


/* =====================================================
   CEVRILEN SAYFA ARKA
===================================================== */

.page-back{
    position:absolute;

    inset:0;

    overflow:hidden;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    transform:
        rotateY(180deg);

    border-radius:
        28px
        5px
        5px
        28px;

    /*
       ONEMLI:
       Arka yuz artik tamamen opak.
       Alttaki gun batimi gorunmez.
    */

    background:
        radial-gradient(
            ellipse at 40% 40%,
            #fff5d9 0%,
            #e5d0a0 72%,
            #bd9c69 100%
        );

    box-shadow:
        -8px 12px 25px rgba(0,0,0,.25),
        inset -15px 0 22px rgba(0,0,0,.08);

    z-index:3;
}


/* =====================================================
   SAYFA KIVRIM
===================================================== */

.turn-page::after{
    content:"";

    position:absolute;

    top:0;
    right:-1px;

    width:32px;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.20),
            rgba(0,0,0,.07),
            transparent
        );

    filter:blur(4px);

    opacity:.75;

    z-index:10;
}


/* =====================================================
   ALT SAG KOSENIN ISARETI
===================================================== */

.corner{
    position:absolute;

    right:8px;
    bottom:8px;

    width:65px;
    height:65px;

    pointer-events:none;

    border-radius:
        0 0 20px 0;

    background:
        linear-gradient(
            135deg,
            transparent 45%,
            rgba(0,0,0,.12) 48%,
            rgba(255,255,255,.50) 60%,
            transparent 68%
        );
}


/* =====================================================
   BUTONLAR
===================================================== */

.controls{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:10px;

    z-index:200;
}

button{
    padding:11px 22px;

    border:0;
    border-radius:8px;

    background:#fff;
    color:#222;

    font-size:15px;

    cursor:pointer;
}

button:hover{
    background:#ddd;
}


/* =====================================================
   MOBIL
===================================================== */

@media(max-width:700px){

    .book{
        width:96vw;

        aspect-ratio:1.40;

        height:auto;
    }

    .cover{
        width:min(82vw,420px);
    }

    .contents{
        padding:
            25px 20px;
    }

    .contents ol{
        padding-left:24px;

        font-size:15px;

        line-height:1.65;
    }

    button{
        padding:10px 15px;

        font-size:13px;
    }

}


/* =====================================================
   BUYUK PC EKRANLARI
===================================================== */

@media(min-width:1400px){

    .book{
        width:min(
            94vw,
            calc(86vh * 1.40),
            1450px
        );
    }

}

</style>
</head>


<body>


<!-- =====================================================
     KAPALI KITAP
===================================================== -->

<div class="closed-book" id="closedBook">

    <div class="cover">

        <div class="cover-window">

            <span></span>

        </div>

        <div class="cover-content">

            <h1>ŞİİR NEFESTİR</h1>

            <p>
                Kelimelerden kızıma,<br>
                insanlara ve hayata...
            </p>

        </div>

    </div>

</div>


<!-- =====================================================
     KITAP
===================================================== -->

<div class="book" id="book">


    <!-- SOL SAYFA -->

    <div class="page-left">

        <div class="sunset"></div>

    </div>


    <!-- SAG SAYFA -->

    <div class="page-right">

        <div class="contents">

            <h2>İçindekiler</h2>

            <ol>

                <li>Deneme 1</li>
                <li>Deneme 2</li>
                <li>Deneme 3</li>
                <li>Deneme 4</li>
                <li>Deneme 5</li>
                <li>Deneme 6</li>
                <li>Deneme 7</li>
                <li>Deneme 8</li>

            </ol>

        </div>

    </div>


    <!-- CILT -->

    <div class="binding"></div>


    <!-- CEVRILEN SAYFA -->

    <div
        class="turn-page"
        id="turnPage"
    >

        <div class="page-front">

            <div class="corner"></div>

        </div>

        <div class="page-back"></div>

    </div>

</div>


<!-- =====================================================
     KONTROLLER
===================================================== -->

<div class="controls">

    <button id="prevBtn">
        ‹ Önceki
    </button>

    <button id="nextBtn">
        Sonraki ›
    </button>

</div>


<script>


/* =====================================================
   ELEMANLAR
===================================================== */

const closedBook =
    document.getElementById("closedBook");

const turnPage =
    document.getElementById("turnPage");

const nextBtn =
    document.getElementById("nextBtn");

const prevBtn =
    document.getElementById("prevBtn");


/* =====================================================
   DURUM
===================================================== */

let progress = 0;

let dragging = false;

let startX = 0;

let startProgress = 0;


/* =====================================================
   KAPAGI AC
===================================================== */

closedBook.addEventListener(
    "click",
    function(){

        closedBook.classList.add(
            "hidden"
        );

    }
);


/* =====================================================
   SAYFAYI CIZ
===================================================== */

function render(){

    /*
       0 = sagda
       1 = solda
    */

    const angle =
        -180 * progress;


    /*
       Onceki kodda rotateX
       ve rotateZ sayfayi
       fazla egiyordu.

       Bu da sayfanin
       iceri cekiliyormus gibi
       gorunmesine neden oluyordu.

       Simdi sadece cok hafif
       fiziksel egim kullaniyoruz.
    */

    const curve =
        Math.sin(
            progress * Math.PI
        );


    const rotateX =
        curve * 0.45;


    const rotateZ =
        curve * 0.20;


    turnPage.style.transform =
        `
        rotateY(${angle}deg)
        rotateX(${rotateX}deg)
        rotateZ(${rotateZ}deg)
        `;


    /*
       GOLGE
    */

    const shadow =
        .08 +
        curve * .14;


    turnPage.style.filter =
        `
        drop-shadow(
            3px 6px 14px
            rgba(0,0,0,${shadow})
        )
        `;
}


/* =====================================================
   ANIMASYON
===================================================== */

function animateTo(target){

    const from =
        progress;

    const duration =
        650;

    const start =
        performance.now();


    function frame(now){

        let t =
            (now - start) /
            duration;


        if(t > 1){
            t = 1;
        }


        const eased =
            1 -
            Math.pow(
                1 - t,
                3
            );


        progress =
            from +
            (target - from) *
            eased;


        render();


        if(t < 1){

            requestAnimationFrame(
                frame
            );

        }else{

            progress =
                target;

            render();
        }
    }


    requestAnimationFrame(frame);
}


/* =====================================================
   FARE / PARMAK BASLANGICI
===================================================== */

turnPage.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        startX =
            e.clientX;

        startProgress =
            progress;

        turnPage.classList.add(
            "dragging"
        );

        turnPage.setPointerCapture(
            e.pointerId
        );
    }
);


/* =====================================================
   SURUKLE
===================================================== */

turnPage.addEventListener(
    "pointermove",
    function(e){

        if(!dragging){
            return;
        }


        const rect =
            document
            .getElementById("book")
            .getBoundingClientRect();


        const halfWidth =
            rect.width / 2;


        const distance =
            startX -
            e.clientX;


        const change =
            distance /
            halfWidth;


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    startProgress +
                    change
                )
            );


        render();
    }
);


/* =====================================================
   BIRAK
===================================================== */

turnPage.addEventListener(
    "pointerup",
    function(){

        if(!dragging){
            return;
        }


        dragging = false;

        turnPage.classList.remove(
            "dragging"
        );


        if(progress >= .5){

            animateTo(1);

        }else{

            animateTo(0);

        }
    }
);


/* =====================================================
   IPTAL
===================================================== */

turnPage.addEventListener(
    "pointercancel",
    function(){

        dragging = false;

        turnPage.classList.remove(
            "dragging"
        );


        animateTo(
            progress >= .5
            ? 1
            : 0
        );
    }
);


/* =====================================================
   BUTONLAR
===================================================== */

nextBtn.addEventListener(
    "click",
    function(){

        animateTo(1);

    }
);


prevBtn.addEventListener(
    "click",
    function(){

        animateTo(0);

    }
);


/* =====================================================
   KLAVYE
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){

            animateTo(1);

        }

        if(e.key === "ArrowRight"){

            animateTo(0);

        }

    }
);


/* =====================================================
   BASLANGIC
===================================================== */

render();

</script>

</body>
</html>
