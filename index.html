<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* KITAP SAHNESI */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* ARKA PLAN VE SAYFA AYNI OLCEKTE */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: visible;
}


/* ARKA PLAN */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* SABIT SAG SAYFA */

.right-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;

    z-index: 2;
}


/* SABIT SOL SAYFA */

.left-page {
    position: absolute;

    left: 19%;
    top: 13.2%;

    width: 34%;
    height: calc(100% - 27.5%);

    display: block;

    pointer-events: none;

    transform: scaleX(-1);

    z-index: 2;
}


/* SIIR METINLERI */

.poem-text {
    position: absolute;

    top: 23%;
    width: 25%;
    height: 61%;

    z-index: 5;

    color: #174a82;

    font-family:
        "Caveat",
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size: clamp(17px, 1.35vw, 23px);

    font-weight: 500;

    line-height: 1.55;

    letter-spacing: 0.01em;

    white-space: pre-line;

    overflow: hidden;

    text-shadow:
        0.2px 0.2px 0 rgba(23, 74, 130, 0.22);

    opacity: 1;

    transition:
        opacity 1.2s ease;
}


/* SOL SIIR */

.left-poem {
    left: 23%;

    text-align: left;
}


/* SAG SIIR */

.right-poem {
    left: 53%;

    text-align: left;
}


/* SAYFA GECISINDE SILINME */

.poem-text.fade-out {
    opacity: 0;
}


/* =================================================
   SOL ALTTAKI SABIT KALEM + MUREKKEP
   ================================================= */

.corner-quill {
    position: absolute;

    left: 1.5%;
    bottom: -1%;

    width: 140px;
    height: auto;

    z-index: 6;

    pointer-events: none;
    user-select: none;

    opacity: 0.96;
}


/* =================================================
   YAZIYI YAZAN ALTIN TUY KALEM
   ================================================= */

.writing-quill {
    position: absolute;

    width: 78px;
    height: auto;

    z-index: 10;

    pointer-events: none;
    user-select: none;

    opacity: 0;

    transform-origin: 8% 88%;

    transition:
        left 0.12s linear,
        top 0.12s linear,
        opacity 0.25s ease;
}


/* SAG OK */

.page-arrow {
    position: absolute;

    top: 50%;
    left: 88%;

    width: 30px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255, 255, 255, 0.72);

    font-family: Arial, sans-serif;

    font-size: 38px;
    font-weight: 300;

    line-height: 1;

    cursor: pointer;
    user-select: none;

    z-index: 20;

    transform: translateY(-50%);

    text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.8);

    transition:
        color 0.25s ease,
        transform 0.25s ease,
        text-shadow 0.25s ease;
}


/* OK UZERINE GELINCE */

.page-arrow:hover {

    color: rgba(255, 255, 255, 0.95);

    transform:
        translateY(-50%)
        scale(1.08);

    text-shadow:
        0 0 7px rgba(255, 255, 255, 0.45),
        0 1px 4px rgba(0, 0, 0, 0.8);
}


/* OKA BASILDIGINDA PARLAMA */

.page-arrow.flash {

    animation:
        arrowFlash 0.55s ease;
}


@keyframes arrowFlash {

    0% {

        color:
            rgba(255, 255, 255, 0.72);

        text-shadow:
            0 1px 3px rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1);

    }


    35% {

        color: #ffffff;

        text-shadow:
            0 0 5px rgba(255, 255, 255, 0.65),
            0 0 12px rgba(255, 255, 255, 0.45),
            0 1px 4px rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1.16);

    }


    100% {

        color:
            rgba(255, 255, 255, 0.72);

        text-shadow:
            0 1px 3px rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1);

    }

}


/* ANIMASYON SIRASINDA OK KAPALI */

.page-arrow.disabled {
    pointer-events: none;

    opacity: 0.35;
}


/* GIZLI OLCUM ALANI */

.measure-poem {
    position: absolute;

    visibility: hidden;

    pointer-events: none;

    left: -99999px;
    top: 0;

    white-space: pre-line;

    overflow: hidden;
}

</style>
</head>


<body>

<div class="page">

    <div class="book-stage">

        <!-- ARKA PLAN -->

        <img

        >


        <!-- SABIT SAG SAYFA -->

        <img

        <!-- SABIT SOL SAYFA -->

        <img

        <!-- SAG OK -->

        <div
            id="nextArrow"

        >

        </div>

    </div>

</div>


<script>

/* =========================================
   DEMO SIIR
   ========================================= */

const poems = [

`Haydi Abbas, vakit tamam;
Akşam diyordun işte oldu akşam.
Kur bakalım çilingir soframızı;
Dinsin artık bu kalb ağrısı.
Şu ağacın gölgesinde olsun;
Tam kenarında havuzun.
Aya haber sal çıksın bu gece;
Görünsün şöyle gönlümce.
Bas kırbacı sihirli seccadeye,
Göster hükmettiğini mesafeye
Ve zamana.
Katıp tozu dumana,
Var git,
Böyle ferman etti Cahit,
Al getir ilk sevgiliyi Beşiktaş'tan;
Yaşamak istiyorum gençliğimi yeni baştan.`

];


/* =========================================
   ELEMENTLER
   ========================================= */

const leftPoem =
    document.getElementById("leftPoem");

const rightPoem =
    document.getElementById("rightPoem");

const nextArrow =
    document.getElementById("nextArrow");

const writingQuill =
    document.getElementById("writingQuill");


/* =========================================
   DURUM
   ========================================= */

let pages = [];

let currentSpread = 0;

let isAnimating = false;

let typingTimers = [];


/* =========================================
   SAYFA OLCUMU
   ========================================= */

function createMeasureElement(sourceElement) {

    const measure =
        document.createElement("div");

    measure.className =
        "measure-poem";

    const styles =
        window.getComputedStyle(sourceElement);

    measure.style.width =
        styles.width;

    measure.style.height =
        styles.height;

    measure.style.fontFamily =
        styles.fontFamily;

    measure.style.fontSize =
        styles.fontSize;

    measure.style.fontWeight =
        styles.fontWeight;

    measure.style.lineHeight =
        styles.lineHeight;

    measure.style.letterSpacing =
        styles.letterSpacing;

    measure.style.textShadow =
        styles.textShadow;

    document.body.appendChild(measure);

    return measure;
}


/* =========================================
   SAYFAYA SIGIYOR MU
   ========================================= */

function fitsOnPage(
    text,
    sourceElement,
    measureElement
) {

    measureElement.textContent =
        text;

    return (
        measureElement.scrollHeight <=
        sourceElement.clientHeight + 1
    );
}


/* =========================================
   SIIRI SAYFALARA BOL
   ========================================= */

function paginatePoem(poem) {

    const lines =
        poem.split("\n");

    const measure =
        createMeasureElement(leftPoem);

    const result = [];

    let currentText = "";


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];

        const candidate =
            currentText === ""
                ? line
                : currentText + "\n" + line;


        if (
            fitsOnPage(
                candidate,
                leftPoem,
                measure
            )
        ) {

            currentText =
                candidate;

            continue;
        }


        if (currentText !== "") {

            result.push(
                currentText
            );

            currentText =
                line;

        } else {

            result.push(
                line
            );

            currentText = "";
        }
    }


    if (currentText !== "") {

        result.push(
            currentText
        );
    }


    measure.remove();

    return result;
}


/* =========================================
   BUTUN SIIRLERI SAYFALANDIR
   ========================================= */

function buildPages() {

    pages = [];

    poems.forEach(function(poem) {

        const chunks =
            paginatePoem(poem);


        for (
            let i = 0;
            i < chunks.length;
            i += 2
        ) {

            pages.push({

                left:
                    chunks[i] || "",

                right:
                    chunks[i + 1] || ""

            });
        }

    });
}


/* =========================================
   ZAMANLAYICILARI TEMIZLE
   ========================================= */

function clearTypingTimers() {

    typingTimers.forEach(
        function(timer) {

            clearTimeout(timer);

        }
    );

    typingTimers = [];
}


/* =========================================
   KALEM POZISYONU
   ========================================= */

function moveWritingQuill(element) {

    if (!element || !element.textContent) {
        writingQuill.style.opacity = "0";
        return;
    }


    const stageRect =
        document
            .querySelector(".book-stage")
            .getBoundingClientRect();


    const textRect =
        element.getBoundingClientRect();


    const range =
        document.createRange();


    const textNode =
        element.firstChild;


    if (!textNode) {
        return;
    }


    range.setStart(
        textNode,
        Math.max(
            0,
            textNode.length - 1
        )
    );

    range.setEnd(
        textNode,
        textNode.length
    );


    const rect =
        range.getBoundingClientRect();


    if (!rect.width && !rect.height) {
        return;
    }


    const x =
        rect.right -
        stageRect.left -
        7;


    const y =
        rect.bottom -
        stageRect.top -
        19;


    writingQuill.style.left =
        x + "px";

    writingQuill.style.top =
        y + "px";

    writingQuill.style.opacity =
        "0.95";
}
