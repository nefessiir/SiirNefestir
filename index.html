<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Şiir Nefestir</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #0d0d0d;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

/* =========================================
   KITAP SAHNESI VE 3D PERSPEKTIF
========================================= */

.book-stage {
    position: relative;
    width: min(96vw, 140vh);
    height: min(96vh, 65vw);
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    background: #1e1915;
    background-image: 
        radial-gradient(circle at 50% 50%, rgba(244, 230, 208, 0.08) 0%, transparent 80%),
        linear-gradient(to bottom, #14100d, #261f1a, #14100d);
    box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 100px rgba(0,0,0,0.8);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
    container-type: inline-size;
}

/* 3D Sahne Konteyneri - Omurga ile tam hizalanma sağlar */
.book-3d-wrapper {
    position: absolute;
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    perspective: 2000px;
}

/* =========================================
   SAYFA TABAN DOKULERI
========================================= */

.page-bg-texture {
    position: absolute;
    inset: 0;
    background: #f8f1e5;
    background-image: 
        linear-gradient(to right, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.02) 8%, rgba(0,0,0,0) 15%),
        radial-gradient(circle at 50% 50%, #fbf6ed 0%, #ede1cc 100%);
    box-shadow: inset 0 0 30px rgba(160, 130, 90, 0.25);
}

.left-page .page-bg-texture {
    background-image: 
        linear-gradient(to left, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.03) 8%, rgba(0,0,0,0) 15%),
        radial-gradient(circle at 50% 50%, #fbf6ed 0%, #ede1cc 100%);
    border-radius: 6px 0 0 6px;
}

.right-page .page-bg-texture {
    border-radius: 0 6px 6px 0;
}

/* ORTA OMURGA GÖLGESİ */
.spine-shadow {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 40px;
    transform: translateX(-50%);
    background: linear-gradient(to right, 
        rgba(0,0,0,0) 0%, 
        rgba(0,0,0,0.25) 35%, 
        rgba(0,0,0,0.45) 50%, 
        rgba(0,0,0,0.25) 65%, 
        rgba(0,0,0,0) 100%);
    z-index: 20;
    pointer-events: none;
}

/* =========================================
   SAYFA YERLEŞİMLERİ (OMURGAYA SIFIRLI)
========================================= */

.page {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    overflow: hidden;
}

.left-page {
    left: 0;
    z-index: 2;
}

.right-page {
    left: 50%;
    z-index: 2;
    cursor: grab;
}

.right-page:active {
    cursor: grabbing;
}

/* =========================================
   SAYFA İÇERİĞİ VE ŞİİR METNİ
========================================= */

.page-content {
    position: absolute;
    left: 12%;
    top: 10%;
    width: 76%;
    height: 80%;
    overflow: hidden;
    z-index: 5;
}

.poem {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 0;
    color: #1a385c;
    font-family: "Caveat", cursive;
    font-size: 2.1cqw;
    font-weight: 500;
    line-height: 1.55;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: normal;
    opacity: 0;
    transition: opacity 0.8s ease;
}

/* =========================================
   SÜRÜKLENEN SAYFA KATMANI (FLIPPER)
   Omurgaya %100 Kilitli Eksen
========================================= */

.flipper {
    position: absolute;
    top: 0;
    left: 50%; /* Tam Omurga Ekseni */
    width: 50%;
    height: 100%;
    transform-origin: left center !important; /* Omurgadan Ayrılmaz */
    transform-style: preserve-3d;
    z-index: 30;
    pointer-events: none;
    display: none;
}

.flipper.active {
    display: block;
}

.flipper-face {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    backface-visibility: hidden;
    overflow: hidden;
}

.flipper-front {
    z-index: 2;
    transform: rotateY(0deg);
}

.flipper-back {
    z-index: 1;
    transform: rotateY(180deg);
}

/* Sağ Alt Köşe Bükülme ve Gölge Doku Katmanı */
.curl-shadow-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(135deg, transparent 55%, rgba(0,0,0,0.08) 75%, rgba(0,0,0,0.3) 100%);
}

/* =========================================
   TÜY KALEM DOKULARI
========================================= */

.quill-watermark {
    position: absolute;
    width: 60%;
    height: 60%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-30deg);
    opacity: 0.08;
    pointer-events: none;
    z-index: 1;
}

.quill-watermark-flip {
    transform: translate(-50%, -50%) scaleX(-1) rotate(-30deg);
}

/* =========================================
   KÖŞE KALEM SÜSÜ
========================================= */

.ink-quill {
    position: absolute;
    width: 7cqw;
    height: auto;
    left: 3%;
    bottom: 3%;
    z-index: 40;
    pointer-events: none;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
}

/* =========================================
   OKLAR VE BUTONLAR
========================================= */

.nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 5cqw;
    height: 5cqw;
    border: none;
    background: rgba(0,0,0,0.25);
    border-radius: 50%;
    color: rgba(255,255,255,0.7);
    font-size: 3.5cqw;
    line-height: 1;
    cursor: pointer;
    z-index: 50;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-arrow:hover {
    color: #fff;
    background: rgba(0,0,0,0.5);
    transform: translateY(-50%) scale(1.1);
}

.left-arrow { left: 2%; }
.right-arrow { right: 2%; }

.top-controls {
    position: absolute;
    top: 3%;
    left: 3%;
    z-index: 60;
    display: flex;
    gap: 1cqw;
}

.control-button {
    width: 3.8cqw;
    height: 3.8cqw;
    min-width: 28px;
    min-height: 28px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    background: rgba(0,0,0,0.3);
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    font-size: 1.8cqw;
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-button:hover {
    background: rgba(0,0,0,0.6);
    color: #fff;
}

.equalizer {
    position: absolute;
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 0.4cqw;
    height: 2.5cqw;
    z-index: 40;
}

.equalizer span {
    display: block;
    width: 0.3cqw;
    min-width: 2px;
    height: 30%;
    background: rgba(255,255,255,0.4);
    border-radius: 2px;
}
</style>
</head>

<body>

<div class="book-stage" id="bookStage">

    <!-- ÜST KONTROLLER -->
    <div class="top-controls">
        <button class="control-button" title="Sesli dinle" onclick="toggleAudio()">🔊</button>
        <button class="control-button" title="Tam ekran" onclick="toggleFullscreen()">⛶</button>
    </div>

    <!-- 3D KİTAP ALANI -->
    <div class="book-3d-wrapper" id="bookWrapper">

        <!-- OMURGA GÖLGESİ -->
        <div class="spine-shadow"></div>

        <!-- SOL SAYFA -->
        <div class="page left-page" id="leftPage">
            <div class="page-bg-texture"></div>
            <svg class="quill-watermark quill-watermark-flip" viewBox="0 0 24 24" fill="#1a385c"><path d="M21 3C21 3 14 4 10 9C6 14 4 20 4 20C4 20 8 19 12 15C16 11 21 3 21 3Z"/></svg>
            <div class="page-content">
                <div class="poem" id="leftPoem"></div>
            </div>
        </div>

        <!-- SAĞ SAYFA -->
        <div class="page right-page" id="rightPage">
            <div class="page-bg-texture"></div>
            <svg class="quill-watermark" viewBox="0 0 24 24" fill="#1a385c"><path d="M21 3C21 3 14 4 10 9C6 14 4 20 4 20C4 20 8 19 12 15C16 11 21 3 21 3Z"/></svg>
            <div class="page-content">
                <div class="poem" id="rightPoem"></div>
            </div>
        </div>

        <!-- SÜRÜKLENEN / DÖNEN SAYFA (FLIPPER) -->
        <div class="flipper" id="flipper">
            <!-- Ön Yüz (Sağ Sayfadan Başlar) -->
            <div class="flipper-face flipper-front">
                <div class="page-bg-texture" style="border-radius: 0 6px 6px 0;"></div>
                <svg class="quill-watermark" viewBox="0 0 24 24" fill="#1a385c"><path d="M21 3C21 3 14 4 10 9C6 14 4 20 4 20C4 20 8 19 12 15C16 11 21 3 21 3Z"/></svg>
                <div class="page-content">
                    <div class="poem" id="flipperFrontPoem" style="opacity: 1;"></div>
                </div>
                <div class="curl-shadow-overlay"></div>
            </div>
            <!-- Arka Yüz (Sol Sayfaya Dönüşür) -->
            <div class="flipper-face flipper-back">
                <div class="page-bg-texture" style="border-radius: 6px 0 0 6px;"></div>
                <svg class="quill-watermark quill-watermark-flip" viewBox="0 0 24 24" fill="#1a385c"><path d="M21 3C21 3 14 4 10 9C6 14 4 20 4 20C4 20 8 19 12 15C16 11 21 3 21 3Z"/></svg>
                <div class="page-content">
                    <div class="poem" id="flipperBackPoem" style="opacity: 1;"></div>
                </div>
                <div class="curl-shadow-overlay"></div>
            </div>
        </div>

    </div>

    <!-- KALEM SÜSÜ -->
    <svg class="ink-quill" viewBox="0 0 100 100" fill="none">
        <path d="M80 10C80 10 40 30 20 70C15 80 10 90 10 90C10 90 20 85 30 80C70 60 90 20 90 20Z" fill="#2c1a0e"/>
        <path d="M10 90L22 78" stroke="#d4af37" stroke-width="3"/>
    </svg>

    <!-- GEZİNTİ OKLARI -->
    <button class="nav-arrow left-arrow" onclick="previousPage()">‹</button>
    <button class="nav-arrow right-arrow" onclick="nextPage()">›</button>

    <!-- EQUALIZER -->
    <div class="equalizer">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

</div>

<script>
/* ELEMANLAR */
const leftPoem = document.getElementById("leftPoem");
const rightPoem = document.getElementById("rightPoem");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const bookWrapper = document.getElementById("bookWrapper");

const flipper = document.getElementById("flipper");
const flipperFrontPoem = document.getElementById("flipperFrontPoem");
const flipperBackPoem = document.getElementById("flipperBackPoem");

/* ŞİİR METNİ */
const poemText =
`Yoksam düşlerinde
Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor

Bir sessizlik büyüyor
İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor

Ben seni beklerken
Zaman ağır ağır geçiyor
Her geçen gün biraz daha
İçimde büyüyor özlemin

Bir gün dönersin diye
Penceremde ışık yanıyor
Gecenin en sessiz yerinde
Adını fısıldıyor rüzgar

Belki uzaklardasın
Belki hemen yanımdasın
Ama ben yine de seni
Kalbimin içinde arıyorum

Ne zaman gözlerimi kapatsam
Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun

Yoksam düşlerinde
Bir gün hatırla beni
Çünkü ben bu dünyada
Seni beklemek için vardım

Bekle…!
Geliyorum!`;

/* YAZI BOYUTU VE SAYFA HESAPLAMA */
const measurePoem = document.createElement("div");
measurePoem.style.position = "absolute";
measurePoem.style.visibility = "hidden";
measurePoem.style.pointerEvents = "none";
measurePoem.style.fontFamily = '"Caveat", cursive';
measurePoem.style.whiteSpace = "nowrap";
document.body.appendChild(measurePoem);

function measureTextWidth(text, fontSize) {
    measurePoem.style.fontSize = fontSize;
    measurePoem.textContent = text;
    return measurePoem.getBoundingClientRect().width;
}

function getWrappedLines() {
    const pageContent = document.querySelector(".left-page .page-content");
    const availableWidth = pageContent.getBoundingClientRect().width;
    const currentFontSize = window.getComputedStyle(leftPoem).fontSize;
    const rawLines = poemText.split("\n");
    const result = [];

    for (const rawLine of rawLines) {
        if (rawLine.trim() === "") {
            result.push("");
            continue;
        }
        const words = rawLine.split(/\s+/);
        let currentLine = "";
        for (const word of words) {
            const testLine = currentLine ? currentLine + " " + word : word;
            if (measureTextWidth(testLine, currentFontSize) <= availableWidth) {
                currentLine = testLine;
            } else {
                if (currentLine) result.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine) result.push(currentLine);
    }
    return result;
}

function buildPages() {
    const lines = getWrappedLines();
    const pageContent = document.querySelector(".left-page .page-content");
    const pageRect = pageContent.getBoundingClientRect();

    const test = document.createElement("div");
    test.style.position = "absolute";
    test.style.visibility = "hidden";
    test.style.pointerEvents = "none";
    test.style.width = pageRect.width + "px";
    test.style.fontFamily = '"Caveat", cursive';
    test.style.fontSize = window.getComputedStyle(leftPoem).fontSize;
    test.style.lineHeight = "1.55";
    test.style.whiteSpace = "pre-wrap";
    test.textContent = "A";

    document.body.appendChild(test);
    const lineHeight = test.getBoundingClientRect().height;
    test.remove();

    const linesPerPage = Math.max(1, Math.floor(pageRect.height / lineHeight));
    const pagesList = [];
    for (let i = 0; i < lines.length; i += linesPerPage) {
        pagesList.push(lines.slice(i, i + linesPerPage));
    }
    return pagesList;
}

/* DURUM DEĞİŞKENLERİ */
let pages = [];
let pageIndex = 0;
let stageState = "left";
let animating = false;

function fadeIn(element) {
    element.style.opacity = "0";
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            element.style.opacity = "1";
        });
    });
}

function fadeOut(element) {
    element.style.opacity = "0";
}

function startBook() {
    pages = buildPages();
    pageIndex = 0;
    stageState = "left";

    leftPoem.textContent = pages[0] ? pages[0].join("\n") : "";
    rightPoem.textContent = "";

    leftPoem.style.opacity = "0";
    rightPoem.style.opacity = "0";
}

/* OMURGAYA kilitli CANLI SÜRÜKLEME (DRAG/TOUCH) MANTIĞI */
let isDragging = false;
let startX = 0;
let currentProgress = 0;

function onPointerDown(e) {
    if (animating) return;
    
    const rightRect = rightPage.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    if (!clientX || !clientY) return;

    // Sağ sayfa alanından başlarsa yakala
    if (clientX >= rightRect.left && clientX <= rightRect.right + 20 &&
        clientY >= rightRect.top && clientY <= rightRect.bottom) {
        
        isDragging = true;
        startX = clientX;
        
        if (stageState === "spread") {
            const nextLeftIndex = pageIndex + 2;
            flipperFrontPoem.textContent = rightPoem.textContent;
            flipperBackPoem.textContent = pages[nextLeftIndex] ? pages[nextLeftIndex].join("\n") : "";
        } else if (stageState === "right") {
            flipperFrontPoem.textContent = rightPoem.textContent;
            flipperBackPoem.textContent = "";
        } else {
            flipperFrontPoem.textContent = "";
            flipperBackPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        }

        flipper.style.transition = "none";
        flipper.classList.add("active");
    }
}

function onPointerMove(e) {
    if (!isDragging) return;

    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    if (!clientX) return;

    const deltaX = startX - clientX;
    const maxDistance = bookWrapper.getBoundingClientRect().width * 0.5;
    
    currentProgress = Math.min(Math.max(deltaX / maxDistance, 0), 1);

    const angle = currentProgress * -180;
    // Sağ alt köşeden kıvrılma kavisleri
    const skew = Math.sin(currentProgress * Math.PI) * -3;
    const translateY = Math.sin(currentProgress * Math.PI) * -1.5;

    flipper.style.transform = `rotateY(${angle}deg) rotateZ(${skew}deg) translateY(${translateY}%)`;
}

async function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;

    flipper.style.transition = "transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)";

    if (currentProgress > 0.3) {
        // Eşik geçildi: Sol sayfaya sıfır oturarak yapışır
        flipper.style.transform = `rotateY(-180deg) rotateZ(0deg) translateY(0%)`;
        await wait(500);

        if (stageState === "spread") {
            pageIndex += 2;
            leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
            rightPoem.textContent = pages[pageIndex + 1] ? pages[pageIndex + 1].join("\n") : "";
            leftPoem.style.opacity = "1";
            rightPoem.style.opacity = pages[pageIndex + 1] ? "1" : "0";
            stageState = pages[pageIndex + 1] ? "spread" : "right";
        } else if (stageState === "right") {
            if (pageIndex + 1 < pages.length) {
                rightPoem.textContent = pages[pageIndex + 1].join("\n");
                fadeIn(rightPoem);
                stageState = "spread";
            }
        } else if (stageState === "left") {
            leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
            fadeIn(leftPoem);
            stageState = "right";
        }
    } else {
        // Eşik geçilemedi: Geri yerine esner
        flipper.style.transform = `rotateY(0deg) rotateZ(0deg) translateY(0%)`;
        await wait(500);
    }

    flipper.classList.remove("active");
    flipper.style.transform = "";
}

/* EVENT LISTENERS */
window.addEventListener("mousedown", onPointerDown);
window.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerUp);

window.addEventListener("touchstart", onPointerDown, { passive: true });
window.addEventListener("touchmove", onPointerMove, { passive: true });
window.addEventListener("touchend", onPointerUp);

/* BUTON İLE SAYFA ÇEVİRME */
async function nextPage() {
    if (animating) return;
    animating = true;

    if (stageState === "left") {
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        fadeIn(leftPoem);
        stageState = "right";
        await wait(1000);
        animating = false;
        return;
    }

    if (stageState === "right") {
        if (pageIndex + 1 < pages.length) {
            rightPoem.textContent = pages[pageIndex + 1].join("\n");
            fadeIn(rightPoem);
            stageState = "spread";
            await wait(1000);
            animating = false;
            return;
        }
        stageState = "spread";
        animating = false;
        return;
    }

    if (stageState === "spread") {
        const nextLeftIndex = pageIndex + 2;
        const nextRightIndex = pageIndex + 3;

        flipperFrontPoem.textContent = rightPoem.textContent;
        flipperBackPoem.textContent = pages[nextLeftIndex] ? pages[nextLeftIndex].join("\n") : "";

        flipper.style.transition = "transform 1.1s cubic-bezier(0.4, 0, 0.2, 1)";
        flipper.classList.add("active");

        requestAnimationFrame(() => {
            flipper.style.transform = "rotateY(-180deg)";
        });

        rightPoem.textContent = pages[nextRightIndex] ? pages[nextRightIndex].join("\n") : "";

        await wait(1100);

        pageIndex += 2;
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        leftPoem.style.opacity = "1";

        flipper.classList.remove("active");
        flipper.style.transform = "";

        if (pageIndex < pages.length) {
            stageState = "right";
        } else {
            stageState = "finished";
        }

        animating = false;
        return;
    }
}

async function previousPage() {
    if (animating || (pageIndex === 0 && stageState === "left")) return;
    animating = true;

    if (stageState === "right") {
        fadeOut(leftPoem);
        await wait(800);
        stageState = "left";
        animating = false;
        return;
    }

    if (stageState === "spread") {
        fadeOut(rightPoem);
        await wait(800);
        stageState = "right";
        animating = false;
        return;
    }

    if (stageState === "finished" || (stageState === "left" && pageIndex >= 2)) {
        pageIndex = Math.max(0, pageIndex - 2);
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        rightPoem.textContent = pages[pageIndex + 1] ? pages[pageIndex + 1].join("\n") : "";
        fadeIn(leftPoem);
        if (pages[pageIndex + 1]) fadeIn(rightPoem);
        stageState = pages[pageIndex + 1] ? "spread" : "right";
        await wait(800);
    }

    animating = false;
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

function toggleAudio() {
    alert("Ses oynatma başlatıldı/durduruldu.");
}

let resizeTimer;
window.addEventListener("load", () => {
    setTimeout(startBook, 300);
});

window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        pages = buildPages();
    }, 200);
});
</script>

</body>
</html>
