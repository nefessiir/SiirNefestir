<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;

    background-image: url("yeni_arka_plan0.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Kapağın bulunduğu alan */
.kitap-alani {
    width: 39%;
    height: calc(82vh + 4cm);

    transform: translateX(10cm);

    position: relative;
}

/* Kapak */
.kitap-kapak {
    width: calc(100% - 2cm);
    height: calc(100% - 2cm);

    position: absolute;

    left: 1cm;
    top: 1cm;

    cursor: pointer;
}

/* Ön ve arka yüz */
.kapak-on,
.kapak-arka {
    width: 100%;
    height: 100%;

    position: absolute;

    left: 0;
    top: 0;
}

/* Ön kapak */
.kapak-on {
    background-image: url("kitap_kapagi.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

/* İç kapak */
.kapak-arka {
    background: #d8c08d;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.18);

    display: none;
}

/* Açıldığında ön kapak kaybolur,
   aynı ölçüde iç kapak görünür */
.kitap-kapak.acik .kapak-on {
    display: none;
}

.kitap-kapak.acik .kapak-arka {
    display: block;
}

</style>

</head>

<body>

<div class="kitap-alani">

```
<div
    class="kitap-kapak"
    id="kitapKapak"
>

    <div class="kapak-on"></div>

    <div class="kapak-arka"></div>

</div>
```

</div>

<script>

const kitapKapak = document.getElementById("kitapKapak");

kitapKapak.addEventListener("click", function () {

    kitapKapak.classList.toggle("acik");

});

</script>

</body>
</html>
