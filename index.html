<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* KİTAP KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. SAĞda SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTAP GÖVDESİ */
.acik-kitap-alan {
    position: absolute;
    top: 0.5cm;
    left: calc(-100% - 0.6cm);
    width: calc(200% - 1.3cm);
    height: calc(100% - 1cm);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.1882);
    transform-origin: left center;
    clip-path: inset(0 0 0 100%);
    transition: opacity 0.8s ease-in-out, clip-path 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.kitap-kapsayici.acildi .acik-kitap-alan {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transition: opacity 0.4s ease-in-out 0.6s, clip-path 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) 0.6s;
}

.acik-kitap-alan img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTABIN SOL KANAT YAZI ALANI (1. Sayfa) */
.sol-kanat-yazi {
    position: absolute;
    top: 0.8cm;
    left: calc(0.75cm + 0.3cm + 1.2cm);
    width: calc(50% - 2.5cm);
    height: calc(100% - 1.5cm);
    font-family: 'Dancing Script', cursive, serif;
    font-size: 11pt;
    line-height: 1.35;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 3px rgba(26, 75, 130, 0.35), 0 0 1px rgba(26, 75, 130, 0.6);
    box-sizing: border-box;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    hyphens: none;
    white-space: pre-wrap;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sol-kanat-yazi {
    opacity: 1;
    transition: opacity 0.3s ease-in-out 1.1s;
}

/* BAŞLIKLARIN ORTALANMASI */
.sol-kanat-yazi .sayfa-baslik,
.sayfa-yazi .sayfa-baslik {
    text-align: center;
    display: block;
    width: 100%;
    font-weight: 700;
    font-size: 1.2em;
    margin-top: 0.3em; 
    margin-bottom: 0.2em;
}

/* SAYFA NUMARASI STİLİ */
.sayfa-numara {
    position: absolute;
    bottom: 0.4cm;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Dancing Script', cursive, serif;
    font-size: 10pt;
    color: #1a4b82;
    text-shadow: 0 0 2px rgba(26, 75, 130, 0.3);
    pointer-events: none;
    letter-spacing: 2px;
}

/* ÇOKLU SAYFA KONTEYNERİ */
.sayfalar-kapsayici {
    position: absolute;
    top: 0.5cm;
    left: 0;
    width: 100%;
    height: calc(100% - 1cm);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sayfalar-kapsayici {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.3s ease-in-out 1.1s;
}

/* HER BİR YAPRAK */
.sayfa-yaprak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.0s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
}

.sayfa-yaprak.cevirdi {
    transform: rotateY(-180deg);
}

/* Sayfa İçerik Boyutu */
.sayfa-icerik {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% - 1.5cm);
    height: 100%;
    transform-style: preserve-3d;
}

.sayfa-on, .sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sayfa-on img, .sayfa-arka img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.sayfa-arka {
    transform: rotateY(180deg);
}

/* SAYFA İÇİ YAZILAR */
.sayfa-yazi {
    position: absolute;
    top: 0.6cm;
    left: 0.5cm;
    width: calc(100% - 1cm);
    height: calc(100% - 1.4cm);
    font-family: 'Dancing Script', cursive, serif;
    line-height: 1.3;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 3px rgba(26, 75, 130, 0.35), 0 0 1px rgba(26, 75, 130, 0.6);
    box-sizing: border-box;
    backface-visibility: hidden;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    hyphens: none;
    white-space: pre-wrap;
    font-size: 11pt;
}

/* ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 2.0s ease-in-out;
    z-index: 30;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
    z-index: 1;
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}

/* KİTAP KENARI GEÇİŞ OKLARI */
.kitap-ok {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 70px;
    background: rgba(25, 15, 5, 0.55);
    border: 1px solid rgba(214, 173, 56, 0.4);
    color: #d6ad38;
    font-family: Georgia, serif;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease-in-out;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
    user-select: none;
}

.kitap-kapsayici.acildi .kitap-ok {
    opacity: 0.85;
    pointer-events: auto;
    transition: opacity 0.5s ease-in-out 1.2s, background 0.3s, color 0.3s, box-shadow 0.3s, transform 0.3s;
}

.sol-ok {
    left: calc(-100% - 1.8cm);
    border-top-left-radius: 8px;
    border-bottom-left-radius: 8px;
}

.sag-ok {
    right: -1.8cm;
    border-top-right-radius: 8px;
    border-bottom-right-radius: 8px;
}

.kitap-ok:hover {
    opacity: 1;
    background: rgba(50, 30, 10, 0.85);
    color: #fff2b0;
    border-color: #f5c641;
    box-shadow: 0 0 18px rgba(245, 198, 65, 0.7), inset 0 0 10px rgba(245, 198, 65, 0.4);
    transform: translateY(-50%) scale(1.08);
}
</style>
</head>

<body>

<div class="kitap-kapsayici" id="kitapKapsayici" style="cursor: pointer;">

    <!-- SOL KENAR OKU (GERİ) -->
    <div class="kitap-ok sol-ok" id="geriBtn" title="Önceki Sayfa">‹</div>

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg" alt="Alt Kapak">
    </div>

    <!-- AÇIK KİTAP GÖVDESİ -->
    <div class="acik-kitap-alan" id="acikKitapAlan">
        <img src="acik_kitap1.png" alt="Açık Kitap Gövdesi">
        <!-- Sabit Sol Kanat Yazı Alanı -->
        <div class="sol-kanat-yazi" id="solKanatYazi"></div>
        <div class="sayfa-numara">1</div>
    </div>

    <!-- DİNAMİK YAPRAKLAR KONTEYNERİ -->
    <div class="sayfalar-kapsayici" id="sayfalarKapsayici"></div>

    <!-- ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">
        <img src="kapak.jpg" class="kapak" alt="Ön Kapak">
        
        <div class="kapak-yazi">
            Şiir'e hatıra.<br><br>
            kelimelerden..<br>
            hayattan..<br>
            Babasından.<br><br><br>
            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak" alt="Arka Kapak">
    </div>

    <!-- SAĞ KENAR OKU (İLERİ) -->
    <div class="kitap-ok sag-ok" id="ileriBtn" title="Sonraki Sayfa">›</div>

</div>

<script>
window.addEventListener("load", function () {
    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const sayfalarKapsayici = document.getElementById("sayfalarKapsayici");
    const solKanatYazi = document.getElementById("solKanatYazi");
    const kapakImg = document.querySelector(".kapak");
    const ileriBtn = document.getElementById("ileriBtn");
    const geriBtn = document.getElementById("geriBtn");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;
    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";

    const baslikMetni = "KIZIM'a…\n\n";
    
    const solSayfaMetni = 
`Sevgili Şiir,
Bu satırları belki bir gün yüzümüzde bir tebessümle beraber okuyacağız..
belki de .. gözlerinden akmamaya inat eden bir damla gözyaşı ile
ama yine de gülümseyerek tek başına okuyacaksın.
Sonuçta yine ,  güldüğünde yanaklarında beliren ve görmeyi en çok sevdiğim gamzelerini göreceğim... nerede olduğumun bir önemi yok.`;

    const sayfaMetinleri = [
        // Sayfa 2 (1. Yaprak Ön)
        `Bilmeni isterim ki;
Ben bu şiirleri birilerine bir şey anlatmak için değil,
içimde kopan fırtınaları , bir yağmur misali kağıda dökmek için yazdım.
Ve bazılarını yıllar sonra sen bul diye sakladım. Çünkü ben buldum.
Sana bırakabileceğim hatıralar arasından biri de , bu şiirlerim.
Ve bu şiirleri benim sesimden duymak isteyebileceğini düşündüm..
Ben çok isterdim..`,

        // Sayfa 3 (1. Yaprak Arka - Son Sayfa)
        `Bir gün bu sayfalarda kendinden bir parça bulursan, bil ki , o şiir senden önce yazılmış olsa bile, sana aittir.
Çünkü sen benim , yani bu kocaman gövdenin altındaki çelimsiz çocuğun , beklediği yaşama sebebisin.
Çünkü sen benim , yazdığım en güzel şiirsin...
Beni hep gülen gözlerle ve sana deliler gibi aşık bir kalple hatırla…
Hasretle gamzelerinden ve o küçük çenenden öperim.
Baban.`
    ];

    const toplamYaprak = 1; // 3 sayfalık yapı için tek yaprak yeterli (Sol sabit: 1, Ön: 2, Arka: 3)
    let yaprakElementleri = [];
    let aktifTimeouts = [];
    
    let akisAsamasi = 0;
    let islemde = false;
    
    let mevcutYazmaDurumu = {
        element: null,
        metin: "",
        index: 0,
        hedefAsama: 0
    };

    function temizleZamanasimlari() {
        aktifTimeouts.forEach(id => clearTimeout(id));
        aktifTimeouts = [];
    }

    function aktifSayfayiHemenBitir() {
        if (!mevcutYazmaDurumu.element) return false;
        temizleZamanasimlari();
        
        let kalanMetin = mevcutYazmaDurumu.metin.slice(mevcutYazmaDurumu.index);
        kalanMetin = kalanMetin.replace(/\n/g, "<br>");
        mevcutYazmaDurumu.element.innerHTML += kalanMetin;
        mevcutYazmaDurumu.element = null;
        
        akisAsamasi = mevcutYazmaDurumu.hedefAsama;
        islemde = false;
        return true;
    }

    // Yazı Hızı: 85ms
    function metinYazdirKademeli(element, tamMetin, hedefAsama, callback) {
        islemde = true;
        if (!element.innerHTML || element.innerHTML.trim() === "") {
            element.innerHTML = "";
            mevcutYazmaDurumu.element = element;
            mevcutYazmaDurumu.metin = tamMetin;
            mevcutYazmaDurumu.index = 0;
            mevcutYazmaDurumu.hedefAsama = hedefAsama;

            function adim() {
                if (mevcutYazmaDurumu.index < tamMetin.length) {
                    let k = tamMetin[mevcutYazmaDurumu.index];
                    element.innerHTML += (k === "\n") ? "<br>" : k;
                    mevcutYazmaDurumu.index++;
                    let t = setTimeout(adim, 85);
                    aktifTimeouts.push(t);
                } else {
                    mevcutYazmaDurumu.element = null;
                    akisAsamasi = hedefAsama;
                    islemde = false;
                    if (callback) callback();
                }
            }
            adim();
        } else {
            islemde = false;
            akisAsamasi = hedefAsama;
            if (callback) callback();
        }
    }

    // Başlık ve Sol Sayfa Yazısı
    function solSayfayiBaslat() {
        islemde = true;
        if (!solKanatYazi.innerHTML || solKanatYazi.innerHTML.trim() === "") {
            solKanatYazi.innerHTML = "";
            let baslikSpan = document.createElement("span");
            baslikSpan.className = "sayfa-baslik";
            solKanatYazi.appendChild(baslikSpan);

            let bK = baslikMetni.split("");
            let bIdx = 0;
            
            function baslikYaz() {
                if (bIdx < bK.length) {
                    let k = bK[bIdx];
                    baslikSpan.innerHTML += (k === "\n") ? "<br>" : k;
                    bIdx++;
                    let t = setTimeout(baslikYaz, 35);
                    aktifTimeouts.push(t);
                } else {
                    mevcutYazmaDurumu.element = solKanatYazi;
                    mevcutYazmaDurumu.hedefAsama = 3;
                    
                    let beklemeT = setTimeout(() => {
                        metinYazdirKademeli(solKanatYazi, solSayfaMetni, 3);
                    }, 1800);
                    aktifTimeouts.push(beklemeT);
                }
            }
            baslikYaz();
        } else {
            islemde = false;
            akisAsamasi = 3;
        }
    }

    function ileriGit() {
        if (islemde && !mevcutYazmaDurumu.element) return;

        if (aktifSayfayiHemenBitir()) {
            return;
        }

        if (akisAsamasi === 1) {
            akisAsamasi = 2;
            solSayfayiBaslat();
        }
        else if (akisAsamasi === 3) {
            akisAsamasi = 4;
            let yOn0 = document.getElementById("yazi-on-0");
            if (yOn0 && sayfaMetinleri[0]) {
                metinYazdirKademeli(yOn0, sayfaMetinleri[0], 5);
            }
        }
        else if (akisAsamasi === 5) {
            islemde = true;
            akisAsamasi = 6;
            yaprakElementleri[0].style.zIndex = 50;
            yaprakElementleri[0].classList.add("cevirdi");
            setTimeout(() => { 
                akisAsamasi = 7; 
                islemde = false;
            }, 1000);
        }
        else if (akisAsamasi === 7) {
            akisAsamasi = 8;
            let yArka0 = document.getElementById("yazi-arka-0");
            if (yArka0 && sayfaMetinleri[1]) {
                metinYazdirKademeli(yArka0, sayfaMetinleri[1], 9);
            }
        }
    }

    function geriGit() {
        temizleZamanasimlari();
        mevcutYazmaDurumu.element = null;
        islemde = false;

        if (akisAsamasi >= 5) {
            yaprakElementleri[0].classList.remove("cevirdi");
            yaprakElementleri[0].style.zIndex = toplamYaprak;
            akisAsamasi = 3;
        } 
        else if (akisAsamasi >= 1) {
            akisAsamasi = 1;
        }
        else if (akisAsamasi === 0 || kapsayici.classList.contains("acildi")) {
            kapsayici.classList.remove("acildi");
            kapakAlan.classList.remove("dondu");
            akisAsamasi = 0;
        }
    }

    // Yaprakları Oluştur (3 Sayfalık Kitap: Sol=1, Ön=2, Arka=3)
    for (let i = 0; i < toplamYaprak; i++) {
        const yaprakDiv = document.createElement("div");
        yaprakDiv.className = "sayfa-yaprak";
        yaprakDiv.style.zIndex = toplamYaprak - i;

        let onSayfaNo = (i * 2) + 2;
        let arkaSayfaNo = (i * 2) + 3;

        yaprakDiv.innerHTML = `
            <div class="sayfa-icerik">
                <div class="sayfa-on">
                    <img src="sag_sayfa.png" alt="Sayfa Ön">
                    <div class="sayfa-yazi" id="yazi-on-${i}"></div>
                    <div class="sayfa-numara">${onSayfaNo}</div>
                </div>
                <div class="sayfa-arka">
                    <img src="sol_sayfa.png" alt="Sayfa Arka">
                    <div class="sayfa-yazi" id="yazi-arka-${i}"></div>
                    <div class="sayfa-numara">${arkaSayfaNo}</div>
                </div>
            </div>
        `;

        sayfalarKapsayici.appendChild(yaprakDiv);
        yaprakElementleri.push(yaprakDiv);
    }

    kapsayici.addEventListener("click", function (e) {
        if (e.target.closest('.kitap-ok')) return;
        e.stopPropagation();
        if (islemde && !mevcutYazmaDurumu.element) return;

        if (!kapsayici.classList.contains("acildi")) {
            kapsayici.classList.add("acildi");
            kapakAlan.classList.add("dondu");
            
            temizleZamanasimlari();
            akisAsamasi = 1; 
        } else {
            ileriGit();
        }
    });

    ileriBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        if (islemde && !mevcutYazmaDurumu.element) return;

        if (!kapsayici.classList.contains("acildi")) {
            kapsayici.classList.add("acildi");
            kapakAlan.classList.add("dondu");
            temizleZamanasimlari();
            akisAsamasi = 1;
        } else {
            ileriGit();
        }
    });

    geriBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        geriGit();
    });

    window.addEventListener("contextmenu", function(e) {
        e.preventDefault();
        geriGit();
    });
});
</script>
</body>
</html>
