<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;

    background-image: url("yeni_arka_plan0.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =================================================
   KİTABIN ANA ALANI
================================================= */

.kitap-alani {

    width: 39%;
    height: calc(82vh + 4cm);

    transform: translateX(10cm);

    perspective: 1800px;

    position: relative;
}


/* =================================================
   SAĞ SABİT ALT KAPAK
================================================= */

.alt-kapak {

    width: calc(100% - 2cm);
    height: calc(100% - 2cm);

    position: absolute;

    left: 1cm;
    top: 1cm;

    z-index: 1;

    background: #4a2d1d;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.18);
}


/* Sağ kapağın içindeki saman kağıdı */

.alt-kapak-ici {

    position: absolute;

    left: 1cm;
    top: 1cm;
    right: 0;
    bottom: 1cm;

    background: #d8c08d;
}


/* =================================================
   AÇILAN ÖN KAPAK
================================================= */

.kitap-kapak {

    width: calc(100% - 2cm);
    height: calc(100% - 2cm);

    position: absolute;

    left: 1cm;
    top: 1cm;

    z-index: 5;

    transform-style: preserve-3d;

    transform-origin: left center;

    transition:
        transform 1.4s cubic-bezier(0.22, 0.61, 0.36, 1);

    cursor: pointer;
}


/* Ön ve arka yüz */

.kapak-on,
.kapak-arka {

    width: 100%;
    height: 100%;

    position: absolute;

    left: 0;
    top: 0;

    backface-visibility: hidden;
}


/* =================================================
   ÖN KAPAK
================================================= */

.kapak-on {

    background-image: url("kitap_kapagi.png");

    background-size: 100% 100%;

    background-position: center;

    background-repeat: no-repeat;
}


/* =================================================
   ÖN KAPAĞIN İÇ YÜZÜ
================================================= */

.kapak-arka {

    transform: rotateY(180deg);

    background: #4a2d1d;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.18);
}


/* Sol iç yüzdeki saman kağıdı */

.kapak-arka-ici {

    position: absolute;

    left: 1cm;
    top: 1cm;
    right: 0;
    bottom: 1cm;

    background: #d8c08d;
}


/* =================================================
   KAPAĞI AÇ
================================================= */

.kitap-kapak.acik {

    transform: rotateY(-180deg);

}

</style>
</head>


<body>


<div class="kitap-alani">


    <!-- SAĞ SABİT ALT KAPAK -->

    <div class="alt-kapak">

        <div class="alt-kapak-ici"></div>

    </div>


    <!-- AÇILAN ÖN KAPAK -->

    <div
        class="kitap-kapak"
        id="kitapKapak"
    >

        <div class="kapak-on"></div>

        <div class="kapak-arka">

            <div class="kapak-arka-ici"></div>

        </div>

    </div>


</div>


<script>

const kitapKapak =
    document.getElementById("kitapKapak");


kitapKapak.addEventListener("click", function () {

    kitapKapak.classList.toggle("acik");

});

</script>


</body>
</html>
