<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}

.book-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.book-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

.page {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    z-index: 2;
}

.page.left {
    left: 0;
    transform: scaleX(-1);
}

.page.right {
    right: 0;
}

/* =========================
   SIIR
========================= */

.poem {
    position: absolute;
    top: 23%;
    width: 25%;
    height: 61%;

    font-family: "Caveat", cursive;
    font-size: clamp(17px, 1.35vw, 23px);
    font-weight: 500;
    line-height: 1.55;

    color: #174a82;

    white-space: pre-wrap;
    overflow: hidden;

    z-index: 5;

    opacity: 1;

    transition: opacity 1.1s ease;
}

.poem.left {
    left: 23%;
}

.poem.right {
    left: 53%;
}

/* =========================
   TUY
========================= */

.quill {
    position: absolute;

    width: 34px;
    height: 34px;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    transform-origin: 5px 29px;

    transition:
        left 0.055s linear,
        top 0.055s linear,
        opacity 0.2s ease;
}

.quill svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
}

/* =========================
   OK
========================= */

.next-button {
    position: absolute;

    right: 2.5%;
    top: 50%;

    transform: translateY(-50%);

    width: 54px;
    height: 80px;

    border: none;
    background: transparent;

    color: rgba(255,255,255,0.55);

    font-size: 64px;
    font-weight: 200;
    line-height: 80px;

    cursor: pointer;

    z-index: 20;

    padding: 0;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.next-button:hover {
    color: rgba(255,255,255,0.85);
    transform: translateY(-50%) scale(1.05);
}

.next-button.flash {
    animation: arrowFlash 0.55s ease;
}

@keyframes arrowFlash {

    0% {
        color: rgba(255,255,255,0.55);
        text-shadow: none;
    }

    35% {
        color: white;
        text-shadow:
            0 0 8px rgba(255,255,255,0.9),
            0 0 18px rgba(255,255,255,0.65),
            0 0 30px rgba(255,255,255,0.35);
    }

    100% {
        color: rgba(255,255,255,0.55);
        text-shadow: none;
    }
}

.fade-out {
    opacity: 0 !important;
}

</style>
</head>

<body>

<div class="book-stage">

    <img
        src="arkaplan0.jpeg"
        class="book-background"
        alt=""
    >

    <div class="page left"></div>
    <div class="page right"></div>

    <div id="poemLeft" class="poem left"></div>
    <div id="poemRight" class="poem right"></div>

    <!-- Zarif tuy -->
    <div id="quill" class="quill">

        <svg
            viewBox="0 0 34 34"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!-- Tüy -->
            <path
                d="
                    M5 27
                    C6 20 8 13 14 8
                    C19 4 25 2 31 3
                    C30 9 27 16 23 21
                    C18 26 12 28 5 27
                "
                fill="#f3efe6"
                stroke="#bcb5aa"
                stroke-width="0.7"
            />

            <!-- Ana damar -->
            <path
                d="M5 27 C12 20 20 11 30 4"
                fill="none"
                stroke="#aaa399"
                stroke-width="0.7"
                stroke-linecap="round"
            />

            <!-- İnce tüy damarları -->
            <path
                d="M10 23 L9 17"
                fill="none"
                stroke="#b4ada2"
                stroke-width="0.55"
            />

            <path
                d="M14 20 L14 13"
                fill="none"
                stroke="#b4ada2"
                stroke-width="0.55"
            />

            <path
                d="M18 16 L19 10"
                fill="none"
                stroke="#b4ada2"
                stroke-width="0.55"
            />

            <path
                d="M22 12 L24 7"
                fill="none"
                stroke="#b4ada2"
                stroke-width="0.55"
            />

            <!-- Çok küçük mürekkep ucu -->
            <circle
                cx="5"
                cy="27"
                r="1.15"
                fill="#174a82"
            />

        </svg>

    </div>

    <button
        id="nextButton"
        class="next-button"
        aria-label="Sonraki"
    >›</button>

</div>

<script>

const poems = [

`Haydi Abbas, vakit tamam;
Akşam diyordun işte oldu akşam.
Kur bakalım çilingir soframızı;
Dinsin artık bu kalb ağrısı.
Şu ağacın gölgesinde olsun;
Tam kenarında havuzun.
Aya haber sal çıksın bu gece;
Görünsün şöyle gönlümce.
Bas kırbacı sihirli seccadeye,
Göster hükmettiğini mesafeye
Ve zamana.
Katıp tozu dumana,
Var git,
Böyle ferman etti Cahit,
Al getir ilk sevgiliyi Beşiktaş'tan;
Yaşamak istiyorum gençliğimi yeni baştan.`

];

const typingSpeed = 55;

let currentPoem = 0;
let currentSpread = 0;

let typingInProgress = false;
let isAnimating = false;

const poemLeft = document.getElementById("poemLeft");
const poemRight = document.getElementById("poemRight");

const quill = document.getElementById("quill");
const nextButton = document.getElementById("nextButton");

/* =========================
   METNI SAYFAYA SIGDIR
========================= */

function splitPoem(text) {

    const test = document.createElement("div");

    test.className = "poem left";

    test.style.visibility = "hidden";
    test.style.position = "absolute";
    test.style.left = "23%";
    test.style.top = "23%";

    document.body.appendChild(test);

    const words = text.split(/(\s+)/);

    let leftText = "";
    let rightText = "";
    let currentText = "";

    for (let i = 0; i < words.length; i++) {

        const piece = words[i];
        const candidate = currentText + piece;

        test.textContent = candidate;

        if (test.scrollHeight <= test.clientHeight + 2) {

            currentText = candidate;

        } else {

            if (!leftText) {

                leftText = currentText;
                currentText = piece;

            } else {

                rightText += currentText;
                currentText = piece;
            }
        }
    }

    if (!leftText) {

        leftText = currentText;

    } else {

        rightText += currentText;
    }

    document.body.removeChild(test);

    return {
        left: leftText,
        right: rightText
    };
}

/* =========================
   TUYU YAZININ UCUNA GETIR
========================= */

function moveQuillToCharacter(element) {

    const textNode = element.firstChild;

    if (!textNode) return;

    const text = textNode.textContent;

    if (!text.length) return;

    let index = text.length - 1;

    /*
       Son karakter bosluksa,
       gorunen son karakteri bul.
    */

    while (
        index >= 0 &&
        /\s/.test(text[index])
    ) {
        index--;
    }

    if (index < 0) return;

    const range = document.createRange();

    range.setStart(textNode, index);
    range.setEnd(textNode, index + 1);

    const rect = range.getBoundingClientRect();

    const stage =
        document.querySelector(".book-stage")
        .getBoundingClientRect();

    /*
       Tüyün mürekkep ucu:
       SVG içindeki x=5, y=27.

       Ucu doğrudan harfin
       sağ-alt tarafına yaklaştırıyoruz.
    */

    const nibX = 5;
    const nibY = 27;

    const left =
        rect.right -
        stage.left -
        nibX;

    const top =
        rect.bottom -
        stage.top -
        nibY -
        2;

    quill.style.left = left + "px";
    quill.style.top = top + "px";
}

/* =========================
   YAZ
========================= */

function typeText(element, text, callback) {

    element.textContent = "";

    if (!text) {

        callback();
        return;
    }

    typingInProgress = true;

    quill.style.opacity = "1";

    let index = 0;

    function writeCharacter() {

        if (index >= text.length) {

            typingInProgress = false;

            callback();

            return;
        }

        element.textContent += text[index];

        requestAnimationFrame(() => {
            moveQuillToCharacter(element);
        });

        index++;

        setTimeout(
            writeCharacter,
            typingSpeed
        );
    }

    writeCharacter();
}

/* =========================
   YAYILIM
========================= */

function typeSpread() {

    const parts = splitPoem(
        poems[currentPoem]
    );

    poemLeft.textContent = "";
    poemRight.textContent = "";

    quill.style.opacity = "0";

    typeText(
        poemLeft,
        parts.left,
        () => {

            if (parts.right) {

                typeText(
                    poemRight,
                    parts.right,
                    () => {
                        quill.style.opacity = "1";
                    }
                );

            } else {

                quill.style.opacity = "1";
            }
        }
    );
}

/* =========================
   BASLANGIC
========================= */

window.addEventListener("load", () => {

    typeSpread();

});

/* =========================
   SAG OK
========================= */

nextButton.addEventListener("click", () => {

    if (isAnimating || typingInProgress) {
        return;
    }

    isAnimating = true;

    nextButton.disabled = true;

    nextButton.classList.remove("flash");

    void nextButton.offsetWidth;

    nextButton.classList.add("flash");

    poemLeft.classList.add("fade-out");
    poemRight.classList.add("fade-out");

    quill.style.opacity = "0";

    setTimeout(() => {

        currentSpread++;

        poemLeft.classList.remove("fade-out");
        poemRight.classList.remove("fade-out");

        typeSpread();

        function waitForTyping() {

            if (!typingInProgress) {

                isAnimating = false;
                nextButton.disabled = false;

            } else {

                setTimeout(
                    waitForTyping,
                    100
                );
            }
        }

        waitForTyping();

    }, 1200);

});

</script>

</body>
</html>
