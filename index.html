<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    margin: 0;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #51463a 0%,
            #302923 55%,
            #1e1a17 100%
        );
}


/* =====================================================
   KAPALI KITAP
   ===================================================== */

#closedBook {

    width: 360px;
    height: 520px;

    cursor: pointer;

    border-radius:
        8px 20px 20px 8px;

    overflow: hidden;

    box-shadow:
        0 35px 70px rgba(0,0,0,.58);

    transition:
        transform .35s ease;
}


/* =====================================================
   KAPAK GORSELI
   TAMAMI KITABI DOLDURUR
   ===================================================== */

#closedBook img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: fill;

    user-select: none;
    -webkit-user-drag: none;
    -webkit-user-select: none;
}


/* =====================================================
   HAFIF HOVER
   ===================================================== */

#closedBook:hover {

    transform:
        scale(1.025);
}


/* =====================================================
   MOBIL
   ===================================================== */

@media (max-width: 700px) {

    #closedBook {

        width: 280px;
        height: 410px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     KAPALI KITAP
     ===================================================== -->

<div id="closedBook">

    <img
        src="kapak-gorsel.jpg"
        alt="Şiir Nefestir"
        draggable="false"
    >

</div>


</body>
</html>
