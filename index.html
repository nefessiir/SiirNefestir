<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}

.book-stage {
    position: relative;
    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);
    margin: auto;
    background: url("arkaplan0.jpeg") center center / 100% 100% no-repeat;
    overflow: hidden;
}

/* SOL SAYFA */

.page-left {
    position: absolute;
    left: 19%;
    top: 13.2%;
    width: 34%;
    height: calc(100% - 27.5%);

    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;

    transform: scaleX(-1);

    overflow: hidden;
}

/* SAG SAYFA */

.page-right {
    position: absolute;
    left: 48.828125%;
    top: 13.2%;
    width: 38.411458%;
    height: calc(100% - 27.5%);

    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* SIIR ALANI */

.poem {
    position: absolute;

    top: calc(23% - 0.5em);
    height: calc(61% + 0.5em);

    width: 25%;

    font-family: "Caveat", cursive;
    font-size: 11pt;
    font-weight: 500;
    line-height: 1.55;

    color: #174a82;

    white-space: pre-wrap;
    overflow: hidden;

    text-shadow:
        0.2px 0.2px 0 rgba(23, 74, 130, 0.22);

    opacity: 1;
}

.poem-left {
    left: 23%;
}

.poem-right {
    left: 53%;
}

/* KALem */

.corner-quill {
    position: absolute;

    left: calc(1.5% + 1cm);
    bottom: calc(-1% + 1cm);

    width: 140px;
    height: auto;

    z-index: 20;

    pointer-events: none;
}

/* YAZAN KALEM */

.writing-quill {
    position: absolute;

    width: 78px;
    height: auto;

    z-index: 30;

    pointer-events: none;

    opacity: 0;
}

/* OK */

.next-arrow {
    position: absolute;

    right: 1.5%;
    top: 50%;

    width: 45px;
    height: 80px;

    transform: translateY(-50%);

    border: none;
    background: transparent;

    color: rgba(255, 255, 255, 0.68);

    font-family: Arial, sans-serif;
    font-size: 70px;
    font-weight: 200;

    line-height: 80px;

    padding: 0;
    margin: 0;

    cursor: pointer;

    z-index: 50;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.next-arrow:hover {
    color: rgba(255, 255, 255, 0.92);

    transform:
        translateY(-50%)
        scale(1.05);
}

/* OK TIKLAMA ISIGI */

.next-arrow.arrow-flash {
    animation: arrowFlash 0.38s ease;
}

@keyframes arrowFlash {

    0% {
        color: rgba(255,255,255,0.68);
        text-shadow: none;
    }

    45% {
        color: rgba(255,255,255,1);
        text-shadow:
            0 0 8px rgba(255,255,255,0.85),
            0 0 18px rgba(255,255,255,0.65);
    }

    100% {
        color: rgba(255,255,255,0.68);
        text-shadow: none;
    }
}

/* SAYFA GECISI */

.page-fade {
    animation: pageFade 0.55s ease;
}

@keyframes pageFade {

    0% {
        opacity: 1;
    }

    50% {
        opacity: 0;
    }

    100% {
        opacity: 1;
    }
}

/* OLCEK ALANI */

#measurePoem {
    position: absolute;

    left: -99999px;
    top: 0;

    visibility: hidden;

    white-space: pre-wrap;

    overflow-wrap: break-word;
    word-wrap: break-word;
}

</style>
</head>

<body>

<div class="book-stage" id="bookStage">

    <div class="page-left" id="pageLeft">
        <div class="poem poem-left" id="poemLeft"></div>
    </div>

    <div class="page-right" id="pageRight">
        <div class="poem poem-right" id="poemRight"></div>
    </div>

    <img
        src="murekkep_kalem.png"
        class="corner-quill"
        alt=""
    >

    <img
        src="yazan_kalem3.png"
        class="writing-quill"
        id="writingQuill"
        alt=""
    >

    <button
        class="next-arrow"
        id="nextArrow"
        aria-label="Sonraki sayfa"
    >›</button>

    <div id="measurePoem"></div>

</div>

<script>

/* =========================================================
   TEST SIIRLERI
   ========================================================= */

const poems = [

    {
        title: "Uzun Test Siiri",

        text: `Bir zamanlar sessizliğin içinde yürüyen bir adam vardı.
Her adımında başka bir düşünce,
her düşüncesinde başka bir yol saklıydı.

Akşam olduğunda gökyüzüne bakar,
uzakta kalan ışıkları tek tek sayardı.
Kimi zaman bir yıldızın peşinden gider,
kimi zaman yalnızca rüzgarın sesini dinlerdi.

Çünkü bazı yollar yürümek için değil,
hatırlamak için uzardı.

Bir kelime söylenirdi gecenin içinde,
ardından başka bir kelime,
sonra bir cümle,
sonra yıllarca unutulmayacak bir hikaye.

Adam yürümeye devam ederdi.

Önünde uzun bir yol,
arkasında susmuş bir şehir,
içinde ise hiç bitmeyen bir şiir vardı.

Bazen dururdu.
Bir ağacın altında,
eski bir duvarın yanında,
ya da denizi gören bir tepede.

Sonra yeniden başlardı.

Çünkü insan bazen nereye gittiğini bilmeden de yürüyebilir.
Önemli olan yolun bitmesi değil,
yol boyunca kendinden bir şeyler bulabilmektir.

Günler geçti.
Mevsimler değişti.
Aynı gökyüzünün altında
başka başka insanlar gelip geçti.

Ama bazı kelimeler hiç değişmedi.

Bir çocuğun gülüşü,
bir annenin sesi,
uzaktan gelen bir tren,
pencerede unutulmuş bir ışık...

Hepsi bir kitabın sayfaları gibiydi.

Adam her sayfayı dikkatle çevirdi.

Bazı sayfalarda sustu.
Bazılarında uzun uzun düşündü.
Bazılarında ise yalnızca gülümsedi.

Ve sonunda anladı:

Hayat dediğimiz şey,
bir kitabın son sayfasına ulaşmak değildi.

Asıl mesele,
okuduğun her sayfada
kendinden bir iz bırakabilmekti.

Gece yeniden çöktü.

Şehir yavaşça sessizleşti.

Adam gökyüzüne baktı.

Bir yıldız kaydı.

Dilek tutmadı.

Çünkü bazı dileklerin
çoktan gerçekleşmiş olduğunu biliyordu.

Yol devam ediyordu.

Sayfalar çevriliyordu.

Ve şiir,
hala nefes alıyordu.`

    },

    {
        title: "Abbas",

        text: `Haydi Abbas,
vakit tamam.

Akşam yine ağır ağır inerken
yolun kenarında durma.

Biraz daha yürü.

Şehir uzaklarda kalsın,
gece önünde açılsın.

Bazen insanın
gidecek başka bir yeri yoktur.

Ama yine de yürür.

Çünkü bazı yollar
insanı bir yere değil,
kendisine götürür.

Haydi Abbas.

Vakit tamam.`
    }

];


/* =========================================================
   SISTEM DEGISKENLERI
   ========================================================= */

const stage = document.getElementById("bookStage");

const leftPage = document.getElementById("pageLeft");
const rightPage = document.getElementById("pageRight");

const leftPoem = document.getElementById("poemLeft");
const rightPoem = document.getElementById("poemRight");

const writingQuill = document.getElementById("writingQuill");

const nextArrow = document.getElementById("nextArrow");

const measurePoem = document.getElementById("measurePoem");


let currentPoemIndex = 0;

let currentSpreadIndex = 0;

let poemPages = [];

let activeTypingToken = 0;

let activeTypingFinished = true;

let movingToNextPage = false;


/* =========================================================
   OLCTU ALANINI HAZIRLA
   ========================================================= */

function prepareMeasureArea() {

    const style = window.getComputedStyle(leftPoem);

    measurePoem.style.fontFamily = style.fontFamily;
    measurePoem.style.fontSize = style.fontSize;
    measurePoem.style.fontWeight = style.fontWeight;
    measurePoem.style.lineHeight = style.lineHeight;
    measurePoem.style.letterSpacing = style.letterSpacing;

    measurePoem.style.width =
        leftPoem.getBoundingClientRect().width + "px";
}


/* =========================================================
   METIN YUKSEKLIGI
   ========================================================= */

function measureTextHeight(text) {

    measurePoem.textContent = text;

    return measurePoem.getBoundingClientRect().height;
}


/* =========================================================
   GERCEK SATIRLARI BUL
   ========================================================= */

function getWrappedLines(text) {

    const lines = [];

    const paragraphs = text.split("\n");

    for (const paragraph of paragraphs) {

        if (paragraph.trim() === "") {

            lines.push("");

            continue;
        }

        const words =
            paragraph.trim().split(/\s+/);

        let currentLine = "";

        for (const word of words) {

            const testLine =
                currentLine
                    ? currentLine + " " + word
                    : word;

            if (
                measureTextHeight(testLine)
                <= measureTextHeight("X")
            ) {

                currentLine = testLine;

            } else {

                if (currentLine) {
                    lines.push(currentLine);
                }

                currentLine = word;
            }
        }

        if (currentLine) {
            lines.push(currentLine);
        }
    }

    return lines;
}


/* =========================================================
   SATIRLARI SAYFALARA BOL
   ========================================================= */

function splitLinesIntoPages(lines) {

    const pages = [];

    const pageHeight =
        leftPoem.getBoundingClientRect().height;

    let currentPage = "";

    for (const line of lines) {

        const testPage =
            currentPage
                ? currentPage + "\n" + line
                : line;

        const height =
            measureTextHeight(testPage);

        if (
            height <= pageHeight + 1
            || currentPage === ""
        ) {

            currentPage = testPage;

        } else {

            pages.push(currentPage);

            currentPage = line;
        }
    }

    if (currentPage) {
        pages.push(currentPage);
    }

    return pages;
}


/* =========================================================
   SIIRI SAYFALARA AYIR
   ========================================================= */

function createPoemPages(text) {

    prepareMeasureArea();

    const lines =
        getWrappedLines(text);

    return splitLinesIntoPages(lines);
}


/* =========================================================
   KALEMI KARAKTERE GORE KONUM LANDIR
   ========================================================= */

function moveWritingQuillToCharacter(element, startIndex) {

    if (!element.textContent.length) {
        return;
    }

    const textNode = element.firstChild;

    if (!textNode) {
        return;
    }

    const safeIndex =
        Math.min(
            startIndex,
            textNode.textContent.length - 1
        );

    if (safeIndex < 0) {
        return;
    }

    const range =
        document.createRange();

    range.setStart(
        textNode,
        safeIndex
    );

    range.setEnd(
        textNode,
        Math.min(
            safeIndex + 1,
            textNode.textContent.length
        )
    );

    const rect =
        range.getBoundingClientRect();

    const stageRect =
        stage.getBoundingClientRect();

    if (
        !rect ||
        rect.width === 0 ||
        rect.height === 0
    ) {
        return;
    }

    writingQuill.style.left =
        (
            rect.left -
            stageRect.left -
            8
        ) + "px";

    writingQuill.style.top =
        (
            rect.top -
            stageRect.top -
            45
        ) + "px";

    writingQuill.style.opacity = "1";
}


/* =========================================================
   TEK KELIME YAZ
   ========================================================= */

function typeWord(element, word, token) {

    return new Promise(resolve => {

        if (token !== activeTypingToken) {
            resolve();
            return;
        }

        const wordStart =
            element.textContent.length;

        let index = 0;

        function writeNextCharacter() {

            if (token !== activeTypingToken) {
                resolve();
                return;
            }

            if (index >= word.length) {

                resolve();
                return;
            }

            element.textContent +=
                word[index];

            if (index === 0) {

                moveWritingQuillToCharacter(
                    element,
                    wordStart
                );
            }

            index++;

            setTimeout(
                writeNextCharacter,
                55
            );
        }

        writeNextCharacter();
    });
}


/* =========================================================
   METNI YAZ
   ========================================================= */

async function typeText(element, text) {

    activeTypingToken++;

    const token =
        activeTypingToken;

    element.textContent = "";

    writingQuill.style.opacity = "0";

    const parts =
        text.match(/\S+\s*|\s+/g) || [];

    for (const part of parts) {

        if (token !== activeTypingToken) {
            return;
        }

        if (/^\s+$/.test(part)) {

            element.textContent += part;

            await new Promise(
                resolve =>
                    setTimeout(resolve, 20)
            );

        } else {

            await typeWord(
                element,
                part,
                token
            );
        }
    }

    if (token === activeTypingToken) {

        activeTypingFinished = true;

        writingQuill.style.opacity = "0";
    }
}


/* =========================================================
   SPREAD YAZ
   ========================================================= */

async function typeSpread() {

    activeTypingFinished = false;

    leftPoem.textContent = "";
    rightPoem.textContent = "";

    writingQuill.style.opacity = "0";

    const leftText =
        poemPages[currentSpreadIndex] || "";

    const rightText =
        poemPages[currentSpreadIndex + 1] || "";

    await typeText(
        leftPoem,
        leftText
    );

    if (rightText) {

        activeTypingFinished = false;

        await typeText(
            rightPoem,
            rightText
        );
    }

    activeTypingFinished = true;

    writingQuill.style.opacity = "0";
}


/* =========================================================
   SAYFA GECISI
   ========================================================= */

async function nextPage() {

    if (!activeTypingFinished) {
        return;
    }

    if (movingToNextPage) {
        return;
    }

    movingToNextPage = true;

    nextArrow.classList.remove(
        "arrow-flash"
    );

    void nextArrow.offsetWidth;

    nextArrow.classList.add(
        "arrow-flash"
    );


    /*
       AYNI SIIRIN DEVAMI VARSA
    */

    if (
        currentSpreadIndex + 2
        < poemPages.length
    ) {

        leftPage.classList.add(
            "page-fade"
        );

        rightPage.classList.add(
            "page-fade"
        );

        await new Promise(
            resolve =>
                setTimeout(resolve, 550)
        );

        currentSpreadIndex += 2;

        leftPage.classList.remove(
            "page-fade"
        );

        rightPage.classList.remove(
            "page-fade"
        );

        await typeSpread();

        movingToNextPage = false;

        return;
    }


    /*
       YENI SIIR
    */

    if (
        currentPoemIndex + 1
        < poems.length
    ) {

        leftPage.classList.add(
            "page-fade"
        );

        rightPage.classList.add(
            "page-fade"
        );

        await new Promise(
            resolve =>
                setTimeout(resolve, 550)
        );

        currentPoemIndex++;

        currentSpreadIndex = 0;

        poemPages =
            createPoemPages(
                poems[currentPoemIndex].text
            );

        leftPage.classList.remove(
            "page-fade"
        );

        rightPage.classList.remove(
            "page-fade"
        );

        await typeSpread();

        movingToNextPage = false;

        return;
    }


    /*
       SON SAYFA
    */

    movingToNextPage = false;
}


/* =========================================================
   BASLANGIC
   ========================================================= */

async function startBook() {

    poemPages =
        createPoemPages(
            poems[currentPoemIndex].text
        );

    currentSpreadIndex = 0;

    await typeSpread();
}


/* =========================================================
   OK
   ========================================================= */

nextArrow.addEventListener(
    "click",
    nextPage
);


/* =========================================================
   PENCERE BOYUTU
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (
            !activeTypingFinished ||
            movingToNextPage
        ) {
            return;
        }

        poemPages =
            createPoemPages(
                poems[currentPoemIndex].text
            );

    }
);


/* =========================================================
   BASLAT
   ========================================================= */

window.addEventListener(
    "load",
    startBook
);

</script>

</body>
</html>
