<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background:
        radial-gradient(circle at center, #62584c 0%, #352f29 55%, #211e1a 100%);
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    color: #2d241b;
}

/* =========================================================
   ANA SAHNE
========================================================= */

.scene {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    perspective: 2200px;
}

/* =========================================================
   KAPALI KİTAP
========================================================= */

.closed-book {
    position: absolute;

    width: min(520px, 72vw);
    aspect-ratio: 0.70;

    cursor: pointer;

    transform-style: preserve-3d;

    transition:
        transform 1.3s cubic-bezier(.2,.8,.2,1),
        opacity .8s ease;
}

.closed-book:hover {
    transform:
        rotateY(-5deg)
        rotateX(2deg)
        scale(1.015);
}

.closed-book.opening {
    transform:
        rotateY(-75deg)
        scale(.92)
        translateX(-15%);
    opacity: 0;
    pointer-events: none;
}

/* Kitabın gövdesi */

.book-cover {
    position: absolute;
    inset: 0;

    border-radius: 5px 13px 13px 5px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            transparent 25%,
            rgba(0,0,0,.18)
        ),
        #403429;

    box-shadow:
        0 30px 70px rgba(0,0,0,.55),
        inset 4px 0 0 rgba(255,255,255,.06),
        inset -5px 0 0 rgba(0,0,0,.25);

    border: 1px solid rgba(255,255,255,.1);
}

/* Kapak içindeki görsel */

.cover-image {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.30)
        ),
        url("kapak-gorsel.jpg");

    background-size: cover;
    background-position: center;

    opacity: .88;
}

/* Kapak yazıları */

.cover-writing {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 40px;
    color: #f8eee0;

    text-shadow:
        0 2px 4px rgba(0,0,0,.65),
        0 0 15px rgba(0,0,0,.35);
}

.cover-title {
    font-size: clamp(32px, 5vw, 55px);
    letter-spacing: 4px;
    font-weight: normal;
    margin-bottom: 20px;
}

.cover-subtitle {
    font-size: clamp(15px, 2vw, 21px);
    font-style: italic;
    line-height: 1.6;
    max-width: 85%;
}

.cover-author {
    margin-top: 35px;
    font-size: 19px;
    letter-spacing: 2px;
}

/* =========================================================
   AÇIK KİTAP
========================================================= */

.book {
    position: relative;

    width: min(1100px, 94vw);
    height: min(720px, 82vh);

    display: flex;

    transform-style: preserve-3d;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 1s ease;
}

.book.visible {
    opacity: 1;
    pointer-events: auto;
}

/* =========================================================
   SAYFALAR
========================================================= */

.page {
    position: relative;

    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            rgba(90,65,40,.10),
            transparent 10%,
            transparent 90%,
            rgba(90,65,40,.08)
        ),
        #f4ead7;

    overflow: hidden;

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);

    backface-visibility: hidden;

    border-top: 1px solid rgba(70,45,20,.15);
    border-bottom: 1px solid rgba(70,45,20,.15);
}

.left-page {
    border-radius: 7px 0 0 7px;

    box-shadow:
        inset -18px 0 25px rgba(60,40,20,.12),
        -8px 10px 25px rgba(0,0,0,.25);
}

.right-page {
    border-radius: 0 7px 7px 0;

    box-shadow:
        inset 18px 0 25px rgba(60,40,20,.12),
        8px 10px 25px rgba(0,0,0,.25);
}

/* Kitabın ortası */

.book-spine {
    position: absolute;

    left: 50%;
    top: 0;

    width: 4px;
    height: 100%;

    transform: translateX(-50%);

    z-index: 50;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.20),
            rgba(255,255,255,.25),
            rgba(0,0,0,.20)
        );

    pointer-events: none;
}

/* =========================================================
   SAYFA İÇERİĞİ
========================================================= */

.page-content {
    width: 100%;
    height: 100%;

    padding: 55px 55px 45px;

    overflow: hidden;
}

.page-title {
    text-align: center;

    font-size: 30px;
    font-weight: normal;

    margin: 0 0 35px;

    letter-spacing: 2px;
}

.page-line {
    height: 1px;

    background: rgba(70,45,25,.25);

    margin: 15px 0 25px;
}

/* =========================================================
   SOL GÖRSEL SAYFA
========================================================= */

.visual-page {
    padding: 0;

    position: relative;
}

.visual-page::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.03),
            transparent 50%,
            rgba(0,0,0,.10)
        );

    pointer-events: none;
}

.visual-image {
    width: 100%;
    height: 100%;

    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.02),
            rgba(0,0,0,.20)
        ),
        url("kapak-gorsel.jpg");

    background-size: cover;
    background-position: center;
}

.visual-writing {
    position: absolute;

    left: 8%;
    right: 8%;
    bottom: 10%;

    text-align: center;

    color: #fff7eb;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8),
        0 0 15px rgba(0,0,0,.5);
}

.visual-writing h2 {
    margin: 0 0 12px;

    font-size: 32px;
    font-weight: normal;
    letter-spacing: 3px;
}

.visual-writing p {
    margin: 0;

    font-size: 17px;
    font-style: italic;
}

/* =========================================================
   İÇİNDEKİLER
========================================================= */

.contents {
    height: calc(100% - 75px);

    overflow: hidden;
}

.contents-item {
    display: flex;

    align-items: baseline;

    margin-bottom: 13px;

    font-size: 17px;

    cursor: pointer;

    transition: transform .2s ease;
}

.contents-item:hover {
    transform: translateX(5px);
}

.contents-name {
    white-space: nowrap;
}

.contents-dots {
    flex: 1;

    border-bottom: 1px dotted rgba(70,45,25,.45);

    margin: 0 10px;
}

/* =========================================================
   ŞİİR
========================================================= */

.poem-title {
    text-align: center;

    font-size: 26px;

    margin-bottom: 28px;

    font-weight: normal;
}

.poem {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 17px;

    line-height: 1.85;

    white-space: pre-line;

    height: calc(100% - 80px);

    overflow: hidden;
}

.poem-page-number {
    position: absolute;

    bottom: 17px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 13px;

    opacity: .55;
}

/* =========================================================
   BOŞ AYIRICI SAYFA
========================================================= */

.empty-page {
    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 14px;

    color: rgba(60,45,30,.3);

    font-style: italic;
}

/* =========================================================
   SAYFA ÇEVİRME ANİMASYONU
========================================================= */

.turning-page {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    z-index: 100;

    transform-style: preserve-3d;

    transform-origin: left center;

    transition:
        transform 1.15s cubic-bezier(.22,.61,.36,1),
        box-shadow 1.15s ease;

    pointer-events: none;
}

.turning-page.flip {
    transform:
        rotateY(-180deg)
        translateZ(1px);

    box-shadow:
        -20px 10px 45px rgba(0,0,0,.38);
}

.turning-front,
.turning-back {
    position: absolute;

    inset: 0;

    backface-visibility: hidden;

    background: #f4ead7;

    overflow: hidden;
}

.turning-back {
    transform: rotateY(180deg);
}

/* Sayfa kıvrım ışığı */

.turning-page::after {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 45px;

    right: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.16)
        );

    opacity: .5;

    pointer-events: none;
}

/* =========================================================
   KONTROLLER
========================================================= */

.controls {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 14px;

    z-index: 300;
}

.control-button {
    border: 1px solid rgba(255,255,255,.25);

    background: rgba(20,16,12,.65);

    color: #f6ead7;

    padding: 11px 19px;

    border-radius: 4px;

    cursor: pointer;

    font-family: Georgia, serif;

    transition:
        background .2s ease,
        transform .2s ease;
}

.control-button:hover {
    background: rgba(20,16,12,.9);
    transform: translateY(-2px);
}

.page-counter {
    color: #eadcc8;

    font-size: 13px;

    min-width: 90px;

    text-align: center;
}
