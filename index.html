<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* KİTAP KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. SAĞDA SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTAP GÖVDESİ (acik_kitap1.png) - Orijinal kusursuz boyutunda sabit kalıyor */
.acik-kitap-alan {
    position: absolute;
    top: 0.5cm;
    left: calc(-100% - 0.6cm);
    width: calc(200% - 1.3cm);
    height: calc(100% - 1cm);
    z-index: 1; 
    opacity: 0;
    pointer-events: none;
    transform: scale(1.1882);
    transform-origin: left center;
    clip-path: inset(0 0 0 100%);
    transition: opacity 0.3s ease-in-out, clip-path 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.kitap-kapsayici.acildi .acik-kitap-alan {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transition: opacity 0.3s ease-in-out 1.5s, clip-path 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) 1.5s;
}

.acik-kitap-alan img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* 2. SOL SAYFA - 0.2 cm küçültüldü (İçeri çekildi) */
.sol-sayfa-alan {
    position: absolute;
    top: 0.7cm;
    left: calc(-100% + 0.4cm);
    width: calc(100% - 0.6cm);
    height: calc(100% - 1.4cm);
    z-index: 0;
    opacity: 0;
    pointer-events: none;
    transform-style: preserve-3d;
    transform-origin: right center;
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sol-sayfa-alan {
    opacity: 1;
    z-index: 5;
    pointer-events: auto;
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.3s ease-in-out 1.5s;
    cursor: pointer;
}

.sol-sayfa-alan.cevirdi {
    transform: rotateY(180deg);
    z-index: 20;
}

.sol-sayfa-on, .sol-sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sol-sayfa-on img, .sol-sayfa-arka img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.sol-sayfa-arka {
    transform: rotateY(180deg);
}

/* 3. SAĞ SAYFA - 0.2 cm küçültüldü (İçeri çekildi) */
.sag-sayfa-alan {
    position: absolute;
    top: 0.7cm;
    left: 0.3cm;
    width: calc(100% - 0.6cm);
    height: calc(100% - 1.4cm);
    z-index: 0;
    opacity: 0;
    pointer-events: none;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sag-sayfa-alan {
    opacity: 1;
    z-index: 6;
    pointer-events: auto;
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.3s ease-in-out 1.5s;
    cursor: pointer;
}

.sag-sayfa-alan.cevirdi {
    transform: rotateY(-180deg);
    z-index: 20;
}

.sayfa-on, .sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sayfa-on img, .sayfa-arka img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.sayfa-arka {
    transform: rotateY(180deg);
}

/* 4. ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 1.5s ease-in-out;
    z-index: 30;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
    z-index: 1;
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<div class="kitap-kapsayici" id="kitapKapsayici">

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg">
    </div>

    <!-- AÇIK KİTAP GÖVDESİ (acik_kitap1.png) -->
    <div class="acik-kitap-alan" id="acikKitapAlan">
        <img src="acik_kitap1.png" alt="Açık Kitap Gövdesi">
    </div>

    <!-- 2. SOL SAYFA (Küçültüldü) -->
    <div class="sol-sayfa-alan" id="solSayfaAlan">
        <div class="sol-sayfa-on">
            <img src="sol_sayfa.png" alt="Sol Sayfa Ön">
        </div>
        <div class="sol-sayfa-arka">
            <img src="sag_sayfa.png" alt="Sol Sayfa Arka">
        </div>
    </div>

    <!-- 3. SAĞ SAYFA (Küçültüldü) -->
    <div class="sag-sayfa-alan" id="sagSayfaAlan">
        <div class="sayfa-on">
            <img src="sag_sayfa.png" alt="Sağ Sayfa Ön">
        </div>
        <div class="sayfa-arka">
            <img src="sol_sayfa.png" alt="Sağ Sayfa Arka">
        </div>
    </div>

    <!-- 4. ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">
        <img src="kapak.jpg" class="kapak">
        
        <div class="kapak-yazi">
            Şiir'e hatıra.<br><br>
            kelimelerden..<br>
            hayattan..<br>
            babasından.<br><br><br>
            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak">
    </div>

</div>

<script>
window.addEventListener("load", function () {
    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const solSayfaAlan = document.getElementById("solSayfaAlan");
    const sagSayfaAlan = document.getElementById("sagSayfaAlan");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;

    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";

    // Kapak açma / kapama mantığı ve zamanlama senkronizasyonu
    kapakAlan.addEventListener("click", function () {
        if (kapsayici.classList.contains("acildi")) {
            sagSayfaAlan.classList.remove("cevirdi");
            solSayfaAlan.classList.remove("cevirdi");
            kapsayici.classList.remove("acildi");
        } else {
            kapsayici.classList.add("acildi");
            kapakAlan.classList.add("dondu");
        }
    });

    // Sağ sayfaya tıklandığında sola dönme
    sagSayfaAlan.addEventListener("click", function (e) {
        e.stopPropagation();
        sagSayfaAlan.classList.toggle("cevirdi");
    });

    // Sol sayfaya tıklandığında sağa dönme (geri çevirme)
    solSayfaAlan.addEventListener("click", function (e) {
        e.stopPropagation();
        solSayfaAlan.classList.toggle("cevirdi");
    });
});
</script>

</body>
</html>
