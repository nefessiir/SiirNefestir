<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* ORTAK KAPSAYICI ALAN */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. KATMAN: SAĞDA SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: auto;
    display: block;
}

/* 2. KATMAN: İÇ SAYFALARIN ALANI (Açık Kitap Kapsayıcısı) */
.ic-sayfalar-alani {
    position: absolute;
    top: -0.5cm;
    left: calc(-50% - 3.95cm);
    width: calc(200% + 1cm);
    height: calc(100% + 1cm);
    z-index: 1; 
    pointer-events: none;
    display: flex;
    transform-style: preserve-3d;
    
    opacity: 0;
    transition: opacity 0.4s ease-in-out 0s, z-index 0s 0.4s;
}

/* Kapak açıldığında iç sayfalar belirir */
.kitap-kapsayici.acildi .ic-sayfalar-alani {
    opacity: 1;
    z-index: 4; 
    pointer-events: auto; /* Sayfa çevirme için tıklanabilir olur */
    transition: opacity 0.4s ease-in-out 1.1s, z-index 0s 0s;
}

/* Sol İç Sayfa (Sabit) */
.ic-sol-sayfa {
    width: 50%;
    height: 100%;
    position: relative;
}
.ic-sol-sayfa img {
    width: 100%;
    height: 100%;
    display: block;
}

/* Sağ İç Sayfa / Çevrilecek Yaprak Kapsayıcısı */
.ic-sag-sayfa-alan {
    width: 50%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transform-origin: left center; /* Kitabın ortasından (omurgasından) döner */
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
}

.ic-sag-sayfa-alan.cevirildi {
    transform: rotateY(-180deg);
}

/* Sağ Sayfa Ön ve Arka Yüzleri */
.sayfa-on, .sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sayfa-on img, .sayfa-arka img {
    width: 100%;
    height: 100%;
    display: block;
}

.sayfa-arka {
    transform: rotateY(180deg);
}

/* 3. KATMAN: ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: auto;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 1.5s ease-in-out;
    z-index: 3;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: auto;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<div class="kitap-kapsayici" id="kitapKapsayici">

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg">
    </div>

    <!-- 2. İÇ SAYFALAR (Sol sabit, Sağ çevrilebilir) -->
    <div class="ic-sayfalar-alani" id="icSayfalarAlani">
        <!-- Sol Sayfa -->
        <div class="ic-sol-sayfa">
            <img src="ic_sayfa_sol.jpg" alt="Sol Sayfa">
        </div>
        <!-- Sağ Çevrilebilir Sayfa -->
        <div class="ic-sag-sayfa-alan" id="sagSayfaAlan">
            <div class="sayfa-on">
                <img src="ic_sayfa_sag.jpg" alt="Sağ Sayfa Ön">
            </div>
            <div class="sayfa-arka">
                <!-- Arka tarafa başka bir görsel koyabilirsiniz, örn: sonraki sayfa veya boş arka plan -->
                <img src="ic_sayfa_sol.jpg" alt="Sağ Sayfa Arka">
            </div>
        </div>
    </div>

    <!-- 3. ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">
        <img src="kapak.jpg" class="kapak">
        
        <div class="kapak-yazi">
            Şiir'e hatıra<br>
            kelimelerden..<br>
            hayattan..<br>
            babasından.<br><br><br>
            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak">
    </div>

</div>

<script>
window.addEventListener("load", function () {
    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const sagSayfaAlan = document.getElementById("sagSayfaAlan");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;

    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";

    // Kapak açma/kapatma
    kapakAlan.addEventListener("click", function (e) {
        e.stopPropagation();
        kapakAlan.classList.toggle("dondu");
        kapsayici.classList.toggle("acildi");
    });

    // Sağ sayfayı çevirme (Tıklayınca)
    sagSayfaAlan.addEventListener("click", function (e) {
        e.stopPropagation();
        if (kapsayici.classList.contains("acildi")) {
            sagSayfaAlan.classList.toggle("cevirildi");
        }
    });
});
</script>

</body>
</html>
