<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şiir Nefestir</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #08070b;
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* Arka Plan Görseli / Atmosfer Katmanı */
        .ambient-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Harici resim varsa arkaplan0.jpg yükler, yoksa renk geçişli atmosferi gösterir */
            background-image: url("arkaplan0.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0a0b10;
            z-index: 1;
        }

        /* Yağmurlu Pencere Dokusu (Opsiyonel Yumuşatma) */
        .rain-overlay {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 2;
        }

        /* Mum Işığı Parıltısı */
        .candle-light {
            position: absolute;
            left: 10%;
            bottom: 15%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(235, 140, 50, 0.25) 0%, rgba(200, 90, 20, 0.05) 50%, transparent 80%);
            border-radius: 50%;
            z-index: 3;
            animation: flicker 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes flicker {
            0% { opacity: 0.7; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.04); }
            100% { opacity: 0.8; transform: scale(0.99); }
        }

        /* Ana Kitap Sahnesi */
        .book-container {
            position: relative;
            z-index: 10;
            width: min(86vw, 920px);
            height: min(65vh, 580px);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* Deri Ciltli Kitap Gövdesi */
        .book {
            position: relative;
            width: 100%;
            height: 100%;
            background: #2b1810;
            border-radius: 12px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.85),
                0 0 100px rgba(0,0,0,0.6),
                inset 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            padding: 18px;
            border: 1px solid rgba(110, 60, 30, 0.4);
        }

        /* Kitap Sayfaları Yapısı */
        .pages-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            background: #f4e8c1;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(245, 230, 195, 1) 0%, rgba(215, 190, 145, 1) 100%),
                linear-gradient(to right, rgba(0,0,0,0.15) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.15) 100%);
            border-radius: 4px;
            box-shadow: inset 0 0 30px rgba(100, 60, 20, 0.3);
            overflow: hidden;
        }

        /* Orta Kitap Omurgası / Gölgesi */
        .spine-shadow {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 7%;
            transform: translateX(-50%);
            background: linear-gradient(to right, 
                rgba(0,0,0,0.25) 0%, 
                rgba(0,0,0,0.05) 30%, 
                rgba(0,0,0,0.4) 50%, 
                rgba(0,0,0,0.05) 70%, 
                rgba(0,0,0,0.25) 100%);
            z-index: 15;
            pointer-events: none;
        }

        /* Sol ve Sağ Sayfalar */
        .page {
            flex: 1;
            height: 100%;
            padding: 40px 45px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .page-left {
            border-right: 1px solid rgba(0,0,0,0.06);
        }

        /* Şiir Metin Alanı */
        .poem-content {
            font-family: 'Caveat', cursive;
            font-size: 1.65rem;
            line-height: 1.55;
            color: #2a1a08;
            white-space: pre-line;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            text-shadow: 0 0 1px rgba(42, 26, 8, 0.2);
        }

        .poem-content.visible {
            opacity: 1;
        }

        /* Tüy Kalem Detayı */
        .quill-art {
            position: absolute;
            right: -20px;
            bottom: -15px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(120,70,20,0.08) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.75;
            z-index: 12;
            transform: rotate(-15deg);
        }

        /* Navigasyon Okları */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(20, 15, 12, 0.65);
            border: 1px solid rgba(212, 133, 62, 0.35);
            color: #d4953e;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .nav-btn:hover {
            background: rgba(40, 25, 18, 0.9);
            color: #f5e0b8;
            border-color: rgba(212, 133, 62, 0.85);
            box-shadow: 0 0 15px rgba(212, 133, 62, 0.35);
        }

        .prev-btn { left: -65px; }
        .next-btn { right: -65px; }

        /* Sayfa Numarası */
        .page-number {
            font-size: 0.85rem;
            color: #7a6348;
            text-align: center;
            font-family: 'Cinzel', serif;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .book-container {
                width: 94vw;
                height: 75vh;
            }
            .page {
                padding: 25px 20px;
            }
            .poem-content {
                font-size: 1.35rem;
            }
            .nav-btn {
                top: auto;
                bottom: -55px;
                transform: none;
            }
            .prev-btn { left: 25%; }
            .next-btn { right: 25%; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="rain-overlay"></div>
    <div class="candle-light"></div>

    <div class="book-container">
        <button class="nav-btn prev-btn" onclick="prevPage()">&#10094;</button>

        <div class="book">
            <div class="pages-wrapper">
                <div class="spine-shadow"></div>

                <!-- SOL SAYFA -->
                <div class="page page-left">
                    <div class="poem-content" id="leftPoem"></div>
                    <div class="page-number" id="leftPageNum">1</div>
                </div>

                <!-- SAĞ SAYFA -->
                <div class="page page-right">
                    <div class="poem-content" id="rightPoem"></div>
                    <div class="quill-art"></div>
                    <div class="page-number" id="rightPageNum">2</div>
                </div>
            </div>
        </div>

        <button class="nav-btn next-btn" onclick="nextPage()">&#10095;</button>
    </div>

    <script>
        const poemStanzas = [
            `Yoksam düşlerinde
Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor`,

            `Bir sessizlik büyüyor
İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor`,

            `Ben seni beklerken
Zaman ağır ağır geçiyor
Her geçen gün biraz daha
İçimde büyüyor özlemin`,

            `Bir gün dönersin diye
Penceremde ışık yanıyor
Gecenin en sessiz yerinde
Adını fısıldıyor rüzgar`,

            `Belki uzaklardasın
Belki hemen yanımdasın
Ama ben yine de seni
Kalbimin içinde arıyorum`,

            `Ne zaman gözlerimi kapatsam
Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun`
        ];

        let currentPagePair = 0;

        const leftPoem = document.getElementById('leftPoem');
        const rightPoem = document.getElementById('rightPoem');
        const leftPageNum = document.getElementById('leftPageNum');
        const rightPageNum = document.getElementById('rightPageNum');

        function renderPages() {
            leftPoem.classList.remove('visible');
            rightPoem.classList.remove('visible');

            setTimeout(() => {
                const leftIndex = currentPagePair * 2;
                const rightIndex = leftIndex + 1;

                leftPoem.textContent = poemStanzas[leftIndex] || '';
                rightPoem.textContent = poemStanzas[rightIndex] || '';

                leftPageNum.textContent = leftIndex + 1;
                rightPageNum.textContent = rightIndex + 1;

                leftPoem.classList.add('visible');
                rightPoem.classList.add('visible');
            }, 300);
        }

        function nextPage() {
            if ((currentPagePair + 1) * 2 < poemStanzas.length) {
                currentPagePair++;
                renderPages();
            }
        }

        function prevPage() {
            if (currentPagePair > 0) {
                currentPagePair--;
                renderPages();
            }
        }

        // İlk yükleme
        renderPages();
    </script>
</body>
</html>
