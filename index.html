<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Şiir Nefestir</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #111;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

/* =========================================
   KITAP ALANI
========================================= */

.book-stage {
    position: relative;
    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    background-image: url("arkaplan0.jpeg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    container-type: inline-size;
    perspective: 2500px;
}

/* =========================================
   SAYFALAR (ORİJİNAL KONUM VE BOYUTLAR)
========================================= */

.page {
    position: absolute;
    top: 13.2%;
    height: calc(100% - 27.5%);
    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    overflow: hidden;
    z-index: 2;
}

.left-page {
    left: 19%;
    width: 34%;
}

.right-page {
    left: 48.828125%;
    width: 38.411458%;
    cursor: grab;
}

.right-page:active {
    cursor: grabbing;
}

/* =========================================
   SAYFA ICERIGI & YAZI KATMANI
========================================= */

.page-content {
    position: absolute;
    left: 14%;
    top: 11%;
    width: 72%;
    height: 78%;
    overflow: hidden;
    z-index: 5;
}

/* =========================================
   SIIR
========================================= */

.poem {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 0;
    color: #174a82;
    font-family: "Caveat", cursive;
    font-size: 1.85cqw;
    font-weight: 500;
    line-height: 1.55;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: normal;
    opacity: 0;
    transition: opacity 0.8s ease;
}

/* =========================================
   3D DRAGGABLE FLIPPER (SÜRÜKLENEN SAYFA)
========================================= */

.flipper {
    position: absolute;
    top: 13.2%;
    left: 48.828125%;
    width: 38.411458%;
    height: calc(100% - 27.5%);
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 30;
    pointer-events: none;
    display: none;
}

.flipper.active {
    display: block;
}

.flipper-face {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    backface-visibility: hidden;
    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    overflow: hidden;
}

.flipper-front {
    z-index: 2;
    transform: rotateY(0deg);
}

.flipper-back {
    z-index: 1;
    transform: rotateY(180deg) scaleX(-1);
}

/* Kıvrılma Gölgesi ve Efekti */
.curl-shadow {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, transparent 60%, rgba(0,0,0,0.12) 80%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
}

/* =========================================
   ARKA PLAN TUY KALEMLARI (SAYFA DOKUSU)
========================================= */

.quill-bg-right {
    position: absolute;
    max-width: 85%;
    max-height: 85%;
    width: auto;
    height: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-35deg);
    opacity: 0.22;
    pointer-events: none;
    z-index: 1;
    filter: sepia(0.3) contrast(0.9);
}

.quill-bg-left {
    position: absolute;
    max-width: 85%;
    max-height: 85%;
    width: auto;
    height: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scaleX(-1) rotate(-35deg);
    opacity: 0.22;
    pointer-events: none;
    z-index: 1;
    filter: sepia(0.3) contrast(0.9);
}

/* =========================================
   KOSENIN KALEM / MUREKKEP GORSELI
========================================= */

.ink-quill {
    position: absolute;
    width: 8.5cqw;
    height: auto;
    left: 4.5%;
    bottom: 2.5%;
    z-index: 10;
    pointer-events: none;
}

/* =========================================
   OKLAR
========================================= */

.nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 5cqw;
    height: 5cqw;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.55);
    font-size: 4cqw;
    line-height: 5cqw;
    cursor: pointer;
    z-index: 50;
    transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-arrow:hover {
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 15px rgba(255,255,255,0.8);
    transform: translateY(-50%) scale(1.08);
}

.left-arrow { left: 12%; }
.right-arrow { right: 8%; }

/* =========================================
   UST KONTROLLER & EQUALIZER
========================================= */

.top-controls {
    position: absolute;
    top: 3%;
    left: 3%;
    z-index: 60;
    display: flex;
    gap: 1cqw;
}

.control-button {
    width: 4.2cqw;
    height: 4.2cqw;
    min-width: 28px;
    min-height: 28px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    background: rgba(0,0,0,0.22);
    color: rgba(255,255,255,0.75);
    cursor: pointer;
    font-size: 2cqw;
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-button:hover {
    background: rgba(0,0,0,0.4);
    color: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.35);
}

.equalizer {
    position: absolute;
    left: 50%;
    bottom: 3%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 0.4cqw;
    height: 3cqw;
    z-index: 40;
}

.equalizer span {
    display: block;
    width: 0.3cqw;
    min-width: 2px;
    height: 30%;
    background: rgba(255,255,255,0.55);
    border-radius: 2px;
}

.blank-page {
    background-image: url("sag_sayfa_bos.png") !important;
}
</style>
</head>

<body>

<div class="book-stage" id="bookStage">

    <div class="top-controls">
        <button class="control-button" title="Sesli dinle" onclick="toggleAudio()">🔊</button>
        <button class="control-button" title="Tam ekran" onclick="toggleFullscreen()">⛶</button>
    </div>

    <!-- SOL SAYFA -->
    <div class="page left-page" id="leftPage">
        <img src="yazan_kalem3.png" class="quill-bg-left" alt="">
        <div class="page-content">
            <div class="poem" id="leftPoem"></div>
        </div>
    </div>

    <!-- SAG SAYFA -->
    <div class="page right-page" id="rightPage">
        <img src="yazan_kalem3.png" class="quill-bg-right" alt="">
        <div class="page-content">
            <div class="poem" id="rightPoem"></div>
        </div>
    </div>

    <!-- SÜRÜKLENEN / DÖNEN SAYFA KATMANI -->
    <div class="flipper" id="flipper">
        <div class="flipper-face flipper-front" id="flipperFront">
            <img src="yazan_kalem3.png" class="quill-bg-right" alt="">
            <div class="page-content">
                <div class="poem" id="flipperFrontPoem" style="opacity: 1;"></div>
            </div>
            <div class="curl-shadow"></div>
        </div>
        <div class="flipper-face flipper-back" id="flipperBack">
            <img src="yazan_kalem3.png" class="quill-bg-left" alt="">
            <div class="page-content">
                <div class="poem" id="flipperBackPoem" style="opacity: 1;"></div>
            </div>
            <div class="curl-shadow"></div>
        </div>
    </div>

    <img src="murekkep_kalem.png" class="ink-quill" alt="">

    <button class="nav-arrow left-arrow" onclick="previousPage()">‹</button>
    <button class="nav-arrow right-arrow" onclick="nextPage()">›</button>

    <div class="equalizer">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

</div>

<script>
/* ELEMANLAR */
const leftPoem = document.getElementById("leftPoem");
const rightPoem = document.getElementById("rightPoem");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const bookStage = document.getElementById("bookStage");

const flipper = document.getElementById("flipper");
const flipperFrontPoem = document.getElementById("flipperFrontPoem");
const flipperBackPoem = document.getElementById("flipperBackPoem");

/* ŞİİR METNİ */
const poemText =
`Yoksam düşlerinde
Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor

Bir sessizlik büyüyor
İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor

Ben seni beklerken
Zaman ağır ağır geçiyor
Her geçen gün biraz daha
İçimde büyüyor özlemin

Bir gün dönersin diye
Penceremde ışık yanıyor
Gecenin en sessiz yerinde
Adını fısıldıyor rüzgar

Belki uzaklardasın
Belki hemen yanımdasın
Ama ben yine de seni
Kalbimin içinde arıyorum

Ne zaman gözlerimi kapatsam
Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun

Yoksam düşlerinde
Bir gün hatırla beni
Çünkü ben bu dünyada
Seni beklemek için vardım

Bekle…!
Geliyorum!`;

/* METİN BOYUTU & HESAPLAMA */
const measurePoem = document.createElement("div");
measurePoem.style.position = "absolute";
measurePoem.style.visibility = "hidden";
measurePoem.style.pointerEvents = "none";
measurePoem.style.fontFamily = '"Caveat", cursive';
measurePoem.style.whiteSpace = "nowrap";
document.body.appendChild(measurePoem);

function measureTextWidth(text, fontSize) {
    measurePoem.style.fontSize = fontSize;
    measurePoem.textContent = text;
    return measurePoem.getBoundingClientRect().width;
}

function getWrappedLines() {
    const pageContent = document.querySelector(".left-page .page-content");
    const availableWidth = pageContent.getBoundingClientRect().width;
    const currentFontSize = window.getComputedStyle(leftPoem).fontSize;
    const rawLines = poemText.split("\n");
    const result = [];

    for (const rawLine of rawLines) {
        if (rawLine.trim() === "") {
            result.push("");
            continue;
        }
        const words = rawLine.split(/\s+/);
        let currentLine = "";
        for (const word of words) {
            const testLine = currentLine ? currentLine + " " + word : word;
            if (measureTextWidth(testLine, currentFontSize) <= availableWidth) {
                currentLine = testLine;
            } else {
                if (currentLine) result.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine) result.push(currentLine);
    }
    return result;
}

function buildPages() {
    const lines = getWrappedLines();
    const pageContent = document.querySelector(".left-page .page-content");
    const pageRect = pageContent.getBoundingClientRect();

    const test = document.createElement("div");
    test.style.position = "absolute";
    test.style.visibility = "hidden";
    test.style.pointerEvents = "none";
    test.style.width = pageRect.width + "px";
    test.style.fontFamily = '"Caveat", cursive';
    test.style.fontSize = window.getComputedStyle(leftPoem).fontSize;
    test.style.lineHeight = "1.55";
    test.style.whiteSpace = "pre-wrap";
    test.textContent = "A";

    document.body.appendChild(test);
    const lineHeight = test.getBoundingClientRect().height;
    test.remove();

    const linesPerPage = Math.max(1, Math.floor(pageRect.height / lineHeight));
    const pagesList = [];
    for (let i = 0; i < lines.length; i += linesPerPage) {
        pagesList.push(lines.slice(i, i + linesPerPage));
    }
    return pagesList;
}

/* DURUM TANIMLARI */
let pages = [];
let pageIndex = 0;
let stageState = "left";
let animating = false;

function fadeIn(element) {
    element.style.opacity = "0";
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            element.style.opacity = "1";
        });
    });
}

function fadeOut(element) {
    element.style.opacity = "0";
}

function startBook() {
    pages = buildPages();
    pageIndex = 0;
    stageState = "left";

    leftPage.classList.remove("blank-page");
    rightPage.classList.remove("blank-page");

    leftPoem.textContent = pages[0] ? pages[0].join("\n") : "";
    rightPoem.textContent = "";

    leftPoem.style.opacity = "0";
    rightPoem.style.opacity = "0";
}

/* SÜRÜKLEME (DRAG & TOUCH) MANTIĞI */
let isDragging = false;
let startX = 0;
let currentProgress = 0; // 0 (sağ) -> 1 (sol)

function onPointerDown(e) {
    if (animating) return;
    
    // Sağ sayfanın sağ yarısından veya sağ alt köşeden tutulduğunu kontrol et
    const rightRect = rightPage.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    if (!clientX || !clientY) return;

    // Sadece sağ sayfa alanından başlarsa aktif et
    if (clientX >= rightRect.left && clientX <= rightRect.right + 40 &&
        clientY >= rightRect.top && clientY <= rightRect.bottom) {
        
        isDragging = true;
        startX = clientX;
        
        // Flipper'a doğru sayfaları yükle
        if (stageState === "spread") {
            const nextLeftIndex = pageIndex + 2;
            flipperFrontPoem.textContent = rightPoem.textContent;
            flipperBackPoem.textContent = pages[nextLeftIndex] ? pages[nextLeftIndex].join("\n") : "";
        } else if (stageState === "right") {
            flipperFrontPoem.textContent = rightPoem.textContent;
            flipperBackPoem.textContent = "";
        } else {
            flipperFrontPoem.textContent = "";
            flipperBackPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        }

        flipper.style.transition = "none";
        flipper.classList.add("active");
    }
}

function onPointerMove(e) {
    if (!isDragging) return;

    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    if (!clientX) return;

    const deltaX = startX - clientX;
    const maxDistance = bookStage.getBoundingClientRect().width * 0.45;
    
    currentProgress = Math.min(Math.max(deltaX / maxDistance, 0), 1);

    const angle = currentProgress * -180;
    const skew = Math.sin(currentProgress * Math.PI) * -5; // Sayfanın bükülme kavis açısı
    const translateY = Math.sin(currentProgress * Math.PI) * -2; // Sağ alt kıvrılma kalkması

    flipper.style.transform = `rotateY(${angle}deg) rotateZ(${skew}deg) translateY(${translateY}%)`;
}

async function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;

    flipper.style.transition = "transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)";

    if (currentProgress > 0.35) {
        // Eşik geçildi: Sol sayfaya düşür / tam kapat
        flipper.style.transform = `rotateY(-180deg) rotateZ(0deg) translateY(0%)`;
        await wait(500);

        if (stageState === "spread") {
            pageIndex += 2;
            leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
            rightPoem.textContent = pages[pageIndex + 1] ? pages[pageIndex + 1].join("\n") : "";
            leftPoem.style.opacity = "1";
            rightPoem.style.opacity = pages[pageIndex + 1] ? "1" : "0";
            stageState = pages[pageIndex + 1] ? "spread" : "right";
        } else if (stageState === "right") {
            if (pageIndex + 1 < pages.length) {
                rightPoem.textContent = pages[pageIndex + 1].join("\n");
                fadeIn(rightPoem);
                stageState = "spread";
            }
        } else if (stageState === "left") {
            leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
            fadeIn(leftPoem);
            stageState = "right";
        }
    } else {
        // Eşik geçilemedi: Sağ tarafa geri esnet
        flipper.style.transform = `rotateY(0deg) rotateZ(0deg) translateY(0%)`;
        await wait(500);
    }

    flipper.classList.remove("active");
    flipper.style.transform = "";
}

/* ETKİLEŞİM DİNLENİCİLERİ */
window.addEventListener("mousedown", onPointerDown);
window.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerUp);

window.addEventListener("touchstart", onPointerDown, { passive: true });
window.addEventListener("touchmove", onPointerMove, { passive: true });
window.addEventListener("touchend", onPointerUp);

/* BUTONLARLA İLERLEME/GERİLEME */
async function nextPage() {
    if (animating) return;
    animating = true;

    if (stageState === "left") {
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        fadeIn(leftPoem);
        stageState = "right";
        await wait(1000);
        animating = false;
        return;
    }

    if (stageState === "right") {
        if (pageIndex + 1 < pages.length) {
            rightPoem.textContent = pages[pageIndex + 1].join("\n");
            fadeIn(rightPoem);
            stageState = "spread";
            await wait(1000);
            animating = false;
            return;
        }
        stageState = "spread";
        animating = false;
        return;
    }

    if (stageState === "spread") {
        const nextLeftIndex = pageIndex + 2;
        const nextRightIndex = pageIndex + 3;

        flipperFrontPoem.textContent = rightPoem.textContent;
        flipperBackPoem.textContent = pages[nextLeftIndex] ? pages[nextLeftIndex].join("\n") : "";

        flipper.style.transition = "transform 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95)";
        flipper.classList.add("active");

        requestAnimationFrame(() => {
            flipper.style.transform = "rotateY(-180deg)";
        });

        rightPoem.textContent = pages[nextRightIndex] ? pages[nextRightIndex].join("\n") : "";

        await wait(1200);

        pageIndex += 2;
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        leftPoem.style.opacity = "1";

        flipper.classList.remove("active");
        flipper.style.transform = "";

        if (pageIndex < pages.length) {
            stageState = "right";
        } else {
            stageState = "finished";
        }

        animating = false;
        return;
    }
}

async function previousPage() {
    if (animating || (pageIndex === 0 && stageState === "left")) return;
    animating = true;

    if (stageState === "right") {
        fadeOut(leftPoem);
        await wait(800);
        stageState = "left";
        animating = false;
        return;
    }

    if (stageState === "spread") {
        fadeOut(rightPoem);
        await wait(800);
        stageState = "right";
        animating = false;
        return;
    }

    if (stageState === "finished" || (stageState === "left" && pageIndex >= 2)) {
        pageIndex = Math.max(0, pageIndex - 2);
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        rightPoem.textContent = pages[pageIndex + 1] ? pages[pageIndex + 1].join("\n") : "";
        fadeIn(leftPoem);
        if (pages[pageIndex + 1]) fadeIn(rightPoem);
        stageState = pages[pageIndex + 1] ? "spread" : "right";
        await wait(800);
    }

    animating = false;
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

function toggleAudio() {
    alert("Ses oynatma başlatıldı/durduruldu.");
}

let resizeTimer;
window.addEventListener("load", () => {
    setTimeout(startBook, 500);
});

window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        pages = buildPages();
    }, 200);
});
</script>

</body>
</html>
