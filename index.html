<script>
window.addEventListener("load", function () {

    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const sayfalarKapsayici = document.getElementById("sayfalarKapsayici");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;
    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";


    /* =====================================================
       İLK 4 SAYFANIN MEVCUT METİNLERİ
       BURAYA DOKUNULMADI
    ===================================================== */

    const sagSayfaMetni1 =
`Bilmeni isterim ki;
Ben bu şiirleri birilerine bir şey anlatmak için değil,
içimde kopan fırtınaları , bir yağmur misali kağıda dökmek için yazdım.
Ve bazılarını yıllar sonra sen bul diye sakladım. Çünkü ben buldum.

Sana bırakabileceğim hatıralar arasından biri de , bu şiirlerim.
Ve bu şiirleri benim sesimden duymak isteyebileceğini düşündüm..
Ben çok isterdim..
Bir gün bu sayfalarda kendinden bir parça bulursan, bil ki ,
o şiir senden önce yazılmış olsa bile, sana aittir.`;


    const sagSayfaMetni2 =
`Çünkü sen benim , yani bu kocaman gövdenin altındaki çelimsiz çocuğun ,
beklediği yaşama sebebisin.
Çünkü sen benim , yazdığım en güzel şiirsin…

Beni hep gülen gözlerle ve sana deliler gibi aşık bir kalple hatırla…

Hasretle gamzelerinden ve o küçük çenenden öperim.

Baban.`;


    /* =====================================================
       SADECE 1 ŞİİR
       SAYFA 5'TEN BAŞLAYACAK
    ===================================================== */

    const siirBasligi = "GELİYORUM";

    const siirMetni =
`Yoksam düşlerinde, gecelerinde kayıpsam..
Bakışların hep donuk, gözlerin ıslanıyorsa..
Soğuksa ellerin, buz gibiyse hala..
Ve inatçıysan çağrında..sabırsız
Geliyorum!

Gecelerin koynunda bir esireysen
Yanaklarımdan akan yaşlar kadar sessiz
Yağmurlu gecelerde…
Bir ceylan yavrusu gibi ürkek ve ıslaksan
Geliyorum!

Denizin koyu maviliğinde kayboluyorsan..
Her kanat çırpışında martıların,
Yüreğine çaresiz sancılar saplanıyorsa
Geliyorum!

Bir rüzgar kırmışsa dalını..
Dudaklarını kurutmuşsa serin bir meltem..
Sıyrılamamışsan gecenin sisli ve bulanık karanlığından
Ve şefkatli eller bekliyorsan yaşamak için..

Bekle…!

Geliyorum!`;


    /* =====================================================
       SAYFA SAYISI
       25 YAPRAK KORUNDU.
       ŞİMDİLİK TEK ŞİİR İÇİN YETERLİ.
    ===================================================== */

    const toplamYaprak = 25;

    let yaprakElementleri = [];
    let aktifZamanAsimlari = [];
    let mevcutAdimIndex = 0;
    let isTidyingUp = false;


    /* =====================================================
       ZAMANLARI TEMİZLE
    ===================================================== */

    function temizleZamanAsimlari() {

        aktifZamanAsimlari.forEach(
            id => clearTimeout(id)
        );

        aktifZamanAsimlari = [];
    }


    /* =====================================================
       HTML GÜVENLİ HALE GETİR
    ===================================================== */

    function htmlEscape(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =====================================================
       ŞİİR BAŞLIĞI

       KIZIM'a… ile aynı:
       - ortalı
       - aynı font büyüklüğü
       - aynı üst mesafe
    ===================================================== */

    function siirBasligiHTML() {

        return `
            <span class="siir-baslik">
                ${htmlEscape(siirBasligi)}
            </span>
        `;
    }


    /* =====================================================
       ŞİİR SAYFALARINI HESAPLAYACAK ÖLÇÜM ALANI
       
       BU ALAN SADECE ŞİİR İÇİN.
       İLK 4 SAYFAYA DOKUNMAZ.
    ===================================================== */

    const olcum =
        document.createElement("div");

    olcum.style.position = "absolute";
    olcum.style.visibility = "hidden";
    olcum.style.pointerEvents = "none";
    olcum.style.left = "-100000px";
    olcum.style.top = "0";

    document.body.appendChild(olcum);


    /* =====================================================
       SAYFA 5'İN GERÇEK YAZI ALANINI ÖLÇ
    ===================================================== */

    function sayfaYaziOlcusu() {

        const deneme =
            document.createElement("div");

        deneme.className =
            "sayfa-yazi";

        deneme.style.visibility = "hidden";
        deneme.style.opacity = "1";
        deneme.style.display = "block";

        sayfalarKapsayici.appendChild(
            deneme
        );

        const rect =
            deneme.getBoundingClientRect();

        const sonuc = {
            width: rect.width,
            height: rect.height
        };

        deneme.remove();

        return sonuc;
    }


    /* =====================================================
       BİR METNİN SAYFAYA SIĞIP SIĞMADIĞINI ÖLÇ
       
       İLK SAYFADA BAŞLIK VAR.
       DEVAM SAYFALARINDA BAŞLIK YOK.
    ===================================================== */

    function metinSigiyorMu(
        metin,
        baslikVar
    ) {

        const alan =
            sayfaYaziOlcusu();

        olcum.innerHTML = "";

        olcum.style.width =
            alan.width + "px";

        olcum.style.height =
            alan.height + "px";

        const stil =
            getComputedStyle(
                document.querySelector(".sayfa-yazi")
            );

        olcum.style.fontFamily =
            stil.fontFamily;

        olcum.style.fontSize =
            stil.fontSize;

        olcum.style.lineHeight =
            stil.lineHeight;

        olcum.style.color =
            stil.color;

        olcum.style.whiteSpace =
            "pre-wrap";

        olcum.style.wordBreak =
            "normal";

        olcum.style.overflowWrap =
            "break-word";

        olcum.style.boxSizing =
            "border-box";

        if (baslikVar) {

            const baslik =
                document.createElement("div");

            baslik.style.textAlign =
                "center";

            baslik.style.fontFamily =
                "'Dancing Script', cursive, serif";

            baslik.style.fontSize =
                "1.25em";

            baslik.style.fontWeight =
                "700";

            baslik.style.lineHeight =
                "1.2";

            baslik.style.marginTop =
                "2.5em";

            baslik.style.marginBottom =
                "0.2em";

            baslik.textContent =
                siirBasligi;

            olcum.appendChild(
                baslik
            );
        }

        const govde =
            document.createElement("span");

        govde.style.whiteSpace =
            "pre-wrap";

        govde.textContent =
            metin;

        olcum.appendChild(
            govde
        );

        return (
            olcum.scrollHeight <=
            alan.height + 1
        );
    }


    /* =====================================================
       GELİYORUM'U SAYFALARA BÖL

       5. SAYFA:
       BAŞLIK + ŞİİR GÖVDESİ

       6. SAYFA VE SONRASI:
       SADECE KALAN ŞİİR

       FONT KÜÇÜLTÜLMEZ.
    ===================================================== */

    function siiriBol() {

        const kelimeler =
            siirMetni.match(/\S+(?:\s+|$)/g) || [];

        const sayfalar = [];

        let mevcutMetin = "";
        let ilkSayfa = true;

        for (
            let i = 0;
            i < kelimeler.length;
            i++
        ) {

            const aday =
                mevcutMetin +
                kelimeler[i];

            const sigiyor =
                metinSigiyorMu(
                    aday,
                    ilkSayfa
                );

            if (
                !sigiyor &&
                mevcutMetin.trim() !== ""
            ) {

                sayfalar.push({
                    baslik:
                        ilkSayfa
                            ? siirBasligi
                            : "",
                    metin:
                        mevcutMetin
                });

                mevcutMetin =
                    kelimeler[i];

                ilkSayfa = false;

            } else {

                mevcutMetin =
                    aday;
            }
        }

        if (
            mevcutMetin.trim() !== ""
        ) {

            sayfalar.push({
                baslik:
                    ilkSayfa
                        ? siirBasligi
                        : "",
                metin:
                    mevcutMetin
            });
        }

        return sayfalar;
    }


    const siirSayfalari =
        siiriBol();


    /* =====================================================
       ŞİİRİN SAYFA İÇERİĞİNİ AL
    ===================================================== */

    function siirSayfaIcerigi(sayfaNo) {

        /*
           Şiir 5. sayfadan başlıyor.

           5 -> siirSayfalari[0]
           6 -> siirSayfalari[1]
           7 -> siirSayfalari[2]
           ...
        */

        const index =
            sayfaNo - 5;

        if (
            index < 0 ||
            index >= siirSayfalari.length
        ) {
            return "";
        }

        const parca =
            siirSayfalari[index];

        let sonuc = "";

        if (parca.baslik) {

            sonuc += `
                <span class="sayfa-baslik">
                    ${htmlEscape(parca.baslik)}
                </span>
            `;
        }

        sonuc +=
            `<span class="siir-devam-metni">${htmlEscape(parca.metin)}</span>`;

        return sonuc;
    }


    /* =====================================================
       İÇERİKLERİ GÖSTER
       
       İLK 4 SAYFANIN ZAMANLAMASI KORUNDU.

       ŞİİR SAYFALARINDA DA AYNI 1 SANİYELİK
       SAYFA GEÇİŞ BEKLEMESİ KULLANILIYOR.
    ===================================================== */

    function sayfaIcerikleriniGoster(adim) {

        temizleZamanAsimlari();


        /* ===============================================
           SAYFA 1 - MEVCUT SİSTEM
           =============================================== */

        if (adim === 1) {

            let t1 =
                setTimeout(() => {

                    const b =
                        document.getElementById(
                            "solBaslik"
                        );

                    const g =
                        document.getElementById(
                            "solGovde"
                        );

                    if (b)
                        b.classList.add(
                            "acildi"
                        );

                    let t2 =
                        setTimeout(() => {

                            if (g)
                                g.classList.add(
                                    "acildi"
                                );

                        }, 1000);

                    aktifZamanAsimlari.push(t2);

                }, 1000);

            aktifZamanAsimlari.push(t1);


            /* SAYFA 2'NİN MEVCUT KURALI */

            let yaprak0 =
                yaprakElementleri[0];

            if (yaprak0) {

                let sagGovde0 =
                    yaprak0.querySelector(
                        ".sayfa-on .sayfa-govde"
                    );

                if (sagGovde0) {

                    let t3 =
                        setTimeout(() => {

                            sagGovde0.classList.add(
                                "acildi"
                            );

                        }, 10000);

                    aktifZamanAsimlari.push(t3);
                }
            }

            return;
        }


        /* ===============================================
           DİĞER SAYFALAR
           =============================================== */

        let yaprakIndex =
            adim - 2;

        if (
            yaprakIndex >= 0 &&
            yaprakIndex <
            yaprakElementleri.length
        ) {

            let aktifYaprak =
                yaprakElementleri[
                    yaprakIndex
                ];

            /*
               SOLDA GÖRÜNEN ARKA SAYFA
            */

            let arkaBaslik =
                aktifYaprak.querySelector(
                    ".sayfa-arka .sayfa-baslik"
                );

            let arkaGovde =
                aktifYaprak.querySelector(
                    ".sayfa-arka .sayfa-govde"
                );


            /*
               SAĞDA GÖRÜNEN SONRAKİ SAYFA
               
               Böylece şiirin 6. sayfası boş
               kalmaz.
            */

            let sonrakiYaprak =
                yaprakElementleri[
                    yaprakIndex + 1
                ];

            let sagGovde = null;

            if (sonrakiYaprak) {

                sagGovde =
                    sonrakiYaprak.querySelector(
                        ".sayfa-on .sayfa-govde"
                    );
            }


            /*
               MEVCUT SİSTEMDEKİ 1 SANİYELİK
               GECİKME KORUNUYOR.
            */

            let t1 =
                setTimeout(() => {

                    if (arkaBaslik) {

                        arkaBaslik.classList.add(
                            "acildi"
                        );
                    }

                    if (arkaGovde) {

                        arkaGovde.classList.add(
                            "acildi"
                        );
                    }


                    /*
                       SAĞ SAYFANIN ŞİİR GÖVDESİ
                       DE AYNI ZAMANDA AÇILIR.
                    */

                    if (sagGovde) {

                        sagGovde.classList.add(
                            "acildi"
                        );
                    }

                }, 1000);

            aktifZamanAsimlari.push(t1);
        }
    }


    /* =====================================================
       SONRAKİ SAYFA
       MEVCUT SİSTEM KORUNDU
    ===================================================== */

    function sonrakiSayfayaGec() {

        if (isTidyingUp) return;

        temizleZamanAsimlari();

        if (
            mevcutAdimIndex === 0
        ) {

            kapsayici.classList.add(
                "acildi"
            );

            kapakAlan.classList.add(
                "dondu"
            );

            mevcutAdimIndex = 1;

            setTimeout(() => {

                sayfaIcerikleriniGoster(1);

            }, 1200);

        } else {

            let yaprakIndexGercek =
                mevcutAdimIndex - 1;


            if (
                mevcutAdimIndex === 1
            ) {

                let yaprak0 =
                    yaprakElementleri[0];

                let sagGovde0 =
                    yaprak0.querySelector(
                        ".sayfa-on .sayfa-govde"
                    );

                if (sagGovde0) {

                    sagGovde0.classList.add(
                        "acildi"
                    );
                }
            }


            if (
                yaprakIndexGercek <
                toplamYaprak
            ) {

                let yaprak =
                    yaprakElementleri[
                        yaprakIndexGercek
                    ];

                if (
                    !yaprak.classList.contains(
                        "cevirdi"
                    )
                ) {

                    yaprak.style.zIndex =
                        50 +
                        yaprakIndexGercek;

                    yaprak.classList.add(
                        "cevirdi"
                    );

                    mevcutAdimIndex++;


                    if (
                        mevcutAdimIndex >
                        toplamYaprak
                    ) {

                        setTimeout(() => {

                            otomatikGeriyeSar();

                        }, 1200);

                        return;
                    }


                    setTimeout(() => {

                        sayfaIcerikleriniGoster(
                            mevcutAdimIndex
                        );

                    }, 1000);

                } else {

                    otomatikGeriyeSar();
                }

            } else {

                otomatikGeriyeSar();
            }
        }
    }


    /* =====================================================
       ÖNCEKİ SAYFA
    ===================================================== */

    function oncekiSayfayaGec() {

        if (isTidyingUp) return;

        temizleZamanAsimlari();

        if (
            mevcutAdimIndex > 1
        ) {

            mevcutAdimIndex--;

            let yaprakIndex =
                mevcutAdimIndex - 1;

            let yaprak =
                yaprakElementleri[
                    yaprakIndex
                ];

            yaprak.classList.remove(
                "cevirdi"
            );

            yaprak.style.zIndex =
                toplamYaprak -
                yaprakIndex;

            setTimeout(() => {

                sayfaIcerikleriniGoster(
                    mevcutAdimIndex
                );

            }, 1000);

        } else if (
            mevcutAdimIndex === 1
        ) {

            kapsayici.classList.remove(
                "acildi"
            );

            kapakAlan.classList.remove(
                "dondu"
            );

            mevcutAdimIndex = 0;
        }
    }


    /* =====================================================
       GERİ SAR
    ===================================================== */

    function otomatikGeriyeSar() {

        if (isTidyingUp) return;

        isTidyingUp = true;

        temizleZamanAsimlari();

        let index =
            yaprakElementleri.length - 1;

        let rewindInterval =
            setInterval(function () {

                if (index >= 0) {

                    yaprakElementleri[
                        index
                    ].style.zIndex = 100;

                    yaprakElementleri[
                        index
                    ].classList.remove(
                        "cevirdi"
                    );

                    yaprakElementleri[
                        index
                    ].style.zIndex =
                        toplamYaprak -
                        index;

                    index--;

                } else {

                    clearInterval(
                        rewindInterval
                    );

                    setTimeout(function () {

                        kapsayici.classList.remove(
                            "acildi"
                        );

                        kapakAlan.classList.remove(
                            "dondu"
                        );

                        mevcutAdimIndex = 0;

                        isTidyingUp = false;

                    }, 400);
                }

            }, 100);
    }


    /* =====================================================
       YAPRAKLARI OLUŞTUR

       İLK 4 SAYFA AYNEN KORUNDU.

       SADECE 5. SAYFADAN İTİBAREN GELİYORUM
       İÇERİĞİ EKLENİYOR.
    ===================================================== */

    for (
        let i = 0;
        i < toplamYaprak;
        i++
    ) {

        const yaprakDiv =
            document.createElement(
                "div"
            );

        yaprakDiv.className =
            "sayfa-yaprak";

        yaprakDiv.style.zIndex =
            toplamYaprak - i;


        let onSayfaNo =
            (i * 2) + 2;

        let arkaSayfaNo =
            (i * 2) + 3;


        let icerikOn = "";

        let icerikArka =
            `<div class="sayfa-yazi">
                <span class="sayfa-govde"></span>
            </div>`;


        /* ===============================================
           İLK YAPRAK:
           SAYFA 2 + SAYFA 3
        =============================================== */

        if (i === 0) {

            icerikOn =
                `<div class="sayfa-yazi">
                    <span class="sayfa-govde">
                        ${sagSayfaMetni1}
                    </span>
                </div>`;

            icerikArka =
                `<div class="sayfa-yazi">
                    <span class="sayfa-govde">
                        ${sagSayfaMetni2}
                    </span>
                </div>`;
        }


        /* ===============================================
           SAYFA 4 FOTOĞRAF
        =============================================== */

        else if (
            onSayfaNo === 4
        ) {

            icerikOn = `
                <div class="sayfa-fotograf">

                    <div class="bant bant-sol-alt"></div>

                    <div class="bant bant-sag-ust"></div>

                    <img
                        src="kizim1.jpg"
                        alt="Şiir"
                    >

                </div>
            `;
        }


        /* ===============================================
           SAYFA 5 VE SONRASI - ÖN
        =============================================== */

        else if (
            onSayfaNo >= 5
        ) {

            const icerik =
                siirSayfaIcerigi(
                    onSayfaNo
                );

            icerikOn =
                `<div class="sayfa-yazi">
                    <div class="sayfa-govde">
                        ${icerik}
                    </div>
                </div>`;
        }


        /* ===============================================
           SAYFA 5 VE SONRASI - ARKA
        =============================================== */

        if (
            arkaSayfaNo >= 5
        ) {

            const icerik =
                siirSayfaIcerigi(
                    arkaSayfaNo
                );

            icerikArka =
                `<div class="sayfa-yazi">
                    <div class="sayfa-govde">
                        ${icerik}
                    </div>
                </div>`;
        }


        /* ===============================================
           YAPRAĞIN HTML'İ
        =============================================== */

        yaprakDiv.innerHTML = `
            <div class="sayfa-icerik">

                <div class="sayfa-on">

                    <img
                        src="sag_sayfa.png"
                        alt="Sayfa Ön"
                    >

                    ${icerikOn}

                    <div class="sayfa-numara">
                        <span class="tuy">🪶</span>
                        ${onSayfaNo}
                        <span class="tuy">🪶</span>
                    </div>

                </div>


                <div class="sayfa-arka">

                    <img
                        src="sol_sayfa.png"
                        alt="Sayfa Arka"
                    >

                    ${icerikArka}

                    <div class="sayfa-numara">
                        <span class="tuy">🪶</span>
                        ${arkaSayfaNo}
                        <span class="tuy">🪶</span>
                    </div>

                </div>

            </div>
        `;


        /* ===============================================
           TIKLAMA MANTIĞI
           MEVCUT KODUN AYNISI
        =============================================== */

        yaprakDiv.addEventListener(
            "click",
            function (e) {

                e.stopPropagation();

                if (isTidyingUp) return;

                const rect =
                    yaprakDiv.getBoundingClientRect();

                const tikX =
                    e.clientX -
                    rect.left;


                let aktifSonYaprak =
                    yaprakElementleri[
                        yaprakElementleri.length - 1
                    ];


                if (
                    yaprakDiv ===
                    aktifSonYaprak &&
                    tikX >=
                    rect.width / 2 &&
                    aktifSonYaprak.classList.contains(
                        "cevirdi"
                    )
                ) {

                    otomatikGeriyeSar();

                    return;
                }


                if (
                    tikX <
                    rect.width / 2
                ) {

                    oncekiSayfayaGec();

                } else {

                    if (
                        !yaprakDiv.classList.contains(
                            "cevirdi"
                        )
                    ) {

                        let aktifSagYaprak =
                            yaprakElementleri.find(
                                y =>
                                !y.classList.contains(
                                    "cevirdi"
                                )
                            );

                        if (
                            aktifSagYaprak ===
                            yaprakDiv
                        ) {

                            sonrakiSayfayaGec();
                        }

                    } else {

                        let cevrilmisYapraklar =
                            yaprakElementleri.filter(
                                y =>
                                y.classList.contains(
                                    "cevirdi"
                                )
                            );

                        let enUstSolYaprak =
                            cevrilmisYapraklar[
                                cevrilmisYapraklar.length - 1
                            ];

                        if (
                            enUstSolYaprak ===
                            yaprakDiv
                        ) {

                            oncekiSayfayaGec();
                        }
                    }
                }
            }
        );


        sayfalarKapsayici.appendChild(
            yaprakDiv
        );

        yaprakElementleri.push(
            yaprakDiv
        );
    }


    /* =====================================================
       KAPAK TIKLAMA
       DEĞİŞMEDİ
    ===================================================== */

    kapakAlan.addEventListener(
        "click",
        function (e) {

            if (
                mevcutAdimIndex === 0
            ) {

                sonrakiSayfayaGec();
            }
        }
    );


    /* =====================================================
       SAYFA 1 TIKLAMA
       DEĞİŞMEDİ
    ===================================================== */

    document
        .getElementById("solKanatYazi")
        .addEventListener(
            "click",
            function (e) {

                e.stopPropagation();

                if (isTidyingUp) return;

                if (
                    mevcutAdimIndex === 1
                ) {

                    oncekiSayfayaGec();
                }
            }
        );


    document
        .getElementById("solSayfaNumara")
        .addEventListener(
            "click",
            function (e) {

                e.stopPropagation();

                if (isTidyingUp) return;

                if (
                    mevcutAdimIndex === 1
                ) {

                    oncekiSayfayaGec();
                }
            }
        );


    /* =====================================================
       AÇIK KİTAP TIKLAMA
       DEĞİŞMEDİ
    ===================================================== */

    document
        .getElementById("acikKitapAlan")
        .addEventListener(
            "click",
            function (e) {

                if (isTidyingUp) return;

                if (
                    mevcutAdimIndex === 1
                ) {

                    const rect =
                        this.getBoundingClientRect();

                    const tikX =
                        e.clientX -
                        rect.left;

                    if (
                        tikX <
                        rect.width / 2
                    ) {

                        oncekiSayfayaGec();

                    } else {

                        sonrakiSayfayaGec();
                    }
                }
            }
        );

});
</script>
