<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* KITAP SAHNESI */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* ARKA PLAN VE SAYFA AYNI OLCEKTE */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: visible;

    perspective: 1800px;
}


/* ARKA PLAN */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* SABIT SAG SAYFA */

.right-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;

    z-index: 2;
}


/* SOL SAYFA */

.left-page {
    position: absolute;

    left: 19%;
    top: 13.2%;

    width: 34%;
    height: calc(100% - 27.5%);

    display: block;

    pointer-events: none;

    transform: scaleX(-1);

    z-index: 2;
}


/* DONEN SAYFA */

.turning-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    z-index: 5;

    pointer-events: none;

    transform-origin: left center;

    backface-visibility: hidden;

    will-change:
        left,
        top,
        width,
        height,
        transform;
}


/* OKLAR */

.page-arrow {
    position: absolute;

    top: 50%;

    width: 30px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255, 255, 255, 0.85);

    font-family: Arial, sans-serif;
    font-size: 38px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;
    user-select: none;

    z-index: 20;

    transform: translateY(-50%);

    text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.8);

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.page-arrow:hover {
    color: #fff;
}


/* SOL OK */

.prev-arrow {
    left: 16%;
    display: none;
}


/* SAG OK */

.next-arrow {
    left: 88%;
}


/* DONUS ANIMASYONU */

.turning-page.animate {
    animation: pageTurn 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}


@keyframes pageTurn {

    0% {

        left: 48.828125%;
        top: 13.2%;

        width: 38.411458%;
        height: auto;

        transform:
            rotateY(0deg)
            scaleX(1);
    }


    25% {

        left: 43%;
        top: 13.2%;

        width: 37%;
        height: auto;

        transform:
            rotateY(-55deg)
            scaleX(0.96);
    }


    50% {

        left: 35%;
        top: 13.2%;

        width: 35.5%;
        height: auto;

        transform:
            rotateY(-115deg)
            scaleX(0.94);
    }


    75% {

        left: 26%;
        top: 13.2%;

        width: 34.5%;
        height: auto;

        transform:
            rotateY(-155deg)
            scaleX(0.98);
    }


    100% {

        left: 19%;
        top: 13.2%;

        width: 34%;

        height: calc(100% - 27.5%);

        transform:
            rotateY(-180deg)
            scaleX(-1);
    }
}

</style>
</head>

<body>

<div class="page">

    <div class="book-stage">

        <img
            class="book-background"
            src="arkaplan0.jpeg"
            alt="Sair Nefestir"
        >

        <!-- SABIT SAG SAYFA -->

        <img
            class="right-page"
            src="sag_sayfa_bos.png"
            alt=""
        >

        <!-- SOL SAYFA -->

        <img
            class="left-page"
            src="sag_sayfa_bos.png"
            alt=""
        >

        <!-- SAG OK -->

        <div
            class="page-arrow next-arrow"
            onclick="turnPage()"
            aria-label="Sonraki sayfa"
        >
            ›
        </div>

        <!-- SOL OK -->

        <div
            class="page-arrow prev-arrow"
            aria-label="Onceki sayfa"
        >
            ‹
        </div>

        <!-- DONEN SAYFA -->

        <img
            class="turning-page"
            id="turningPage"
            src="sag_sayfa_bos.png"
            alt=""
        >

    </div>

</div>


<script>

function turnPage() {

    const turningPage =
        document.getElementById("turningPage");

    const rightPage =
        document.querySelector(".right-page");

    const nextArrow =
        document.querySelector(".next-arrow");

    if (turningPage.classList.contains("animate")) {
        return;
    }

    nextArrow.style.pointerEvents = "none";

    turningPage.classList.add("animate");

    turningPage.addEventListener(
        "animationend",
        function () {

            rightPage.style.display = "none";

            turningPage.style.left = "19%";
            turningPage.style.top = "13.2%";
            turningPage.style.width = "34%";
            turningPage.style.height =
                "calc(100% - 27.5%)";

            turningPage.style.transform =
                "scaleX(-1)";

            turningPage.classList.remove("animate");

        },
        { once: true }
    );
}

</script>

</body>
</html>
