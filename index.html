<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background:
        radial-gradient(
            circle at center,
            #5a4637 0%,
            #2b211a 75%
        );
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   SAHNE
========================= */

.scene {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    perspective: 1800px;
    perspective-origin: center center;
}


/* =========================
   KITAP
========================= */

.book {
    position: relative;

    /*
       KAPAK DIKEY DIKDORTGEN
    */
    width: min(58vw, 700px);
    height: min(84vh, 1000px);

    aspect-ratio: auto;

    transform-style: preserve-3d;

    touch-action: none;

    cursor: grab;
}

.book:active {
    cursor: grabbing;
}


/* =========================
   ACIK KITAP
========================= */

.page {
    position: absolute;

    top: 0;
    width: 50%;
    height: 100%;

    overflow: hidden;

    background: #f4ecd9;

    box-shadow:
        0 12px 25px rgba(0,0,0,.18),
        inset 0 0 20px rgba(80,50,20,.08);

    user-select: none;
    -webkit-user-select: none;
}

.page-left {
    left: 0;

    border-radius:
        10px 0 0 10px;
}

.page-right {
    right: 0;

    border-radius:
        0 10px 10px 0;
}


/* =========================
   SOL SAYFA
   GUN BATIMI YOK
========================= */

.page-left {
    background: #f4ecd9;
}


/* =========================
   SAG SAYFA
========================= */

.contents {
    position: absolute;

    inset: 0;

    padding:
        9%
        10%;

    color: #493322;

    text-align: center;

    pointer-events: none;
}

.contents h1 {
    margin: 0 0 8%;

    font-size: clamp(24px, 3vw, 48px);

    letter-spacing: .12em;

    font-weight: normal;
}

.contents p {
    margin: 4% 0;

    font-size: clamp(15px, 1.5vw, 24px);

    letter-spacing: .04em;
}


/* =========================
   CILT
========================= */

.binding {
    position: absolute;

    top: 0;
    left: 50%;

    width: 28px;
    height: 100%;

    transform: translateX(-50%);

    z-index: 80;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.20),
            rgba(255,255,255,.16) 35%,
            rgba(0,0,0,.16) 65%,
            rgba(255,255,255,.08)
        );

    box-shadow:
        0 0 15px rgba(0,0,0,.15);
}


/* =========================
   CEVRILEN SAYFA
========================= */

.turn-page {
    position: absolute;

    top: 0;
    right: 0;

    width: 50%;
    height: 100%;

    z-index: 150;

    transform-origin: left center;

    transform-style: preserve-3d;

    pointer-events: auto;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================
   ON YUZ
========================= */

.page-front {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #f4ecd9;

    padding: 10%;

    color: #493322;

    text-align: center;

    border-radius:
        0 10px 10px 0;

    /*
       AYNALAMA YOK
    */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    pointer-events: none;

    user-select: none;
    -webkit-user-select: none;
}

.page-front h2 {
    margin: 10% 0 7%;

    font-size: clamp(22px, 2.5vw, 40px);

    font-weight: normal;

    letter-spacing: .08em;
}

.page-front p {
    font-size: clamp(14px, 1.4vw, 21px);

    line-height: 1.8;
}


/* =========================
   ARKA YUZ
   TAMAMEN BOS
========================= */

.page-back {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #f4ecd9;

    /*
       ARKA YUZDE HICBIR YAZI YOK
    */

    transform: rotateY(180deg);

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    pointer-events: none;

    user-select: none;
    -webkit-user-select: none;
}


/*
   SAYFA CEVRILDIKTEN SONRA
   ARKA YUZUN GORUNMESINI ENGELLE
*/

.turn-page {
    backface-visibility: visible;
}


/* =========================
   KAPALI KITAP KAPAGI
========================= */

.closed-cover {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 500;

    overflow: hidden;

    background: #3b2619;

    border-radius: 10px;

    opacity: 1;
    visibility: visible;

    pointer-events: auto;

    transition:
        opacity .35s ease,
        visibility .35s ease;

    user-select: none;
    -webkit-user-select: none;
}


/*
   KAPAK GORSELİ
   DIKEY KAPAK ORANINI KORUYARAK
   TAM KAPAK ALANINA SIGAR
*/

.closed-cover img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    object-position: center center;

    pointer-events: none;

    user-select: none;
    -webkit-user-select: none;
}


/*
   KITAP ACILINCA KAPAK TAMAMEN KAYBOLUR
*/

.book.open .closed-cover {
    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* =========================
   ACIK SAYFA HAFIF BOMBE
========================= */

.book.open .page-left {
    transform:
        perspective(1600px)
        rotateY(-2deg);
}

.book.open .page-right {
    transform:
        perspective(1600px)
        rotateY(2deg);
}


/* =========================
   TELEFON
========================= */

@media (max-width: 600px) {

    .book {
        width: 88vw;
        height: 82vh;
    }

    .binding {
        width: 16px;
    }
}

</style>
</head>


<body>

<div class="scene">

    <div class="book" id="book">


        <!-- SOL SAYFA -->
        <div class="page page-left"></div>


        <!-- SAG SAYFA -->
        <div class="page page-right">

            <div class="contents">

                <h1>İÇİNDEKİLER</h1>

                <p>Şairler Ağlamaz</p>
                <p>Kırılgan Bir Şiirim</p>
                <p>Gidiyorum</p>
                <p>Bir Anlık Mutluluk</p>

            </div>

        </div>


        <!-- CEVRILEN SAYFA -->
        <div class="turn-page" id="turnPage">

            <!-- ON YUZ -->
            <div class="page-front">

                <h2>ŞİİR NEFESTİR</h2>

                <p>
                    Bazı sözler söylenmez...<br>
                    Yazılır.
                </p>

            </div>


            <!-- ARKA YUZ TAMAMEN BOS -->
            <div class="page-back"></div>

        </div>


        <!-- CILT -->
        <div class="binding"></div>


        <!-- KAPALI KAPAK -->
        <div
            class="closed-cover"
            id="closedCover"
        >

            <img
                src="kapak-gorsel.jpg"
                alt="Şiir Nefestir"
                draggable="false"
            >

        </div>

    </div>

</div>


<script>

const book =
    document.getElementById("book");

const turnPage =
    document.getElementById("turnPage");


let progress = 0;

let startX = 0;

let startProgress = 0;

let dragging = false;


/* =========================
   SAYFAYI RENDER ET
========================= */

function render() {

    const angle =
        -180 * progress;

    const curve =
        Math.sin(progress * Math.PI);

    const rotateX =
        curve * 0.45;

    const rotateZ =
        curve * 0.20;


    turnPage.style.transform =
        "rotateY(" + angle + "deg) " +
        "rotateX(" + rotateX + "deg) " +
        "rotateZ(" + rotateZ + "deg)";


    const shadow =
        0.08 +
        curve * 0.14;


    turnPage.style.filter =
        "drop-shadow(3px 6px 14px rgba(0,0,0," +
        shadow +
        "))";


    if (progress > 0.01) {

        book.classList.add("open");

    } else {

        book.classList.remove("open");

    }
}


/* =========================
   ANIMASYON
========================= */

function animateTo(target) {

    const start =
        progress;

    const duration =
        420;

    const startTime =
        performance.now();


    function step(now) {

        const elapsed =
            now - startTime;

        const t =
            Math.min(
                elapsed / duration,
                1
            );


        const eased =
            t < 0.5
                ? 2 * t * t
                : 1 -
                  Math.pow(
                      -2 * t + 2,
                      2
                  ) / 2;


        progress =
            start +
            (target - start) *
            eased;


        render();


        if (t < 1) {

            requestAnimationFrame(step);

        }

    }


    requestAnimationFrame(step);
}


/* =========================
   MOUSE SAYFA CEVIRME
   SADECE SAYFAYI KONTROL EDER
========================= */

turnPage.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        dragging = true;

        startX =
            e.clientX;

        startProgress =
            progress;


        turnPage.setPointerCapture(
            e.pointerId
        );

    }
);


turnPage.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging) return;

        e.preventDefault();

        const rect =
            book.getBoundingClientRect();


        const delta =
            startX - e.clientX;


        progress =
            startProgress +
            delta /
            (rect.width * 0.5);


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );


        render();

    }
);


function finishDrag(e) {

    if (!dragging) return;

    e.preventDefault();

    dragging = false;


    try {

        turnPage.releasePointerCapture(
            e.pointerId
        );

    } catch (_) {}


    if (progress > 0.5) {

        animateTo(1);

    } else {

        animateTo(0);

    }

}


turnPage.addEventListener(
    "pointerup",
    finishDrag
);


turnPage.addEventListener(
    "pointercancel",
    finishDrag
);


/* =========================
   KAPAKTA MOUSE
   SAYFA CEVIRMEYE GECMESIN
========================= */

closedCover.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();

    }
);


/* =========================
   BASLANGIC
========================= */

render();

</script>

</body>
</html>
