<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sayfa Cevirme</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#242424;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   KITAP
========================= */

.book{
    position:relative;

    width:min(92vw,1100px);
    height:min(72vh,700px);

    perspective:1800px;

    transform-style:preserve-3d;
}

/* =========================
   SOL SAYFA
========================= */

.page-left{
    position:absolute;

    left:0;
    top:0;

    width:50%;
    height:100%;

    border-radius:22px 4px 4px 22px;

    background:
        radial-gradient(
            ellipse at 35% 40%,
            #fff8df 0%,
            #ead6aa 72%,
            #c5a473 100%
        );

    box-shadow:
        -10px 12px 25px rgba(0,0,0,.35),
        inset -18px 0 25px rgba(0,0,0,.10);

    transform-origin:right center;

    transform:
        rotateY(4deg)
        translateZ(-5px);
}

/* =========================
   SAG SAYFA
========================= */

.page-right{
    position:absolute;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    border-radius:4px 22px 22px 4px;

    background:
        radial-gradient(
            ellipse at 65% 40%,
            #fff9e5 0%,
            #ead8ae 72%,
            #c6a575 100%
        );

    box-shadow:
        10px 12px 25px rgba(0,0,0,.35),
        inset 18px 0 25px rgba(0,0,0,.10);

    transform-origin:left center;

    transform:
        rotateY(-4deg)
        translateZ(-5px);
}

/* =========================
   CILT
========================= */

.binding{
    position:absolute;

    left:50%;
    top:0;

    width:20px;
    height:100%;

    transform:
        translateX(-50%)
        translateZ(10px);

    z-index:50;

    pointer-events:none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.45),
            rgba(255,255,255,.20),
            rgba(0,0,0,.40)
        );

    border-radius:50%;

    box-shadow:
        0 0 12px rgba(0,0,0,.25);
}

/* =========================
   CEVRILEN SAYFA
========================= */

.turn-page{
    position:absolute;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    z-index:40;

    transform-style:preserve-3d;

    /*
       EN ONEMLI NOKTA

       Sayfanin sol kenari
       cilde sabit.
    */

    transform-origin:left center;

    cursor:grab;

    touch-action:none;

    will-change:transform;
}

.turn-page.dragging{
    cursor:grabbing;
}

/* =========================
   ON YUZ
========================= */

.page-front{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:hidden;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    border-radius:
        3px
        22px
        22px
        3px;

    background:
        radial-gradient(
            ellipse at 65% 40%,
            #fff9e5 0%,
            #ead8ae 72%,
            #c6a575 100%
        );

    box-shadow:
        8px 10px 25px rgba(0,0,0,.25),
        inset 15px 0 22px rgba(0,0,0,.08);
}

/* =========================
   ARKA YUZ
========================= */

.page-back{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:hidden;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    transform:rotateY(180deg);

    border-radius:
        22px
        3px
        3px
        22px;

    background:
        radial-gradient(
            ellipse at 35% 40%,
            #fff6da 0%,
            #e6d0a0 72%,
            #bea06d 100%
        );

    box-shadow:
        -8px 10px 25px rgba(0,0,0,.25),
        inset -15px 0 22px rgba(0,0,0,.08);
}

/* =========================
   ICERIK
========================= */

.page-front::before{
    content:"SAG SAYFA";

    position:absolute;

    top:40px;
    right:40px;

    color:#555;

    font-size:20px;
}

.page-back::before{
    content:"SOL SAYFA";

    position:absolute;

    top:40px;
    left:40px;

    color:#555;

    font-size:20px;
}

/* =========================
   SAYFA KENAR GOLGESI
========================= */

.turn-page::after{
    content:"";

    position:absolute;

    right:-2px;
    top:0;

    width:28px;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.22),
            rgba(0,0,0,.08),
            transparent
        );

    filter:blur(4px);

    opacity:.8;
}

/* =========================
   ALT SAG KOSENIN ISARETI
========================= */

.corner{
    position:absolute;

    right:8px;
    bottom:8px;

    width:70px;
    height:70px;

    pointer-events:none;

    border-radius:0 0 20px 0;

    background:
        linear-gradient(
            135deg,
            transparent 45%,
            rgba(0,0,0,.12) 48%,
            rgba(255,255,255,.50) 60%,
            transparent 68%
        );
}

/* =========================
   BUTONLAR
========================= */

.controls{
    position:fixed;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:10px;

    z-index:100;
}

button{
    padding:11px 22px;

    border:0;
    border-radius:8px;

    background:#fff;

    color:#222;

    font-size:15px;

    cursor:pointer;
}

/* =========================
   MOBIL
========================= */

@media(max-width:700px){

    .book{
        width:96vw;
        height:58vh;
    }

    button{
        padding:10px 15px;
        font-size:13px;
    }

}

</style>
</head>

<body>

<div class="book" id="book">

    <div class="page-left"></div>

    <div class="page-right"></div>

    <div class="turn-page" id="turnPage">

        <div class="page-front">

            <div class="corner"></div>

        </div>

        <div class="page-back"></div>

    </div>

    <div class="binding"></div>

</div>


<div class="controls">

    <button id="prevBtn">
        ← Geri
    </button>

    <button id="nextBtn">
        İleri →
    </button>

</div>


<script>

const book =
    document.getElementById("book");

const turnPage =
    document.getElementById("turnPage");

const nextBtn =
    document.getElementById("nextBtn");

const prevBtn =
    document.getElementById("prevBtn");


let progress = 0;

let dragging = false;

let startX = 0;

let startProgress = 0;


/* =========================
   SAYFA HAREKETI
========================= */

function render(){

    /*
        0  = tamamen sagda
        1  = tamamen solda
    */

    const angle =
        -180 * progress;


    /*
        BURADA ARTIK:

        translateY YOK
        translateZ YOK
        lift YOK

        Yani sayfa ciltte
        yukselip havalanmiyor.
    */


    /*
        Ortada cok hafif
        fiziksel egim.

        Sayfa cilde bagli
        kaldigi icin bu hareket
        onu havaya ucurmuyor.
    */

    const curve =
        Math.sin(progress * Math.PI);


    const rotateX =
        curve * 2.5;


    const rotateZ =
        curve * 1.2;


    turnPage.style.transform =
        `
        rotateY(${angle}deg)
        rotateX(${rotateX}deg)
        rotateZ(${rotateZ}deg)
        `;


    /*
        Gölge sadece sayfa
        orta konumdayken belirgin.
    */

    const shadow =
        0.12 + curve * 0.20;


    turnPage.style.filter =
        `drop-shadow(
            5px 8px 18px
            rgba(0,0,0,${shadow})
        )`;
}


/* =========================
   ANIMASYON
========================= */

function animateTo(target){

    const from =
        progress;

    const duration =
        700;

    const start =
        performance.now();


    function frame(now){

        const elapsed =
            now - start;

        let t =
            elapsed / duration;


        if(t > 1){
            t = 1;
        }


        /*
            Yumusak baslangic
            ve bitis.
        */

        const eased =
            t < .5
            ? 2 * t * t
            : 1 - Math.pow(-2 * t + 2,2) / 2;


        progress =
            from +
            (target - from) *
            eased;


        render();


        if(t < 1){

            requestAnimationFrame(frame);

        }else{

            progress =
                target;

            render();
        }
    }


    requestAnimationFrame(frame);
}


/* =========================
   FARE / PARMAK BASLANGICI
========================= */

turnPage.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        startX =
            e.clientX;

        startProgress =
            progress;

        turnPage.classList.add(
            "dragging"
        );

        turnPage.setPointerCapture(
            e.pointerId
        );
    }
);


/* =========================
   SURUKLEME
========================= */

turnPage.addEventListener(
    "pointermove",
    function(e){

        if(!dragging){
            return;
        }


        const rect =
            book.getBoundingClientRect();


        const halfWidth =
            rect.width / 2;


        /*
            Fare sola gittikce
            progress artiyor.
        */

        const distance =
            startX - e.clientX;


        const change =
            distance / halfWidth;


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    startProgress + change
                )
            );


        render();
    }
);


/* =========================
   BIRAKMA
========================= */

turnPage.addEventListener(
    "pointerup",
    function(e){

        if(!dragging){
            return;
        }


        dragging = false;

        turnPage.classList.remove(
            "dragging"
        );


        if(progress >= .5){

            animateTo(1);

        }else{

            animateTo(0);
        }
    }
);


/* =========================
   IPTAL
========================= */

turnPage.addEventListener(
    "pointercancel",
    function(){

        dragging = false;

        turnPage.classList.remove(
            "dragging"
        );


        animateTo(
            progress >= .5
            ? 1
            : 0
        );
    }
);


/* =========================
   BUTONLAR
========================= */

nextBtn.addEventListener(
    "click",
    function(){

        animateTo(1);
    }
);


prevBtn.addEventListener(
    "click",
    function(){

        animateTo(0);
    }
);


/* =========================
   KLAVYE
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){

            animateTo(1);
        }


        if(e.key === "ArrowRight"){

            animateTo(0);
        }
    }
);


/* =========================
   ILK DURUM
========================= */

render();

</script>

</body>
</html>
