<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    margin: auto;

    top: 50%;
    transform: translateY(-50%);

    background-image: url("arkaplan0.jpeg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* =========================
   SAYFALAR
========================= */

.page {
    position: absolute;

    top: 13.2%;

    height: calc(100% - 27.5%);

    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;

    overflow: hidden;

    z-index: 2;
}

.left-page {
    left: 19%;
    width: 34%;
    transform: scaleX(-1);
}

.right-page {
    left: 48.828125%;
    width: 38.411458%;
}

/* Sayfanın içeriği ters dönmesin */
.left-page .page-content {
    transform: scaleX(-1);
}

/* =========================
   SIĞAN YAZI ALANI
========================= */

.page-content {
    position: absolute;

    left: 14%;
    top: 11%;

    width: 72%;
    height: 78%;

    overflow: hidden;
}

/* =========================
   ŞİİR
========================= */

.poem {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    margin: 0;
    padding: 0;

    color: #174a82;

    font-family: "Caveat", cursive;

    font-size: 11pt;
    font-weight: 500;

    line-height: 1.55;

    direction: ltr;
    text-align: left;

    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: normal;
}

/*
   Karakterler normal akışta kalıyor.
   Böylece satır kırılması gerçek yazı gibi oluyor.
*/
.poem-char {
    white-space: pre;
}

/* =========================
   YAZAN TÜY KALEM
========================= */

.writing-quill {
    position: absolute;

    width: 70px;
    height: auto;

    pointer-events: none;

    z-index: 20;

    opacity: 0;

    transform-origin: 50% 90%;

    transition:
        left 0.035s linear,
        top 0.035s linear,
        opacity 0.15s ease;
}

/* =========================
   MÜREKKEP KALEM
========================= */

.ink-quill {
    position: absolute;

    width: 90px;
    height: auto;

    left: calc(1.5% + 1cm);
    bottom: calc(-1% + 1cm);

    z-index: 10;

    pointer-events: none;
}

/* =========================
   OKLAR
========================= */

.nav-arrow {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 48px;
    height: 48px;

    border: none;
    background: transparent;

    color: rgba(255,255,255,0.55);

    font-size: 42px;

    line-height: 48px;

    cursor: pointer;

    z-index: 50;

    transition:
        color 0.2s ease,
        text-shadow 0.2s ease,
        transform 0.2s ease;
}

.nav-arrow:hover {
    color: #fff;

    text-shadow:
        0 0 6px rgba(255,255,255,0.9),
        0 0 15px rgba(255,255,255,0.8),
        0 0 25px rgba(255,255,255,0.6);

    transform: translateY(-50%) scale(1.08);
}

.left-arrow {
    left: 4%;
}

.right-arrow {
    right: 4%;
}

/* =========================
   ÜST KONTROLLER
========================= */

.top-controls {
    position: absolute;

    top: 2.5%;
    left: 2.5%;

    z-index: 60;

    display: flex;
    gap: 10px;
}

.control-button {
    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,0.35);

    border-radius: 50%;

    background: rgba(0,0,0,0.22);

    color: rgba(255,255,255,0.75);

    cursor: pointer;

    font-size: 18px;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
}

.control-button:hover {
    background: rgba(0,0,0,0.4);

    color: #fff;

    box-shadow:
        0 0 10px rgba(255,255,255,0.35);
}

/* =========================
   EŞİTLEYİCİ
========================= */

.equalizer {
    position: absolute;

    left: 50%;
    bottom: 3%;

    transform: translateX(-50%);

    display: flex;
    align-items: flex-end;

    gap: 4px;

    height: 28px;

    z-index: 40;
}

.equalizer span {
    display: block;

    width: 3px;
    height: 8px;

    background: rgba(255,255,255,0.55);

    border-radius: 2px;
}

/* =========================
   BOŞ SAYFA
========================= */

.blank-page {
    background-image: url("sag_sayfa_bos.png") !important;
}

.blank-page::before {
    display: none !important;
}

</style>

</head>

<body>

<div class="book-stage" id="bookStage">

```
<!-- ÜST KONTROLLER -->

<div class="top-controls">

    <button class="control-button"
            title="Sesli dinle">
        🔊
    </button>

    <button class="control-button"
            title="Tam ekran"
            onclick="toggleFullscreen()">
        ⛶
    </button>

</div>


<!-- SOL SAYFA -->

<div class="page left-page" id="leftPage">

    <div class="page-content">

        <div class="poem"
             id="leftPoem"></div>

    </div>

</div>


<!-- SAĞ SAYFA -->

<div class="page right-page" id="rightPage">

    <div class="page-content">

        <div class="poem"
             id="rightPoem"></div>

    </div>

</div>


<!-- YAZAN TÜY KALEM -->

<img
    src="yazan_kalem3.png"
    class="writing-quill"
    id="writingQuill"

>


<!-- MÜREKKEP KALEMİ -->

<img
    src="murekkep_kalem.png"

<button
    class="nav-arrow left-arrow"
    id="leftArrow"

    ‹
</button>

<button
    class="nav-arrow right-arrow"

</div>

</div>

<script>

/* =========================================
   TEMEL ELEMANLAR
========================================= */

const stage = document.getElementById("bookStage");

const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");

const leftPoem = document.getElementById("leftPoem");
const rightPoem = document.getElementById("rightPoem");

const writingQuill =
    document.getElementById("writingQuill");


/* =========================================
   TEST ŞİİRİ
========================================= */

const poems = [

    {
        title: "Deneme 1",

        text:
`Abi gel
Biraz konuşalım.
Sessizliğin içinden
geçip gidelim.
Belki kelimeler
bize yolu gösterir.`
    },

    {
        title: "Deneme 2",

        text:
`Bazen bir kelime
koca bir ömrü anlatır.
Bazen bir bakış
bin cümleden daha fazlasıdır.`
    }

];


/* =========================================
   DURUM
========================================= */

let currentPoem = 0;

let pages = [];

let currentPageIndex = 0;

let typingToken = 0;


/* =========================================
   YAZI GENİŞLİĞİNİ ÖLÇ
========================================= */

const measurePoem =
    document.createElement("div");

measurePoem.style.position = "absolute";
measurePoem.style.visibility = "hidden";
measurePoem.style.pointerEvents = "none";

measurePoem.style.fontFamily =
    '"Caveat", cursive';

measurePoem.style.fontSize = "11pt";
measurePoem.style.fontWeight = "500";
measurePoem.style.lineHeight = "1.55";

measurePoem.style.whiteSpace = "nowrap";

document.body.appendChild(measurePoem);


function measureTextWidth(text) {

    measurePoem.textContent = text;

    return measurePoem.getBoundingClientRect().width;

}


/* =========================================
   ŞİİRİ SAYFALARA BÖL
========================================= */

function getWrappedLines(text, element) {

    const availableWidth =
        element.getBoundingClientRect().width;

    const rawLines =
        text.split("\n");

    const result = [];

    for (const rawLine of rawLines) {

        if (rawLine === "") {

            result.push("");

            continue;
        }

        const words =
            rawLine.split(/\s+/);

        let currentLine = "";

        for (const word of words) {

            const testLine =
                currentLine
                    ? currentLine + " " + word
                    : word;

            const testWidth =
                measureTextWidth(testLine);

            if (
                testWidth <= availableWidth ||
                currentLine === ""
            ) {

                currentLine = testLine;

            } else {

                result.push(currentLine);

                currentLine = word;

            }

        }

        if (currentLine) {

            result.push(currentLine);

        }

    }

    return result;
}


/* =========================================
   SAYFA DİZİSİ OLUŞTUR
========================================= */

function buildPages(text) {

    const lines =
        getWrappedLines(text, leftPoem);

    const linesPerPage = 9;

    const result = [];

    for (
        let i = 0;
        i < lines.length;
        i += linesPerPage
    ) {

        result.push(
            lines.slice(
                i,
                i + linesPerPage
            )
        );

    }

    return result;

}


/* =========================================
   KARAKTERİ SAYFAYA EKLE
========================================= */

function appendCharacter(element, character) {

    const span =
        document.createElement("span");

    span.className = "poem-char";

    span.textContent = character;

    element.appendChild(span);

    return span;
}


/* =========================================
   TÜY KALEMİ KARAKTERİN ÖNÜNE TAŞI
========================================= */

function moveQuillBeforeCharacter(span) {

    if (!span) {
        return;
    }

    const rect =
        span.getBoundingClientRect();

    const stageRect =
        stage.getBoundingClientRect();

    /*
       Kalemi karakterin tam önüne getiriyoruz.

       Böylece:

       a
       b
       i
       boşluk
       g
       e
       l

       her birinde ayrı ayrı hareket ediyor.
    */

    writingQuill.style.left =
        (rect.left -
         stageRect.left -
         10) + "px";

    writingQuill.style.top =
        (rect.top -
         stageRect.top -
         54) + "px";

    writingQuill.style.opacity = "1";
}


/* =========================================
   TEK KARAKTER YAZ
========================================= */

function typeCharacter(
    element,
    character,
    token
) {

    return new Promise(resolve => {

        if (token !== typingToken) {
            resolve();
            return;
        }

        const span =
            appendCharacter(
                element,
                character
            );

        /*
           Önce kalemi karakterin önüne
           taşıyoruz.
        */

        moveQuillBeforeCharacter(span);

        /*
           Çok kısa bekleme.
           Böylece her karakter ayrı ayrı
           görülebiliyor.
        */

        setTimeout(() => {

            resolve();

        }, 42);

    });

}


/* =========================================
   METNİ KARAKTER KARAKTER YAZ
========================================= */

async function typeText(
    element,
    text,
    token
) {

    element.innerHTML = "";

    writingQuill.style.opacity = "0";

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        if (token !== typingToken) {
            return;
        }

        await typeCharacter(
            element,
            text[i],
            token
        );

    }

    /*
       Son karakterden sonra kalemi
       biraz bekletiyoruz.
    */

    await new Promise(resolve =>
        setTimeout(resolve, 250)
    );

}


/* =========================================
   SAYFAYA METİN YAZ
========================================= */

async function writePage(
    element,
    lines,
    token
) {

    element.innerHTML = "";

    writingQuill.style.opacity = "0";

    const text =
        lines.join("\n");

    await typeText(
        element,
        text,
        token
    );

}


/* =========================================
   ŞİİRİ BAŞLAT
========================================= */

async function startPoem() {

    typingToken++;

    const token =
        typingToken;

    const poem =
        poems[currentPoem];

    pages =
        buildPages(poem.text);

    currentPageIndex = 0;

    leftPoem.innerHTML = "";
    rightPoem.innerHTML = "";

    leftPage.classList.remove("blank-page");
    rightPage.classList.remove("blank-page");

    /*
       İlk açılışta ilk iki sayfa.
    */

    const firstPage =
        pages[0] || [];

    const secondPage =
        pages[1] || [];

    await writePage(
        leftPoem,
        firstPage,
        token
    );

    if (token !== typingToken) {
        return;
    }

    await writePage(
        rightPoem,
        secondPage,
        token
    );

}


/* =========================================
   SONRAKİ SAYFA
========================================= */

async function nextPage() {

    typingToken++;

    writingQuill.style.opacity = "0";

    /*
       Eğer mevcut şiirin sayfaları devam ediyorsa
       sağ sayfa sola geçer.
    */

    if (
        currentPageIndex + 2 <
        pages.length
    ) {

        const nextLeft =
            pages[
                currentPageIndex + 1
            ];

        const nextRight =
            pages[
                currentPageIndex + 2
            ];

        leftPoem.style.opacity = "0";
        rightPoem.style.opacity = "0";

        await new Promise(resolve =>
            setTimeout(resolve, 250)
        );

        leftPoem.innerHTML = "";
        rightPoem.innerHTML = "";

        leftPage.classList.remove(
            "blank-page"
        );

        rightPage.classList.remove(
            "blank-page"
        );

        leftPoem.style.opacity = "1";
        rightPoem.style.opacity = "1";

        currentPageIndex++;

        const token =
            typingToken;

        await writePage(
            leftPoem,
            nextLeft,
            token
        );

        if (token !== typingToken) {
            return;
        }

        await writePage(
            rightPoem,
            nextRight,
            token
        );

        return;
    }


    /*
       Şiirin tüm sayfaları bittiyse
       bir sonraki tıklamada boş sayfa.
    */

    await showBlankPage();

}


/* =========================================
   BOŞ SAYFA
========================================= */

async function showBlankPage() {

    typingToken++;

    writingQuill.style.opacity = "0";

    leftPoem.style.opacity = "0";
    rightPoem.style.opacity = "0";

    await new Promise(resolve =>
        setTimeout(resolve, 250)
    );

    leftPoem.innerHTML = "";
    rightPoem.innerHTML = "";

    /*
       Sayfa resmi korunuyor.
       Böylece arkaplan0'ın altındaki başka
       görsel ortaya çıkmıyor.
    */

    leftPage.classList.add(
        "blank-page"
    );

    rightPage.classList.add(
        "blank-page"
    );

    leftPoem.style.opacity = "1";
    rightPoem.style.opacity = "1";

}


/* =========================================
   ÖNCEKİ SAYFA
========================================= */

function previousPage() {

    typingToken++;

    writingQuill.style.opacity = "0";

    if (currentPageIndex <= 0) {
        return;
    }

    currentPageIndex--;

    leftPage.classList.remove(
        "blank-page"
    );

    rightPage.classList.remove(
        "blank-page"
    );

    leftPoem.innerHTML = "";
    rightPoem.innerHTML = "";

    const leftLines =
        pages[currentPageIndex] || [];

    const rightLines =
        pages[currentPageIndex + 1] || [];

    writePage(
        leftPoem,
        leftLines,
        typingToken
    );

    writePage(
        rightPoem,
        rightLines,
        typingToken
    );

}


/* =========================================
   TAM EKRAN
========================================= */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document.documentElement
            .requestFullscreen()
            .catch(() => {});

    } else {

        document.exitFullscreen();

    }

}


/* =========================================
   BAŞLANGIÇ
========================================= */

window.addEventListener(
    "load",
    () => {

        setTimeout(() => {

            startPoem();

        }, 500);

    }
);


/* =========================================
   SAYFA YENİDEN BOYUTLANINCA
========================================= */

window.addEventListener(
    "resize",
    () => {

        /*
           Kalemin o anki karakter konumunun
           yeniden hesaplanması için mevcut
           görünümü bozmuyoruz.
        */

    }
);

</script>

</body>
