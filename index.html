<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    /* Varsayılan Tema: Ahşap Masa (Eski arka_plan.jpg yerine güvenli şık gradyan/renk altyapısı) */
    background: linear-gradient(135deg, #2c1d11 0%, #1a1008 100%);
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    transition: background 0.8s ease-in-out;
}

/* TEMA SEÇİM BUTONU (Sağ Üst Köşe) */
.tema-buton-kapsayici {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    gap: 10px;
}

.tema-btn {
    background: rgba(40, 25, 10, 0.85);
    color: #d6ad38;
    border: 1px solid #d6ad38;
    padding: 8px 14px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
}

.tema-btn:hover {
    background: #d6ad38;
    color: #28190a;
}

/* KİTAP KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. SAĞDA SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTAP GÖVDESİ */
.acik-kitap-alan {
    position: absolute;
    top: 0.5cm;
    left: calc(-100% - 0.6cm);
    width: calc(200% - 1.3cm);
    height: calc(100% - 1cm);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.1882);
    transform-origin: left center;
    clip-path: inset(0 0 0 100%);
    transition: opacity 0.8s ease-in-out, clip-path 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.kitap-kapsayici.acildi .acik-kitap-alan {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transition: opacity 0.4s ease-in-out 0.6s, clip-path 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) 0.6s;
}

.acik-kitap-alan img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* ÇOKLU SAYFA KONTEYNERİ */
.sayfalar-kapsayici {
    position: absolute;
    top: 0.5cm;
    left: 0;
    width: 100%;
    height: calc(100% - 1cm);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sayfalar-kapsayici {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.3s ease-in-out 1.1s;
}

/* HER BİR YAPRAK */
.sayfa-yaprak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.0s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
}

.sayfa-yaprak.cevirdi {
    transform: rotateY(-180deg);
}

/* Sayfa İçerik Boyutu */
.sayfa-icerik {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% - 1.5cm);
    height: 100%;
    transform-style: preserve-3d;
}

.sayfa-on, .sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sayfa-on img, .sayfa-arka img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.sayfa-arka {
    transform: rotateY(180deg);
}

/* SAYFA İÇİ YAZILAR */
.sayfa-yazi {
    position: absolute;
    top: 15%;
    left: 10%;
    width: 80%;
    height: 70%;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(8px, 1vw, 16px);
    line-height: 1.6;
    color: #4a3319;
    box-sizing: border-box;
    pointer-events: none;
    backface-visibility: hidden;
    overflow: hidden;
}

/* ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 2.0s ease-in-out;
    z-index: 30;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
    z-index: 1;
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<!-- TEMA SEÇİM BUTONLARI -->
<div class="tema-buton-kapsayici">
    <button class="tema-btn" onclick="temaDegis('ahsap')">Ahşap Masa</button>
    <button class="tema-btn" onclick="temaDegis('gece')">Gece / Mum</button>
    <button class="tema-btn" onclick="temaDegis('kulube')">Deniz Kulübesi</button>
</div>

<div class="kitap-kapsayici" id="kitapKapsayici">

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg">
    </div>

    <!-- AÇIK KİTAP GÖVDESİ -->
    <div class="acik-kitap-alan" id="acikKitapAlan">
        <img src="acik_kitap1.png" alt="Açık Kitap Gövdesi">
    </div>

    <!-- DİNAMİK YAPRAKLAR KONTEYNERİ -->
    <div class="sayfalar-kapsayici" id="sayfalarKapsayici"></div>

    <!-- ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">
        <img src="kapak.jpg" class="kapak">
        
        <div class="kapak-yazi">
            Şiir'e hatıra.<br><br>
            kelimelerden..<br>
            hayattan..<br>
            babasından.<br><br><br>
            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak">
    </div>

</div>

<script>
// TEMA DEĞİŞTİRME FONKSİYONU (Harika Atmosferler)
function temaDegis(temaAdi) {
    if (temaAdi === 'ahsap') {
        // Sıcak Klasik Ahşap Masa Tonu
        document.body.style.background = "linear-gradient(135deg, #2c1d11 0%, #1a1008 100%)";
    } else if (temaAdi === 'gece') {
        // Gece ve Mum Işığı Atmosferi (Koyu lacivert + sıcak mum sarısı ışıma)
        document.body.style.background = "radial-gradient(circle at 70% 30%, #3a2510 0%, #0d111a 70%, #05070a 100%)";
    } else if (temaAdi === 'kulube') {
        // Deniz Kenarı Kulübe Atmosferi (Ferah Akdeniz mavisi ve ahşap pencere hissi)
        document.body.style.background = "linear-gradient(135deg, #1b4d6e 0%, #0f2a3d 50%, #221710 100%)";
    }
}

window.addEventListener("load", function () {
    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const sayfalarKapsayici = document.getElementById("sayfalarKapsayici");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;
    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";

    // 50 Sayfa (25 Yaprak Çifti) Verisi
    const toplamYaprak = 25;
    let yaprakVerileri = [];

    for (let i = 1; i <= toplamYaprak; i++) {
        let metinOn = `Sayfa ${i * 2 - 1}<br><br>Bu ${i * 2 - 1}. sayfanın şiiri / metnidir.`;
        let metinArka = `Sayfa ${i * 2}<br><br>Bu ${i * 2}. sayfanın metnidir.`;

        if (i === toplamYaprak) {
            metinArka = `Son Sayfa<br><br>Kitabın sonuna geldiniz.<br><br><b>Kapatmak için bu sayfaya tıklayın.</b>`;
        }

        yaprakVerileri.push({
            id: i,
            onMetin: metinOn,
            arkaMetin: metinArka
        });
    }

    let yaprakElementleri = [];
    let isRewinding = false;

    // Yaprakları DOM'a Oluşturup Yerleştirme
    for (let i = 0; i < toplamYaprak; i++) {
        const yaprakDiv = document.createElement("div");
        yaprakDiv.className = "sayfa-yaprak";
        yaprakDiv.style.zIndex = toplamYaprak - i;

        yaprakDiv.innerHTML = `
            <div class="sayfa-icerik">
                <div class="sayfa-on">
                    <img src="sag_sayfa.png" alt="Sayfa Ön">
                    <div class="sayfa-yazi">${yaprakVerileri[i].onMetin}</div>
                </div>
                <div class="sayfa-arka">
                    <img src="sol_sayfa.png" alt="Sayfa Arka">
                    <div class="sayfa-yazi">${yaprakVerileri[i].arkaMetin}</div>
                </div>
            </div>
        `;

        // Yaprağa tıklama mantığı
        yaprakDiv.addEventListener("click", function (e) {
            e.stopPropagation();
            if (isRewinding) return;

            // Sağdan sola çevir
            if (!yaprakDiv.classList.contains("cevirdi")) {
                let aktifSagYaprak = yaprakElementleri.find(y => !y.classList.contains("cevirdi"));
                if (aktifSagYaprak === yaprakDiv) {
                    yaprakDiv.style.zIndex = 50 + i;
                    yaprakDiv.classList.add("cevirdi");

                    if (i === toplamYaprak - 1) {
                        otomatikGeriyeSar();
                    }
                }
            } 
            // Soldan sağa geri çevir
            else {
                let cevrilmisYapraklar = yaprakElementleri.filter(y => y.classList.contains("cevirdi"));
                let enUstSolYaprak = cevrilmisYapraklar[cevrilmisYapraklar.length - 1];
                
                if (enUstSolYaprak === yaprakDiv) {
                    yaprakDiv.style.zIndex = 100;
                    yaprakDiv.classList.remove("cevirdi");

                    const transitionBitince = function() {
                        yaprakDiv.style.zIndex = toplamYaprak - i;
                        yaprakDiv.removeEventListener("transitionend", transitionBitince);
                    };
                    yaprakDiv.addEventListener("transitionend", transitionBitince);
                }
            }
        });

        sayfalarKapsayici.appendChild(yaprakDiv);
        yaprakElementleri.push(yaprakDiv);
    }

    // OTOMATİK GERİYE SARMA (REWIND) FONKSİYONU
    function otomatikGeriyeSar() {
        isRewinding = true;
        let index = yaprakElementleri.length - 1;

        let rewindInterval = setInterval(function () {
            if (index >= 0) {
                yaprakElementleri[index].style.zIndex = 100;
                yaprakElementleri[index].classList.remove("cevirdi");
                yaprakElementleri[index].style.zIndex = toplamYaprak - index;
                index--;
            } else {
                clearInterval(rewindInterval);

                setTimeout(function () {
                    kapsayici.classList.remove("acildi");
                    kapakAlan.classList.remove("dondu");
                    isRewinding = false;
                }, 400);
            }
        }, 100);
    }

    // Kapak Açma / Kapanma Mantığı
    kapakAlan.addEventListener("click", function () {
        if (isRewinding) return;

        if (kapsayici.classList.contains("acildi")) {
            yaprakElementleri.forEach((y, index) => {
                y.classList.remove("cevirdi");
                y.style.zIndex = toplamYaprak - index;
            });
            kapsayici.classList.remove("acildi");
            kapakAlan.classList.remove("dondu");
        } else {
            kapsayici.classList.add("acildi");
            kapakAlan.classList.add("dondu");
        }
    });
});
</script>

</body>
</html>
