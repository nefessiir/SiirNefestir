<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Şiir Nefestir</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#2b1b10;
}

body{
    background:radial-gradient(circle at center,#5d4630 0%,#2b1b10 100%);
    font-family:Georgia,"Times New Roman",serif;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
}

.sahne{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    touch-action:pinch-zoom;
}

body.yakin .sahne{touch-action:auto;}

.alan{
    position:relative;
    flex:1 1 auto;
    min-height:0;
}

/* ------------------------------------------------------------------
   KİTAP
   ------------------------------------------------------------------ */

.kitap{
    position:absolute;
    left:50%;
    top:50%;
    width:var(--kitapW);
    height:var(--H);
    margin-left:calc(var(--kitapW) / -2);
    margin-top:calc(var(--H) / -2);
    perspective:var(--persp);
    transform:translateX(var(--kapaliKayma));
    transition:transform 1.1s ease-in-out;
}

.kitap.acik{transform:none;}

.kitap.kuruluyor,
.kitap.kuruluyor *{
    transition:none !important;
}

.acik-gorsel{
    position:absolute;
    z-index:1;
    left:0;
    top:0;
    width:var(--kitapW);
    height:var(--H);
    overflow:hidden;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease 0s;
}

.acik-gorsel img{
    position:absolute;
    display:block;
    max-width:none;
    height:auto;
    pointer-events:none;
    -webkit-user-drag:none;
}

.kitap.acik .acik-gorsel{
    opacity:1;
    transition:opacity .3s ease .55s;
}

.kitap.acik.sakla .acik-gorsel{
    opacity:0;
    transition:opacity .25s ease 0s;
}

/* kapak */

.kapak{
    position:absolute;
    top:0;
    left:var(--spine);
    width:var(--W);
    height:var(--H);
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform 1.1s ease-in-out, opacity .15s linear;
    cursor:pointer;
    outline:none;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
}

.kitap.acik .kapak{
    transform:rotateY(-180deg);
    opacity:0;
    transition:transform 1.1s ease-in-out, opacity .2s linear .62s;
}

.kapak .yuz{width:100%;}

.kapak .yuz img{
    display:block;
    width:100%;
    height:100%;
    object-fit:fill;
    pointer-events:none;
    -webkit-user-drag:none;
}

.kitap.tek .kapak .arka{display:none;}

.kapak-yazi{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:80%;
    text-align:center;
    font-size:calc(var(--W) * .06);
    line-height:1.55;
    color:#f4d47a;
    text-shadow:
        0 1px 0 #8c641c,
        0 2px 1px rgba(60,35,5,.8),
        0 0 3px rgba(255,218,120,.85),
        0 0 7px rgba(255,202,80,.35);
    pointer-events:none;
    animation:altinParilti 4s ease-in-out infinite;
}

.kapak-yazi div{white-space:nowrap;}

@keyframes altinParilti{
    0%,100%{
        text-shadow:
            0 1px 0 #8c641c,
            0 2px 1px rgba(60,35,5,.8),
            0 0 3px rgba(255,218,120,.75),
            0 0 6px rgba(255,202,80,.25);
    }
    50%{
        text-shadow:
            0 1px 0 #8c641c,
            0 2px 1px rgba(60,35,5,.8),
            0 0 4px rgba(255,225,145,1),
            0 0 10px rgba(255,210,95,.5);
    }
}

/* içerik katmanı */

.icerik{
    position:absolute;
    inset:0;
    z-index:2;
    perspective:var(--persp);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .25s ease, visibility 0s linear .25s;
}

.kitap.acik .icerik{
    opacity:1;
    visibility:visible;
    transition:opacity .45s ease .6s, visibility 0s linear .6s;
}

.kitap.acik.sakla .icerik{
    opacity:0;
    transition:opacity .25s ease, visibility 0s linear .25s;
}

.taban{
    position:absolute;
    top:var(--pt);
    width:var(--pw);
    height:var(--ph);
    z-index:0;
}

#tabanSol{left:calc(var(--hinge) - var(--pwl));width:var(--pwl);}
#tabanSag{left:calc(var(--hinge));}
.kitap.tek #tabanSol{display:none;}

.yaprak{
    position:absolute;
    top:var(--pt);
    left:var(--hinge);
    width:var(--pw);
    height:var(--ph);
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform .85s cubic-bezier(.45,.05,.25,1);
}

.yaprak.cevrildi{transform:rotateY(-180deg);}

.yuz{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.yuz.arka{transform:rotateY(180deg);}
.yaprak .yuz.on{width:var(--pw);}
.yaprak .yuz.arka{width:var(--pwl);}

/* sayfa */

.sayfa{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#e9d9b4;
}

.sayfa .kagit{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    pointer-events:none;
    -webkit-user-drag:none;
}

.sayfa .golge{
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
}

.sayfa.sol .golge{
    background:linear-gradient(to left,rgba(70,40,10,.30) 0,rgba(70,40,10,.10) 7%,rgba(70,40,10,0) 16%);
}

.sayfa.sag .golge{
    background:linear-gradient(to right,rgba(70,40,10,.30) 0,rgba(70,40,10,.10) 7%,rgba(70,40,10,0) 16%);
}

.sayfa.tek .golge{
    background:linear-gradient(to right,rgba(70,40,10,.18) 0,rgba(70,40,10,0) 8%);
}

.sayfa-metni{
    position:absolute;
    z-index:5;
    top:7%;
    bottom:7%;
    left:10.5%;
    right:10.5%;
    overflow:hidden;
    color:#294d88;
    font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
    font-size:var(--yazi);
    line-height:1.42;
    text-align:left;
    overflow-wrap:break-word;
    text-shadow:0.3px 0.3px 0 rgba(20,40,80,.35);
}

.sayfa.sol .sayfa-metni{left:10%;right:13%;}
.sayfa.sag .sayfa-metni{left:13%;right:10%;}

.blok{margin:0 0 .7em 0;}
.blok:last-child{margin-bottom:0;}
.blok.baslik{font-size:1.12em;margin-bottom:1em;}
.blok.siir-baslik{
    font-size:1.35em;
    font-weight:bold;
    text-align:center;
    margin-bottom:1.1em;
}
.blok.son{margin-top:1em;}
.blok.ara{margin-top:2em;}
.sayfa-metni > .blok:first-child{margin-top:0;}

.sayfa-fotografi{
    position:absolute;
    z-index:6;
    top:50%;
    left:50%;
    width:62%;
    transform:translate(-50%,-50%);
    line-height:0;
}

.sayfa-fotografi img{
    display:block;
    width:100%;
    height:auto;
    max-height:calc(var(--ph) * .72);
    object-fit:contain;
    pointer-events:none;
    -webkit-user-drag:none;
}

.sayfa-fotografi::before,
.sayfa-fotografi::after{
    content:"";
    position:absolute;
    z-index:8;
    width:32%;
    height:9%;
    background:#c0aa80;
    opacity:.9;
    box-shadow:0 1px 2px rgba(60,40,20,.20), inset 0 0 1px rgba(255,255,255,.25);
    pointer-events:none;
}

.sayfa-fotografi::before{top:-3%;right:-8%;transform:rotate(9deg);}
.sayfa-fotografi::after{bottom:-3%;left:-8%;transform:rotate(-9deg);}

.sayfa-no{
    position:absolute;
    z-index:8;
    left:50%;
    bottom:3.6%;
    transform:translateX(-50%);
    color:#6d5942;
    font-size:max(9px, calc(var(--yazi) * .62));
    line-height:1;
    pointer-events:none;
    text-shadow:0 .5px 0 rgba(255,255,255,.35);
}

/* ölçüm (görünmez) */

.olcer{
    position:absolute;
    left:0;
    top:0;
    width:var(--pw);
    height:var(--ph);
    visibility:hidden;
    pointer-events:none;
    z-index:-1;
}

/* ------------------------------------------------------------------
   KONTROLLER
   ------------------------------------------------------------------ */

.kontroller{
    flex:0 0 auto;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:#f4d47a;
    font-family:Georgia,"Times New Roman",serif;
}

.kontroller button{
    min-width:40px;
    height:40px;
    padding:0 12px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:10px;
    background:rgba(30,20,12,.72);
    color:#f4d47a;
    font-family:Arial,sans-serif;
    font-size:20px;
    line-height:1;
    cursor:pointer;
}

.kontroller button:disabled{opacity:.35;cursor:default;}
.kontroller button.yazili{font-size:14px;font-family:Georgia,serif;}

.bilgi{
    min-width:92px;
    text-align:center;
    font-size:15px;
}

.ipucu{font-size:15px;letter-spacing:.02em;opacity:.9;}
.nav{display:none;align-items:center;gap:10px;}
.kontroller.acik .nav{display:flex;}
.kontroller.acik .ipucu{display:none;}

@media (prefers-reduced-motion:reduce){
    .yaprak,.kapak,.kitap{transition-duration:.01s !important;}
    .kapak-yazi{animation:none;}
}
</style>
</head>

<body>

<div class="sahne" id="sahne">

    <div class="alan" id="alan">

        <div class="kitap" id="kitap">

            <div class="acik-gorsel" id="acikGorsel"><img id="acikImg" alt=""></div>

            <div class="icerik" id="icerik">
                <div class="taban" id="tabanSol"></div>
                <div class="taban" id="tabanSag"></div>
            </div>

            <div class="kapak" id="kapak" tabindex="0" role="button" aria-label="Kitabı aç">

                <div class="yuz on">
                    <img alt="">
                    <div class="kapak-yazi">
                        <div>Şiir'e hatıra..</div>
                        <div>Kelimelerden..</div>
                        <div>Hayattan..</div>
                        <div>Babasından..</div>
                    </div>
                </div>

                <div class="yuz arka">
                    <img alt="">
                </div>

            </div>

            <div class="olcer sayfa sag">
                <div class="sayfa-metni" id="olcerMetin"></div>
            </div>

        </div>

    </div>

    <div class="kontroller" id="kontroller">

        <span class="ipucu">Açmak için kapağa dokun</span>

        <div class="nav">
            <button id="btnGeri" aria-label="Önceki sayfa">‹</button>
            <span class="bilgi" id="bilgi"></span>
            <button id="btnIleri" aria-label="Sonraki sayfa">›</button>
            <button id="btnKapat" class="yazili" aria-label="Kitabı kapat">Kapat</button>
        </div>

        <button id="btnTamEkran" aria-label="Tam ekran" title="Tam ekran">⛶</button>

    </div>

</div>

const kir  = function(){ return {t:"kir"}; };

const blok = function(satirlar,sinif){
    return {t:"blok",satirlar:[].concat(satirlar),sinif:sinif||""};
};
const siir = function(ad,kitalar,ara){
    return [kir(), blok(ad,"siir-baslik"+(ara?" ara":""))]
        .concat(kitalar.map(function(k){ return blok(k); }));
};
const siirAra = function(ad,kitalar){
    return [blok(ad,"siir-baslik ara")]
        .concat(kitalar.map(function(k){ return blok(k); }));
};

/* acik_kitap2.png üzerindeki ölçüler (görsel pikseli cinsinden) */
const G_W = 854, G_H = 641;
const SAYFA = {xs:431, yt:38, yb:586, lx0:110, rx1:738};
const KIRP2 = {x0:56,  y0:28, x1:806, y1:614};   /* çift sayfa: kitabın tamamı */
const KIRP1 = {x0:424, y0:28, x1:794, y1:614};   /* tek sayfa: sağ sayfa ve kenarı */

function yerlesimHesapla(){

    const aw = alan.clientWidth;
    const ah = alan.clientHeight;

    const kenar = Math.max(8, Math.min(aw,ah) * 0.02);

    const mw = Math.max(50, aw - 2*kenar);
    const mh = Math.max(50, ah - 2*kenar);

    const c = (aw / ah >= 1.08) ? 2 : 1;

    const kr = (c === 2) ? KIRP2 : KIRP1;
    const cw = kr.x1 - kr.x0;
    const ch = kr.y1 - kr.y0;

    const s = Math.min(mw / cw, mh / ch);

    const kitapW = Math.round(cw * s);
    const H = Math.round(ch * s);
    const W = (c === 2) ? Math.round(kitapW / 2) : kitapW;
    const ph = Math.round((SAYFA.yb - SAYFA.yt) * s);

    const yazi = Math.max(12.5, Math.min(20, ph * 0.031));

    return {
        cols:c, W:W, H:H, kitapW:kitapW,
        hinge: Math.round((SAYFA.xs - kr.x0) * s),
        pw:    Math.round((SAYFA.rx1 - SAYFA.xs) * s),
        pwl:   Math.round((SAYFA.xs - SAYFA.lx0) * s),
        ph:    ph,
        pt:    Math.round((SAYFA.yt - kr.y0) * s),
        imgW:  Math.round(G_W * s),
        imgL: -Math.round(kr.x0 * s),
        imgT: -Math.round(kr.y0 * s),
        yazi:  Math.round(yazi * 10) / 10
    };
}

function yerlesimUygula(y){

    const s = kitap.style;

    s.setProperty("--W", y.W + "px");
    s.setProperty("--H", y.H + "px");
    s.setProperty("--pw", y.pw + "px");
    s.setProperty("--pwl", y.pwl + "px");
    s.setProperty("--ph", y.ph + "px");
    s.setProperty("--pt", y.pt + "px");
    s.setProperty("--hinge", y.hinge + "px");
    s.setProperty("--yazi", y.yazi + "px");
    s.setProperty("--kitapW", y.kitapW + "px");
    s.setProperty("--spine", (y.cols === 2 ? y.W : 0) + "px");
    s.setProperty("--persp", (y.W * 8) + "px");
    s.setProperty("--kapaliKayma", (y.cols === 2 ? -Math.round(y.W / 2) : 0) + "px");

    acikImg.style.width = y.imgW + "px";
    acikImg.style.left = y.imgL + "px";
    acikImg.style.top = y.imgT + "px";

    kitap.classList.toggle("tek", y.cols === 1);
}


/* =========================================================
   SAYFALARA BÖLME
   ========================================================= */

function baslikMi(dugum){
    return /(^| )(siir-baslik|baslik)( |$)/.test(dugum.className);
}

/* "sen !" gibi yerlerde noktalama işareti tek başına alt satıra düşmesin */
function bagla(s){
    return s.replace(/ ([!?;,:])/g, " $1");
}

function sayfalaraBol(){

    const kutu = olcerMetin;
    const sonuc = [];
    let mevcut = null;

    function tasma(){
        return kutu.scrollHeight > kutu.clientHeight + 1;
    }

    function temizle(){
        while(kutu.firstChild){ kutu.removeChild(kutu.firstChild); }
    }

    function yeni(basId){
        temizle();
        mevcut = {tur:"metin", basId:basId, dugumler:[]};
        sonuc.push(mevcut);
    }

    function dugumYap(b, satirlar, devam, id){
        const p = document.createElement("p");
        p.className = "blok" + (b.sinif ? " " + b.sinif : "") + (devam ? " devam" : "");
        p.dataset.id = String(id);
        satirlar.forEach(function(s,i){
            if(i){ p.appendChild(document.createElement("br")); }
            p.appendChild(document.createTextNode(bagla(s)));
        });
        return p;
    }

    function yerlestir(b){

        let bas = 0;
        let devam = false;

        while(bas < b.satirlar.length){

            const id = b.id + bas / 1000;

            if(!mevcut){ yeni(id); }

            const kalan = b.satirlar.slice(bas);
            const p = dugumYap(b, kalan, devam, id);
            kutu.appendChild(p);

            if(!tasma()){
                mevcut.dugumler.push(p);
                return;
            }

            /* taştı: kaç satır sığıyor? */

            const bos = mevcut.dugumler.every(baslikMi);
            let sigan = 0;

            if(kalan.length > 4 || (bos && kalan.length > 1)){

                p.textContent = "";

                for(let i = 0; i < kalan.length; i++){
                    if(i){ p.appendChild(document.createElement("br")); }
                    p.appendChild(document.createTextNode(bagla(kalan[i])));
                    if(tasma()){ break; }
                    sigan = i + 1;
                }
            }

            if(bos){

                if(sigan < 1){
                    sigan = 1;
                }else if(kalan.length - sigan === 1 && sigan > 2){
                    sigan -= 1;
                }

            }else{

                if(sigan < 2){
                    sigan = 0;
                }else if(kalan.length - sigan === 1){
                    sigan -= 1;
                    if(sigan < 2){ sigan = 0; }
                }
            }

            if(sigan > 0){

                /* satırları böl: ilk kısım bu sayfada kalır */

                p.textContent = "";
                for(let i = 0; i < sigan; i++){
                    if(i){ p.appendChild(document.createElement("br")); }
                    p.appendChild(document.createTextNode(bagla(kalan[i])));
                }

                mevcut.dugumler.push(p);

                bas += sigan;
                devam = true;
                mevcut = null;
                continue;
            }

            /* tamamı bir sonraki sayfaya */

            kutu.removeChild(p);

            let tasinan = null;
            const son = mevcut.dugumler[mevcut.dugumler.length - 1];

            if(son && baslikMi(son) && mevcut.dugumler.length > 1){
                mevcut.dugumler.pop();
                tasinan = son;
            }

            mevcut = null;

            if(tasinan){
                yeni(parseFloat(tasinan.dataset.id));
                kutu.appendChild(tasinan);
                mevcut.dugumler.push(tasinan);
            }
        }
    }

    PARCALAR.forEach(function(parca, idx){

        if(parca.t === "kir"){
            mevcut = null;
            return;
        }

        if(parca.t === "foto"){
            sonuc.push({tur:"foto", basId:idx, src:parca.src, alt:parca.alt});
            mevcut = null;
            return;
        }

        yerlestir({id:idx, satirlar:parca.satirlar, sinif:parca.sinif});
    });

    temizle();

    return sonuc;
}


/* =========================================================
   SAYFA VE YAPRAK OLUŞTURMA
   ========================================================= */

function sayfaEl(veri, idx, tur){

    const s = document.createElement("div");
    s.className = "sayfa " + tur;

    const img = new Image();
    img.className = "kagit";
    img.alt = "";
    img.draggable = false;
    img.src = (tur === "sol") ? G.sol : G.sag;
    s.appendChild(img);

    if(veri.tur === "metin"){

        const m = document.createElement("div");
        m.className = "sayfa-metni";
        veri.dugumler.forEach(function(d){ m.appendChild(d); });
        s.appendChild(m);

    }else if(veri.tur === "foto"){

        const f = document.createElement("div");
        f.className = "sayfa-fotografi";
        const fi = new Image();
        fi.src = G[veri.src] || (veri.src + ".jpg");
        fi.alt = veri.alt || "";
        fi.draggable = false;
        f.appendChild(fi);
        s.appendChild(f);
    }

    if(veri.tur !== "bos"){
        const no = document.createElement("div");
        no.className = "sayfa-no";
        no.textContent = String(idx + 1);
        s.appendChild(no);
    }

    const g = document.createElement("div");
    g.className = "golge";
    s.appendChild(g);

    return s;
}

function yaprakOlustur(onVeri, onIdx, onTur, arkaVeri, arkaIdx, arkaTur){

    const y = document.createElement("div");
    y.className = "yaprak";

    const on = document.createElement("div");
    on.className = "yuz on";
    on.appendChild(sayfaEl(onVeri, onIdx, onTur));
    y.appendChild(on);

    if(arkaVeri){
        const arka = document.createElement("div");
        arka.className = "yuz arka";
        arka.appendChild(sayfaEl(arkaVeri, arkaIdx, arkaTur));
        y.appendChild(arka);
    }

    return y;
}


/* =========================================================
   KURULUM
   ========================================================= */

function kur(){

    yer = yerlesimHesapla();
    cols = yer.cols;

    kitap.classList.add("kuruluyor");
    yerlesimUygula(yer);

    /* sayfalama */

    sayfalar = sayfalaraBol();
    toplam = sayfalar.length;

    if(cols === 2 && sayfalar.length % 2 === 1){
        const sonId = sayfalar[sayfalar.length - 1].basId;
        sayfalar.push({tur:"bos", basId:sonId + 1});
    }

    const n = sayfalar.length;

    /* eski yaprakları sil */

    Array.prototype.slice.call(icerik.querySelectorAll(".yaprak")).forEach(function(e){
        e.remove();
    });

    tabanSol.textContent = "";
    tabanSag.textContent = "";
    yaprakEls = [];

    if(cols === 2){

        L = Math.max(0, n / 2 - 1);

        tabanSol.appendChild(sayfaEl(sayfalar[0], 0, "sol"));
        tabanSag.appendChild(sayfaEl(sayfalar[n - 1], n - 1, "sag"));

        for(let j = 0; j < L; j++){
            const y = yaprakOlustur(
                sayfalar[2*j + 1], 2*j + 1, "sag",
                sayfalar[2*j + 2], 2*j + 2, "sol"
            );
            icerik.appendChild(y);
            yaprakEls.push(y);
        }

    }else{

        L = Math.max(0, n - 1);

        tabanSag.appendChild(sayfaEl(sayfalar[n - 1], n - 1, "sag"));

        for(let j = 0; j < L; j++){
            const y = yaprakOlustur(sayfalar[j], j, "sag", null, 0, "");
            icerik.appendChild(y);
            yaprakEls.push(y);
        }
    }

    /* kalınan yeri bul */

    let a = 0;
    for(let i = 0; i < sayfalar.length; i++){
        if(sayfalar[i].basId <= ankraj + 1e-9){ a = i; }
    }

    k = (cols === 2) ? (a >> 1) : a;
    k = Math.max(0, Math.min(L, k));

    yaprakDurumlariniUygula();
    ankrajGuncelle();
    bilgiGuncelle();

    /* geçişleri geri aç */

    void kitap.offsetWidth;
    requestAnimationFrame(function(){
        kitap.classList.remove("kuruluyor");
    });
}

function yaprakDurumlariniUygula(){

    yaprakEls.forEach(function(y, j){
        if(j < k){
            y.classList.add("cevrildi");
            y.style.zIndex = String(j + 1);
        }else{
            y.classList.remove("cevrildi");
            y.style.zIndex = String(L - j);
        }
    });
}

function ankrajGuncelle(){
    const a = (cols === 2) ? 2 * k : k;
    const s = sayfalar[a];
    if(s){ ankraj = s.basId; }
}

function bilgiGuncelle(){

    if(cols === 2){

        const sol = 2 * k + 1;
        const sag = 2 * k + 2;

        bilgi.textContent = (sag <= toplam)
            ? (sol + "–" + sag + " / " + toplam)
            : (sol + " / " + toplam);

    }else{

        bilgi.textContent = (k + 1) + " / " + toplam;
    }

    btnGeri.disabled  = !acik || animasyon || k <= 0;
    btnIleri.disabled = !acik || animasyon || k >= L;
}


/* =========================================================
   SAYFA ÇEVİRME
   ========================================================= */

function cevir(j, ileriMi){

    const y = yaprakEls[j];
    if(!y){ return; }

    animasyon = true;
    bilgiGuncelle();

    y.style.zIndex = "1000";
    y.classList.toggle("cevrildi", ileriMi);

    let bitti = false;

    function bitir(){
        if(bitti){ return; }
        bitti = true;
        y.removeEventListener("transitionend", sonu);
        y.style.zIndex = String(ileriMi ? (j + 1) : (L - j));
        animasyon = false;
        bilgiGuncelle();
    }

    function sonu(e){
        if(e.target === y && e.propertyName === "transform"){ bitir(); }
    }

    y.addEventListener("transitionend", sonu);
    setTimeout(bitir, 1000);
}

function ileri(){
    if(!acik || animasyon || k >= L){ return; }
    cevir(k, true);
    k++;
    ankrajGuncelle();
    bilgiGuncelle();
}

function geri(){
    if(!acik || animasyon || k <= 0){ return; }
    k--;
    cevir(k, false);
    ankrajGuncelle();
    bilgiGuncelle();
}


/* =========================================================
   KAPAĞI AÇ / KAPAT
   ========================================================= */

function ac(){

    if(acik || animasyon){ return; }

    acik = true;
    animasyon = true;

    kapak.style.zIndex = "2000";
    kitap.classList.add("acik");
    kontroller.classList.add("acik");
    kapak.setAttribute("aria-label","Kapak");

    setTimeout(function(){ kapak.style.zIndex = "0"; }, 560);

    setTimeout(function(){
        animasyon = false;
        bilgiGuncelle();
    }, 1150);

    bilgiGuncelle();
}

function kapat(){

    if(!acik || animasyon){ return; }

    animasyon = true;
    kitap.classList.add("sakla");
    bilgiGuncelle();

    setTimeout(function(){

        kapak.style.zIndex = "2000";
        kitap.classList.remove("acik");
        kitap.classList.remove("sakla");
        kontroller.classList.remove("acik");
        kapak.setAttribute("aria-label","Kitabı aç");
        acik = false;

    }, 270);

    setTimeout(function(){
        animasyon = false;
        bilgiGuncelle();
    }, 1450);
}

kapak.addEventListener("click", function(){
    if(!acik){ ac(); }
});

kapak.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        if(!acik){ ac(); }
    }
});

btnGeri.addEventListener("click", geri);
btnIleri.addEventListener("click", ileri);
btnKapat.addEventListener("click", kapat);


/* =========================================================
   DOKUNMA / KAYDIRMA / KLAVYE
   ========================================================= */

let basla = null;

function yakinlastirildi(){
    return !!(window.visualViewport && window.visualViewport.scale > 1.02);
}

sahne.addEventListener("pointerdown", function(e){
    if(e.target.closest(".kontroller")){ basla = null; return; }
    basla = {x:e.clientX, y:e.clientY, t:Date.now()};
});

sahne.addEventListener("pointercancel", function(){ basla = null; });

sahne.addEventListener("pointerup", function(e){

    if(!basla){ return; }

    const a = basla;
    basla = null;

    if(!acik || yakinlastirildi()){ return; }

    const dx = e.clientX - a.x;
    const dy = e.clientY - a.y;

    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3){
        if(dx < 0){ ileri(); }else{ geri(); }
        return;
    }

    if(Math.abs(dx) < 12 && Math.abs(dy) < 12 && Date.now() - a.t < 600){

        const r = kitap.getBoundingClientRect();

        if(cols === 2){
            if(e.clientX < r.left + r.width / 2){ geri(); }else{ ileri(); }
        }else{
            if(e.clientX < r.left + r.width * 0.3){ geri(); }else{ ileri(); }
        }
    }
});

document.addEventListener("keydown", function(e){

    if(e.key === "ArrowRight" || e.key === "PageDown"){
        if(acik){ ileri(); }
    }else if(e.key === "ArrowLeft" || e.key === "PageUp"){
        if(acik){ geri(); }
    }else if(e.key === " " && acik){
        e.preventDefault();
        ileri();
    }
});

if(window.visualViewport){
    window.visualViewport.addEventListener("resize", function(){
        document.body.classList.toggle("yakin", yakinlastirildi());
    });
}


/* =========================================================
   TAM EKRAN
   ========================================================= */

const kok = document.documentElement;
const tamEkranIste = kok.requestFullscreen || kok.webkitRequestFullscreen;

if(!tamEkranIste){
    btnTamEkran.style.display = "none";
}

btnTamEkran.addEventListener("click", function(){

    const tamMi = document.fullscreenElement || document.webkitFullscreenElement;

    try{
        if(!tamMi){
            tamEkranIste.call(kok);
        }else if(document.exitFullscreen){
            document.exitFullscreen();
        }else if(document.webkitExitFullscreen){
            document.webkitExitFullscreen();
        }
    }catch(hata){
        console.log("Tam ekran açılamadı:", hata);
    }
});


/* =========================================================
   BOYUT DEĞİŞİMİ (döndürme, tam ekran, pencere)
   Kalınan yer korunur.
   ========================================================= */

let zamanlayici = null;

function degisti(a, b){
    return !a || a.cols !== b.cols ||
           Math.abs(a.W - b.W) >= 1 || Math.abs(a.H - b.H) >= 1;
}

function yenidenKur(){

    clearTimeout(zamanlayici);

    zamanlayici = setTimeout(function(){

        const yeni = yerlesimHesapla();

        if(!degisti(yer, yeni)){ return; }

        animasyon = false;
        kapak.style.zIndex = acik ? "0" : "2000";
        kur();

    }, 160);
}

window.addEventListener("resize", yenidenKur);
window.addEventListener("orientationchange", yenidenKur);


/* =========================================================
   BAŞLAT
   ========================================================= */

Array.prototype.forEach.call(kapak.querySelectorAll("img"), function(i){ i.src = G.kapak; });
acikImg.src = G.acik;

kapak.style.zIndex = "2000";

function baslat(){
    kur();
}

if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(baslat);
}else{
    baslat();
}

/* test ve hata ayıklama için */
window.__kitapDurum = function(){
    return {k:k, L:L, cols:cols, toplam:toplam, acik:acik, ankraj:ankraj};
};

})();
</script>
