<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:#171717;
    font-family:Georgia,serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   KAPALI KITAP
========================= */

.closed-book{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;

    background:
        radial-gradient(
            ellipse at center,
            #46301f 0%,
            #24180f 65%,
            #120c08 100%
        );

    cursor:pointer;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.closed-book.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.cover{
    position:relative;

    width:min(72vw,520px);
    aspect-ratio:.70;

    border-radius:8px 16px 16px 8px;

    background:
        linear-gradient(
            135deg,
            #57351e,
            #8b5a32 45%,
            #422717
        );

    box-shadow:
        20px 25px 45px rgba(0,0,0,.55),
        inset 8px 0 15px rgba(255,255,255,.08),
        inset -10px 0 20px rgba(0,0,0,.25);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#e8d3a7;

    text-align:center;
}

.cover h1{
    margin:0;

    font-size:clamp(28px,5vw,52px);

    letter-spacing:4px;

    font-weight:normal;
}

.cover p{
    margin-top:20px;

    font-size:16px;

    opacity:.8;
}


/* =========================
   KITAP
========================= */

.book{
    position:relative;

    width:min(94vw,1200px);
    height:min(72vh,700px);

    perspective:1800px;

    transform-style:preserve-3d;
}


/* =========================
   SOL SAYFA
========================= */

.page-left{
    position:absolute;

    left:0;
    top:0;

    width:50%;
    height:100%;

    overflow:hidden;

    border-radius:22px 4px 4px 22px;

    background:
        radial-gradient(
            ellipse at 35% 40%,
            #fff8df 0%,
            #ead6aa 70%,
            #c5a473 100%
        );

    box-shadow:
        -10px 12px 28px rgba(0,0,0,.35),
        inset -18px 0 25px rgba(0,0,0,.10);

    transform-origin:right center;

    transform:
        rotateY(4deg)
        translateZ(-5px);
}


/* =========================
   GUN BATIMI / DENIZ
========================= */

.sunset{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            #e99567 0%,
            #efb47b 34%,
            #e6c48e 49%,
            #7895a1 50%,
            #466f80 72%,
            #1e4657 100%
        );
}

.sunset::before{
    content:"";

    position:absolute;

    width:90px;
    height:90px;

    border-radius:50%;

    left:52%;
    top:39%;

    transform:translate(-50%,-50%);

    background:#ffe3a1;

    box-shadow:
        0 0 35px rgba(255,226,160,.75);
}

.sunset::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:49%;

    height:2px;

    background:rgba(255,240,190,.7);

    box-shadow:
        0 30px 15px rgba(255,225,160,.12);
}


/* =========================
   SAG SAYFA
========================= */

.page-right{
    position:absolute;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    overflow:hidden;

    border-radius:4px 22px 22px 4px;

    background:
        radial-gradient(
            ellipse at 65% 40%,
            #fff9e5 0%,
            #ead8ae 72%,
            #c6a575 100%
        );

    box-shadow:
        10px 12px 28px rgba(0,0,0,.35),
        inset 18px 0 25px rgba(0,0,0,.10);

    transform-origin:left center;

    transform:
        rotateY(-4deg)
        translateZ(-5px);
}


/* =========================
   SAG SAYFA ICERIK
========================= */

.contents{
    position:absolute;

    inset:0;

    padding:
        clamp(25px,4vw,55px)
        clamp(25px,5vw,65px);

    color:#463522;
}

.contents h2{
    margin:
        0
        0
        30px;

    text-align:center;

    font-size:
        clamp(24px,3vw,38px);

    font-weight:normal;

    letter-spacing:2px;
}

.contents ol{
    margin:0;
    padding-left:30px;

    font-size:
        clamp(16px,2vw,22px);

    line-height:1.8;
}

.contents li{
    border-bottom:1px solid rgba(80,55,30,.18);
}


/* =========================
   CILT
========================= */

.binding{
    position:absolute;

    left:50%;
    top:0;

    width:20px;
    height:100%;

    transform:
        translateX(-50%)
        translateZ(10px);

    z-index:50;

    pointer-events:none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.45),
            rgba(255,255,255,.20),
            rgba(0,0,0,.40)
        );

    border-radius:50%;

    box-shadow:
        0 0 12px rgba(0,0,0,.25);
}


/* =========================
   CEVRILEN SAYFA
========================= */

.turn-page{
    position:absolute;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    z-index:40;

    transform-style:preserve-3d;

    transform-origin:left center;

    cursor:grab;

    touch-action:none;

    will-change:transform;
}

.turn-page.dragging{
    cursor:grabbing;
}


/* =========================
   SAYFA ON
========================= */

.page-front{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:hidden;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    border-radius:
        3px
        22px
        22px
        3px;

    background:
        radial-gradient(
            ellipse at 65% 40%,
            #fff9e5 0%,
            #ead8ae 72%,
            #c6a575 100%
        );

    box-shadow:
        8px 10px 25px rgba(0,0,0,.25),
        inset 15px 0 22px rgba(0,0,0,.08);
}


/* =========================
   SAYFA ARKA
========================= */

.page-back{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:hidden;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    transform:rotateY(180deg);

    border-radius:
        22px
        3px
        3px
        22px;

    background:
        radial-gradient(
            ellipse at 35% 40%,
            #fff6da 0%,
            #e6d0a0 72%,
            #bea06d 100%
        );

    box-shadow:
        -8px 10px 25px rgba(0,0,0,.25),
        inset -15px 0 22px rgba(0,0,0,.08);
}


/* =========================
   SAYFA YAZISI
========================= */

.page-front::before{
    content:"Şiir Nefestir";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:
        clamp(22px,3vw,38px);

    color:#735c3e;

    white-space:nowrap;
}

.page-back::before{
    content:"Şiir";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:32px;

    color:#735c3e;
}


/* =========================
   SAYFA GOLGESI
========================= */

.turn-page::after{
    content:"";

    position:absolute;

    right:-2px;
    top:0;

    width:28px;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.22),
            rgba(0,0,0,.08),
            transparent
        );

    filter:blur(4px);

    opacity:.8;
}


/* =========================
   ALT KOSE
========================= */

.corner{
    position:absolute;

    right:8px;
    bottom:8px;

    width:70px;
    height:70px;

    pointer-events:none;

    border-radius:0 0 20px 0;

    background:
        linear-gradient(
            135deg,
            transparent 45%,
            rgba(0,0,0,.12) 48%,
            rgba(255,255,255,.50) 60%,
            transparent 68%
        );
}


/* =========================
   KONTROLLER
========================= */

.controls{
    position:fixed;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:10px;

    z-index:100;
}

button{
    padding:11px 22px;

    border:0;

    border-radius:8px;

    background:#fff;

    color:#222;

    font-size:15px;

    cursor:pointer;
}

button:hover{
    background:#ddd;
}


/* =========================
   MOBIL
========================= */

@media(max-width:700px){

    .book{
        width:96vw;
        height:58vh;
    }

    .contents{
        padding:25px 20px;
    }

    .contents h2{
        margin-bottom:20px;
    }

    .contents ol{
        padding-left:24px;
        font-size:15px;
        line-height:1.65;
    }

    button{
        padding:10px 15px;
        font-size:13px;
    }
}

</style>
</head>


<body>


<!-- =========================
     KAPALI KITAP
========================= -->

<div class="closed-book" id="closedBook">

    <div class="cover">

        <div>

            <h1>ŞİİR NEFESTİR</h1>

            <p>
                Kelimelerden kızıma,<br>
                insanlara ve hayata...
            </p>

        </div>

    </div>

</div>


<!-- =========================
     KITAP
========================= -->

<div class="book" id="book">


    <!-- SOL SAYFA -->

    <div class="page-left">

        <div class="sunset"></div>

    </div>


    <!-- SAG SAYFA -->

    <div class="page-right">

        <div class="contents">

            <h2>İçindekiler</h2>

            <ol>

                <li>Deneme 1</li>
                <li>Deneme 2</li>
                <li>Deneme 3</li>
                <li>Deneme 4</li>
                <li>Deneme 5</li>
                <li>Deneme 6</li>
                <li>Deneme 7</li>
                <li>Deneme 8</li>

            </ol>

        </div>

    </div>


    <!-- CILT -->

    <div class="binding"></div>


    <!-- CEVRILEN SAYFA -->

    <div class="turn-page" id="turnPage">

        <div class="page-front">

            <div class="corner"></div>

        </div>

        <div class="page-back"></div>

    </div>


</div>


<!-- =========================
     BUTONLAR
========================= -->

<div class="controls">

    <button id="prevBtn">
        ‹ Önceki
    </button>

    <button id="nextBtn">
        Sonraki ›
    </button>

</div>


<script>

/* =========================
   ELEMANLAR
========================= */

const closedBook =
    document.getElementById("closedBook");

const book =
    document.getElementById("book");

const turnPage =
    document.getElementById("turnPage");

const nextBtn =
    document.getElementById("nextBtn");

const prevBtn =
    document.getElementById("prevBtn");


/* =========================
   BASLANGIC
========================= */

let progress = 0;

let dragging = false;

let startX = 0;

let startProgress = 0;


/* =========================
   KITABI AC
========================= */

closedBook.addEventListener(
    "click",
    function(){

        closedBook.classList.add("hidden");

    }
);


/* =========================
   SAYFA HAREKETI
========================= */

function render(){

    const angle =
        -180 * progress;


    /*
        Sayfa artik yukari
        kaldirilmiyor.

        Cilt sabit.

        Sol kenar cilde
        bagli kaliyor.
    */

    const curve =
        Math.sin(
            progress * Math.PI
        );


    const rotateX =
        curve * 2.5;


    const rotateZ =
        curve * 1.2;


    turnPage.style.transform =
        `
        rotateY(${angle}deg)
        rotateX(${rotateX}deg)
        rotateZ(${rotateZ}deg)
        `;


    const shadow =
        .12 +
        curve * .20;


    turnPage.style.filter =
        `
        drop-shadow(
            5px 8px 18px
            rgba(0,0,0,${shadow})
        )
        `;
}


/* =========================
   ANIMASYON
========================= */

function animateTo(target){

    const from =
        progress;

    const duration =
        700;

    const start =
        performance.now();


    function frame(now){

        const elapsed =
            now - start;


        let t =
            elapsed / duration;


        if(t > 1){
            t = 1;
        }


        const eased =
            t < .5
            ? 2 * t * t
            : 1 -
              Math.pow(
                  -2 * t + 2,
                  2
              ) / 2;


        progress =
            from +
            (target - from) *
            eased;


        render();


        if(t < 1){

            requestAnimationFrame(frame);

        }else{

            progress =
                target;

            render();

        }

    }


    requestAnimationFrame(frame);
}


/* =========================
   FARE / PARMAK
========================= */

turnPage.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        startX =
            e.clientX;

        startProgress =
            progress;

        turnPage.classList.add(
            "dragging"
        );

        turnPage.setPointerCapture(
            e.pointerId
        );

    }
);


/* =========================
   SURUKLEME
========================= */

turnPage.addEventListener(
    "pointermove",
    function(e){

        if(!dragging){
            return;
        }


        const rect =
            book.getBoundingClientRect();


        const halfWidth =
            rect.width / 2;


        const distance =
            startX -
            e.clientX;


        const change =
            distance /
            halfWidth;


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    startProgress +
                    change
                )
            );


        render();

    }
);


/* =========================
   BIRAK
========================= */

turnPage.addEventListener(
    "pointerup",
    function(){

        if(!dragging){
            return;
        }


        dragging = false;


        turnPage.classList.remove(
            "dragging"
        );


        if(progress >= .5){

            animateTo(1);

        }else{

            animateTo(0);

        }

    }
);


/* =========================
   IPTAL
========================= */

turnPage.addEventListener(
    "pointercancel",
    function(){

        dragging = false;


        turnPage.classList.remove(
            "dragging"
        );


        animateTo(
            progress >= .5
            ? 1
            : 0
        );

    }
);


/* =========================
   BUTONLAR
========================= */

nextBtn.addEventListener(
    "click",
    function(){

        animateTo(1);

    }
);


prevBtn.addEventListener(
    "click",
    function(){

        animateTo(0);

    }
);


/* =========================
   KLAVYE
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){

            animateTo(1);

        }


        if(e.key === "ArrowRight"){

            animateTo(0);

        }

    }
);


/* =========================
   ILK DURUM
========================= */

render();

</script>

</body>
</html>
