<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sayfa Cevirme Testi</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#222;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* KITAP */

.book{
    position:relative;
    width:min(92vw,1100px);
    height:min(72vh,700px);
    perspective:2500px;
}

/* ORTA CILT */

.binding{
    position:absolute;
    left:50%;
    top:2%;
    width:18px;
    height:96%;
    transform:translateX(-50%);
    z-index:20;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.35),
            rgba(255,255,255,.15),
            rgba(0,0,0,.35)
        );

    border-radius:50%;
}

/* SABIT SOL SAYFA */

.page-left{
    position:absolute;
    left:0;
    top:0;
    width:50%;
    height:100%;
    overflow:hidden;

    border-radius:22px 5px 5px 22px;

    background:
        radial-gradient(
            ellipse at 40% 40%,
            #f9f0d5 0%,
            #e9d5a9 70%,
            #c8aa76 100%
        );

    box-shadow:
        -12px 15px 30px rgba(0,0,0,.35),
        inset -15px 0 25px rgba(0,0,0,.12);

    transform:
        rotateY(5deg)
        translateZ(-10px);

    transform-origin:right center;
}

/* SABIT SAG SAYFA */

.page-right{
    position:absolute;
    left:50%;
    top:0;
    width:50%;
    height:100%;
    overflow:hidden;

    border-radius:5px 22px 22px 5px;

    background:
        radial-gradient(
            ellipse at 60% 40%,
            #fff8df 0%,
            #ead7ad 72%,
            #c8aa76 100%
        );

    box-shadow:
        12px 15px 30px rgba(0,0,0,.35),
        inset 15px 0 25px rgba(0,0,0,.12);

    transform:
        rotateY(-5deg)
        translateZ(-10px);

    transform-origin:left center;
}

/* YAZI */

.page-left::after{
    content:"SOL SAYFA";
    position:absolute;
    left:40px;
    top:40px;
    color:#555;
    font-size:20px;
}

.page-right::after{
    content:"SAG SAYFA";
    position:absolute;
    right:40px;
    top:40px;
    color:#555;
    font-size:20px;
}

/* CEVRILEN GERCEK SAYFA */

.turn-page{
    position:absolute;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    z-index:30;

    transform-style:preserve-3d;
    transform-origin:left center;

    cursor:grab;

    touch-action:none;
}

.turn-page.dragging{
    cursor:grabbing;
}

/* SAYFA ON YUZ */

.page-front,
.page-back{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    background:
        radial-gradient(
            ellipse at 55% 40%,
            #fff9e5 0%,
            #ead8ae 70%,
            #c5a675 100%
        );

    box-shadow:
        10px 15px 30px rgba(0,0,0,.35),
        inset 12px 0 25px rgba(0,0,0,.12);
}

/* ON YUZ */

.page-front{
    border-radius:5px 22px 22px 5px;
}

/* ARKA YUZ */

.page-back{
    transform:rotateY(180deg);

    border-radius:22px 5px 5px 22px;

    background:
        radial-gradient(
            ellipse at 45% 40%,
            #f8efd5 0%,
            #e4cfa0 70%,
            #bd9b67 100%
        );

    box-shadow:
        -10px 15px 30px rgba(0,0,0,.35),
        inset -12px 0 25px rgba(0,0,0,.12);
}

/* SAYFA ICERIGI */

.page-front .content{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;
    color:#555;
}

.page-back .content{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;
    color:#555;
}

/* KIVRIM GOLGESI */

.turn-page::after{
    content:"";

    position:absolute;

    top:0;
    right:-2px;

    width:35px;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.28),
            rgba(0,0,0,.08),
            transparent
        );

    filter:blur(5px);

    opacity:.8;
}

/* KOSE */

.corner{
    position:absolute;

    right:12px;
    bottom:12px;

    width:65px;
    height:65px;

    border-radius:0 0 22px 0;

    background:
        linear-gradient(
            135deg,
            transparent 48%,
            rgba(0,0,0,.15) 50%,
            rgba(255,255,255,.55) 65%,
            transparent 70%
        );

    pointer-events:none;
}

/* BUTON */

.controls{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    gap:10px;

    z-index:100;
}

button{
    padding:12px 22px;

    border:0;
    border-radius:8px;

    background:#fff;
    color:#222;

    font-size:15px;

    cursor:pointer;
}

button:hover{
    background:#ddd;
}

/* TELEFON */

@media(max-width:700px){

    .book{
        width:96vw;
        height:58vh;
    }

    .page-left::after,
    .page-right::after{
        font-size:14px;
    }

    button{
        padding:10px 15px;
        font-size:13px;
    }
}

</style>
</head>

<body>

<div class="book" id="book">

    <div class="page-left"></div>

    <div class="page-right"></div>

    <div class="binding"></div>

    <div class="turn-page" id="turnPage">

        <div class="page-front">
            <div class="content">
                SAYFA
            </div>

            <div class="corner"></div>
        </div>

        <div class="page-back">
            <div class="content">
                ARKA SAYFA
            </div>
        </div>

    </div>

</div>

<div class="controls">
    <button id="prevBtn">← Geri</button>
    <button id="nextBtn">İleri →</button>
</div>

<script>

const book = document.getElementById("book");
const turnPage = document.getElementById("turnPage");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let progress = 0;

let dragging = false;
let startX = 0;
let startProgress = 0;

function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
}


/* SAYFAYI HAREKET ETTIR */

function render(){

    const p = progress;

    /*
        0 = sagda
        1 = solda
    */

    const angle = -180 * p;

    /*
        ORTA NOKTADA KIVRILMA
    */

    const curl = Math.sin(p * Math.PI);

    /*
        SAYFAYI HAFIF YUKARI KALDIR
    */

    const lift = -45 * curl;

    /*
        DERINLIK
    */

    const depth = -80 * curl;

    /*
        SAYFANIN KIVRILMASI
    */

    const bend = 18 * curl;

    /*
        HAFIF YATMA
    */

    const tilt = 5 * curl;

    turnPage.style.transform =
        `
        translate3d(0px, ${lift}px, ${depth}px)
        rotateY(${angle}deg)
        rotateX(${bend}deg)
        rotateZ(${tilt}deg)
        `;

    /*
        GOLGEYI ORTADA GUCLENDIR
    */

    turnPage.style.filter =
        `drop-shadow(${12 * curl}px ${18 * curl}px ${25 * curl}px rgba(0,0,0,.30))`;

}


/* SAYFAYI AC */

function openPage(){

    animateTo(1);
}


/* SAYFAYI KAPAT */

function closePage(){

    animateTo(0);
}


/* ANIMASYON */

function animateTo(target){

    const from = progress;

    const duration = 650;

    const start = performance.now();

    function frame(now){

        const elapsed = now - start;

        const t = clamp(elapsed / duration,0,1);

        /*
            YUMUSAK HAREKET
        */

        const eased =
            1 - Math.pow(1 - t,3);

        progress =
            from + (target - from) * eased;

        render();

        if(t < 1){

            requestAnimationFrame(frame);

        }else{

            progress = target;

            render();
        }
    }

    requestAnimationFrame(frame);
}


/* FARE BASLANGICI */

turnPage.addEventListener("pointerdown",(e)=>{

    dragging = true;

    startX = e.clientX;

    startProgress = progress;

    turnPage.classList.add("dragging");

    turnPage.setPointerCapture(e.pointerId);

});


/* FARE HAREKETI */

turnPage.addEventListener("pointermove",(e)=>{

    if(!dragging) return;

    const rect = book.getBoundingClientRect();

    const halfWidth = rect.width / 2;

    /*
        SAGDAN SOLA = POZITIF
    */

    const distance =
        startX - e.clientX;

    const change =
        distance / halfWidth;

    progress =
        clamp(startProgress + change,0,1);

    render();

});


/* FARE BIRAK */

turnPage.addEventListener("pointerup",(e)=>{

    if(!dragging) return;

    dragging = false;

    turnPage.classList.remove("dragging");

    /*
        YARIDAN FAZLA GECTIYSE
        SOLA DUS
    */

    if(progress > .5){

        animateTo(1);

    }else{

        animateTo(0);

    }

});


/* FARE IPTAL */

turnPage.addEventListener("pointercancel",()=>{

    dragging = false;

    turnPage.classList.remove("dragging");

    animateTo(
        progress > .5 ? 1 : 0
    );

});


/* BUTONLAR */

nextBtn.addEventListener("click",()=>{

    openPage();

});

prevBtn.addEventListener("click",()=>{

    closePage();

});


/* KLAVYE */

document.addEventListener("keydown",(e)=>{

    if(e.key === "ArrowLeft"){

        openPage();

    }

    if(e.key === "ArrowRight"){

        closePage();

    }

});


/* ILK DURUM */

render();

</script>

</body>
</html>
