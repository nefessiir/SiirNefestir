<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at center,
            #51463a 0%,
            #302923 55%,
            #1e1a17 100%
        );

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =====================================================
   KAPALI KITAP
   ===================================================== */

#closedBook {

    position: absolute;

    width: 360px;
    height: 520px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    cursor: pointer;

    transition:
        transform .8s ease;

    user-select: none;
    -webkit-user-select: none;
}

#closedBook:hover {

    transform:
        translate(-50%, -50%)
        scale(1.025);
}


/* =====================================================
   KAPAK
   ===================================================== */

.cover {

    width: 100%;
    height: 100%;

    border-radius:
        8px 20px 20px 8px;

    background:
        url("kapak-gorsel.jpg");

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    box-shadow:
        0 35px 70px rgba(0,0,0,.58),
        inset 5px 0 12px rgba(255,255,255,.08);

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;
}


/*
   KAPAK GORSELININ UZERINE
   HICBIR YAZI EKLENMIYOR
*/


/* =====================================================
   KITAP
   ===================================================== */

#book {

    display: none;

    position: absolute;

    width:
        min(1120px, 94vw);

    height:
        min(720px, 82vh);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    perspective:
        2200px;

    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   KITAP TABANI
   ===================================================== */

.book-base {

    position: absolute;

    inset: 0;

    transform-style:
        preserve-3d;

    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   BOMBELI SOL VE SAG SAYFALAR
   ===================================================== */

.static-page {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background: #f3ead8;

    overflow: hidden;

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.18);

    user-select: none;
    -webkit-user-select: none;
}


/* SOL */

.static-page.left {

    left: 0;

    border-radius:
        12px 0 0 12px;

    transform:
        perspective(1200px)
        rotateY(5deg)
        rotateX(-3deg);

    transform-origin:
        right center;
}


/* SAG */

.static-page.right {

    right: 0;

    border-radius:
        0 12px 12px 0;

    transform:
        perspective(1200px)
        rotateY(-5deg)
        rotateX(3deg);

    transform-origin:
        left center;
}


/* =====================================================
   BOMBE GOLGESI
   ===================================================== */

.static-page::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.10),
            transparent 18%,
            transparent 82%,
            rgba(0,0,0,.10)
        );

    opacity: .65;
}


/* =====================================================
   SOL SAYFA
   GUN BATIMI KALDIRILDI
   ===================================================== */

.picture {

    position: absolute;

    inset: 0;

    background:
        #f3ead8;

    pointer-events: none;
}


/* =====================================================
   SOL YAZI KALDIRILDI
   ===================================================== */

.pictureText {
    display: none;
}


/* =====================================================
   ICINDEKILER
   ===================================================== */

.contents {

    position: absolute;

    inset: 0;

    padding: 55px;

    background:
        #f3ead8;

    user-select: none;
    -webkit-user-select: none;

    pointer-events: none;
}

.contents h2 {

    margin:
        0 0 35px;

    text-align: center;

    font-size: 30px;

    font-weight: normal;
}

.line {

    height: 1px;

    margin-bottom: 25px;

    background:
        rgba(60,40,20,.3);
}

.item {

    display: flex;

    margin: 15px 0;

    font-size: 17px;

    user-select: none;
    -webkit-user-select: none;
}

.dots {

    flex: 1;

    margin:
        0 10px;

    border-bottom:
        1px dotted #8b7964;
}


/* =====================================================
   CILT
   ===================================================== */

.binding {

    position: absolute;

    z-index: 50;

    left: 50%;
    top: 0;

    width: 20px;
    height: 100%;

    transform:
        translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(30,20,10,.08),
            rgba(40,25,15,.30),
            rgba(255,255,255,.08),
            rgba(30,20,10,.15)
        );

    box-shadow:
        0 0 15px
        rgba(0,0,0,.18);
}


/* =====================================================
   CEVRILEN GERCEK SAYFA
   ===================================================== */

#turnPage {

    position: absolute;

    z-index: 100;

    top: 0;
    left: 50%;

    width: 50%;
    height: 100%;

    transform-style:
        preserve-3d;

    transform-origin:
        left center;

    pointer-events: none;

    user-select: none;
    -webkit-user-select: none;

    transform:
        translateX(0)
        rotateY(0deg);
}


/* =====================================================
   ON VE ARKA YUZ
   ===================================================== */

.turn-front,
.turn-back {

    position: absolute;

    inset: 0;

    overflow: hidden;

    backface-visibility:
        hidden;

    -webkit-backface-visibility:
        hidden;

    border-radius:
        0 12px 12px 0;

    background:
        #f3ead8;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.22);

    user-select: none;
    -webkit-user-select: none;

    pointer-events: none;
}


/* =====================================================
   ARKA YUZ
   TAMAMEN BOS
   ===================================================== */

.turn-back {

    transform:
        rotateY(180deg);

    border-radius:
        12px 0 0 12px;

    /*
       ICERIK YOK
       YAZI YOK
       AYNALAMA YOK
    */

    background:
        #f3ead8;
}


/* =====================================================
   KIVRIM ISIGI
   ===================================================== */

.turn-front::after,
.turn-back::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.25),
            transparent 25%,
            transparent 70%,
            rgba(0,0,0,.14)
        );
}


/* =====================================================
   SAYFA KIVRILIRKEN GOLGE
   ===================================================== */

#turnShadow {

    position: absolute;

    z-index: 80;

    top: 0;

    left: 45%;

    width: 55%;
    height: 100%;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.20),
            transparent
        );

    filter:
        blur(14px);
}


/* =====================================================
   ALT KOSENIN TUTMA ALANI
   ===================================================== */

#pageHandle {

    position: absolute;

    z-index: 200;

    right: 0;
    bottom: 0;

    width: 110px;
    height: 110px;

    cursor: grab;

    pointer-events: auto;

    border-radius:
        100% 0 0 0;

    background:
        radial-gradient(
            circle at bottom right,
            rgba(255,255,255,.20),
            transparent 70%
        );

    user-select: none;
    -webkit-user-select: none;
}

#pageHandle:active {

    cursor: grabbing;
}


/* =====================================================
   SAYFA CEVIRIRKEN
   MOUSE SECIMINI TAMAMEN KAPAT
   ===================================================== */

body.dragging,
body.dragging * {

    user-select: none !important;
    -webkit-user-select: none !important;

    cursor: grabbing !important;
}


/* =====================================================
   KONTROLLER
   ===================================================== */

.controls {

    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    display: none;

    gap: 15px;

    z-index: 500;
}

button {

    padding:
        10px 20px;

    border:
        1px solid #74614d;

    background:
        #211b16;

    color:
        #f5ead8;

    font-family:
        Georgia,
        serif;

    cursor: pointer;
}


/* =====================================================
   MOBIL
   ===================================================== */

@media(max-width:700px) {

    #closedBook {

        width: 280px;
        height: 410px;
    }

    #book {

        width: 96vw;
        height: 70vh;
    }

    .contents {

        padding:
            30px 20px;
    }

    .contents h2 {

        font-size: 23px;
    }

    .item {

        font-size: 13px;
    }

    #pageHandle {

        width: 85px;
        height: 85px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     KAPALI KITAP
     ===================================================== -->

<div
    id="closedBook"
    onclick="openBook()"
>

    <div class="cover"></div>

</div>


<!-- =====================================================
     ACIK KITAP
     ===================================================== -->

<div id="book">

    <div class="book-base">


        <!-- SOL SAYFA -->

        <div class="static-page left">

            <div class="picture"></div>

        </div>


        <!-- SAG SAYFA -->

        <div class="static-page right">

            <div class="contents">

                <h2>İçindekiler</h2>

                <div class="line"></div>

                <div class="item">
                    <span>Deneme 1</span>
                    <span class="dots"></span>
                    <span>1</span>
                </div>

                <div class="item">
                    <span>Deneme 2</span>
                    <span class="dots"></span>
                    <span>2</span>
                </div>

                <div class="item">
                    <span>Deneme 3</span>
                    <span class="dots"></span>
                    <span>3</span>
                </div>

                <div class="item">
                    <span>Deneme 4</span>
                    <span class="dots"></span>
                    <span>4</span>
                </div>

                <div class="item">
                    <span>Deneme 5</span>
                    <span class="dots"></span>
                    <span>5</span>
                </div>

                <div class="item">
                    <span>Deneme 6</span>
                    <span class="dots"></span>
                    <span>6</span>
                </div>

                <div class="item">
                    <span>Deneme 7</span>
                    <span class="dots"></span>
                    <span>7</span>
                </div>

                <div class="item">
                    <span>Deneme 8</span>
                    <span class="dots"></span>
                    <span>8</span>
                </div>

            </div>

        </div>


        <!-- CILT -->

        <div class="binding"></div>


        <!-- =================================================
             CEVRILEN SAYFA
             ================================================= -->

        <div id="turnPage">

            <div class="turn-front">

                <div class="contents">

                    <h2>İçindekiler</h2>

                    <div class="line"></div>

                    <div class="item">
                        <span>Deneme 1</span>
                        <span class="dots"></span>
                        <span>1</span>
                    </div>

                    <div class="item">
                        <span>Deneme 2</span>
                        <span class="dots"></span>
                        <span>2</span>
                    </div>

                    <div class="item">
                        <span>Deneme 3</span>
                        <span class="dots"></span>
                        <span>3</span>
                    </div>

                    <div class="item">
                        <span>Deneme 4</span>
                        <span class="dots"></span>
                        <span>4</span>
                    </div>

                </div>

            </div>


            <!--
                ARKA YUZ BILEREK BOS BIRAKILDI
                AYNALAMA YAPACAK YAZI YOK
            -->

            <div class="turn-back"></div>

        </div>


        <!-- GOLGE -->

        <div id="turnShadow"></div>


        <!-- ALT KOSENIN TUTMA NOKTASI -->

        <div id="pageHandle"></div>

    </div>

</div>


<!-- KONTROLLER -->

<div
    class="controls"
    id="controls"
>

    <button onclick="previousPage()">
        ‹ Önceki
    </button>

    <button onclick="nextPage()">
        Sonraki ›
    </button>

</div>


<script>

/* =====================================================
   DEGISKENLER
   ===================================================== */

const book =
    document.getElementById("book");

const turnPage =
    document.getElementById("turnPage");

const pageHandle =
    document.getElementById("pageHandle");

const turnShadow =
    document.getElementById("turnShadow");

let progress = 0;

let dragging = false;

let startX = 0;

let startProgress = 0;


/* =====================================================
   KITABI AC
   ===================================================== */

function openBook() {

    document.getElementById(
        "closedBook"
    ).style.display = "none";

    book.style.display = "block";

    document.getElementById(
        "controls"
    ).style.display = "flex";

    updatePage(0);
}


/* =====================================================
   SAYFAYI HAREKET ETTIR
   ===================================================== */

function updatePage(value) {

    progress =
        Math.max(
            0,
            Math.min(
                1,
                value
            )
        );


    const angle =
        -180 * progress;


    const curl =
        Math.sin(
            progress * Math.PI
        );


    const lift =
        -45 *
        curl;


    const depth =
        -70 *
        curl;


    const bend =
        12 *
        curl;


    turnPage.style.transform = `
        translateX(0px)
        translateY(${lift}px)
        translateZ(${depth}px)
        rotateY(${angle}deg)
        rotateX(${bend}deg)
        skewY(${bend * .12}deg)
    `;


    turnShadow.style.opacity =
        curl * .9;
}


/* =====================================================
   SONRAKI SAYFA
   ===================================================== */

function nextPage() {

    animatePage(
        progress,
        1
    );
}


/* =====================================================
   ONCEKI SAYFA
   ===================================================== */

function previousPage() {

    animatePage(
        progress,
        0
    );
}


/* =====================================================
   ANIMASYON
   ===================================================== */

function animatePage(
    from,
    to
) {

    const duration =
        1200;

    const start =
        performance.now();


    function frame(now) {

        let t =
            (now - start) /
            duration;

        t =
            Math.min(
                t,
                1
            );


        const eased =
            t < .5
                ? 2 * t * t
                : 1 -
                  Math.pow(
                      -2 * t + 2,
                      2
                  ) / 2;


        const value =
            from +
            (to - from) *
            eased;


        updatePage(
            value
        );


        if (t < 1) {

            requestAnimationFrame(
                frame
            );

        }

    }

    requestAnimationFrame(
        frame
    );
}


/* =====================================================
   FARE ILE SAYFAYI TUT
   ===================================================== */

pageHandle.addEventListener(
    "mousedown",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        dragging = true;

        document.body.classList.add(
            "dragging"
        );

        startX =
            event.clientX;

        startProgress =
            progress;

    }
);


/* =====================================================
   FAREYI SURUKLE
   SADECE SAYFA
   ===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();


        const width =
            book.offsetWidth / 2;


        const distance =
            startX -
            event.clientX;


        const movement =
            distance /
            width;


        updatePage(
            startProgress +
            movement
        );

    },
    true
);


/* =====================================================
   FAREYI BIRAK
   ===================================================== */

document.addEventListener(
    "mouseup",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        dragging = false;

        document.body.classList.remove(
            "dragging"
        );


        if (progress >= .5) {

            animatePage(
                progress,
                1
            );

        } else {

            animatePage(
                progress,
                0
            );

        }

    },
    true
);


/* =====================================================
   TELEFON / TABLET
   ===================================================== */

pageHandle.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        dragging = true;

        document.body.classList.add(
            "dragging"
        );

        startX =
            event.touches[0].clientX;

        startProgress =
            progress;

    },
    {
        passive: false
    }
);


/* =====================================================
   DOKUNMATIK SURUKLE
   ===================================================== */

document.addEventListener(
    "touchmove",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();


        const width =
            book.offsetWidth / 2;


        const distance =
            startX -
            event.touches[0].clientX;


        updatePage(
            startProgress +
            distance /
            width
        );

    },
    {
        passive: false,
        capture: true
    }
);


/* =====================================================
   DOKUNMATIK BIRAK
   ===================================================== */

document.addEventListener(
    "touchend",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        dragging = false;

        document.body.classList.remove(
            "dragging"
        );


        if (progress >= .5) {

            animatePage(
                progress,
                1
            );

        } else {

            animatePage(
                progress,
                0
            );

        }

    },
    {
        capture: true
    }
);


/* =====================================================
   KLAVYE
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (dragging) {
            return;
        }


        if (
            event.key === "ArrowRight"
        ) {

            nextPage();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousPage();

        }

    }
);


/* =====================================================
   BASLANGIC
   ===================================================== */

updatePage(0);

</script>

</body>
</html>
