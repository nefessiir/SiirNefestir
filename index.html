<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* KİTAP KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. SAĞDA SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTAP GÖVDESİ */
.acik-kitap-alan {
    position: absolute;
    top: 0.5cm;
    left: calc(-100% - 0.6cm);
    width: calc(200% - 1.3cm);
    height: calc(100% - 1cm);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.1882);
    transform-origin: left center;
    clip-path: inset(0 0 0 100%);
    transition: opacity 0.8s ease-in-out, clip-path 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.kitap-kapsayici.acildi .acik-kitap-alan {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transition: opacity 0.4s ease-in-out 0.6s, clip-path 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) 0.6s;
}

.acik-kitap-alan img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTABIN SOL KANAT YAZI ALANI (Optik denge için 11.2pt ve 1.42 satır aralığı) */
.sol-kanat-yazi {
    position: absolute;
    top: 0.3cm;
    left: calc(0.75cm + 0.3cm + 1cm);
    width: calc(50% - 1.8cm);
    height: calc(100% - 0.6cm);
    font-family: 'Caveat', cursive, serif;
    font-size: 11.2pt;
    line-height: 1.42;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 2px rgba(26, 75, 130, 0.25);
    box-sizing: border-box;
    pointer-events: none;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sol-kanat-yazi {
    opacity: 1;
    transition: opacity 0.3s ease-in-out 1.1s;
}

/* ÇOKLU SAYFA KONTEYNERİ */
.sayfalar-kapsayici {
    position: absolute;
    top: 0.5cm;
    left: 0;
    width: 100%;
    height: calc(100% - 1cm);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sayfalar-kapsayici {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.3s ease-in-out 1.1s;
}

/* HER BİR YAPRAK */
.sayfa-yaprak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.0s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
}

.sayfa-yaprak.cevirdi {
    transform: rotateY(-180deg);
}

/* Sayfa İçerik Boyutu */
.sayfa-icerik {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% - 1.5cm);
    height: 100%;
    transform-style: preserve-3d;
}

.sayfa-on, .sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sayfa-on img, .sayfa-arka img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.sayfa-arka {
    transform: rotateY(180deg);
}

/* SAYFA İÇİ YAZILAR (Sağ taraf: 12pt ve 1.42 satır aralığı) */
.sayfa-yazi {
    position: absolute;
    top: 0.3cm;
    left: 0.3cm;
    width: calc(100% - 0.6cm);
    height: calc(100% - 0.6cm);
    font-family: 'Caveat', cursive, serif;
    font-size: 12pt;
    line-height: 1.42;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 2px rgba(26, 75, 130, 0.25);
    box-sizing: border-box;
    pointer-events: none;
    backface-visibility: hidden;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    white-space: pre-wrap;
}

/* ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 2.0s ease-in-out;
    z-index: 30;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
    z-index: 1;
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<div class="kitap-kapsayici" id="kitapKapsayici">

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg" alt="Alt Kapak">
    </div>

    <!-- AÇIK KİTAP GÖVDESİ -->
    <div class="acik-kitap-alan" id="acikKitapAlan">
        <img src="acik_kitap1.png" alt="Açık Kitap Gövdesi">
        <!-- Sabit Sol Kanat Yazı Alanı -->
        <div class="sol-kanat-yazi" id="solKanatYazi"></div>
    </div>

    <!-- DİNAMİK YAPRAKLAR KONTEYNERİ -->
    <div class="sayfalar-kapsayici" id="sayfalarKapsayici"></div>

    <!-- ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">
        <img src="kapak.jpg" class="kapak" alt="Ön Kapak">
        
        <div class="kapak-yazi">
            Şiir'e hatıra.<br><br>
            kelimelerden..<br>
            hayattan..<br>
            babasından.<br><br><br>
            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak" alt="Arka Kapak">
    </div>

</div>

<script>
window.addEventListener("load", function () {
    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const sayfalarKapsayici = document.getElementById("sayfalarKapsayici");
    const solKanatYazi = document.getElementById("solKanatYazi");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;
    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";

    const onsozMetni = 
`
Kızıma…

Sevgili Şiir,

Belki bu satırları okuduğunda ben yanında olacağım, belki de hayat bizi birbirimizden uzaklaştırmış olacak.

Ama şunu bilmeni isterim:
Ben bu şiirleri insanlara bir şey anlatmak için değil, içimde birikenleri kaybetmemek için yazdım. Ve bazılarını yıllar sonra sen bul diye sakladım.

Çünkü sana bırakabileceğim en güzel şeylerden birinin, benim dünyamı anlatan kelimeler olduğunu düşündüm.

Bir gün bu sayfalarda kendinden bir parça bulursan, bil ki, o şiir senden önce yazılmış olsa bile, sana da aittir.

Çünkü sen benim hayatıma girdikten sonra yazdığım hiçbir şey eskisi gibi olmadı.

Baban.`;

    const toplamYaprak = 25;
    let yaprakElementleri = [];
    let isRewinding = false;
    let aktifDaktiloTimeout = null;
    let daktiloDevamEdiyor = false;

    let kelimeParcalari = onsozMetni.match(/([^\s]+|\s+)/g) || [];
    let globalKelimeIndex = 0;

    function metinYazdir(parcalar, element, hiz = 55, callback = null) {
        daktiloDevamEdiyor = true;

        function yazdirAdim() {
            if (!daktiloDevamEdiyor) return;

            if (globalKelimeIndex < parcalar.length) {
                let parca = parcalar[globalKelimeIndex];
                element.textContent += parca;

                if (element.scrollHeight > element.clientHeight) {
                    element.textContent = element.textContent.slice(0, -parca.length);
                    daktiloDevamEdiyor = false;
                    if (callback) callback();
                    return;
                }

                globalKelimeIndex++;
                aktifDaktiloTimeout = setTimeout(yazdirAdim, hiz);
            } else {
                daktiloDevamEdiyor = false;
                if (callback) callback();
            }
        }

        yazdirAdim();
    }

    for (let i = 0; i < toplamYaprak; i++) {
        const yaprakDiv = document.createElement("div");
        yaprakDiv.className = "sayfa-yaprak";
        yaprakDiv.style.zIndex = toplamYaprak - i;

        yaprakDiv.innerHTML = `
            <div class="sayfa-icerik">
                <div class="sayfa-on">
                    <img src="sag_sayfa.png" alt="Sayfa Ön">
                    <div class="sayfa-yazi" id="yazi-on-${i}"></div>
                </div>
                <div class="sayfa-arka">
                    <img src="sol_sayfa.png" alt="Sayfa Arka">
                    <div class="sayfa-yazi" id="yazi-arka-${i}"></div>
                </div>
            </div>
        `;

        yaprakDiv.addEventListener("click", function (e) {
            e.stopPropagation();

            if (daktiloDevamEdiyor) return; 
            if (isRewinding) return;

            if (!yaprakDiv.classList.contains("cevirdi")) {
                let aktifSagYaprak = yaprakElementleri.find(y => !y.classList.contains("cevirdi"));
                if (aktifSagYaprak === yaprakDiv) {
                    yaprakDiv.style.zIndex = 50 + i;
                    yaprakDiv.classList.add("cevirdi");

                    setTimeout(() => {
                        const arkaYaziElementi = document.getElementById(`yazi-arka-${i}`);
                        
                        if (globalKelimeIndex < kelimeParcalari.length && arkaYaziElementi) {
                            metinYazdir(kelimeParcalari, arkaYaziElementi, 55, () => {
                                let sonrakiIndex = i + 1;
                                if (sonrakiIndex < toplamYaprak && globalKelimeIndex < kelimeParcalari.length) {
                                    const sonrakiOnYaziElementi = document.getElementById(`yazi-on-${sonrakiIndex}`);
                                    if (sonrakiOnYaziElementi) {
                                        metinYazdir(kelimeParcalari, sonrakiOnYaziElementi, 55);
                                    }
                                }
                            });
                        }
                    }, 1000);

                    if (i === toplamYaprak - 1) {
                        otomatikGeriyeSar();
                    }
                }
            } else {
                let cevrilmisYapraklar = yaprakElementleri.filter(y => y.classList.contains("cevirdi"));
                let enUstSolYaprak = cevrilmisYapraklar[cevrilmisYapraklar.length - 1];
                
                if (enUstSolYaprak === yaprakDiv) {
                    yaprakDiv.style.zIndex = 100;
                    yaprakDiv.classList.remove("cevirdi");

                    const transitionBitince = function() {
                        yaprakDiv.style.zIndex = toplamYaprak - i;
                        yaprakDiv.removeEventListener("transitionend", transitionBitince);
                    };
                    yaprakDiv.addEventListener("transitionend", transitionBitince);
                }
            }
        });

        sayfalarKapsayici.appendChild(yaprakDiv);
        yaprakElementleri.push(yaprakDiv);
    }

    function otomatikGeriyeSar() {
        isRewinding = true;
        let index = yaprakElementleri.length - 1;

        let rewindInterval = setInterval(function () {
            if (index >= 0) {
                yaprakElementleri[index].style.zIndex = 100;
                yaprakElementleri[index].classList.remove("cevirdi");
                yaprakElementleri[index].style.zIndex = toplamYaprak - index;
                index--;
            } else {
                clearInterval(rewindInterval);

                setTimeout(function () {
                    kapsayici.classList.remove("acildi");
                    kapakAlan.classList.remove("dondu");
                    isRewinding = false;
                }, 400);
            }
        }, 100);
    }

    kapakAlan.addEventListener("click", function () {
        if (isRewinding) return;

        const ilkSagSayfaYazi = document.getElementById("yazi-on-0");

        if (kapsayici.classList.contains("acildi")) {
            if (aktifDaktiloTimeout) clearTimeout(aktifDaktiloTimeout);
            daktiloDevamEdiyor = false;
            globalKelimeIndex = 0;
            if (solKanatYazi) solKanatYazi.textContent = "";
            if (ilkSagSayfaYazi) ilkSagSayfaYazi.textContent = "";

            yaprakElementleri.forEach((y, index) => {
                y.classList.remove("cevirdi");
                y.style.zIndex = toplamYaprak - index;
            });
            kapsayici.classList.remove("acildi");
            kapakAlan.classList.remove("dondu");
        } else {
            kapsayici.classList.add("acildi");
            kapakAlan.classList.add("dondu");

            globalKelimeIndex = 0;
            setTimeout(() => {
                if (solKanatYazi) {
                    metinYazdir(kelimeParcalari, solKanatYazi, 55, () => {
                        if (globalKelimeIndex < kelimeParcalari.length && ilkSagSayfaYazi) {
                            metinYazdir(kelimeParcalari, ilkSagSayfaYazi, 55);
                        }
                    });
                }
            }, 3800);
        }
    });
});
</script>

</body>
</html>
