<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* =========================================================
   KITAP SAHNESI
========================================================= */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   ARKA PLAN VE SAYFA AYNI OLCEKTE
========================================================= */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: visible;
}


/* =========================================================
   ARKA PLAN
========================================================= */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* =========================================================
   SABIT SAG SAYFA
========================================================= */

.right-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;

    z-index: 2;
}


/* =========================================================
   SABIT SOL SAYFA
========================================================= */

.left-page {
    position: absolute;

    left: 19%;
    top: 13.2%;

    width: 34%;
    height: calc(100% - 27.5%);

    display: block;

    pointer-events: none;

    transform: scaleX(-1);

    z-index: 2;
}


/* =========================================================
   SIIR METIN ALANLARI
========================================================= */

.poem-text {
    position: absolute;

    top: 23%;
    width: 25%;

    z-index: 5;

    color: #173c68;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size: clamp(15px, 1.35vw, 23px);

    line-height: 1.9;

    white-space: pre-line;

    opacity: 1;

    transition: opacity 1.2s ease;
}


/* SOL SIIR */

.left-poem {
    left: 23%;

    text-align: left;
}


/* SAG SIIR */

.right-poem {
    left: 53%;

    text-align: left;
}


/* =========================================================
   SIIR KAYBOLURKEN
========================================================= */

.poem-text.fade-out {
    opacity: 0;
}


/* =========================================================
   SAG OK
========================================================= */

.page-arrow {
    position: absolute;

    top: 50%;
    left: 88%;

    width: 30px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255, 255, 255, 0.85);

    font-family: Arial, sans-serif;
    font-size: 38px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;
    user-select: none;

    z-index: 20;

    transform: translateY(-50%);

    text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.8);

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.page-arrow:hover {
    color: #fff;
}


/* =========================================================
   OK ANIMASYON SIRASINDA KAPALI
========================================================= */

.page-arrow.disabled {
    pointer-events: none;
    opacity: 0.35;
}

</style>
</head>

<body>

<div class="page">

    <div class="book-stage">

        <!-- ARKA PLAN -->

        <img
            class="book-background"
            src="arkaplan0.jpeg"
            alt="Sair Nefestir"
        >


        <!-- SABIT SAG SAYFA -->

        <img
            class="right-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- SABIT SOL SAYFA -->

        <img
            class="left-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- =================================================
             SOL SIIR
        ================================================== -->

        <div
            id="leftPoem"
            class="poem-text left-poem"
        >
            ŞİİR METİNLERİ
            AL BENİ
            YE BENİ
            OKU BENİ...
        </div>


        <!-- =================================================
             SAG SIIR
        ================================================== -->

        <div
            id="rightPoem"
            class="poem-text right-poem"
        >
            ŞİİR METİNLERİ
            ALDIM SENİ
            YEDİM SENİ
            OKUDUM SENİ...
        </div>


        <!-- =================================================
             SAG OK
        ================================================== -->

        <div
            id="nextArrow"
            class="page-arrow next-arrow"
            aria-label="Şiirin devamını göster"
        >
            ›
        </div>

    </div>

</div>


<script>

/* =========================================================
   SIIRLER
========================================================= */

const leftPoem = document.getElementById("leftPoem");
const rightPoem = document.getElementById("rightPoem");
const nextArrow = document.getElementById("nextArrow");


/* =========================================================
   ANIMASYON DURUMU
========================================================= */

let isAnimating = false;


/* =========================================================
   SAG OKA BASILINCA
========================================================= */

nextArrow.addEventListener("click", function () {

    if (isAnimating) {
        return;
    }

    isAnimating = true;

    nextArrow.classList.add("disabled");


    /*
     * 1
     * SOL VE SAG SIIR YAVASCA KAYBOLUYOR
     */

    leftPoem.classList.add("fade-out");
    rightPoem.classList.add("fade-out");


    /*
     * 2
     * KAYBOLMA TAMAMLANDIKTAN SONRA
     * YENI METINLERI YERLESTIRIYORUZ
     */

    setTimeout(function () {

        /*
         * SAGDAKI SIIR SOLA GECIYOR
         */

        leftPoem.innerHTML =
            "ŞİİR METİNLERİ<br>" +
            "ALDIM SENİ<br>" +
            "YEDİM SENİ<br>" +
            "OKUDUM SENİ...";


        /*
         * SIIRIN DEVAMI SAG SAYFAYA GELIYOR
         */

        rightPoem.innerHTML =
            "SİİRDİM<br>" +
            "ALINDIM<br>" +
            "YENİLDİM<br>" +
            "OKUNDUM....";


        /*
         * 3
         * YENI METINLERI GORUNUR YAPIYORUZ
         */

        leftPoem.classList.remove("fade-out");
        rightPoem.classList.remove("fade-out");


        /*
         * 4
         * ANIMASYON BITINCE OK YENIDEN AKTIF
         */

        setTimeout(function () {

            isAnimating = false;

            nextArrow.classList.remove("disabled");

        }, 1200);

    }, 1200);

});

</script>

</body>
</html>
