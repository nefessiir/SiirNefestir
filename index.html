<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* KITAP SAHNESI */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* ARKA PLAN VE SAYFA AYNI OLCEKTE */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: hidden;
}


/* ARKA PLAN */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* BOS SAG SAYFA */

.right-page {
    position: absolute;

    /*
        Kaynak goruntudeki konum:
        x = 750 / 1536
        y = 155 / 1024

        Boyut:
        590 x 740
    */

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;
}

</style>
</head>

<body>

<div class="page">

    <div class="book-stage">

        <img
            class="book-background"
            src="arkaplan0.jpeg"
            alt="Sair Nefestir"
        >

        <img
            class="right-page"
            src="sag_sayfa_bos.png"
            alt=""
        >

    </div>

</div>

</body>
</html>
