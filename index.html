<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;

    background-image: url("yeni_arka_plan0.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Kapağın bulunduğu alan */
.kitap-alani {
    width: 39%;
    height: calc(82vh + 4cm);

    transform: translateX(8cm);

    perspective: 1800px;

    position: relative;
}

/* 3D kapak */
.kitap-kapak {
    width: 100%;
    height: 100%;

    position: absolute;
    left: 0;
    top: 0;

    transform-style: preserve-3d;
    transform-origin: left center;

    transition:
        transform 1.4s cubic-bezier(0.22, 0.61, 0.36, 1);

    cursor: pointer;
}

/* Ön ve arka yüz */
.kapak-on,
.kapak-arka {
    width: 100%;
    height: 100%;

    position: absolute;
    left: 0;
    top: 0;

    backface-visibility: hidden;
}

/* Ön kapak */
.kapak-on {
    background-image: url("kitap_kapagi.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

/* İç kapak / cilt */
.kapak-arka {
    transform: rotateY(180deg);

    background:
        linear-gradient(
            to right,
            #4a2d1d 0,
            #4a2d1d 1cm,
            #d8c08d 1cm,
            #d8c08d 100%
        );

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.18);
}

/* Üst ve alt cilt payları */
.kapak-arka::before {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 1cm;

    background: #4a2d1d;
}

/* Alt cilt payı */
.kapak-arka::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 1cm;

    background: #4a2d1d;
}

/* Açılmış kapak */
.kitap-kapak.acik {
    transform: rotateY(-180deg);
}

</style>
</head>

<body>

<div class="kitap-alani">

    <div
        class="kitap-kapak"
        id="kitapKapak"
    >

        <div class="kapak-on"></div>

        <div class="kapak-arka"></div>

    </div>

</div>

<script>

const kitapKapak = document.getElementById("kitapKapak");

kitapKapak.addEventListener("click", function () {

    kitapKapak.classList.toggle("acik");

});

</script>

</body>
</html>
