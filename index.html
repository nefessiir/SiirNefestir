<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* KITAP SAHNESI */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* ARKA PLAN VE SAYFA AYNI OLCEKTE */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: hidden;
}


/* ARKA PLAN */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* SABIT SAG SAYFA */

.right-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;

    z-index: 2;
}


/* SOL SAYFA */

.left-page {
    position: absolute;

    left: 19%;
    top: 13.2%;

    width: 34%;
    height: 27.5%;

    display: block;

    pointer-events: none;

    transform: scaleX(-1);

    z-index: 2;
}


/* SAYFA OKLARI */

.page-arrow {
    position: absolute;

    top: 50%;
    transform: translateY(-50%);

    width: 45px;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;
    font-family: Arial, sans-serif;

    color: rgba(255, 255, 255, 0.75);

    background: rgba(0, 0, 0, 0.18);

    border-radius: 8px;

    cursor: pointer;

    user-select: none;

    z-index: 10;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
}

.page-arrow:hover {
    color: #fff;
    background: rgba(0, 0, 0, 0.35);
}

.page-arrow:active {
    transform: translateY(-50%) scale(0.94);
}


/* SAG OK */

.next-arrow {
    right: 1.5%;
}


/* SOL OK */

.prev-arrow {
    left: 1.5%;
}


/* ILK SAYFADA SOL OK GIZLI */

.prev-arrow {
    display: none;
}

</style>
</head>

<body>

<div class="page">

    <div class="book-stage">

        <img
            class="book-background"
            src="arkaplan0.jpeg"
            alt="Sair Nefestir"
        >

        <!-- SABIT SAG SAYFA -->

        <img
            class="right-page"
            src="sag_sayfa_bos.png"
            alt=""
        >

        <!-- SOL SAYFA -->

        <img
            class="left-page"
            src="sag_sayfa_bos.png"
            alt=""
        >

        <!-- SAG OK -->

        <div
            class="page-arrow next-arrow"
            onclick="nextPage()"
            aria-label="Sonraki sayfa"
        >
            →
        </div>

        <!-- SOL OK -->

        <div
            class="page-arrow prev-arrow"
            onclick="prevPage()"
            aria-label="Onceki sayfa"
        >
            ←
        </div>

    </div>

</div>


<script>

let currentPage = 1;


/* SONRAKI SAYFA */

function nextPage() {

    currentPage++;

    console.log("Sonraki sayfa:", currentPage);

    updateArrows();
}


/* ONCEKI SAYFA */

function prevPage() {

    if (currentPage <= 1) {
        return;
    }

    currentPage--;

    console.log("Onceki sayfa:", currentPage);

    updateArrows();
}


/* OKLARIN DURUMU */

function updateArrows() {

    const prevArrow = document.querySelector(".prev-arrow");

    if (currentPage <= 1) {
        prevArrow.style.display = "none";
    } else {
        prevArrow.style.display = "flex";
    }
}

</script>

</body>
</html>
