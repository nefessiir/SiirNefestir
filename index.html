<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    margin: auto;

    top: 50%;
    transform: translateY(-50%);

    background-image: url("arkaplan0.jpeg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}


/* =========================
   SAYFALAR
========================= */

.page {
    position: absolute;

    top: 13.2%;

    height: calc(100% - 27.5%);

    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;

    overflow: hidden;

    z-index: 2;
}

.left-page {
    left: 19%;
    width: 34%;

    transform: scaleX(-1);
}

.right-page {
    left: 48.828125%;
    width: 38.411458%;
}


/* =========================
   SAYFA ICERIGI
========================= */

.page-content {
    position: absolute;

    left: 14%;
    top: 11%;

    width: 72%;
    height: 78%;

    overflow: hidden;
}

.left-page .page-content {
    transform: scaleX(-1);
}


/* =========================
   SIIR
========================= */

.poem {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    margin: 0;
    padding: 0;

    color: #174a82;

    font-family: "Caveat", cursive;

    font-size: 11pt;
    font-weight: 500;

    line-height: 1.55;

    direction: ltr;

    text-align: left;

    white-space: pre-wrap;

    word-break: normal;

    overflow-wrap: normal;
}


/*
   Her karakter ayrı span.
   Ancak span kendi başına yeni satır
   oluşturmaz.
*/

.poem-char {
    display: inline;
    white-space: pre;
}


/* =========================
   YAZAN TUY KALEM
========================= */

.writing-quill {
    position: absolute;

    width: 70px;
    height: auto;

    pointer-events: none;

    z-index: 30;

    opacity: 0;

    /*
       Kalemin ucu sağ-alt tarafta.
       Bu nedenle konumlandırmayı buna göre
       yapıyoruz.
    */

    transform-origin: 50% 90%;

    transition:
        left 0.035s linear,
        top 0.035s linear,
        opacity 0.12s ease;
}


/* =========================
   KORNER KALEM
========================= */

.ink-quill {
    position: absolute;

    width: 90px;
    height: auto;

    left: calc(1.5% + 1cm);
    bottom: calc(-1% + 1cm);

    z-index: 10;

    pointer-events: none;
}


/* =========================
   OKLAR
========================= */

.nav-arrow {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 48px;
    height: 48px;

    border: none;

    background: transparent;

    color: rgba(255,255,255,0.55);

    font-size: 42px;

    line-height: 48px;

    cursor: pointer;

    z-index: 50;

    transition:
        color 0.2s ease,
        text-shadow 0.2s ease,
        transform 0.2s ease;
}

.nav-arrow:hover {
    color: #fff;

    text-shadow:
        0 0 6px rgba(255,255,255,0.9),
        0 0 15px rgba(255,255,255,0.8),
        0 0 25px rgba(255,255,255,0.6);

    transform: translateY(-50%) scale(1.08);
}

.left-arrow {
    left: 4%;
}

.right-arrow {
    right: 4%;
}


/* =========================
   UST KONTROLLER
========================= */

.top-controls {
    position: absolute;

    top: 2.5%;
    left: 2.5%;

    z-index: 60;

    display: flex;

    gap: 10px;
}

.control-button {
    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,0.35);

    border-radius: 50%;

    background: rgba(0,0,0,0.22);

    color: rgba(255,255,255,0.75);

    cursor: pointer;

    font-size: 18px;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
}

.control-button:hover {
    background: rgba(0,0,0,0.4);

    color: #fff;

    box-shadow:
        0 0 10px rgba(255,255,255,0.35);
}


/* =========================
   ESITLEYICI
========================= */

.equalizer {
    position: absolute;

    left: 50%;
    bottom: 3%;

    transform: translateX(-50%);

    display: flex;

    align-items: flex-end;

    gap: 4px;

    height: 28px;

    z-index: 40;
}

.equalizer span {
    display: block;

    width: 3px;
    height: 8px;

    background: rgba(255,255,255,0.55);

    border-radius: 2px;
}


/* =========================
   BOS SAYFA
========================= */

.blank-page {
    background-image: url("sag_sayfa_bos.png") !important;
}

</style>

</head>

<body>

</div>

<script>


/* =========================================
   ELEMANLAR
========================================= */

const stage =
    document.getElementById("bookStage");

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const leftPoem =
    document.getElementById("leftPoem");

const rightPoem =
    document.getElementById("rightPoem");

const writingQuill =
    document.getElementById("writingQuill");


/* =========================================
   UZUN TEST SIIRI
========================================= */

const poems = [

{
    title: "Deneme 1",

    text:
`Yoksam düşlerinde
Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor

Bir sessizlik büyüyor
İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor

Ben seni beklerken
Zaman ağır ağır geçiyor
Her geçen gün biraz daha
İçimde büyüyor özlemin

Bir gün dönersin diye
Penceremde ışık yanıyor
Gecenin en sessiz yerinde
Adını fısıldıyor rüzgar

Belki uzaklardasın
Belki hemen yanımdasın
Ama ben yine de seni
Kalbimin içinde arıyorum

Ne zaman gözlerimi kapatsam
Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun

Yoksam düşlerinde
Bir gün hatırla beni
Çünkü ben bu dünyada
Seni beklemek için vardım

Bekle…!
Geliyorum!`
}

];


/* =========================================
   DURUM
========================================= */

let pages = [];

let currentPageIndex = 0;

let typingToken = 0;


/* =========================================
   YAZI GENISLIGI
========================================= */

const measurePoem =
    document.createElement("div");

measurePoem.style.position =
    "absolute";

measurePoem.style.visibility =
    "hidden";

measurePoem.style.pointerEvents =
    "none";

measurePoem.style.fontFamily =
    '"Caveat", cursive';

measurePoem.style.fontSize =
    "11pt";

measurePoem.style.fontWeight =
    "500";

measurePoem.style.lineHeight =
    "1.55";

measurePoem.style.whiteSpace =
    "nowrap";

document.body.appendChild(
    measurePoem
);


function measureTextWidth(text) {

    measurePoem.textContent =
        text;

    return measurePoem
        .getBoundingClientRect()
        .width;
}


/* =========================================
   SATIRLARI OLUSTUR
========================================= */

function getWrappedLines(
    text,
    element
) {

    const availableWidth =
        element
            .getBoundingClientRect()
            .width;

    const rawLines =
        text.split("\n");

    const result = [];

    for (
        const rawLine of rawLines
    ) {

        if (rawLine === "") {

            result.push("");

            continue;
        }

        const words =
            rawLine.split(/\s+/);

        let currentLine = "";

        for (
            const word of words
        ) {

            const testLine =
                currentLine
                    ? currentLine + " " + word
                    : word;

            const testWidth =
                measureTextWidth(
                    testLine
                );

            if (
                testWidth <=
                availableWidth
            ) {

                currentLine =
                    testLine;

            } else {

                if (currentLine) {

                    result.push(
                        currentLine
                    );

                }

                currentLine =
                    word;
            }
        }

        if (currentLine) {

            result.push(
                currentLine
            );
        }
    }

    return result;
}


/* =========================================
   SAYFALARI OLUSTUR
========================================= */

function buildPages(text) {

    const lines =
        getWrappedLines(
            text,
            leftPoem
        );

    const linesPerPage = 9;

    const result = [];

    for (
        let i = 0;
        i < lines.length;
        i += linesPerPage
    ) {

        result.push(
            lines.slice(
                i,
                i + linesPerPage
            )
        );
    }

    return result;
}


/* =========================================
   KARAKTER OLUSTUR
========================================= */

function createCharacter(
    element,
    character
) {

    const span =
        document.createElement(
            "span"
        );

    span.className =
        "poem-char";

    /*
       Bosluklar kaybolmasin diye
       normal text olarak bırakıyoruz.
    */

    span.textContent =
        character;

    element.appendChild(
        span
    );

    return span;
}


/* =========================================
   KALEMİ GERCEK KARAKTER BASLANGICINA
   GOTUR
========================================= */

function moveQuillToCharacter(
    span
) {

    if (!span) {
        return;
    }

    const range =
        document.createRange();

    /*
       Karakterin TAM ONCESİ.
    */

    range.setStart(
        span.firstChild,
        0
    );

    range.collapse(true);

    let rect =
        range.getBoundingClientRect();

    /*
       Bosluk karakterlerinde bazı
       tarayıcılar sıfır genişlik
       verebilir.

       Bu durumda karakter kutusunun
       sol tarafını kullanıyoruz.
    */

    if (
        !rect ||
        rect.height === 0
    ) {

        rect =
            span.getBoundingClientRect();
    }

    const stageRect =
        stage.getBoundingClientRect();

    /*
       Kalemin ucunu yazı hattına
       oturtuyoruz.

       - X = karakterin gerçek solu
       - Y = satırın üstünden kalem
             ucuna kadar olan mesafe
    */

    writingQuill.style.left =
        (
            rect.left -
            stageRect.left -
            8
        ) + "px";

    writingQuill.style.top =
        (
            rect.top -
            stageRect.top -
            52
        ) + "px";

    writingQuill.style.opacity =
        "1";
}


/* =========================================
   KARAKTERI YAZ
========================================= */

function typeCharacter(
    element,
    character,
    token
) {

    return new Promise(resolve => {

        if (
            token !==
            typingToken
        ) {

            resolve();

            return;
        }

        /*
           Önce karakterin spanını
           oluşturuyoruz.
        */

        const span =
            createCharacter(
                element,
                character
            );

        /*
           Kalem tam olarak bu
           karakterin önüne geliyor.
        */

        moveQuillToCharacter(
            span
        );

        /*
           Karakterin görünmesi için
           çok kısa bekleme.
        */

        setTimeout(
            resolve,
            45
        );

    });
}


/* =========================================
   METNI KARAKTER KARAKTER YAZ
========================================= */

async function typeText(
    element,
    text,
    token
) {

    element.innerHTML = "";

    writingQuill.style.opacity =
        "0";

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        if (
            token !==
            typingToken
        ) {

            return;
        }

        await typeCharacter(
            element,
            text[i],
            token
        );
    }

    /*
       Son harften sonra kalem
       hemen kaybolmasın.
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                300
            )
    );

    if (
        token ===
        typingToken
    ) {

        writingQuill.style.opacity =
            "0";
    }
}


/* =========================================
   SAYFAYA YAZ
========================================= */

async function writePage(
    element,
    lines,
    token
) {

    const text =
        lines.join("\n");

    await typeText(
        element,
        text,
        token
    );
}


/* =========================================
   SIIRI BASLAT
========================================= */

async function startPoem() {

    typingToken++;

    const token =
        typingToken;

    const poem =
        poems[0];

    pages =
        buildPages(
            poem.text
        );

    currentPageIndex = 0;

    leftPage.classList.remove(
        "blank-page"
    );

    rightPage.classList.remove(
        "blank-page"
    );

    leftPoem.innerHTML = "";
    rightPoem.innerHTML = "";

    /*
       İlk sayfa sol.
    */

    await writePage(
        leftPoem,
        pages[0] || [],
        token
    );

    if (
        token !==
        typingToken
    ) {

        return;
    }

    /*
       İkinci sayfa sağ.
    */

    await writePage(
        rightPoem,
        pages[1] || [],
        token
    );
}


/* =========================================
   SONRAKI SAYFA
========================================= */

async function nextPage() {

    typingToken++;

    writingQuill.style.opacity =
        "0";

    /*
       Devam eden sayfalar varsa
       sağdaki sola geçer.
    */

    if (
        currentPageIndex + 2 <
        pages.length
    ) {

        const token =
            typingToken;

        leftPoem.style.opacity =
            "0";

        rightPoem.style.opacity =
            "0";

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    250
                )
        );

        currentPageIndex++;

        leftPoem.innerHTML = "";
        rightPoem.innerHTML = "";

        leftPage.classList.remove(
            "blank-page"
        );

        rightPage.classList.remove(
            "blank-page"
        );

        leftPoem.style.opacity =
            "1";

        rightPoem.style.opacity =
            "1";

        await writePage(
            leftPoem,
            pages[
                currentPageIndex
            ] || [],
            token
        );

        if (
            token !==
            typingToken
        ) {

            return;
        }

        await writePage(
            rightPoem,
            pages[
                currentPageIndex + 1
            ] || [],
            token
        );

        return;
    }

    /*
       Siir tamamen bittiyse
       gizli resim kesinlikle görünmeyecek.

       Sayfa görseli korunuyor,
       sadece şiir kaldırılıyor.
    */

    await showBlankPage();
}


/* =========================================
   BOS SAYFA
========================================= */

async function showBlankPage() {

    typingToken++;

    writingQuill.style.opacity =
        "0";

    leftPoem.style.opacity =
        "0";

    rightPoem.style.opacity =
        "0";

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                250
            )
    );

    leftPoem.innerHTML = "";
    rightPoem.innerHTML = "";

    /*
       Sayfa arka planı korunuyor.
       Böylece arkaplan0.jpeg altında
       bulunan başka bir görsel açığa
       çıkmıyor.
    */

    leftPage.classList.add(
        "blank-page"
    );

    rightPage.classList.add(
        "blank-page"
    );

    leftPoem.style.opacity =
        "1";

    rightPoem.style.opacity =
        "1";
}


/* =========================================
   ONCEKI SAYFA
========================================= */

function previousPage() {

    typingToken++;

    writingQuill.style.opacity =
        "0";

    if (
        currentPageIndex <= 0
    ) {

        return;
    }

    currentPageIndex--;

    leftPage.classList.remove(
        "blank-page"
    );

    rightPage.classList.remove(
        "blank-page"
    );

    leftPoem.innerHTML = "";
    rightPoem.innerHTML = "";

    leftPoem.style.opacity =
        "1";

    rightPoem.style.opacity =
        "1";

    const token =
        typingToken;

    writePage(
        leftPoem,
        pages[
            currentPageIndex
        ] || [],
        token
    );

    writePage(
        rightPoem,
        pages[
            currentPageIndex + 1
        ] || [],
        token
    );
}


/* =========================================
   TAM EKRAN
========================================= */

function toggleFullscreen() {

    if (
        !document.fullscreenElement
    ) {

        document.documentElement
            .requestFullscreen()
            .catch(() => {});

    } else {

        document
            .exitFullscreen();
    }
}


/* =========================================
   BASLANGIC
========================================= */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                startPoem();

            },
            500
        );

    }
);

</script>
