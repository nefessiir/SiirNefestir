<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<link
href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* =================================================
   KITAP SAHNESI
   ================================================= */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* =================================================
   ARKA PLAN VE SAYFA AYNI OLCEKTE
   ================================================= */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: visible;
}


/* =================================================
   ARKA PLAN
   ================================================= */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* =================================================
   SABIT SAG SAYFA
   ================================================= */

.right-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;

    z-index: 2;
}


/* =================================================
   SABIT SOL SAYFA
   ================================================= */

.left-page {
    position: absolute;

    left: 19%;
    top: 13.2%;

    width: 34%;
    height: calc(100% - 27.5%);

    display: block;

    pointer-events: none;

    transform: scaleX(-1);

    z-index: 2;
}


/* =================================================
   SIIR METINLERI
   ================================================= */

.poem-text {
    position: absolute;

    top: 23%;
    width: 25%;
    height: 61%;

    z-index: 5;

    color: #174a82;

    font-family:
        "Caveat",
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size: clamp(17px, 1.35vw, 23px);

    font-weight: 500;

    line-height: 1.55;

    letter-spacing: 0.01em;

    white-space: pre-line;

    overflow: hidden;

    text-shadow:
        0.2px 0.2px 0 rgba(23, 74, 130, 0.22);

    opacity: 1;

    transition:
        opacity 1.2s ease;
}


/* =================================================
   SOL SIIR
   ================================================= */

.left-poem {
    left: 23%;
    text-align: left;
}


/* =================================================
   SAG SIIR
   ================================================= */

.right-poem {
    left: 53%;
    text-align: left;
}


/* =================================================
   SAYFA GECISINDE SILINME
   ================================================= */

.poem-text.fade-out {
    opacity: 0;
}


/* =================================================
   SOL ALTTAKI SABIT KALEM + MUREKKEP

   ONCEKI:
   +2 CM SAG
   +2 CM YUKARI

   SIMDI:
   1 CM SOL
   1 CM ASAGI
   ================================================= */

.corner-quill {
    position: absolute;

    left: calc(1.5% + 1cm);

    bottom: calc(-1% + 1cm);

    width: 140px;
    height: auto;

    z-index: 6;

    pointer-events: none;
    user-select: none;

    opacity: 0.96;
}


/* =================================================
   YAZIYI YAZAN ALTIN TUY KALEM
   ================================================= */

.writing-quill {
    position: absolute;

    width: 78px;
    height: auto;

    z-index: 10;

    pointer-events: none;
    user-select: none;

    opacity: 0;

    transform-origin: 8% 88%;

    transition:
        left 0.08s linear,
        top 0.08s linear,
        opacity 0.25s ease;
}


/* =================================================
   SAG OK
   ================================================= */

.page-arrow {
    position: absolute;

    top: 50%;
    left: 88%;

    width: 30px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255, 255, 255, 0.72);

    font-family: Arial, sans-serif;

    font-size: 38px;
    font-weight: 300;

    line-height: 1;

    cursor: pointer;
    user-select: none;

    z-index: 20;

    transform: translateY(-50%);

    text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.8);

    transition:
        color 0.25s ease,
        transform 0.25s ease,
        text-shadow 0.25s ease;
}


/* =================================================
   OK UZERINE GELINCE
   ================================================= */

.page-arrow:hover {

    color: rgba(255, 255, 255, 0.95);

    transform:
        translateY(-50%)
        scale(1.08);

    text-shadow:
        0 0 7px rgba(255, 255, 255, 0.45),
        0 1px 4px rgba(0, 0, 0, 0.8);
}


/* =================================================
   OKA BASILDIGINDA PARLAMA
   ================================================= */

.page-arrow.flash {

    animation:
        arrowFlash 0.55s ease;
}


@keyframes arrowFlash {

    0% {

        color:
            rgba(255, 255, 255, 0.72);

        text-shadow:
            0 1px 3px rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1);
    }


    35% {

        color: #ffffff;

        text-shadow:
            0 0 5px rgba(255, 255, 255, 0.65),
            0 0 12px rgba(255, 255, 255, 0.45),
            0 1px 4px rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1.16);
    }


    100% {

        color:
            rgba(255, 255, 255, 0.72);

        text-shadow:
            0 1px 3px rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1);
    }

}


/* =================================================
   ANIMASYON SIRASINDA OK KAPALI
   ================================================= */

.page-arrow.disabled {
    pointer-events: none;
    opacity: 0.35;
}


/* =================================================
   GIZLI OLCUM ALANI

   SADECE SATIR OLCECEGI ICIN KULLANILIR.
   SAYFA YUKSEKLIGI BURADA SINIRLANMAZ.
   ================================================= */

.measure-poem {
    position: absolute;

    visibility: hidden;

    pointer-events: none;

    left: -99999px;
    top: 0;

    height: auto;

    overflow: visible;

    white-space: pre-line;
}

</style>
</head>


<body>

<div class="page">

    <div class="book-stage">


        <!-- ARKA PLAN -->

        <img
            class="book-background"
            src="arkaplan0.jpeg"
            alt="Sair Nefestir"
        >


        <!-- SABIT SAG SAYFA -->

        <img
            class="right-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- SABIT SOL SAYFA -->

        <img
            class="left-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- SOL ALTTA SABIT KALEM + MUREKKEP -->

        <img
            class="corner-quill"
            src="murekkep_kalem.png"
            alt=""
        >


        <!-- YAZIYI YAZAN ALTIN TUY KALEM -->

        <img
            id="writingQuill"
            class="writing-quill"
            src="yazan_kalem3.png"
            alt=""
        >


        <!-- SOL SIIR -->

        <div
            id="leftPoem"
            class="poem-text left-poem"
        ></div>


        <!-- SAG SIIR -->

        <div
            id="rightPoem"
            class="poem-text right-poem"
        ></div>


        <!-- GIZLI OLCUM ALANI -->

        <div
            id="measurePoem"
            class="measure-poem"
        ></div>


        <!-- SAG OK -->

        <div
            id="pageArrow"
            class="page-arrow"
        >
            ›
        </div>


    </div>

</div>


<script>


/* =================================================
   DEMO SIIR
   ================================================= */

const poems = [

`Haydi Abbas, vakit tamam;
Akşam diyordun işte oldu akşam.
Kur bakalım çilingir soframızı;
Dinsin artık bu kalb ağrısı.
Şu ağacın gölgesinde olsun;
Tam kenarında havuzun.
Aya haber sal çıksın bu gece;
Görünsün şöyle gönlümce.
Bas kırbacı sihirli seccadeye,
Göster hükmettiğini mesafeye
Ve zamana.
Katıp tozu dumana,
Var git,
Böyle ferman etti Cahit,
Al getir ilk sevgiliyi Beşiktaş'tan;
Yaşamak istiyorum gençliğimi yeni baştan.`

];


/* =================================================
   ELEMANLAR
   ================================================= */

const leftPoem =
    document.getElementById("leftPoem");

const rightPoem =
    document.getElementById("rightPoem");

const measurePoem =
    document.getElementById("measurePoem");

const pageArrow =
    document.getElementById("pageArrow");

const writingQuill =
    document.getElementById("writingQuill");

const bookStage =
    document.querySelector(".book-stage");


/* =================================================
   DURUM
   ================================================= */

let poemIndex = 0;

let spreadParts = [];

let currentPart = 0;

let activeTypingToken = 0;

let activeTypingFinished = true;

let isAnimating = false;


/* =================================================
   OLCEK ALANINI SIIR ALANIYLA AYNI YAP
   ================================================= */

function prepareMeasureArea() {

    const style =
        window.getComputedStyle(leftPoem);

    measurePoem.style.fontFamily =
        style.fontFamily;

    measurePoem.style.fontSize =
        style.fontSize;

    measurePoem.style.fontWeight =
        style.fontWeight;

    measurePoem.style.lineHeight =
        style.lineHeight;

    measurePoem.style.letterSpacing =
        style.letterSpacing;

    measurePoem.style.width =
        leftPoem.getBoundingClientRect().width + "px";
}


/* =================================================
   SATIR YUKSEKLIGI
   ================================================= */

function getLineHeight() {

    const style =
        window.getComputedStyle(leftPoem);

    const fontSize =
        parseFloat(style.fontSize);

    const lineHeight =
        parseFloat(style.lineHeight);

    return fontSize * lineHeight;
}


/* =================================================
   SAYFAYA SIGABILECEK SATIR SAYISI
   ================================================= */

function getLinesPerPage() {

    const lineHeight =
        getLineHeight();

    const pageHeight =
        leftPoem.getBoundingClientRect().height;

    return Math.max(
        1,
        Math.floor(
            pageHeight / lineHeight
        )
    );
}


/* =================================================
   BIR METNIN GERCEK YUKSEKLIGINI OLC
   ================================================= */

function getMeasuredHeight(text) {

    prepareMeasureArea();

    measurePoem.innerText = text;

    return measurePoem.getBoundingClientRect().height;
}


/* =================================================
   METNI GERCEK SATIRLARA AYIR
   ================================================= */

function getWrappedLines(text) {

    prepareMeasureArea();

    const lines = [];

    const paragraphs =
        text.split("\n");

    for (
        let p = 0;
        p < paragraphs.length;
        p++
    ) {

        const paragraph =
            paragraphs[p];


        /* BOS SATIR */

        if (paragraph === "") {

            lines.push("");

            continue;
        }


        const words =
            paragraph.split(" ");

        let currentLine = "";


        for (
            let w = 0;
            w < words.length;
            w++
        ) {

            const word =
                words[w];

            const testLine =
                currentLine
                ? currentLine + " " + word
                : word;


            const testHeight =
                getMeasuredHeight(testLine);

            const lineHeight =
                getLineHeight();


            /* TEK SATIR SINIRI */

            if (
                testHeight > lineHeight * 1.15
            ) {

                if (currentLine) {

                    lines.push(
                        currentLine
                    );

                    currentLine =
                        word;

                } else {

                    lines.push(
                        word
                    );

                    currentLine = "";
                }

            } else {

                currentLine =
                    testLine;
            }
        }


        if (currentLine) {

            lines.push(
                currentLine
            );
        }
    }


    return lines;
}


/* =================================================
   SIIRI SOL VE SAG SAYFAYA DAGIT
   ================================================= */

function createSpreadParts(text) {

    const lines =
        getWrappedLines(text);

    const linesPerPage =
        getLinesPerPage();

    const parts = [];

    let index = 0;


    while (
        index < lines.length
    ) {

        const leftLines =
            lines.slice(
                index,
                index + linesPerPage
            );

        index +=
            linesPerPage;


        const rightLines =
            lines.slice(
                index,
                index + linesPerPage
            );

        index +=
            linesPerPage;


        parts.push({

            left:
                leftLines.join("\n"),

            right:
                rightLines.join("\n")
        });
    }


    if (
        parts.length === 0
    ) {

        parts.push({

            left: "",

            right: ""
        });
    }


    return parts;
}


/* =================================================
   YAZAN TUY KALEM POZISYONU

   YAZIYA 1 PX DAHA YAKIN
   ================================================= */

function moveWritingQuill(element) {

    if (!element) {
        return;
    }


    const textNode =
        element.firstChild;


    if (
        !textNode ||
        textNode.nodeType !== Node.TEXT_NODE ||
        textNode.length === 0
    ) {

        return;
    }


    try {

        const range =
            document.createRange();


        range.setStart(
            textNode,
            textNode.length - 1
        );


        range.setEnd(
            textNode,
            textNode.length
        );


        const rect =
            range.getBoundingClientRect();


        const stageRect =
            bookStage.getBoundingClientRect();


        writingQuill.style.left =
            (
                rect.right -
                stageRect.left -
                11
            ) + "px";


        writingQuill.style.top =
            (
                rect.bottom -
                stageRect.top -
                54
            ) + "px";

    }

    catch (error) {

        console.log(
            "Kalem konumu hesaplanamadi."
        );
    }
}


/* =================================================
   METNI HARF HARF YAZ
   ================================================= */

function typeText(
    element,
    text,
    token
) {

    return new Promise(
        resolve => {

            element.innerText = "";


            if (!text) {

                resolve();

                return;
            }


            let index = 0;

            activeTypingFinished =
                false;

            writingQuill.style.opacity =
                "1";


            function writeNext() {


                /* ESKI YAZMA ISLEMI IPTAL */

                if (
                    token !==
                    activeTypingToken
                ) {

                    resolve();

                    return;
                }


                /* METIN BITTI */

                if (
                    index >=
                    text.length
                ) {

                    writingQuill.style.opacity =
                        "0";

                    resolve();

                    return;
                }


                /* HARFI YAZ */

                element.innerText +=
                    text.charAt(index);


                /* KALEMI YAZININ UCUNA GOTUR */

                moveWritingQuill(
                    element
                );


                index++;


                setTimeout(
                    writeNext,
                    55
                );
            }


            writeNext();

        }
    );
}


/* =================================================
   BIR KITAP ACILIMINI YAZ
   ================================================= */

async function typeSpread(spread) {

    const token =
        ++activeTypingToken;

    activeTypingFinished =
        false;


    leftPoem.innerText =
        "";

    rightPoem.innerText =
        "";


    writingQuill.style.opacity =
        "0";


    /* =================================================
       SOL SAYFA
       ================================================= */

    await typeText(
        leftPoem,
        spread.left,
        token
    );


    if (
        token !==
        activeTypingToken
    ) {

        return;
    }


    /* =================================================
       SAG SAYFA
       ================================================= */

    await typeText(
        rightPoem,
        spread.right,
        token
    );


    if (
        token !==
        activeTypingToken
    ) {

        return;
    }


    /* =================================================
       TAMAMLANDI
       ================================================= */

    activeTypingFinished =
        true;

    writingQuill.style.opacity =
        "0";
}


/* =================================================
   ILK SIIRI BASLAT
   ================================================= */

async function startPoem(index) {

    poemIndex =
        index;


    spreadParts =
        createSpreadParts(
            poems[poemIndex]
        );


    currentPart =
        0;


    leftPoem.classList.remove(
        "fade-out"
    );


    rightPoem.classList.remove(
        "fade-out"
    );


    await typeSpread(
        spreadParts[currentPart]
    );
}


/* =================================================
   SONRAKI SAYFA
   ================================================= */

async function nextPage() {


    if (isAnimating) {
        return;
    }


    if (!activeTypingFinished) {
        return;
    }


    isAnimating =
        true;


    pageArrow.classList.add(
        "disabled"
    );


    pageArrow.classList.remove(
        "flash"
    );


    void pageArrow.offsetWidth;


    pageArrow.classList.add(
        "flash"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                120
            )
    );


    /* SAYFALARI SOLUKLASTIR */

    leftPoem.classList.add(
        "fade-out"
    );


    rightPoem.classList.add(
        "fade-out"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1200
            )
    );


    /* =================================================
       AYNI SIIRIN DEVAMI
       ================================================= */

    if (
        currentPart <
        spreadParts.length - 1
    ) {

        currentPart++;


        leftPoem.classList.remove(
            "fade-out"
        );


        rightPoem.classList.remove(
            "fade-out"
        );


        await typeSpread(
            spreadParts[currentPart]
        );


        isAnimating =
            false;


        pageArrow.classList.remove(
            "disabled"
        );


        return;
    }


    /* =================================================
       YENI SIIR
       ================================================= */

    if (
        poemIndex <
        poems.length - 1
    ) {

        poemIndex++;


        spreadParts =
            createSpreadParts(
                poems[poemIndex]
            );


        currentPart =
            0;


        leftPoem.classList.remove(
            "fade-out"
        );


        rightPoem.classList.remove(
            "fade-out"
        );


        await typeSpread(
            spreadParts[currentPart]
        );


        isAnimating =
            false;


        pageArrow.classList.remove(
            "disabled"
        );


        return;
    }


    /* =================================================
       SON SIIR
       ================================================= */

    leftPoem.classList.remove(
        "fade-out"
    );


    rightPoem.classList.remove(
        "fade-out"
    );


    isAnimating =
        false;


    pageArrow.classList.remove(
        "disabled"
    );
}


/* =================================================
   OK TIKLAMA
   ================================================= */

pageArrow.addEventListener(
    "click",
    nextPage
);


/* =================================================
   PENCERE BOYUTU DEGISTIGINDE
   ================================================= */

window.addEventListener(
    "resize",
    () => {

        if (
            !leftPoem.clientHeight
        ) {

            return;
        }


        spreadParts =
            createSpreadParts(
                poems[poemIndex]
            );


        if (
            currentPart >=
            spreadParts.length
        ) {

            currentPart =
                spreadParts.length - 1;
        }
    }
);


/* =================================================
   KITAP TAM HAZIR OLDUGUNDA BASLAT
   ================================================= */

function initializeBook() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    if (
                        !leftPoem.clientHeight
                    ) {

                        setTimeout(
                            initializeBook,
                            200
                        );

                        return;
                    }


                    prepareMeasureArea();


                    startPoem(0);

                }
            );
        }
    );
}


/* =================================================
   BASLANGIC
   ================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initializeBook
    );

} else {

    initializeBook();
}

</script>

</body>
</html>
