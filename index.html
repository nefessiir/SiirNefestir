<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* KITAP SAHNESI */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* ARKA PLAN VE SAYFA AYNI OLCEKTE */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: visible;
}


/* ARKA PLAN */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* SABIT SAG SAYFA */

.right-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;

    z-index: 2;
}


/* SABIT SOL SAYFA */

.left-page {
    position: absolute;

    left: 19%;
    top: 13.2%;

    width: 34%;
    height: calc(100% - 27.5%);

    display: block;

    pointer-events: none;

    transform: scaleX(-1);

    z-index: 2;
}


/* SIIR METINLERI */

.poem-text {
    position: absolute;

    top: 23%;
    width: 25%;

    height: 61%;

    z-index: 5;

    color: #174a82;

    font-family:
        "Caveat",
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size: clamp(18px, 1.55vw, 27px);

    font-weight: 500;

    line-height: 1.85;

    letter-spacing: 0.01em;

    white-space: pre-line;

    overflow: hidden;

    text-shadow:
        0.25px 0.25px 0 rgba(23, 74, 130, 0.35);

    opacity: 1;

    transition:
        opacity 1.2s ease;
}


/* SOL SIIR */

.left-poem {
    left: 23%;

    text-align: left;
}


/* SAG SIIR */

.right-poem {
    left: 53%;

    text-align: left;
}


/* SIIR KAYBOLURKEN */

.poem-text.fade-out {
    opacity: 0;
}


/* SAG OK */

.page-arrow {
    position: absolute;

    top: 50%;
    left: 88%;

    width: 30px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255, 255, 255, 0.85);

    font-family: Arial, sans-serif;

    font-size: 38px;
    font-weight: 300;

    line-height: 1;

    cursor: pointer;
    user-select: none;

    z-index: 20;

    transform: translateY(-50%);

    text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.8);

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.page-arrow:hover {
    color: #fff;
}


/* OK ANIMASYON SIRASINDA */

.page-arrow.disabled {
    pointer-events: none;

    opacity: 0.35;
}


/* GIZLI OLCUM ALANI */

.measure-poem {
    position: absolute;

    visibility: hidden;

    pointer-events: none;

    left: -99999px;
    top: 0;

    white-space: pre-line;

    overflow: hidden;
}

</style>
</head>


<body>

<div class="page">

    <div class="book-stage">

        <!-- ARKA PLAN -->

        <img
            class="book-background"
            src="arkaplan0.jpeg"
            alt="Sair Nefestir"
        >


        <!-- SABIT SAG SAYFA -->

        <img
            class="right-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- SABIT SOL SAYFA -->

        <img
            class="left-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- SOL SIIR -->

        <div
            id="leftPoem"
            class="poem-text left-poem"
        ></div>


        <!-- SAG SIIR -->

        <div
            id="rightPoem"
            class="poem-text right-poem"
        ></div>


        <!-- SAG OK -->

        <div
            id="nextArrow"
            class="page-arrow next-arrow"
            aria-label="Siirin devamini goster"
        >
            ›
        </div>

    </div>

</div>


<script>

/* =========================================
   DEMO SIIR
   ========================================= */

const poems = [

`Haydi Abbas, vakit tamam;
Akşam diyordun işte oldu akşam.
Kur bakalım çilingir soframızı;
Dinsin artık bu kalb ağrısı.
Şu ağacın gölgesinde olsun;
Tam kenarında havuzun.
Aya haber sal çıksın bu gece;
Görünsün şöyle gönlümce.
Bas kırbacı sihirli seccadeye,
Göster hükmettiğini mesafeye
Ve zamana.
Katıp tozu dumana,
Var git,
Böyle ferman etti Cahit,
Al getir ilk sevgiliyi Beşiktaş'tan;
Yaşamak istiyorum gençliğimi yeni baştan.`

];


/* =========================================
   ELEMENTLER
   ========================================= */

const leftPoem =
    document.getElementById("leftPoem");

const rightPoem =
    document.getElementById("rightPoem");

const nextArrow =
    document.getElementById("nextArrow");


/* =========================================
   DURUM
   ========================================= */

let poemIndex = 0;

let pages = [];

let currentSpread = 0;

let isAnimating = false;


/* =========================================
   SAYFA OLCUMU
   ========================================= */

function createMeasureElement(sourceElement) {

    const measure =
        document.createElement("div");

    measure.className =
        "measure-poem";

    const styles =
        window.getComputedStyle(sourceElement);

    measure.style.width =
        styles.width;

    measure.style.height =
        styles.height;

    measure.style.fontFamily =
        styles.fontFamily;

    measure.style.fontSize =
        styles.fontSize;

    measure.style.fontWeight =
        styles.fontWeight;

    measure.style.lineHeight =
        styles.lineHeight;

    measure.style.letterSpacing =
        styles.letterSpacing;

    measure.style.whiteSpace =
        styles.whiteSpace;

    measure.style.textShadow =
        styles.textShadow;

    document.body.appendChild(measure);

    return measure;
}


/* =========================================
   BIR PARCANIN SAYFAYA SIGIP SIGMADIGI
   ========================================= */

function fitsOnPage(
    text,
    sourceElement,
    measureElement
) {

    measureElement.textContent = text;

    return (
        measureElement.scrollHeight <=
        sourceElement.clientHeight + 1
    );
}


/* =========================================
   SIIRI SAYFALARA BOL
   ========================================= */

function paginatePoem(poem) {

    const lines =
        poem.split("\n");

    const measure =
        createMeasureElement(leftPoem);

    const result = [];

    let currentText = "";


    for (let i = 0; i < lines.length; i++) {

        const line =
            lines[i];

        const candidate =
            currentText === ""
                ? line
                : currentText + "\n" + line;


        /*
         * Yeni satir sayfaya sigiyorsa ekle.
         */

        if (
            fitsOnPage(
                candidate,
                leftPoem,
                measure
            )
        ) {

            currentText =
                candidate;

            continue;
        }


        /*
         * Sayfa doldu.
         * Onceki parcayi kaydet.
         */

        if (currentText !== "") {

            result.push(
                currentText
            );

            currentText = line;

        } else {

            /*
             * Tek bir satir normalden
             * daha uzun olsa bile kaybolmasin.
             */

            result.push(line);

            currentText = "";
        }
    }


    /*
     * Son kalan parcayi ekle.
     */

    if (currentText !== "") {

        result.push(
            currentText
        );
    }


    measure.remove();

    return result;
}


/* =========================================
   BUTUN SIIRLERI SAYFALANDIR
   ========================================= */

function buildPages() {

    pages = [];


    poems.forEach(function(poem) {

        const chunks =
            paginatePoem(poem);


        /*
         * Her siir MUTLAKA sol sayfadan baslar.
         *
         * Ilk parca -> sol
         * Ikinci parca -> sag
         *
         * Sonraki parcalar yeni spread'e gider.
         */

        for (
            let i = 0;
            i < chunks.length;
            i += 2
        ) {

            pages.push({

                left:
                    chunks[i] || "",

                right:
                    chunks[i + 1] || "",

                poemIndex:
                    poems.indexOf(poem)

            });
        }

    });
}


/* =========================================
   SAYFAYI GOSTER
   ========================================= */

function showSpread(index) {

    if (
        !pages[index]
    ) {
        return;
    }


    leftPoem.textContent =
        pages[index].left;

    rightPoem.textContent =
        pages[index].right;
}


/* =========================================
   ILK SAYFA
   ========================================= */

async function initializeBook() {

    /*
     * Web font tamamen yuklenmeden
     * olcum yapmiyoruz.
     */

    if (
        document.fonts &&
        document.fonts.ready
    ) {

        await document.fonts.ready;
    }


    /*
     * Tarayicinin gercek boyutlari
     * hesaplamasi icin bir frame bekle.
     */

    requestAnimationFrame(function() {

        buildPages();

        currentSpread = 0;

        showSpread(currentSpread);

    });
}


/* =========================================
   OK
   ========================================= */

nextArrow.addEventListener(
    "click",
    function() {

        if (isAnimating) {
            return;
        }


        /*
         * Gidecek baska sayfa yoksa
         * hicbir sey yapma.
         */

        if (
            currentSpread >=
            pages.length - 1
        ) {

            return;
        }


        isAnimating = true;

        nextArrow.classList.add(
            "disabled"
        );


        /*
         * ONCE IKISINI DE YAVASCA YOK ET
         */

        leftPoem.classList.add(
            "fade-out"
        );

        rightPoem.classList.add(
            "fade-out"
        );


        /*
         * KAYBOLMA TAMAMLANDIGINDA
         * YENI SAYFAYI YERLESTIR
         */

        setTimeout(function() {

            currentSpread++;

            showSpread(
                currentSpread
            );


            /*
             * SONRA TEKRAR GORUNUR YAP
             */

            leftPoem.classList.remove(
                "fade-out"
            );

            rightPoem.classList.remove(
                "fade-out"
            );


            setTimeout(function() {

                isAnimating = false;

                nextArrow.classList.remove(
                    "disabled"
                );

            }, 1200);

        }, 1200);

    }
);


/* =========================================
   BASLAT
   ========================================= */

initializeBook();

</script>

</body>
</html>
