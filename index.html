<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* KİTAP KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. SAĞDA SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTAP GÖVDESİ */
.acik-kitap-alan {
    position: absolute;
    top: 0.5cm;
    left: calc(-100% - 0.6cm);
    width: calc(200% - 1.3cm);
    height: calc(100% - 1cm);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.1882);
    transform-origin: left center;
    clip-path: inset(0 0 0 100%);
    transition: opacity 0.8s ease-in-out, clip-path 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.kitap-kapsayici.acildi .acik-kitap-alan {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transition: opacity 0.4s ease-in-out 0.6s, clip-path 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) 0.6s;
}

.acik-kitap-alan img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTABIN SOL KANAT YAZI ALANI (1. Sayfa) */
.sol-kanat-yazi {
    position: absolute;
    top: 0.4cm;
    left: calc(0.75cm + 0.3cm + 1cm);
    width: calc(50% - 2.5cm);
    height: calc(100% - 0.8cm);
    font-family: 'Dancing Script', cursive, serif;
    font-size: 9.5pt;
    line-height: 1.25;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 3px rgba(26, 75, 130, 0.35), 0 0 1px rgba(26, 75, 130, 0.6);
    box-sizing: border-box;
    pointer-events: none;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    hyphens: none;
    white-space: pre-wrap;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.sol-kanat-yazi.goster {
    opacity: 1;
}

/* BAŞLIKLARIN ORTALANMASI VE BÜYÜTÜLMESİ */
.sayfa-baslik {
    text-align: center;
    display: block;
    width: 100%;
    font-weight: 700;
    font-size: 1.15em;
    margin-top: 0.5em;
    margin-bottom: 0.2em;
}

/* SAYFA NUMARASI STİLİ */
.sayfa-numara {
    position: absolute;
    bottom: 0.4cm;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Dancing Script', cursive, serif;
    font-size: 10pt;
    color: #1a4b82;
    text-shadow: 0 0 2px rgba(26, 75, 130, 0.3);
    pointer-events: none;
    letter-spacing: 2px;
}

/* ÇOKLU SAYFA KONTEYNERİ */
.sayfalar-kapsayici {
    position: absolute;
    top: 0.5cm;
    left: 0;
    width: 100%;
    height: calc(100% - 1cm);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sayfalar-kapsayici {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.3s ease-in-out 1.1s;
}

/* HER BİR YAPRAK */
.sayfa-yaprak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.0s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
}

.sayfa-yaprak.cevirdi {
    transform: rotateY(-180deg);
}

/* Sayfa İçerik Boyutu */
.sayfa-icerik {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% - 1.5cm);
    height: 100%;
    transform-style: preserve-3d;
}

.sayfa-on,
.sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sayfa-on img,
.sayfa-arka img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.sayfa-arka {
    transform: rotateY(180deg);
}

/* SAYFA İÇİ YAZILAR */
.sayfa-yazi {
    position: absolute;
    top: 0.3cm;
    left: 0.3cm;
    width: calc(100% - 0.6cm);
    height: calc(100% - 1.1cm);
    font-family: 'Dancing Script', cursive, serif;
    line-height: 1.3;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 3px rgba(26, 75, 130, 0.35), 0 0 1px rgba(26, 75, 130, 0.6);
    box-sizing: border-box;
    pointer-events: none;
    backface-visibility: hidden;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    hyphens: none;
    white-space: pre-wrap;
    font-size: 10.5pt;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.sayfa-yazi.goster {
    opacity: 1;
}

/* ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 2.0s ease-in-out;
    z-index: 30;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
    z-index: 1;
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<div class="kitap-kapsayici" id="kitapKapsayici">

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg" alt="Alt Kapak">
    </div>

    <!-- AÇIK KİTAP GÖVDESİ -->
    <div class="acik-kitap-alan" id="acikKitapAlan">
        <img src="acik_kitap1.png" alt="Açık Kitap Gövdesi">

        <!-- Sabit Sol Kanat Yazı Alanı (1. Sayfa) -->
        <div class="sol-kanat-yazi" id="solKanatYazi"></div>

        <div class="sayfa-numara">1</div>
    </div>

    <!-- DİNAMİK YAPRAKLAR KONTEYNERİ -->
    <div class="sayfalar-kapsayici" id="sayfalarKapsayici"></div>

    <!-- ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">

        <img src="kapak.jpg" class="kapak" alt="Ön Kapak">

        <div class="kapak-yazi">
            Şiir'e hatıra.<br><br>
            kelimelerden..<br>
            hayattan..<br>
            Babasından.<br><br><br>

            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak" alt="Arka Kapak">

    </div>

</div>

<script>
window.addEventListener("load", function () {

    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const sayfalarKapsayici = document.getElementById("sayfalarKapsayici");
    const solKanatYazi = document.getElementById("solKanatYazi");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;

    kapsayici.style.transform =
        "translateX(8cm) scale(" + oran + ")";


    /* =========================================================
       METİNLER
       ========================================================= */

    const girisBaslik = "KIZIM'a…\n\n";

    const girisMetin =
`Sevgili Şiir,
Bu satırları belki bir gün yüzümüzde bir tebessümle beraber okuyacağız..
belki de .. gözlerinden akmamaya inat eden bir damla gözyaşı ile
ama yine de gülümseyerek tek başına okuyacaksın.
Sonuçta yine ,  güldüğünde yanaklarında beliren ve görmeyi en çok sevdiğim gamzelerini göreceğim... nerede olduğumun bir önemi yok.`;

    const siirMetni =
`Bilmeni isterim ki;
Ben bu şiirleri birilerine bir şey anlatmak için değil,
içimde kopan fırtınaları , bir yağmur misali kağıda dökmek için yazdım.
Ve bazılarını yıllar sonra sen bul diye sakladım. Çünkü ben buldum.

Sana bırakabileceğim hatıralar arasından biri de , bu şiirlerim.
Ve bu şiirleri benim sesimden duymak isteyebileceğini düşündüm..
Ben çok isterdim..
Bir gün bu sayfalarda kendinden bir parça bulursan, bil ki ,
o şiir senden önce yazılmış olsa bile, sana aittir.
Çünkü sen benim , yani bu kocaman gövdenin altındaki çelimsiz çocuğun ,
beklediği yaşama sebebisin.

Çünkü sen benim , yazdığım en güzel şiirsin...

Beni hep gülen gözlerle ve sana deliler gibi aşık bir kalple hatırla…

Hasretle gamzelerinden ve o küçük çenenden öperim.

Baban.`;

    solKanatYazi.innerHTML =
        `<span class="sayfa-baslik">${girisBaslik.replace(/\n/g, "<br>")}</span>` +
        girisMetin.replace(/\n/g, "<br>");


    /* =========================================================
       YAPRAKLAR
       ========================================================= */

    const toplamYaprak = 15;
    const toplamSayfa = 1 + (toplamYaprak * 2);

    let yaprakElementleri = [];

    for (let i = 0; i < toplamYaprak; i++) {

        const yaprakDiv = document.createElement("div");

        yaprakDiv.className = "sayfa-yaprak";

        let onSayfaNo = (i * 2) + 2;
        let arkaSayfaNo = (i * 2) + 3;

        yaprakDiv.innerHTML = `
            <div class="sayfa-icerik">

                <div class="sayfa-on">

                    <img src="sag_sayfa.png" alt="Sayfa Ön">

                    <div class="sayfa-yazi" id="yazi-on-${i}">
                        <span class="sayfa-baslik">
                            Şiir Sayfa ${onSayfaNo}
                        </span>
                        ${siirMetni.replace(/\n/g, "<br>")}
                    </div>

                    <div class="sayfa-numara">
                        ${onSayfaNo}
                    </div>

                </div>

                <div class="sayfa-arka">

                    <img src="sol_sayfa.png" alt="Sayfa Arka">

                    <div class="sayfa-yazi" id="yazi-arka-${i}">
                        <span class="sayfa-baslik">
                            Şiir Sayfa ${arkaSayfaNo}
                        </span>
                        ${siirMetni.replace(/\n/g, "<br>")}
                    </div>

                    <div class="sayfa-numara">
                        ${arkaSayfaNo}
                    </div>

                </div>

            </div>
        `;

        sayfalarKapsayici.appendChild(yaprakDiv);
        yaprakElementleri.push(yaprakDiv);
    }


    /* =========================================================
       YENİ SAYFA MOTORU
       
       currentPage:
       1  = ilk sayfa
       2  = sağ sayfa
       3  = sol sayfa
       4  = sağ sayfa
       5  = sol sayfa
       ...
       
       okunmusSayfalar:
       Bir sayfa bir kez okunduysa buradan ASLA silinmez.
       ========================================================= */

    let currentPage = 1;

    const okunmusSayfalar = new Set();

    let sayfaDonuyor = false;


    /* =========================================================
       SAYFA NUMARASINDAN YAPRAK NUMARASI
       ========================================================= */

    function sayfaninYapragi(page) {

        if (page < 2) {
            return -1;
        }

        return Math.floor((page - 2) / 2);
    }


    /* =========================================================
       SAYFA YAZILARINI OKUNMUŞ DURUMUNA GÖRE GÖSTER
       ========================================================= */

    function guncelleYazilar() {

        /* 1. SAYFA */

        if (okunmusSayfalar.has(1)) {
            solKanatYazi.classList.add("goster");
        } else {
            solKanatYazi.classList.remove("goster");
        }


        /* DİĞER SAYFALAR */

        for (let i = 0; i < toplamYaprak; i++) {

            const onSayfa = (i * 2) + 2;
            const arkaSayfa = (i * 2) + 3;

            const yaziOn =
                document.getElementById(`yazi-on-${i}`);

            const yaziArka =
                document.getElementById(`yazi-arka-${i}`);


            if (okunmusSayfalar.has(onSayfa)) {
                yaziOn.classList.add("goster");
            } else {
                yaziOn.classList.remove("goster");
            }


            if (okunmusSayfalar.has(arkaSayfa)) {
                yaziArka.classList.add("goster");
            } else {
                yaziArka.classList.remove("goster");
            }
        }
    }


    /* =========================================================
       HEDEF SAYFANIN SABİT GÖRÜNÜMÜ
       ========================================================= */

    function sabitGorunumuUygula(page) {

        /*
           1. SAYFA
        */

        if (page === 1) {

            for (let i = 0; i < toplamYaprak; i++) {

                yaprakElementleri[i].style.opacity = "0";
                yaprakElementleri[i].style.zIndex =
                    toplamYaprak - i;

                yaprakElementleri[i].classList.remove("cevirdi");
            }

            guncelleYazilar();
            return;
        }


        /*
           SAYFANIN ÜSTÜNDEKİ YAPRAK
        */

        const ustYaprak = Math.floor((page - 2) / 2);


        for (let i = 0; i < toplamYaprak; i++) {

            const yaprak = yaprakElementleri[i];


            /*
               AKTİF SAYFAYA KADAR OLAN YAPRAKLAR
               görünür durumda kalır.
            */

            if (page % 2 === 0) {

                /*
                   ÖRNEK:
                   4. SAYFA

                   1. yaprak = çevrilmiş
                   2. yaprak = sağda
                */

                if (i <= ustYaprak) {

                    yaprak.style.opacity = "1";

                    yaprak.style.zIndex =
                        100 + (ustYaprak - i);

                    if (i < ustYaprak) {
                        yaprak.classList.add("cevirdi");
                    } else {
                        yaprak.classList.remove("cevirdi");
                    }

                } else {

                    yaprak.style.opacity = "0";
                    yaprak.style.zIndex =
                        toplamYaprak - i;

                    yaprak.classList.remove("cevirdi");
                }

            } else {

                /*
                   ÖRNEK:
                   3. SAYFA

                   1. yaprak = 3. sayfayı gösterir
                   2. yaprak = arkada kalır

                   ÖRNEK:
                   5. SAYFA

                   1. yaprak = arkada
                   2. yaprak = 5. sayfayı gösterir
                   3. yaprak = arkada
                */

                const ustGorunenYaprak = ustYaprak;

                if (i <= ustGorunenYaprak + 1) {

                    yaprak.style.opacity = "1";

                    yaprak.style.zIndex =
                        100 + (ustGorunenYaprak - i);

                    yaprak.classList.add("cevirdi");

                } else {

                    yaprak.style.opacity = "0";
                    yaprak.style.zIndex =
                        toplamYaprak - i;

                    yaprak.classList.remove("cevirdi");
                }
            }
        }

        guncelleYazilar();
    }


    /* =========================================================
       GEÇİŞ ANİMASYONU
       ========================================================= */

    function sayfayaGit(hedefSayfa) {

        if (sayfaDonuyor) {
            return;
        }

        if (hedefSayfa < 1 || hedefSayfa > toplamSayfa) {
            return;
        }

        if (hedefSayfa === currentPage) {
            return;
        }


        const eskiSayfa = currentPage;

        const eskiYaprak =
            sayfaninYapragi(eskiSayfa);

        const yeniYaprak =
            sayfaninYapragi(hedefSayfa);


        /*
           1 -> 2 geçişinde fiziksel yaprak dönmez.
           Sadece 2. sayfa görünür.
        */

        if (eskiSayfa === 1 && hedefSayfa === 2) {

            currentPage = hedefSayfa;

            if (!okunmusSayfalar.has(2)) {
                okunmusSayfalar.add(2);
            }

            sabitGorunumuUygula(currentPage);

            return;
        }


        /*
           DÖNECEK YAPRAK

           Örneğin:
           2 -> 3 = 0
           3 -> 4 = 1
           4 -> 3 = 1
           3 -> 2 = 0
        */

        const donecekYaprak =
            Math.floor((Math.max(eskiSayfa, hedefSayfa) - 2) / 2);


        const yaprak =
            yaprakElementleri[donecekYaprak];


        if (!yaprak) {
            return;
        }


        sayfaDonuyor = true;


        /*
           Hedef sayfaya ait yazı hemen hazırlanır,
           fakat fiziksel sayfa dönüşü bitmeden
           z-index değişmez.
        */

        currentPage = hedefSayfa;

        guncelleYazilar();


        /*
           DÖNÜŞ SIRASINDA DÖNEN YAPRAĞI EN ÖNE AL.

           Özellikle:

           4 -> 3

           sırasında 4/5 yaprağı en üstte kalır.
           Böylece 5. sayfanın arka yüzü,
           dönüş tamamlanana kadar görünür.

           Dönüş bittikten sonra 3. sayfa onun
           altından çıkar.
        */

        yaprak.style.zIndex = "1000";
        yaprak.style.opacity = "1";


        /*
           HEDEF SAYFANIN FİZİKSEL YÖNÜ
        */

        if (hedefSayfa % 2 === 1 && hedefSayfa >= 3) {

            /*
               2 -> 3
               4 -> 5
               6 -> 7

               sağdan sola çevir
            */

            yaprak.classList.add("cevirdi");

        } else {

            /*
               3 -> 4
               5 -> 6
               7 -> 8

               soldan sağa geri çevir
            */

            yaprak.classList.remove("cevirdi");
        }


        /*
           ANİMASYON TAMAMLANMADAN
           YENİ SAYFAYI ÜSTE GETİRME.
        */

        let tamamlandi = false;


        function gecisTamamlandi() {

            if (tamamlandi) {
                return;
            }

            tamamlandi = true;

            yaprak.removeEventListener(
                "transitionend",
                gecisTamamlandi
            );

            /*
               Artık dönüş tamamen bitti.
               Hedef sayfanın gerçek katman düzenini uygula.
            */

            sabitGorunumuUygula(currentPage);

            sayfaDonuyor = false;
        }


        yaprak.addEventListener(
            "transitionend",
            gecisTamamlandi
        );


        /*
           Güvenlik zamanlayıcısı.
           transitionend bazı tarayıcılarda kaçarsa
           sistem kilitlenmesin.
        */

        setTimeout(gecisTamamlandi, 1100);
    }


    /* =========================================================
       İLERİ
       ========================================================= */

    function ileriGit() {

        if (sayfaDonuyor) {
            return;
        }


        /*
           BULUNDUĞUMUZ SAYFA DAHA ÖNCE OKUNMAMIŞSA
           SADECE YAZISINI AÇ.

           Örnek:

           3 boş
           tıkla
           3 dolu
        */

        if (!okunmusSayfalar.has(currentPage)) {

            okunmusSayfalar.add(currentPage);

            guncelleYazilar();

            return;
        }


        /*
           Sayfa zaten okunmuşsa bir sonraki sayfaya geç.
        */

        if (currentPage < toplamSayfa) {

            const hedefSayfa = currentPage + 1;


            /*
               ÇİFT SAYFALAR sağ sayfaya gelir gelmez
               okunmuş kabul edilir.

               Böylece:

               1 dolu
               tıkla
               2 dolu

               olur.

               Fakat:

               2 dolu
               tıkla
               3 boş

               olur.
            */

            if (hedefSayfa % 2 === 0) {
                okunmusSayfalar.add(hedefSayfa);
            }


            sayfayaGit(hedefSayfa);
        }
    }


    /* =========================================================
       GERİ
       ========================================================= */

    function geriGit() {

        if (sayfaDonuyor) {
            return;
        }


        if (currentPage > 1) {

            /*
               GERİ GİDERKEN HİÇBİR SAYFAYI
               okunmusSayfalar İÇİNDEN SİLME.

               Örneğin 22'ye kadar okunduysa:

               22 -> 21 -> 20 -> ... -> 3

               sırasında 4-22 hâlâ okunmuş kalır.
            */

            const hedefSayfa = currentPage - 1;

            sayfayaGit(hedefSayfa);

        } else {

            /*
               1. sayfadan daha geriye gidilirse
               kitap kapanır.
            */

            kitabiKapat();
        }
    }


    /* =========================================================
       KİTAP İÇİ TIKLAMA
       ========================================================= */

    kapsayici.addEventListener("click", function (e) {

        if (!kapsayici.classList.contains("acildi")) {
            return;
        }

        if (sayfaDonuyor) {
            return;
        }

        e.stopPropagation();


        const rect =
            kapsayici.getBoundingClientRect();

        const tiklamaX =
            e.clientX - rect.left;

        const ortaNokta =
            rect.width / 2;


        if (tiklamaX < ortaNokta) {

            geriGit();

        } else {

            ileriGit();
        }
    });


    /* =========================================================
       KİTABI KAPAT
       ========================================================= */

    function kitabiKapat() {

        kapsayici.classList.remove("acildi");
        kapakAlan.classList.remove("dondu");

        currentPage = 1;
        sayfaDonuyor = false;

        /*
           Kitap tamamen kapatıldığı için
           yeni açılışta tekrar baştan okunur.
        */

        okunmusSayfalar.clear();


        solKanatYazi.classList.remove("goster");


        yaprakElementleri.forEach(
            (yaprak, index) => {

                yaprak.classList.remove("cevirdi");

                yaprak.style.opacity = "0";

                yaprak.style.zIndex =
                    toplamYaprak - index;

                document
                    .getElementById(`yazi-on-${index}`)
                    .classList.remove("goster");

                document
                    .getElementById(`yazi-arka-${index}`)
                    .classList.remove("goster");
            }
        );
    }


    /* =========================================================
       KAPAK TIKLAMA
       ========================================================= */

    kapakAlan.addEventListener("click", function (e) {

        e.stopPropagation();

        if (kapsayici.classList.contains("acildi")) {

            kitabiKapat();

        } else {

            kapsayici.classList.add("acildi");
            kapakAlan.classList.add("dondu");

            currentPage = 1;
            sayfaDonuyor = false;

            okunmusSayfalar.clear();

            sabitGorunumuUygula(currentPage);
        }
    });


    /* =========================================================
       İLK DURUM
       ========================================================= */

    sabitGorunumuUygula(1);

});
</script>

</body>
</html>
