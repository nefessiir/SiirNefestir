<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;

    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;

    background-color: #111;

    display: flex;
    justify-content: center;
    align-items: center;
}

.kapak-alan {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
}

.kapak {
    width: 100%;
    height: auto;
    display: block;
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);

    width: 85%;

    text-align: left;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;

    color: #f5d76e;

    text-shadow:
        0 0 2px rgba(255, 245, 190, 1),
        0 0 5px rgba(255, 215, 80, 0.9),
        1px 1px 1px rgba(255, 235, 150, 0.8),
        -1px -1px 1px rgba(70, 40, 5, 0.85);

    letter-spacing: 0.3px;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}

</style>

</head>

<body>

<div class="kapak-alan">

```
<img src="kapak.jpg" class="kapak">

<div class="kapak-yazi">
    Şiir'e..<br>
    hatıramdır..<br>
    kelimelerden..<br>
    hayattan..<br>
    babasından.<br><br><br>

    <span class="imza">S.O.A</span>
</div>
```

</div>

</body>
</html>
