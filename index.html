<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
    user-select: none;
}

/* =========================================
   KITAP ALANI
========================================= */

.book-stage {
    position: relative;
    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    background-image: url("arkaplan0.jpeg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
}

/* =========================================
   SAYFALAR
========================================= */

.page {
    position: absolute;
    top: 13.2%;
    height: calc(100% - 27.5%);
    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    overflow: hidden;
    z-index: 2;
}

.left-page {
    left: 19%;
    width: 34%;
    transform: scaleX(-1);
}

.right-page {
    left: 48.828125%;
    width: 38.411458%;
}

/* =========================================
   SAYFA ICERIGI & YAZI KATMANI
========================================= */

.page-content {
    position: absolute;
    left: 14%;
    top: 11%;
    width: 72%;
    height: 78%;
    overflow: hidden;
    z-index: 5; /* Şiir yazısı kalemin üstünde kalsın */
}

.left-page .page-content {
    transform: scaleX(-1);
}

/* =========================================
   SIIR
========================================= */

.poem {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 0;
    color: #174a82;
    font-family: "Caveat", cursive;
    font-size: 11pt;
    font-weight: 500;
    line-height: 1.55;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: normal;
    opacity: 0;
    transition: opacity 1.8s ease;
}

/* =========================================
   ARKA PLAN TUY KALEMLARI (SAYFA DOKUSU)
========================================= */

/* Sağ Sayfa: Ortalanmış ve sayfa sınırları içinde sabitlenmiş tüy kalem */
.quill-bg-right {
    position: absolute;
    max-width: 85%;
    max-height: 85%;
    width: auto;
    height: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-35deg);
    opacity: 0.22;
    pointer-events: none;
    z-index: 1; /* Yazının altında */
    filter: sepia(0.3) contrast(0.9);
}

/* Sol Sayfa: Ortalanmış ve sayfa sınırları içinde sabitlenmiş tüy kalem */
.quill-bg-left {
    position: absolute;
    max-width: 85%;
    max-height: 85%;
    width: auto;
    height: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scaleX(-1) rotate(-35deg);
    opacity: 0.22;
    pointer-events: none;
    z-index: 1; /* Yazının altında */
    filter: sepia(0.3) contrast(0.9);
}

/* =========================================
   KOSENIN KALEM / MUREKKEP GORSELI
========================================= */

.ink-quill {
    position: absolute;
    width: 90px;
    height: auto;
    left: calc(1.5% + 1cm);
    bottom: calc(-1% + 1cm);
    z-index: 10;
    pointer-events: none;
}

/* =========================================
   OKLAR
========================================= */

.nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.55);
    font-size: 42px;
    line-height: 48px;
    cursor: pointer;
    z-index: 50;
    transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
}

.nav-arrow:hover {
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 15px rgba(255,255,255,0.8), 0 0 25px rgba(255,255,255,0.6);
    transform: translateY(-50%) scale(1.08);
}

.left-arrow {
    left: 14%; /* Kitaba yaklaştırıldı */
}

.right-arrow {
    right: 9%; /* Kitaba yaklaştırıldı */
}

/* =========================================
   UST KONTROLLER
========================================= */

.top-controls {
    position: absolute;
    top: 2.5%;
    left: 2.5%;
    z-index: 60;
    display: flex;
    gap: 10px;
}

.control-button {
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    background: rgba(0,0,0,0.22);
    color: rgba(255,255,255,0.75);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-button:hover {
    background: rgba(0,0,0,0.4);
    color: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.35);
}

/* =========================================
   EQUALIZER
========================================= */

.equalizer {
    position: absolute;
    left: 50%;
    bottom: 3%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 28px;
    z-index: 40;
}

.equalizer span {
    display: block;
    width: 3px;
    height: 8px;
    background: rgba(255,255,255,0.55);
    border-radius: 2px;
}

/* =========================================
   BOS SAYFA
========================================= */

.blank-page {
    background-image: url("sag_sayfa_bos.png") !important;
}
</style>
</head>

<body>

<div class="book-stage" id="bookStage">

    <!-- UST KONTROLLER -->
    <div class="top-controls">
        <button class="control-button" title="Sesli dinle" onclick="toggleAudio()">🔊</button>
        <button class="control-button" title="Tam ekran" onclick="toggleFullscreen()">⛶</button>
    </div>

    <!-- SOL SAYFA -->
    <div class="page left-page" id="leftPage">
        <!-- SOL SAYFA SOLGUN BACKGROUND KALEMI (Ortalanmış) -->
        <img src="yazan_kalem3.png" class="quill-bg-left" alt="">
        
        <div class="page-content">
            <div class="poem" id="leftPoem"></div>
        </div>
    </div>

    <!-- SAG SAYFA -->
    <div class="page right-page" id="rightPage">
        <!-- SAĞ SAYFA SOLGUN BACKGROUND KALEMI (Ortalanmış) -->
        <img src="yazan_kalem3.png" class="quill-bg-right" alt="">

        <div class="page-content">
            <div class="poem" id="rightPoem"></div>
        </div>
    </div>

    <!-- KOSENIN KALEM GORSELI -->
    <img src="murekkep_kalem.png" class="ink-quill" alt="">

    <!-- OKLAR -->
    <button class="nav-arrow left-arrow" onclick="previousPage()">‹</button>
    <button class="nav-arrow right-arrow" onclick="nextPage()">›</button>

    <!-- EQUALIZER -->
    <div class="equalizer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>

<script>
/* =========================================
   ELEMANLAR
========================================= */

const leftPoem = document.getElementById("leftPoem");
const rightPoem = document.getElementById("rightPoem");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");

/* =========================================
   ŞİİR METNİ
========================================= */

const poemText =
`Yoksam düşlerinde
Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor

Bir sessizlik büyüyor
İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor

Ben seni beklerken
Zaman ağır ağır geçiyor
Her geçen gün biraz daha
İçimde büyüyor özlemin

Bir gün dönersin diye
Penceremde ışık yanıyor
Gecenin en sessiz yerinde
Adını fısıldıyor rüzgar

Belki uzaklardasın
Belki hemen yanımdasın
Ama ben yine de seni
Kalbimin içinde arıyorum

Ne zaman gözlerimi kapatsam
Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun

Yoksam düşlerinde
Bir gün hatırla beni
Çünkü ben bu dünyada
Seni beklemek için vardım

Bekle…!
Geliyorum!`;

/* =========================================
   GENISLIK OLCECEK ALAN
========================================= */

const measurePoem = document.createElement("div");
measurePoem.style.position = "absolute";
measurePoem.style.visibility = "hidden";
measurePoem.style.pointerEvents = "none";
measurePoem.style.fontFamily = '"Caveat", cursive';
measurePoem.style.fontSize = "11pt";
measurePoem.style.fontWeight = "500";
measurePoem.style.lineHeight = "1.55";
measurePoem.style.whiteSpace = "nowrap";

document.body.appendChild(measurePoem);

/* =========================================
   GENISLIK OLCE
========================================= */

function measureTextWidth(text) {
    measurePoem.textContent = text;
    return measurePoem.getBoundingClientRect().width;
}

/* =========================================
   SIIRI GERCEK SAYFA GENISLIGINE GORE
   SATIRLARA AYIR
========================================= */

function getWrappedLines() {
    const availableWidth = document.querySelector(".left-page .page-content").getBoundingClientRect().width;
    const rawLines = poemText.split("\n");
    const result = [];

    for (const rawLine of rawLines) {
        if (rawLine.trim() === "") {
            result.push("");
            continue;
        }

        const words = rawLine.split(/\s+/);
        let currentLine = "";

        for (const word of words) {
            const testLine = currentLine ? currentLine + " " + word : word;

            if (measureTextWidth(testLine) <= availableWidth) {
                currentLine = testLine;
            } else {
                if (currentLine) {
                    result.push(currentLine);
                }
                currentLine = word;
            }
        }

        if (currentLine) {
            result.push(currentLine);
        }
    }

    return result;
}

/* =========================================
   SAYFALARA BOL
========================================= */

function buildPages() {
    const lines = getWrappedLines();
    const pageContent = document.querySelector(".left-page .page-content");
    const pageRect = pageContent.getBoundingClientRect();

    const test = document.createElement("div");
    test.style.position = "absolute";
    test.style.visibility = "hidden";
    test.style.pointerEvents = "none";
    test.style.width = pageRect.width + "px";
    test.style.fontFamily = '"Caveat", cursive';
    test.style.fontSize = "11pt";
    test.style.fontWeight = "500";
    test.style.lineHeight = "1.55";
    test.style.whiteSpace = "pre-wrap";
    test.textContent = "A";

    document.body.appendChild(test);
    const lineHeight = test.getBoundingClientRect().height;
    test.remove();

    const pageHeight = pageRect.height;
    const linesPerPage = Math.max(1, Math.floor(pageHeight / lineHeight));
    const pagesList = [];

    for (let i = 0; i < lines.length; i += linesPerPage) {
        pagesList.push(lines.slice(i, i + linesPerPage));
    }

    return pagesList;
}

/* =========================================
   DURUM
========================================= */

let pages = [];
let pageIndex = 0;
let stageState = "left";
let animating = false;

/* =========================================
   YAVASCA GOSTER / KAYBET
========================================= */

function fadeIn(element) {
    element.style.opacity = "0";
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            element.style.opacity = "1";
        });
    });
}

function fadeOut(element) {
    element.style.opacity = "0";
}

/* =========================================
   ILK DURUM
========================================= */

function startBook() {
    pages = buildPages();
    pageIndex = 0;
    stageState = "left";

    leftPage.classList.remove("blank-page");
    rightPage.classList.remove("blank-page");

    leftPoem.textContent = pages[0] ? pages[0].join("\n") : "";
    rightPoem.textContent = "";

    leftPoem.style.opacity = "0";
    rightPoem.style.opacity = "0";
}

/* =========================================
   SAG OK (ILERI)
========================================= */

async function nextPage() {
    if (animating) return;
    animating = true;

    /* 1. DURUM: ILK OK -> SOL SAYFA GOSTER */
    if (stageState === "left") {
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        fadeIn(leftPoem);
        stageState = "right";
        await wait(1800);
        animating = false;
        return;
    }

    /* 2. DURUM: IKINCI OK -> SAG SAYFA GOSTER */
    if (stageState === "right") {
        if (pageIndex + 1 < pages.length) {
            rightPoem.textContent = pages[pageIndex + 1].join("\n");
            fadeIn(rightPoem);
            stageState = "spread";
            await wait(1800);
            animating = false;
            return;
        }
        stageState = "spread";
        animating = false;
        return;
    }

    /* 3. DURUM: IKI SAYFA DOLU -> TEMIZLE VE DİREKT SONRAKİ SOL SAYFAYI GOSTER */
    if (stageState === "spread") {
        fadeOut(leftPoem);
        fadeOut(rightPoem);

        await wait(1800); // Eski metinlerin kaybolmasını bekle

        pageIndex += 2;

        if (pageIndex < pages.length) {
            leftPoem.textContent = pages[pageIndex].join("\n");
            rightPoem.textContent = "";
            fadeIn(leftPoem);
            stageState = "right";
            await wait(1800);
        } else {
            leftPoem.textContent = "";
            rightPoem.textContent = "";
            stageState = "finished";
        }

        animating = false;
        return;
    }

    if (stageState === "finished") {
        animating = false;
        return;
    }
}

/* =========================================
   SOL OK (GERI)
========================================= */

async function previousPage() {
    if (animating || (pageIndex === 0 && stageState === "left")) return;
    animating = true;

    if (stageState === "right") {
        fadeOut(leftPoem);
        await wait(1800);
        stageState = "left";
        animating = false;
        return;
    }

    if (stageState === "spread") {
        fadeOut(rightPoem);
        await wait(1800);
        stageState = "right";
        animating = false;
        return;
    }

    if (stageState === "finished" || (stageState === "left" && pageIndex >= 2)) {
        fadeOut(leftPoem);
        fadeOut(rightPoem);
        await wait(1800);

        pageIndex = Math.max(0, pageIndex - 2);

        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        rightPoem.textContent = pages[pageIndex + 1] ? pages[pageIndex + 1].join("\n") : "";

        fadeIn(leftPoem);
        if (pages[pageIndex + 1]) fadeIn(rightPoem);

        stageState = pages[pageIndex + 1] ? "spread" : "right";
        await wait(1800);
        animating = false;
        return;
    }

    animating = false;
}

/* =========================================
   BEKLEME VE KONTROL FONKSIYONLARI
========================================= */

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

function toggleAudio() {
    alert("Ses oynatma başlatıldı/durduruldu.");
}

/* =========================================
   BASLAT VE RESIZE DINLEYICI
========================================= */

window.addEventListener("load", () => {
    setTimeout(startBook, 500);
});

window.addEventListener("resize", () => {
    pages = buildPages();
});
</script>

</body>
</html>
