<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>
<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("yeni_arka_plan0.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Kapağın bulunduğu alan */
.kitap-alani {
    width: 39%;
    height: calc(82vh + 4cm);
    transform: translateX(10cm);
    perspective: 2500px;
    position: relative;
}

/* Sağ tarafta SABİT duran iç sayfa */
.sag-kapak {
    width: calc(100% - 2cm);
    height: calc(100% - 2cm);
    position: absolute;
    left: calc(100% - 1cm);
    top: 1cm;
    background: #d8c08d;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.18);
    opacity: 0;
    visibility: hidden;
    z-index: 1;
}

/* Açılan kapak */
.kitap-kapak {
    width: calc(100% - 2cm);
    height: calc(100% - 2cm);
    position: absolute;
    left: 1cm;
    top: 1cm;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.4s cubic-bezier(0.22, 0.61, 0.36, 1);
    cursor: pointer;
    z-index: 2;
}

/* Kapak yüzleri */
.kapak-on,
.kapak-arka {
    width: 100%;
    height: 100%;
    position: absolute;
    left: 0;
    top: 0;
    backface-visibility: hidden;
}

/* Ön kapak */
.kapak-on {
    background-image: url("kitap_kapagi.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

/* Kapağın açılınca görünen iç yüzü */
.kapak-arka {
    transform: rotateY(180deg);
    background: #d8c08d;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.18);
}

/* Ana kapak sola açılır */
.kitap-kapak.acik {
    transform: rotateY(-180deg);
}

/* Açıldığında sağ taraf SABİT şekilde görünür */
.kitap-alani.acik .sag-kapak {
    opacity: 1;
    visibility: visible;
}
</style>
</head>
<body>

<div class="kitap-alani" id="kitapAlani">
    <!-- Sağ tarafta sabit duran saman renkli sayfa -->
    <div class="sag-kapak"></div>

    <!-- Sola açılan kapak -->
    <div class="kitap-kapak" id="kitapKapak">
        <div class="kapak-on"></div>
        <div class="kapak-arka"></div>
    </div>
</div>

<script>
const kitapKapak = document.getElementById("kitapKapak");
const kitapAlani = document.getElementById("kitapAlani");

kitapKapak.addEventListener("click", function () {
    kitapKapak.classList.toggle("acik");
    kitapAlani.classList.toggle("acik");
});
</script>

</body>
</html>
