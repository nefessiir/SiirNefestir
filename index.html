<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<!-- Gerçek Kıvrılan Sayfa Motoru (StPageFlip) -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* KİTAP KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. SAĞDA SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* 2. STPAGEFLIP AÇILMIŞ KİTAP GÖVDESİ (Tam Açık Boyut Oranı) */
#fiziksel-kitap {
    position: absolute;
    top: 0.5cm;
    left: calc(-100% + 0.2cm);
    width: calc(200% - 0.3cm);
    height: calc(100% - 1cm);
    z-index: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi #fiziksel-kitap {
    opacity: 1;
    z-index: 5;
    pointer-events: auto;
    transition: opacity 0.3s ease-in-out 1.5s;
}

/* Sayfa Şablonları (Açık Kitap Ebatlarında) */
.sayfa-oge {
    background-color: #fdfbf7;
    overflow: hidden;
    width: 100%;
    height: 100%;
}

.sayfa-oge img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* 3. ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 1.5s ease-in-out;
    z-index: 10;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
    z-index: 1;
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<div class="kitap-kapsayici" id="kitapKapsayici">

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg">
    </div>

    <!-- 2. AÇILMIŞ KİTAP SAYFALARI -->
    <div id="fiziksel-kitap">
        <div class="sayfa-oge"><img src="sol_sayfa.png" alt="Sol Sayfa 1"></div>
        <div class="sayfa-oge"><img src="sag_sayfa.png" alt="Sağ Sayfa 1"></div>
        
        <div class="sayfa-oge"><img src="sol_sayfa.png" alt="Sol Sayfa 2"></div>
        <div class="sayfa-oge"><img src="sag_sayfa.png" alt="Sağ Sayfa 2"></div>
    </div>

    <!-- 3. ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">
        <img src="kapak.jpg" class="kapak">
        
        <div class="kapak-yazi">
            Şiir'e hatıra.<br><br>
            kelimelerden..<br>
            hayattan..<br>
            babasından.<br><br><br>
            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak">
    </div>

</div>

<script>
window.addEventListener("load", function () {
    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;

    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";

    // Kapak açma animasyonu
    kapakAlan.addEventListener("click", function () {
        kapakAlan.classList.toggle("dondu");
        kapsayici.classList.toggle("acildi");
    });

    // Açılmış kapak ebatlarına tam oturan motor başlatıcısı
    setTimeout(() => {
        const container = document.getElementById("fiziksel-kitap");
        const w = container.clientWidth / 2;
        const h = container.clientHeight;

        if (w > 0 && h > 0) {
            const pageFlip = new St.PageFlip(container, {
                width: Math.round(w),
                height: Math.round(h),
                size: "stretch",
                minWidth: 100,
                maxWidth: 2500,
                minHeight: 100,
                maxHeight: 2500,
                showCover: false,
                mobileScrollSupport: false,
                maxShadowOpacity: 0.4,
                flippingTime: 1000
            });

            pageFlip.loadFromHTML(container.querySelectorAll('.sayfa-oge'));
        }
    }, 600);
});
</script>

</body>
</html>
