<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* =========================================
   KITAP SAHNESI
   ========================================= */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    overflow: visible;
}


/* =========================================
   ARKA PLAN
   ========================================= */

.book-background {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}


/* =========================================
   SAG SAYFA
   ========================================= */

.right-page {
    position: absolute;

    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: auto;

    display: block;

    pointer-events: none;

    z-index: 2;
}


/* =========================================
   SOL SAYFA
   ========================================= */

.left-page {
    position: absolute;

    left: 19%;
    top: 13.2%;

    width: 34%;
    height: calc(100% - 27.5%);

    display: block;

    pointer-events: none;

    transform: scaleX(-1);

    z-index: 2;
}


/* =========================================
   SIIR METINLERI
   ========================================= */

.poem-text {
    position: absolute;

    top: 23%;

    width: 25%;
    height: 61%;

    z-index: 5;

    color: #174a82;

    font-family:
        "Caveat",
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size:
        clamp(17px, 1.35vw, 23px);

    font-weight: 500;

    line-height: 1.55;

    letter-spacing: 0.01em;

    white-space: pre-line;

    overflow: hidden;

    text-shadow:
        0.2px 0.2px 0
        rgba(23, 74, 130, 0.22);

    opacity: 1;

    transition:
        opacity 1.2s ease;
}


.left-poem {
    left: 23%;

    text-align: left;
}


.right-poem {
    left: 53%;

    text-align: left;
}


.poem-text.fade-out {
    opacity: 0;
}


/* =========================================
   TUYLU KALEM
   ========================================= */

.quill {
    position: absolute;

    width: 58px;
    height: 58px;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    transform-origin: 82% 82%;

    transition:
        left 0.055s linear,
        top 0.055s linear,
        opacity 0.35s ease;
}


/*
 * Kalemin kendisi SVG icinde.
 * Zarif bir tuy ve ince mavi murekkep ucu.
 */

.quill svg {
    width: 100%;
    height: 100%;

    display: block;

    overflow: visible;

    filter:
        drop-shadow(
            0 1px 1px
            rgba(0, 0, 0, 0.28)
        );
}


/* =========================================
   OK
   ========================================= */

.page-arrow {
    position: absolute;

    top: 50%;
    left: 88%;

    width: 30px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    color:
        rgba(255, 255, 255, 0.72);

    font-family: Arial, sans-serif;

    font-size: 38px;
    font-weight: 300;

    line-height: 1;

    cursor: pointer;
    user-select: none;

    z-index: 20;

    transform:
        translateY(-50%);

    text-shadow:
        0 1px 3px
        rgba(0, 0, 0, 0.8);

    transition:
        color 0.25s ease,
        transform 0.25s ease,
        text-shadow 0.25s ease;
}


.page-arrow:hover {

    color:
        rgba(255, 255, 255, 0.95);

    transform:
        translateY(-50%)
        scale(1.08);

    text-shadow:
        0 0 7px
        rgba(255, 255, 255, 0.45),

        0 1px 4px
        rgba(0, 0, 0, 0.8);
}


/* =========================================
   OKA BASILDIGINDA PARLAMA
   ========================================= */

.page-arrow.flash {

    animation:
        arrowFlash 0.55s ease;
}


@keyframes arrowFlash {

    0% {

        color:
            rgba(255, 255, 255, 0.72);

        text-shadow:
            0 1px 3px
            rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1);
    }


    35% {

        color: #ffffff;

        text-shadow:
            0 0 5px
            rgba(255, 255, 255, 0.65),

            0 0 12px
            rgba(255, 255, 255, 0.45),

            0 1px 4px
            rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1.16);
    }


    100% {

        color:
            rgba(255, 255, 255, 0.72);

        text-shadow:
            0 1px 3px
            rgba(0, 0, 0, 0.8);

        transform:
            translateY(-50%)
            scale(1);
    }

}


.page-arrow.disabled {

    pointer-events: none;

    opacity: 0.35;
}


/* =========================================
   GIZLI OLCUM ALANI
   ========================================= */

.measure-poem {
    position: absolute;

    visibility: hidden;

    pointer-events: none;

    left: -99999px;
    top: 0;

    white-space: pre-line;

    overflow: hidden;
}

</style>
</head>


<body>

<div class="page">

    <div class="book-stage">

        <!-- ARKA PLAN -->

        <img
            class="book-background"
            src="arkaplan0.jpeg"
            alt="Sair Nefestir"
        >


        <!-- SAG SAYFA -->

        <img
            class="right-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- SOL SAYFA -->

        <img
            class="left-page"
            src="sag_sayfa_bos.png"
            alt=""
        >


        <!-- SOL SIIR -->

        <div
            id="leftPoem"
            class="poem-text left-poem"
        ></div>


        <!-- SAG SIIR -->

        <div
            id="rightPoem"
            class="poem-text right-poem"
        ></div>


        <!-- TUYLU DOLMA KALEM -->

        <div
            id="quill"
            class="quill"
        >

            <svg
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- Tuy govdesi -->

                <path
                    d="
                    M20 76
                    C25 52 39 28 75 10
                    C79 8 83 9 84 12
                    C84 38 67 62 38 75
                    C31 78 25 79 20 76
                    Z
                    "
                    fill="#eee9df"
                    stroke="#9b968d"
                    stroke-width="1.2"
                />


                <!-- Tuy damar -->

                <path
                    d="
                    M23 76
                    C39 57 57 36 82 12
                    "
                    fill="none"
                    stroke="#77736c"
                    stroke-width="1.4"
                    stroke-linecap="round"
                />


                <!-- Tuy cizgileri -->

                <path
                    d="
                    M31 66 L25 55
                    M38 59 L32 45
                    M46 51 L40 37
                    M54 43 L48 29
                    M62 35 L57 23
                    M70 27 L67 17
                    "
                    fill="none"
                    stroke="#aaa59d"
                    stroke-width="1"
                    stroke-linecap="round"
                />


                <!-- Kalem sap -->

                <path
                    d="
                    M22 76
                    C34 78 48 84 68 91
                    "
                    fill="none"
                    stroke="#6c4932"
                    stroke-width="4"
                    stroke-linecap="round"
                />


                <!-- Mavi murekkep ucu -->

                <path
                    d="
                    M18 78
                    L9 91
                    L24 82
                    Z
                    "
                    fill="#174a82"
                />

                <circle
                    cx="12"
                    cy="89"
                    r="2.2"
                    fill="#174a82"
                />

            </svg>

        </div>


        <!-- SAG OK -->

        <div
            id="nextArrow"
            class="page-arrow next-arrow"
            aria-label="Siirin devamini goster"
        >
            ›
        </div>

    </div>

</div>


<script>

/* =========================================
   DEMO SIIR
   ========================================= */

const poems = [

`Haydi Abbas, vakit tamam;
Akşam diyordun işte oldu akşam.
Kur bakalım çilingir soframızı;
Dinsin artık bu kalb ağrısı.
Şu ağacın gölgesinde olsun;
Tam kenarında havuzun.
Aya haber sal çıksın bu gece;
Görünsün şöyle gönlümce.
Bas kırbacı sihirli seccadeye,
Göster hükmettiğini mesafeye
Ve zamana.
Katıp tozu dumana,
Var git,
Böyle ferman etti Cahit,
Al getir ilk sevgiliyi Beşiktaş'tan;
Yaşamak istiyorum gençliğimi yeni baştan.`

];


/* =========================================
   ELEMENTLER
   ========================================= */

const leftPoem =
    document.getElementById("leftPoem");

const rightPoem =
    document.getElementById("rightPoem");

const nextArrow =
    document.getElementById("nextArrow");

const quill =
    document.getElementById("quill");

const bookStage =
    document.querySelector(".book-stage");


/* =========================================
   DURUM
   ========================================= */

let pages = [];

let currentSpread = 0;

let isAnimating = false;

let typingInProgress = false;


/* =========================================
   SAYFA OLCUMU
   ========================================= */

function createMeasureElement(sourceElement) {

    const measure =
        document.createElement("div");

    measure.className =
        "measure-poem";

    const styles =
        window.getComputedStyle(
            sourceElement
        );

    measure.style.width =
        styles.width;

    measure.style.height =
        styles.height;

    measure.style.fontFamily =
        styles.fontFamily;

    measure.style.fontSize =
        styles.fontSize;

    measure.style.fontWeight =
        styles.fontWeight;

    measure.style.lineHeight =
        styles.lineHeight;

    measure.style.letterSpacing =
        styles.letterSpacing;

    measure.style.textShadow =
        styles.textShadow;

    document.body.appendChild(
        measure
    );

    return measure;
}


/* =========================================
   SAYFAYA SIGIYOR MU
   ========================================= */

function fitsOnPage(
    text,
    sourceElement,
    measureElement
) {

    measureElement.textContent =
        text;

    return (
        measureElement.scrollHeight <=
        sourceElement.clientHeight + 1
    );
}


/* =========================================
   SIIRI SAYFALARA BOL
   ========================================= */

function paginatePoem(poem) {

    const lines =
        poem.split("\n");

    const measure =
        createMeasureElement(
            leftPoem
        );

    const result = [];

    let currentText = "";


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];

        const candidate =
            currentText === ""
                ? line
                : currentText + "\n" + line;


        if (
            fitsOnPage(
                candidate,
                leftPoem,
                measure
            )
        ) {

            currentText =
                candidate;

            continue;
        }


        if (currentText !== "") {

            result.push(
                currentText
            );

            currentText =
                line;

        } else {

            result.push(
                line
            );

            currentText = "";
        }
    }


    if (currentText !== "") {

        result.push(
            currentText
        );
    }


    measure.remove();

    return result;
}


/* =========================================
   BUTUN SIIRLERI SAYFALANDIR
   ========================================= */

function buildPages() {

    pages = [];

    poems.forEach(
        function(poem) {

            const chunks =
                paginatePoem(poem);


            for (
                let i = 0;
                i < chunks.length;
                i += 2
            ) {

                pages.push({

                    left:
                        chunks[i] || "",

                    right:
                        chunks[i + 1] || ""

                });
            }

        }
    );
}


/* =========================================
   TUYLU KALEMI GOSTER
   ========================================= */

function showQuill() {

    quill.style.opacity = "1";
}


/* =========================================
   TUYLU KALEMI GIZLE
   ========================================= */

function hideQuill() {

    quill.style.opacity = "0";
}


/* =========================================
   KALEMI KARAKTERIN UCUNA GOTUR
   ========================================= */

function moveQuillToCharacter(
    element
) {

    if (
        !element.firstChild ||
        element.textContent.length === 0
    ) {
        return;
    }


    const textNode =
        element.firstChild;

    const length =
        textNode.textContent.length;


    /*
     * Son karakterin konumunu bul.
     */

    const range =
        document.createRange();

    range.setStart(
        textNode,
        Math.max(
            0,
            length - 1
        )
    );

    range.setEnd(
        textNode,
        length
    );


    const rect =
        range.getBoundingClientRect();

    const stageRect =
        bookStage.getBoundingClientRect();


    /*
     * Kalemin murekkep ucunu
     * karakterin sag-alt tarafina
     * yerlestiriyoruz.
     */

    const x =
        rect.right -
        stageRect.left -
        7;

    const y =
        rect.bottom -
        stageRect.top -
        4;


    quill.style.left =
        x + "px";

    quill.style.top =
        y + "px";
}


/* =========================================
   DAKTILO / KALEM YAZISI
   ========================================= */

function typeText(
    element,
    text,
    callback
) {

    element.textContent = "";

    let index = 0;

    typingInProgress = true;

    showQuill();


    function writeCharacter() {

        if (
            index >= text.length
        ) {

            typingInProgress = false;

            if (callback) {
                callback();
            }

            return;
        }


        /*
         * Karakteri yaz.
         */

        element.textContent +=
            text.charAt(index);


        /*
         * Kalemi yeni karaktere tasi.
         */

        moveQuillToCharacter(
            element
        );


        index++;


        /*
         * Biraz agir,
         * sakin ve siirsel yazim.
         */

        setTimeout(
            writeCharacter,
            55
        );
    }


    writeCharacter();
}


/* =========================================
   SAYFAYI DAKTILO + TUYLU KALEM ILE YAZ
   ========================================= */

function typeSpread(index) {

    const spread =
        pages[index];


    leftPoem.textContent = "";

    rightPoem.textContent = "";


    /*
     * Once sol sayfa.
     */

    typeText(
        leftPoem,
        spread.left,
        function() {


            /*
             * Sol bittikten sonra
             * sag sayfa.
             */

            if (
                spread.right !== ""
            ) {

                typeText(
                    rightPoem,
                    spread.right,
                    function() {

                        /*
                         * Siir bittiginde
                         * kalem son harfte kalir.
                         */

                        typingInProgress =
                            false;
                    }
                );

            } else {

                typingInProgress =
                    false;
            }

        }
    );
}


/* =========================================
   OKA BASILINCA
   ========================================= */

nextArrow.addEventListener(
    "click",
    function() {

        if (isAnimating) {
            return;
        }


        if (typingInProgress) {
            return;
        }


        if (
            currentSpread >=
            pages.length - 1
        ) {
            return;
        }


        /*
         * OK PARLASIN
         */

        nextArrow.classList.remove(
            "flash"
        );

        void nextArrow.offsetWidth;

        nextArrow.classList.add(
            "flash"
        );


        isAnimating = true;

        nextArrow.classList.add(
            "disabled"
        );


        /*
         * Iki sayfa ve kalem
         * birlikte kaybolsun.
         */

        leftPoem.classList.add(
            "fade-out"
        );

        rightPoem.classList.add(
            "fade-out"
        );

        hideQuill();


        /*
         * Kaybolma tamamlaninca
         * yeni sayfaya gec.
         */

        setTimeout(
            function() {

                currentSpread++;


                leftPoem.classList.remove(
                    "fade-out"
                );

                rightPoem.classList.remove(
                    "fade-out"
                );


                /*
                 * Yeni devam yine
                 * sol sayfadan baslar.
                 */

                typeSpread(
                    currentSpread
                );


                /*
                 * Daktilo bitince ok
                 * yeniden aktif olur.
                 */

                const wait =
                    setInterval(
                        function() {

                            if (
                                !typingInProgress
                            ) {

                                clearInterval(
                                    wait
                                );

                                isAnimating =
                                    false;

                                nextArrow.classList.remove(
                                    "disabled"
                                );
                            }

                        },
                        100
                    );

            },
            1200
        );

    }
);


/* =========================================
   ILK ACILIS
   ========================================= */

async function initializeBook() {

    if (
        document.fonts &&
        document.fonts.ready
    ) {

        await document.fonts.ready;
    }


    requestAnimationFrame(
        function() {

            buildPages();

            currentSpread = 0;

            typeSpread(
                currentSpread
            );

        }
    );
}


/* =========================================
   BASLAT
   ========================================= */

initializeBook();

</script>

</body>
</html>
