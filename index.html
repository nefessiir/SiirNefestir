<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background:
        radial-gradient(
            circle at center,
            #51463b 0%,
            #302a24 55%,
            #211d19 100%
        );

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================================================
   KAPALI KITAP
   ========================================================= */

#closedBook {

    position: absolute;

    width: 360px;
    height: 520px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    cursor: pointer;

    transition:
        transform .8s ease;
}

#closedBook:hover {

    transform:
        translate(-50%, -50%)
        scale(1.025);
}

.cover {

    width: 100%;
    height: 100%;

    border-radius:
        8px
        18px
        18px
        8px;

    background:

        linear-gradient(
            rgba(20,10,5,.25),
            rgba(20,10,5,.45)
        ),

        url("kapak-gorsel.jpg");

    background-size: cover;
    background-position: center;

    box-shadow:

        0 30px 60px
        rgba(0,0,0,.55),

        inset
        5px 0 10px
        rgba(255,255,255,.08);

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: #f5ead8;

    text-align: center;
}

.cover h1 {

    font-size: 38px;

    font-weight: normal;

    letter-spacing: 3px;

    margin:
        0 0 25px;
}

.cover p {

    font-size: 17px;

    line-height: 1.6;

    font-style: italic;

    margin:
        0 30px;
}

.cover span {

    margin-top: 35px;

    font-size: 18px;

    letter-spacing: 2px;
}


/* =========================================================
   KITAP
   ========================================================= */

#book {

    display: none;

    position: absolute;

    width:
        min(1100px, 94vw);

    height:
        min(720px, 82vh);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    perspective:
        2200px;

    box-shadow:
        0 30px 70px
        rgba(0,0,0,.5);
}


/* =========================================================
   SAYFALAR
   ========================================================= */

.page {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background: #f3ead8;

    color: #34291e;

    overflow: hidden;
}

.page.left {

    left: 0;

    border-radius:
        9px
        0
        0
        9px;

    box-shadow:
        inset
        -2px 0 0
        rgba(60,40,20,.18);
}

.page.right {

    right: 0;

    border-radius:
        0
        9px
        9px
        0;

    box-shadow:
        inset
        2px 0 0
        rgba(60,40,20,.18);
}


/* =========================================================
   SOL SAYFA
   ========================================================= */

.picture {

    position: relative;

    width: 100%;
    height: 100%;

    background:

        linear-gradient(
            to bottom,
            rgba(30,20,10,.05),
            rgba(20,10,5,.45)
        ),

        linear-gradient(
            to bottom,
            #d98d58 0%,
            #edbd82 28%,
            #527c91 55%,
            #183f52 100%
        );
}

.picture::before {

    content: "";

    position: absolute;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background:
        #ffd28b;

    left: 50%;
    top: 30%;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 0 40px
        rgba(255,210,139,.6);
}

.picture::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 43%;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.13) 0px,
            rgba(255,255,255,.13) 2px,
            transparent 2px,
            transparent 15px
        ),

        #28566b;
}


/* YELKENLI */

.picture::marker {
    display: none;
}


/* =========================================================
   SOL SAYFA YAZISI
   ========================================================= */

.pictureText {

    position: absolute;

    left: 30px;
    right: 30px;
    bottom: 45px;

    text-align: center;

    color: white;

    z-index: 5;

    text-shadow:
        0 2px 7px
        rgba(0,0,0,.8);
}

.pictureText h2 {

    margin:
        0 0 12px;

    font-size: 30px;

    font-weight: normal;

    letter-spacing: 2px;
}

.pictureText p {

    margin: 0;

    font-size: 16px;

    font-style: italic;
}


/* =========================================================
   ICINDEKILER
   ========================================================= */

.content {

    padding: 55px;
}

.content h2 {

    text-align: center;

    font-weight: normal;

    font-size: 30px;

    margin:
        0 0 35px;
}

.line {

    height: 1px;

    background:
        rgba(60,40,20,.3);

    margin-bottom: 25px;
}

.item {

    display: flex;

    margin:
        15px 0;

    font-size: 17px;

    cursor: pointer;

    transition:
        transform .25s ease;
}

.item:hover {

    transform:
        translateX(5px);
}

.dots {

    flex: 1;

    border-bottom:
        1px dotted #8b7964;

    margin:
        0 10px;
}


/* =========================================================
   GERCEK KAGIT KIVRIM SISTEMI
   ========================================================= */

.page-turn {

    position: absolute;

    top: 0;
    right: 0;

    width: 50%;
    height: 100%;

    z-index: 30;

    pointer-events: none;

    transform-style:
        preserve-3d;
}


/*
   Her parca sayfanin dikey bir dilimidir.
   Her dilim ayri hareket ettigi icin
   sayfa tek parca kart gibi donmez.
*/

.paper-piece {

    position: absolute;

    top: 0;

    height: 100%;

    width:
        calc(100% / 14);

    overflow: hidden;

    transform-style:
        preserve-3d;

    transform-origin:
        left center;

    backface-visibility:
        hidden;

    will-change:
        transform;

    background:
        #f3ead8;

    box-shadow:
        inset
        -1px 0 0
        rgba(60,40,20,.06);
}


/* ON YUZ */

.paper-front {

    position: absolute;

    inset: 0;

    backface-visibility:
        hidden;

    background:
        #f3ead8;
}


/* ARKA YUZ */

.paper-back {

    position: absolute;

    inset: 0;

    background:
        #efe4cf;

    transform:
        rotateY(180deg);

    backface-visibility:
        hidden;
}


/* KAGIT YUZLERINDE HAFIF ISIK */

.paper-piece::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(255,255,255,.18),
            transparent 45%,
            rgba(0,0,0,.08)
        );

    opacity: .45;
}


/* =========================================================
   KIVRIM SIRASINDA GOLGE
   ========================================================= */

.page-turn-shadow {

    position: absolute;

    top: 0;
    right: 0;

    width: 50%;
    height: 100%;

    z-index: 25;

    pointer-events: none;

    opacity: 0;

    background:

        linear-gradient(
            90deg,
            transparent 0%,
            rgba(0,0,0,.03) 30%,
            rgba(0,0,0,.22) 60%,
            rgba(0,0,0,.05) 100%
        );

    filter:
        blur(9px);

    transition:
        opacity .2s ease;
}

.page-turn-shadow.active {

    opacity: 1;
}


/* =========================================================
   TUTMA NOKTASI
   ========================================================= */

.page-handle {

    position: absolute;

    right: 0;
    bottom: 0;

    width: 90px;
    height: 90px;

    z-index: 100;

    cursor: grab;

    pointer-events: auto;

    border-radius:
        100% 0 0 0;

    background:
        radial-gradient(
            circle at bottom right,
            rgba(255,255,255,.18),
            transparent 65%
        );

    opacity: .35;

    transition:
        opacity .3s ease;
}

.page-handle:hover {

    opacity: .8;
}

.page-handle:active {

    cursor: grabbing;
}


/* =========================================================
   KONTROLLER
   ========================================================= */

.controls {

    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    display: none;

    gap: 15px;

    z-index: 100;
}

button {

    background:
        #211b16;

    color:
        #f5ead8;

    border:
        1px solid #74614d;

    padding:
        10px 20px;

    font-family:
        Georgia,
        serif;

    cursor: pointer;
}

button:hover {

    background:
        #46382b;
}


/* =========================================================
   MOBIL
   ========================================================= */

@media(max-width:700px) {

    #closedBook {

        width: 280px;
        height: 410px;
    }

    #book {

        height: 70vh;
    }

    .content {

        padding:
            30px 20px;
    }

    .content h2 {

        font-size: 23px;
    }

    .item {

        font-size: 13px;
    }

    .page-handle {

        width: 70px;
        height: 70px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     KAPALI KITAP
     ===================================================== -->

<div
    id="closedBook"
    onclick="openBook()"
>

    <div class="cover">

        <h1>ŞİİR NEFESTİR</h1>

        <p>
            Kelimelerden kızıma,<br>
            insanlara ve hayata...
        </p>

        <span>Serdar</span>

    </div>

</div>


<!-- =====================================================
     AÇIK KITAP
     ===================================================== -->

<div id="book">


    <!-- SOL SAYFA -->

    <div class="page left">

        <div class="picture">

            <div class="pictureText">

                <h2>Şiir Nefestir</h2>

                <p>
                    Kelimelerden kızıma,
                    insanlara ve hayata...
                </p>

            </div>

        </div>

    </div>


    <!-- SAG SAYFA -->

    <div class="page right">

        <div class="content">

            <h2>İçindekiler</h2>

            <div class="line"></div>

            <div class="item">
                <span>Deneme 1</span>
                <span class="dots"></span>
                <span>1</span>
            </div>

            <div class="item">
                <span>Deneme 2</span>
                <span class="dots"></span>
                <span>2</span>
            </div>

            <div class="item">
                <span>Deneme 3</span>
                <span class="dots"></span>
                <span>3</span>
            </div>

            <div class="item">
                <span>Deneme 4</span>
                <span class="dots"></span>
                <span>4</span>
            </div>

            <div class="item">
                <span>Deneme 5</span>
                <span class="dots"></span>
                <span>5</span>
            </div>

            <div class="item">
                <span>Deneme 6</span>
                <span class="dots"></span>
                <span>6</span>
            </div>

            <div class="item">
                <span>Deneme 7</span>
                <span class="dots"></span>
                <span>7</span>
            </div>

            <div class="item">
                <span>Deneme 8</span>
                <span class="dots"></span>
                <span>8</span>
            </div>

        </div>

    </div>


    <!-- =================================================
         KIVRILAN SAYFA
         ================================================= -->

    <div
        class="page-turn"
        id="pageTurn"
    >

        <!-- PARCALAR JAVASCRIPT ILE OLUSTURULACAK -->

    </div>


    <!-- GOLGE -->

    <div
        class="page-turn-shadow"
        id="pageShadow"
    ></div>


    <!-- ALT KOSENIN TUTMA ALANI -->

    <div
        class="page-handle"
        id="pageHandle"
    ></div>

</div>


<!-- =====================================================
     KONTROLLER
     ===================================================== -->

<div
    class="controls"
    id="controls"
>

    <button onclick="previousPage()">
        ‹ Önceki
    </button>

    <button onclick="nextPage()">
        Sonraki ›
    </button>

</div>


<script>

/* =========================================================
   AYARLAR
   ========================================================= */

const pieceCount = 14;

let currentProgress = 0;

let dragging = false;

let startX = 0;

let startProgress = 0;


/* =========================================================
   KITABI AC
   ========================================================= */

function openBook() {

    document.getElementById(
        "closedBook"
    ).style.display = "none";

    document.getElementById(
        "book"
    ).style.display = "block";

    document.getElementById(
        "controls"
    ).style.display = "flex";

    createPaper();

    updatePage(0);
}


/* =========================================================
   KAGIT PARCALARINI OLUSTUR
   ========================================================= */

function createPaper() {

    const container =
        document.getElementById("pageTurn");

    container.innerHTML = "";

    for (
        let i = 0;
        i < pieceCount;
        i++
    ) {

        const piece =
            document.createElement("div");

        piece.className =
            "paper-piece";

        piece.dataset.index = i;

        piece.style.left =
            `${(i / pieceCount) * 100}%`;

        const front =
            document.createElement("div");

        front.className =
            "paper-front";

        const back =
            document.createElement("div");

        back.className =
            "paper-back";

        /*
           Her parca kendi icinde
           butun sayfanin ilgili bolgesini gosterir.
        */

        front.innerHTML = `
            <div
                style="
                    position:absolute;
                    left:-${i * 100}%;
                    top:0;
                    width:${pieceCount * 100}%;
                    height:100%;
                "
            >
                <div class="content">
                    <h2>İçindekiler</h2>

                    <div class="line"></div>

                    <div class="item">
                        <span>Deneme 1</span>
                        <span class="dots"></span>
                        <span>1</span>
                    </div>

                    <div class="item">
                        <span>Deneme 2</span>
                        <span class="dots"></span>
                        <span>2</span>
                    </div>

                    <div class="item">
                        <span>Deneme 3</span>
                        <span class="dots"></span>
                        <span>3</span>
                    </div>

                    <div class="item">
                        <span>Deneme 4</span>
                        <span class="dots"></span>
                        <span>4</span>
                    </div>

                    <div class="item">
                        <span>Deneme 5</span>
                        <span class="dots"></span>
                        <span>5</span>
                    </div>

                    <div class="item">
                        <span>Deneme 6</span>
                        <span class="dots"></span>
                        <span>6</span>
                    </div>

                </div>
            </div>
        `;

        back.innerHTML = `
            <div
                style="
                    position:absolute;
                    left:-${i * 100}%;
                    top:0;
                    width:${pieceCount * 100}%;
                    height:100%;
                "
            >
                <div class="content">

                    <h2>Şiir Nefestir</h2>

                    <p
                        style="
                            text-align:center;
                            margin-top:60px;
                            font-size:18px;
                            line-height:1.8;
                        "
                    >
                        Sayfalar arasında<br>
                        kelimeler yaşayacak...
                    </p>

                </div>
            </div>
        `;

        piece.appendChild(front);

        piece.appendChild(back);

        container.appendChild(piece);
    }
}


/* =========================================================
   SAYFA HAREKETI
   ========================================================= */

function updatePage(progress) {

    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );

    currentProgress =
        progress;

    const pieces =
        document.querySelectorAll(
            ".paper-piece"
        );

    pieces.forEach(
        (piece, index) => {

            /*
               Sayfanin her parcasi farkli
               bir miktarda bukuluyor.

               Ortadaki kisim daha fazla
               donuyor.

               Kenarlar daha yumusak kaliyor.
            */

            const normalized =
                index /
                (pieceCount - 1);

            const distance =
                Math.abs(
                    normalized - progress
                );

            const curl =
                Math.sin(
                    Math.min(
                        1,
                        distance
                    ) * Math.PI
                );

            const baseRotation =
                -180 * progress;

            const wave =
                curl * 55;

            const vertical =
                curl * 12;

            const depth =
                curl * -35;

            const shadow =
                curl * .12;

            piece.style.transform = `
                translateZ(${depth}px)
                translateY(${vertical}px)
                rotateY(${baseRotation + wave}deg)
                rotateX(${curl * 3}deg)
            `;

            piece.style.boxShadow =
                `
                inset -8px 0 15px
                rgba(0,0,0,${shadow})
                `;
        }
    );

    const shadow =
        document.getElementById(
            "pageShadow"
        );

    if (progress > 0.01) {

        shadow.classList.add(
            "active"
        );

    } else {

        shadow.classList.remove(
            "active"
        );
    }
}


/* =========================================================
   SONRAKI SAYFA
   ========================================================= */

function nextPage() {

    animatePage(
        currentProgress,
        1
    );
}


/* =========================================================
   ONCEKI SAYFA
   ========================================================= */

function previousPage() {

    animatePage(
        currentProgress,
        0
    );
}


/* =========================================================
   YUMUSAK ANIMASYON
   ========================================================= */

function animatePage(
    from,
    to
) {

    const duration =
        1000;

    const start =
        performance.now();

    function frame(now) {

        const elapsed =
            now - start;

        let amount =
            Math.min(
                elapsed / duration,
                1
            );

        /*
           Ease in-out
        */

        amount =
            amount < .5
                ? 2 * amount * amount
                : 1 -
                  Math.pow(
                      -2 * amount + 2,
                      2
                  ) / 2;

        const value =
            from +
            (to - from) * amount;

        updatePage(value);

        if (amount < 1) {

            requestAnimationFrame(
                frame
            );
        }
    }

    requestAnimationFrame(
        frame
    );
}


/* =========================================================
   FARE ILE ALT KOSENDEN TUT
   ========================================================= */

const handle =
    document.getElementById(
        "pageHandle"
    );


handle.addEventListener(
    "mousedown",
    startDrag
);

document.addEventListener(
    "mousemove",
    dragPage
);

document.addEventListener(
    "mouseup",
    endDrag
);


/* =========================================================
   DOKUNMATIK
   ========================================================= */

handle.addEventListener(
    "touchstart",
    startTouch,
    {
        passive: true
    }
);

document.addEventListener(
    "touchmove",
    dragTouch,
    {
        passive: false
    }
);

document.addEventListener(
    "touchend",
    endDrag
);


/* =========================================================
   FARE BASLANGICI
   ========================================================= */

function startDrag(event) {

    dragging = true;

    startX =
        event.clientX;

    startProgress =
        currentProgress;
}


/* =========================================================
   FARE HAREKETI
   ========================================================= */

function dragPage(event) {

    if (!dragging) {
        return;
    }

    const book =
        document.getElementById(
            "book"
        );

    const width =
        book.offsetWidth / 2;

    const distance =
        startX -
        event.clientX;

    const progress =
        startProgress +
        distance / width;

    updatePage(
        progress
    );
}


/* =========================================================
   DOKUNMATIK BASLANGIC
   ========================================================= */

function startTouch(event) {

    dragging = true;

    startX =
        event.touches[0].clientX;

    startProgress =
        currentProgress;
}


/* =========================================================
   DOKUNMATIK HAREKET
   ========================================================= */

function dragTouch(event) {

    if (!dragging) {
        return;
    }

    event.preventDefault();

    const book =
        document.getElementById(
            "book"
        );

    const width =
        book.offsetWidth / 2;

    const distance =
        startX -
        event.touches[0].clientX;

    const progress =
        startProgress +
        distance / width;

    updatePage(
        progress
    );
}


/* =========================================================
   BIRAKMA
   ========================================================= */

function endDrag() {

    if (!dragging) {
        return;
    }

    dragging = false;

    /*
       Yaridan fazlaysa
       sayfa karsiya duser.
    */

    if (
        currentProgress > .5
    ) {

        animatePage(
            currentProgress,
            1
        );

    } else {

        animatePage(
            currentProgress,
            0
        );
    }
}


/* =========================================================
   KLAVYE
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            nextPage();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            previousPage();

        }
    }
);

</script>

</body>
</html>
