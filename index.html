<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* =========================================
   KITAP ALANI
========================================= */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    margin: auto;

    top: 50%;
    transform: translateY(-50%);

    background-image: url("arkaplan0.jpeg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}


/* =========================================
   SAYFALAR
========================================= */

.page {
    position: absolute;

    top: 13.2%;

    height: calc(100% - 27.5%);

    background-image: url("sag_sayfa_bos.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;

    overflow: hidden;

    z-index: 2;
}

.left-page {
    left: 19%;
    width: 34%;

    transform: scaleX(-1);
}

.right-page {
    left: 48.828125%;
    width: 38.411458%;
}


/* =========================================
   SAYFA ICERIGI
========================================= */

.page-content {
    position: absolute;

    left: 14%;
    top: 11%;

    width: 72%;
    height: 78%;

    overflow: hidden;
}

.left-page .page-content {
    transform: scaleX(-1);
}


/* =========================================
   SIIR
========================================= */

.poem {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    margin: 0;
    padding: 0;

    color: #174a82;

    font-family: "Caveat", cursive;

    font-size: 11pt;
    font-weight: 500;

    line-height: 1.55;

    direction: ltr;
    text-align: left;

    white-space: pre-wrap;

    word-break: normal;
    overflow-wrap: normal;

    opacity: 0;

    transition: opacity 1.8s ease;
}


/* =========================================
   KOSENIN KALEM / MUREKKEP GORSELI
========================================= */

.ink-quill {
    position: absolute;

    width: 90px;
    height: auto;

    left: calc(1.5% + 1cm);
    bottom: calc(-1% + 1cm);

    z-index: 10;

    pointer-events: none;
}


/* =========================================
   OKLAR
========================================= */

.nav-arrow {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 48px;
    height: 48px;

    border: none;

    background: transparent;

    color: rgba(255,255,255,0.55);

    font-size: 42px;

    line-height: 48px;

    cursor: pointer;

    z-index: 50;

    transition:
        color 0.2s ease,
        text-shadow 0.2s ease,
        transform 0.2s ease;
}

.nav-arrow:hover {
    color: #fff;

    text-shadow:
        0 0 6px rgba(255,255,255,0.9),
        0 0 15px rgba(255,255,255,0.8),
        0 0 25px rgba(255,255,255,0.6);

    transform:
        translateY(-50%)
        scale(1.08);
}

.left-arrow {
    left: 4%;
}

.right-arrow {
    right: 4%;
}


/* =========================================
   UST KONTROLLER
========================================= */

.top-controls {
    position: absolute;

    top: 2.5%;
    left: 2.5%;

    z-index: 60;

    display: flex;

    gap: 10px;
}

.control-button {
    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,0.35);

    border-radius: 50%;

    background: rgba(0,0,0,0.22);

    color: rgba(255,255,255,0.75);

    cursor: pointer;

    font-size: 18px;
}

.control-button:hover {
    background: rgba(0,0,0,0.4);

    color: #fff;

    box-shadow:
        0 0 10px rgba(255,255,255,0.35);
}


/* =========================================
   EQUALIZER
========================================= */

.equalizer {
    position: absolute;

    left: 50%;
    bottom: 3%;

    transform: translateX(-50%);

    display: flex;

    align-items: flex-end;

    gap: 4px;

    height: 28px;

    z-index: 40;
}

.equalizer span {
    display: block;

    width: 3px;
    height: 8px;

    background: rgba(255,255,255,0.55);

    border-radius: 2px;
}


/* =========================================
   BOS SAYFA
========================================= */

.blank-page {
    background-image: url("sag_sayfa_bos.png") !important;
}

</style>

</head>

<body>

<div class="book-stage" id="bookStage">

<!-- UST KONTROLLER -->

<div class="top-controls">

<button
    class="control-button"
    title="Sesli dinle">
    🔊
</button>

<button
    class="control-button"
    title="Tam ekran"
    onclick="toggleFullscreen()">
    ⛶
</button>

</div>

<!-- SOL SAYFA -->

<div
    class="page left-page"
    id="leftPage">

<div class="page-content">

    <div
        class="poem"
        id="leftPoem"></div>

</div>

</div>

<!-- SAG SAYFA -->

<div
    class="page right-page"
    id="rightPage">

<div class="page-content">

    <div
        class="poem"
        id="rightPoem"></div>

</div>

</div>

<!-- KOSENIN KALEM GORSELI -->

<img
 src="murekkep_kalem.png"
 class="ink-quill"
 alt="">

<!-- OKLAR -->

<button
 class="nav-arrow left-arrow"
 onclick="previousPage()">
‹ </button>

<button
 class="nav-arrow right-arrow"
 onclick="nextPage()">
› </button>

<!-- EQUALIZER -->

<div class="equalizer">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

</div>

/* =========================================
   ELEMANLAR
========================================= */

const leftPoem =
    document.getElementById("leftPoem");

Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor

İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor

Her geçen gün biraz daha

Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun

Yoksam düşlerinde
Bir gün hatırla beni
Çünkü ben bu dünyada
Seni beklemek için vardım

Bekle…!
Geliyorum!`;

   GENISLIK OLCECEK ALAN
========================================= */

measurePoem.style.position =
