<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at center,
            #51463a 0%,
            #302923 55%,
            #1e1a17 100%
        );

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =====================================================
   KAPALI KITAP
   ===================================================== */

#closedBook {

    position: absolute;

    width: 360px;
    height: 520px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    cursor: pointer;

    transition:
        transform .8s ease;
}

#closedBook:hover {

    transform:
        translate(-50%, -50%)
        scale(1.025);
}

.cover {

    width: 100%;
    height: 100%;

    border-radius:
        8px 20px 20px 8px;

    background:

        linear-gradient(
            rgba(20,10,5,.22),
            rgba(20,10,5,.48)
        ),

        url("kapak-gorsel.jpg");

    background-size: cover;
    background-position: center;

    box-shadow:

        0 35px 70px
        rgba(0,0,0,.58),

        inset
        5px 0 12px
        rgba(255,255,255,.08);
    
    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: #f5ead8;

    text-align: center;
}

.cover h1 {

    margin: 0 0 25px;

    font-size: 38px;

    font-weight: normal;

    letter-spacing: 3px;
}

.cover p {

    margin: 0 30px;

    font-size: 17px;

    line-height: 1.6;

    font-style: italic;
}

.cover span {

    margin-top: 35px;

    font-size: 18px;

    letter-spacing: 2px;
}


/* =====================================================
   KITAP SAHNESİ
   ===================================================== */

#book {

    display: none;

    position: absolute;

    width:
        min(1120px, 94vw);

    height:
        min(720px, 82vh);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    perspective:
        1800px;
}


/* =====================================================
   KİTABIN GÖVDESİ
   ===================================================== */

.book-body {

    position: absolute;

    inset: 0;

    transform-style:
        preserve-3d;
}


/* =====================================================
   ORTA CİLT
   ===================================================== */

.binding {

    position: absolute;

    z-index: 50;

    left: 50%;
    top: 0;

    width: 24px;
    height: 100%;

    transform:
        translateX(-50%);

    background:

        linear-gradient(
            90deg,
            rgba(40,25,15,.15),
            rgba(60,40,25,.35),
            rgba(20,12,8,.22),
            rgba(80,55,35,.18)
        );

    box-shadow:

        0 0 15px
        rgba(0,0,0,.20);

    pointer-events: none;
}


/* =====================================================
   BOMBELİ SAYFA SİSTEMİ
   ===================================================== */

.book-page {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    transform-style:
        preserve-3d;

    overflow: visible;
}


/* SOL SAYFA */

.book-page.left {

    left: 0;

    transform-origin:
        right center;

    transform:
        rotateY(0deg)
        rotateX(-3deg);

}


/* SAĞ SAYFA */

.book-page.right {

    right: 0;

    transform-origin:
        left center;

    transform:
        rotateY(0deg)
        rotateX(3deg);

}


/* =====================================================
   SAYFAYI OLUŞTURAN BOMBE DİLİMLER
   ===================================================== */

.page-strip {

    position: absolute;

    top: 0;

    height: 100%;

    width:
        6.67%;

    overflow: hidden;

    background:
        #f3ead8;

    box-shadow:
        inset
        0 0 4px
        rgba(70,45,25,.07);

    transform-style:
        preserve-3d;

    backface-visibility:
        hidden;
}


/* SOL SAYFA DİLİMLERİ */

.left .page-strip {

    right: 0;
}


/* SAĞ SAYFA DİLİMLERİ */

.right .page-strip {

    left: 0;
}


/* =====================================================
   SAYFA YÜZEYİ
   ===================================================== */

.page-content {

    position: absolute;

    top: 0;

    width: 1500%;

    height: 100%;
}

.left .page-content {

    right: 0;
}

.right .page-content {

    left: 0;
}


/* =====================================================
   KAĞIT TONU
   ===================================================== */

.page-paper {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.16),
            transparent 18%,
            transparent 82%,
            rgba(70,45,25,.08)
        ),

        #f3ead8;
}


/* =====================================================
   SOL GÖRSEL
   ===================================================== */

.picture {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,
            rgba(30,20,10,.03),
            rgba(20,10,5,.38)
        ),

        linear-gradient(
            to bottom,
            #d98d58 0%,
            #edbd82 28%,
            #527c91 55%,
            #183f52 100%
        );
}


/* GÜNEŞ */

.picture::before {

    content: "";

    position: absolute;

    width: 90px;
    height: 90px;

    left: 50%;
    top: 30%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        #ffd28b;

    box-shadow:
        0 0 45px
        rgba(255,210,139,.65);
}


/* DENİZ */

.picture::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 43%;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.13) 0px,
            rgba(255,255,255,.13) 2px,
            transparent 2px,
            transparent 15px
        ),

        #28566b;
}


/* =====================================================
   SOL SAYFA YAZISI
   ===================================================== */

.pictureText {

    position: absolute;

    left: 30px;
    right: 30px;
    bottom: 45px;

    z-index: 5;

    text-align: center;

    color: white;

    text-shadow:
        0 2px 7px
        rgba(0,0,0,.8);
}

.pictureText h2 {

    margin:
        0 0 12px;

    font-size: 30px;

    font-weight: normal;

    letter-spacing: 2px;
}

.pictureText p {

    margin: 0;

    font-size: 16px;

    font-style: italic;
}


/* =====================================================
   SAĞ SAYFA
   ===================================================== */

.contents {

    position: absolute;

    inset: 0;

    padding: 55px;

    background:
        #f3ead8;
}

.contents h2 {

    margin:
        0 0 35px;

    text-align: center;

    font-size: 30px;

    font-weight: normal;
}

.line {

    height: 1px;

    margin-bottom: 25px;

    background:
        rgba(60,40,20,.3);
}

.item {

    display: flex;

    margin:
        15px 0;

    font-size: 17px;
}

.dots {

    flex: 1;

    margin:
        0 10px;

    border-bottom:
        1px dotted #8b7964;
}


/* =====================================================
   BOMBE HESAPLAMASI
   ===================================================== */

/*
   Sayfanin merkezi yukseliyor.
   Dis kenarlar daha alcakta kaliyor.
   Böylece kitap yukaridan bakildiginda
   marti kanadi gibi gorunuyor.
*/

.left .page-strip:nth-child(1) {

    transform:
        translateY(0px)
        rotateY(-1deg);
}

.left .page-strip:nth-child(2) {

    transform:
        translateY(-3px)
        rotateY(-2deg);
}

.left .page-strip:nth-child(3) {

    transform:
        translateY(-7px)
        rotateY(-3deg);
}

.left .page-strip:nth-child(4) {

    transform:
        translateY(-11px)
        rotateY(-4deg);
}

.left .page-strip:nth-child(5) {

    transform:
        translateY(-15px)
        rotateY(-5deg);
}

.left .page-strip:nth-child(6) {

    transform:
        translateY(-18px)
        rotateY(-6deg);
}

.left .page-strip:nth-child(7) {

    transform:
        translateY(-20px)
        rotateY(-7deg);
}

.left .page-strip:nth-child(8) {

    transform:
        translateY(-18px)
        rotateY(-6deg);
}

.left .page-strip:nth-child(9) {

    transform:
        translateY(-15px)
        rotateY(-5deg);
}

.left .page-strip:nth-child(10) {

    transform:
        translateY(-11px)
        rotateY(-4deg);
}

.left .page-strip:nth-child(11) {

    transform:
        translateY(-7px)
        rotateY(-3deg);
}

.left .page-strip:nth-child(12) {

    transform:
        translateY(-3px)
        rotateY(-2deg);
}

.left .page-strip:nth-child(13) {

    transform:
        translateY(-1px)
        rotateY(-1deg);
}

.left .page-strip:nth-child(14) {

    transform:
        translateY(0px)
        rotateY(0deg);
}


/* SAĞ TARAF AYNA GÖRÜNTÜSÜ */

.right .page-strip:nth-child(1) {

    transform:
        translateY(0px)
        rotateY(0deg);
}

.right .page-strip:nth-child(2) {

    transform:
        translateY(-1px)
        rotateY(1deg);
}

.right .page-strip:nth-child(3) {

    transform:
        translateY(-3px)
        rotateY(2deg);
}

.right .page-strip:nth-child(4) {

    transform:
        translateY(-7px)
        rotateY(3deg);
}

.right .page-strip:nth-child(5) {

    transform:
        translateY(-11px)
        rotateY(4deg);
}

.right .page-strip:nth-child(6) {

    transform:
        translateY(-15px)
        rotateY(5deg);
}

.right .page-strip:nth-child(7) {

    transform:
        translateY(-18px)
        rotateY(6deg);
}

.right .page-strip:nth-child(8) {

    transform:
        translateY(-20px)
        rotateY(7deg);
}

.right .page-strip:nth-child(9) {

    transform:
        translateY(-18px)
        rotateY(6deg);
}

.right .page-strip:nth-child(10) {

    transform:
        translateY(-15px)
        rotateY(5deg);
}

.right .page-strip:nth-child(11) {

    transform:
        translateY(-11px)
        rotateY(4deg);
}

.right .page-strip:nth-child(12) {

    transform:
        translateY(-7px)
        rotateY(3deg);
}

.right .page-strip:nth-child(13) {

    transform:
        translateY(-3px)
        rotateY(2deg);
}

.right .page-strip:nth-child(14) {

    transform:
        translateY(-1px)
        rotateY(1deg);
}


/* =====================================================
   SAYFA ÇEVİRME KATMANI
   ===================================================== */

#turningPage {

    position: absolute;

    z-index: 100;

    top: 0;
    right: 0;

    width: 50%;
    height: 100%;

    pointer-events: none;

    transform-style:
        preserve-3d;

    transform-origin:
        left center;
}


/* ÇEVRİLEN PARÇALAR */

.turn-strip {

    position: absolute;

    top: 0;

    width:
        7.1428%;

    height: 100%;

    background:
        #f3ead8;

    overflow: hidden;

    transform-style:
        preserve-3d;

    transform-origin:
        left center;

    backface-visibility:
        hidden;
}


/* =====================================================
   GÖLGE
   ===================================================== */

.turn-shadow {

    position: absolute;

    z-index: 90;

    top: 0;
    right: 0;

    width: 50%;
    height: 100%;

    pointer-events: none;

    opacity: 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.18),
            transparent
        );

    filter:
        blur(12px);
}


/* =====================================================
   SAYFA TUTMA NOKTASI
   ===================================================== */

.page-handle {

    position: absolute;

    z-index: 200;

    right: 0;
    bottom: 0;

    width: 100px;
    height: 100px;

    cursor: grab;

    border-radius:
        100% 0 0 0;

    background:

        radial-gradient(
            circle at bottom right,
            rgba(255,255,255,.18),
            transparent 70%
        );
}

.page-handle:active {

    cursor: grabbing;
}


/* =====================================================
   KONTROLLER
   ===================================================== */

.controls {

    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    display: none;

    gap: 15px;

    z-index: 500;
}

button {

    padding:
        10px 20px;

    border:
        1px solid #74614d;

    background:
        #211b16;

    color:
        #f5ead8;

    font-family:
        Georgia,
        serif;

    cursor: pointer;
}

button:hover {

    background:
        #46382b;
}


/* =====================================================
   MOBİL
   ===================================================== */

@media(max-width:700px) {

    #closedBook {

        width: 280px;
        height: 410px;
    }

    #book {

        height: 70vh;
    }

    .contents {

        padding:
            30px 20px;
    }

    .contents h2 {

        font-size: 23px;
    }

    .item {

        font-size: 13px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     KAPALI KITAP
     ===================================================== -->

<div
    id="closedBook"
    onclick="openBook()"
>

    <div class="cover">

        <h1>ŞİİR NEFESTİR</h1>

        <p>
            Kelimelerden kızıma,<br>
            insanlara ve hayata...
        </p>

        <span>Serdar</span>

    </div>

</div>


<!-- =====================================================
     AÇIK KITAP
     ===================================================== -->

<div id="book">

    <div class="book-body">


        <!-- SOL SAYFA -->

        <div class="book-page left">

            <script>

            </script>

            <div class="page-paper">

                <div class="picture">

                    <div class="pictureText">

                        <h2>Şiir Nefestir</h2>

                        <p>
                            Kelimelerden kızıma,
                            insanlara ve hayata...
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- SAĞ SAYFA -->

        <div class="book-page right">

            <div class="page-paper">

                <div class="contents">

                    <h2>İçindekiler</h2>

                    <div class="line"></div>

                    <div class="item">
                        <span>Deneme 1</span>
                        <span class="dots"></span>
                        <span>1</span>
                    </div>

                    <div class="item">
                        <span>Deneme 2</span>
                        <span class="dots"></span>
                        <span>2</span>
                    </div>

                    <div class="item">
                        <span>Deneme 3</span>
                        <span class="dots"></span>
                        <span>3</span>
                    </div>

                    <div class="item">
                        <span>Deneme 4</span>
                        <span class="dots"></span>
                        <span>4</span>
                    </div>

                    <div class="item">
                        <span>Deneme 5</span>
                        <span class="dots"></span>
                        <span>5</span>
                    </div>

                    <div class="item">
                        <span>Deneme 6</span>
                        <span class="dots"></span>
                        <span>6</span>
                    </div>

                    <div class="item">
                        <span>Deneme 7</span>
                        <span class="dots"></span>
                        <span>7</span>
                    </div>

                    <div class="item">
                        <span>Deneme 8</span>
                        <span class="dots"></span>
                        <span>8</span>
                    </div>

                </div>

            </div>

        </div>


        <!-- ORTA CİLT -->

        <div class="binding"></div>


        <!-- SAYFA ÇEVİRME KATMANI -->

        <div id="turningPage"></div>

        <div
            class="turn-shadow"
            id="turnShadow"
        ></div>


        <!-- ALT KÖŞE -->

        <div
            class="page-handle"
            id="pageHandle"
        ></div>

    </div>

</div>


<!-- KONTROLLER -->

<div
    class="controls"
    id="controls"
>

    <button onclick="previousPage()">
        ‹ Önceki
    </button>

    <button onclick="nextPage()">
        Sonraki ›
    </button>

</div>


<script>

/* =====================================================
   DEĞİŞKENLER
   ===================================================== */

const book =
    document.getElementById("book");

const turningPage =
    document.getElementById("turningPage");

const handle =
    document.getElementById("pageHandle");

const shadow =
    document.getElementById("turnShadow");

let progress = 0;

let dragging = false;

let startX = 0;


/* =====================================================
   KİTABI AÇ
   ===================================================== */

function openBook() {

    document.getElementById(
        "closedBook"
    ).style.display = "none";

    book.style.display = "block";

    document.getElementById(
        "controls"
    ).style.display = "flex";

    createTurningPage();

    updateTurningPage(0);
}


/* =====================================================
   ÇEVRİLEN SAYFAYI OLUŞTUR
   ===================================================== */

function createTurningPage() {

    turningPage.innerHTML = "";

    for (
        let i = 0;
        i < 14;
        i++
    ) {

        const strip =
            document.createElement("div");

        strip.className =
            "turn-strip";

        strip.style.left =
            `${i * 7.1428}%`;

        turningPage.appendChild(
            strip
        );
    }
}


/* =====================================================
   MARTI KANADI SAYFA HAREKETİ
   ===================================================== */

function updateTurningPage(value) {

    progress =
        Math.max(
            0,
            Math.min(
                1,
                value
            )
        );

    const strips =
        document.querySelectorAll(
            ".turn-strip"
        );

    strips.forEach(
        (strip, index) => {

            const x =
                index / 13;

            /*
               Kıvrımın merkezi
            */

            const curve =
                Math.sin(
                    x * Math.PI
                );

            /*
               Sayfa dönüşü
            */

            const rotation =
                -180 * progress;

            /*
               Dalga etkisi
            */

            const wave =
                curve *
                32 *
                Math.sin(
                    progress * Math.PI
                );

            /*
               Yukarı kalkma
            */

            const lift =
                curve *
                18 *
                Math.sin(
                    progress * Math.PI
                );

            /*
               Derinlik
            */

            const depth =
                curve *
                -45 *
                Math.sin(
                    progress * Math.PI
                );

            strip.style.transform = `
                translateZ(${depth}px)
                translateY(${-lift}px)
                rotateY(${rotation + wave}deg)
            `;

            /*
               Kenarlarda ve merkezde
               hafif ışık farkı
            */

            const darkness =
                curve *
                .18 *
                Math.sin(
                    progress * Math.PI
                );

            strip.style.boxShadow = `
                inset -12px 0 18px
                rgba(0,0,0,${darkness})
            `;
        }
    );

    shadow.style.opacity =
        Math.sin(
            progress * Math.PI
        ) * .8;
}


/* =====================================================
   SONRAKİ
   ===================================================== */

function nextPage() {

    animate(
        progress,
        1
    );
}


/* =====================================================
   ÖNCEKİ
   ===================================================== */

function previousPage() {

    animate(
        progress,
        0
    );
}


/* =====================================================
   ANİMASYON
   ===================================================== */

function animate(
    from,
    to
) {

    const duration =
        1100;

    const start =
        performance.now();

    function frame(now) {

        let t =
            (now - start) /
            duration;

        t =
            Math.min(
                t,
                1
            );

        /*
           Yumuşak başlangıç ve bitiş
        */

        const eased =
            t < .5
                ? 2 * t * t
                : 1 -
                  Math.pow(
                      -2 * t + 2,
                      2
                  ) / 2;

        updateTurningPage(
            from +
            (to - from) *
            eased
        );

        if (t < 1) {

            requestAnimationFrame(
                frame
            );

        }

    }

    requestAnimationFrame(
        frame
    );
}


/* =====================================================
   FARE İLE TUT
   ===================================================== */

handle.addEventListener(
    "mousedown",
    function(event) {

        dragging = true;

        startX =
            event.clientX;
    }
);


/* =====================================================
   FARE HAREKETİ
   ===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging) {
            return;
        }

        const halfWidth =
            book.offsetWidth / 2;

        const distance =
            startX -
            event.clientX;

        updateTurningPage(
            distance /
            halfWidth
        );
    }
);


/* =====================================================
   BIRAK
   ===================================================== */

document.addEventListener(
    "mouseup",
    function() {

        if (!dragging) {
            return;
        }

        dragging = false;

        if (
            progress > .5
        ) {

            animate(
                progress,
                1
            );

        } else {

            animate(
                progress,
                0
            );
        }
    }
);


/* =====================================================
   DOKUNMATİK
   ===================================================== */

handle.addEventListener(
    "touchstart",
    function(event) {

        dragging = true;

        startX =
            event.touches[0].clientX;

    },
    {
        passive: true
    }
);


/* =====================================================
   DOKUNMATİK HAREKET
   ===================================================== */

document.addEventListener(
    "touchmove",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();

        const halfWidth =
            book.offsetWidth / 2;

        const distance =
            startX -
            event.touches[0].clientX;

        updateTurningPage(
            distance /
            halfWidth
        );

    },
    {
        passive: false
    }
);


/* =====================================================
   DOKUNMATİK BIRAK
   ===================================================== */

document.addEventListener(
    "touchend",
    function() {

        if (!dragging) {
            return;
        }

        dragging = false;

        if (
            progress > .5
        ) {

            animate(
                progress,
                1
            );

        } else {

            animate(
                progress,
                0
            );
        }

    }
);


/* =====================================================
   KLAVYE
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            nextPage();
        }

        if (
            event.key === "ArrowLeft"
        ) {

            previousPage();
        }

    }
);

</script>

</body>
</html>
