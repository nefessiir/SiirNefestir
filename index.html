<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #51463a 0%,
            #302923 55%,
            #1e1a17 100%
        );

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =====================================================
   KAPALI KITAP
   ===================================================== */

#closedBook {

    position: absolute;

    left: 50%;
    top: 50%;

    width: auto;
    height: auto;

    transform:
        translate(-50%, -50%);

    cursor: pointer;

    transition:
        transform .8s ease;

    user-select: none;
    -webkit-user-select: none;

    overflow: hidden;
}


/* =====================================================
   KAPAK GORSELINI GERCEK ORANINDA KORU
   ===================================================== */

.cover {

    display: block;

    width: 360px;
    height: 520px;

    background:
        url("kapak-gorsel.jpg")
        center
        center
        no-repeat;

    background-size:
        contain;

    border-radius:
        8px 20px 20px 8px;

    box-shadow:
        0 35px 70px rgba(0,0,0,.58),
        inset 5px 0 12px rgba(255,255,255,.08);

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;
}


#closedBook:hover {

    transform:
        translate(-50%, -50%)
        scale(1.025);
}


/* =====================================================
   ACIK KITAP
   ORAN:
   0.70 + 0.70 = 1.40
   ===================================================== */

#book {

    display: none;

    position: absolute;

    width:
        min(1260px, 96vw);

    aspect-ratio:
        1.40 / 1;

    height: auto;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    perspective:
        2200px;

    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   KITAP TABANI
   ===================================================== */

.book-base {

    position: absolute;

    inset: 0;

    transform-style:
        preserve-3d;

    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   STATIK SAYFALAR
   ===================================================== */

.static-page {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background:
        #f3ead8;

    overflow: hidden;

    box-shadow:
        0 10px 22px
        rgba(0,0,0,.18);

    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   SOL SAYFA
   ===================================================== */

.static-page.left {

    left: 0;

    border-radius:
        14px 0 0 14px;

    transform:
        perspective(1400px)
        rotateY(3deg)
        rotateX(-1deg);

    transform-origin:
        right center;
}


/* =====================================================
   SAG SAYFA
   ===================================================== */

.static-page.right {

    right: 0;

    border-radius:
        0 14px 14px 0;

    transform:
        perspective(1400px)
        rotateY(-3deg)
        rotateX(1deg);

    transform-origin:
        left center;
}


/* =====================================================
   SAYFA GOLGE / BOMBE
   ===================================================== */

.static-page::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.11),
            transparent 14%,
            transparent 84%,
            rgba(0,0,0,.10)
        );

    opacity: .7;
}


/* =====================================================
   GUN BATIMI
   ===================================================== */

.picture {

    position: absolute;

    inset: 0;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #e6a16f 0%,
            #efb77f 28%,
            #f3d19a 52%,
            #8e9da0 53%,
            #506d75 70%,
            #243d48 100%
        );

    pointer-events: none;
}


/* GUNES */

.picture::before {

    content: "";

    position: absolute;

    width: 95px;
    height: 95px;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        #f8d78c;

    box-shadow:
        0 0 35px
        rgba(255,205,110,.75);
}


/* DENIZ ISILTI */

.picture::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: 18%;

    height: 24%;

    background:
        linear-gradient(
            180deg,
            rgba(238,205,145,.45),
            rgba(238,205,145,.08),
            transparent
        );

    opacity: .7;
}


/* =====================================================
   YELKENLI
   ===================================================== */

.pictureText {

    display: block;

    position: absolute;

    left: 24%;
    bottom: 22%;

    width: 120px;
    height: 65px;

    z-index: 3;

    pointer-events: none;
}


/* DIREK */

.pictureText::before {

    content: "";

    position: absolute;

    left: 52px;
    bottom: 5px;

    width: 3px;
    height: 60px;

    background:
        #3d3028;

    transform:
        rotate(-3deg);
}


/* YELKEN */

.pictureText::after {

    content: "";

    position: absolute;

    left: 55px;
    bottom: 23px;

    width: 0;
    height: 0;

    border-top:
        34px solid transparent;

    border-right:
        58px solid
        rgba(245,231,203,.92);

    border-bottom:
        2px solid transparent;
}


/* =====================================================
   ICINDEKILER
   ===================================================== */

.contents {

    position: absolute;

    inset: 0;

    padding:
        7% 9%;

    background:
        #f3ead8;

    user-select: none;
    -webkit-user-select: none;

    pointer-events: none;
}

.contents h2 {

    margin:
        0 0 35px;

    text-align:
        center;

    font-size:
        clamp(24px, 2.4vw, 34px);

    font-weight:
        normal;
}

.line {

    height:
        1px;

    margin-bottom:
        25px;

    background:
        rgba(60,40,20,.3);
}

.item {

    display:
        flex;

    margin:
        15px 0;

    font-size:
        clamp(14px, 1.35vw, 18px);

    user-select:
        none;

    -webkit-user-select:
        none;
}

.dots {

    flex:
        1;

    margin:
        0 10px;

    border-bottom:
        1px dotted #8b7964;
}


/* =====================================================
   DIVIT KALEM - MAVI MUREKKEP
   ===================================================== */

.poem-text {

    position: absolute;

    left: 10%;
    right: 10%;
    top: 12%;

    color:
        #174f88;

    font-family:
        "URW Chancery L",
        "Apple Chancery",
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size:
        clamp(20px, 2vw, 31px);

    line-height:
        1.55;

    font-weight:
        normal;

    letter-spacing:
        .2px;

    transform:
        rotate(-1deg);

    text-shadow:
        .25px .25px 0
        rgba(20,60,110,.22);

    pointer-events:
        none;

    user-select:
        none;

    -webkit-user-select:
        none;
}


/* =====================================================
   CILT
   ===================================================== */

.binding {

    position: absolute;

    z-index:
        150;

    left:
        50%;

    top:
        -1%;

    width:
        18px;

    height:
        102%;

    transform:
        translateX(-50%);

    pointer-events:
        none;

    background:
        linear-gradient(
            90deg,
            rgba(30,20,10,.06),
            rgba(40,25,15,.30),
            rgba(255,255,255,.14),
            rgba(30,20,10,.16)
        );

    box-shadow:
        0 0 15px
        rgba(0,0,0,.20);
}


/* =====================================================
   CEVRILEN SAYFA
   ===================================================== */

#turnPage {

    position: absolute;

    z-index:
        100;

    top:
        0;

    left:
        50%;

    width:
        50%;

    height:
        100%;

    transform-style:
        preserve-3d;

    transform-origin:
        left center;

    pointer-events:
        none;

    user-select:
        none;

    -webkit-user-select:
        none;

    transform:
        rotateY(0deg);
}


/* =====================================================
   ON YUZ
   ===================================================== */

.turn-front {

    position: absolute;

    inset: 0;

    overflow:
        hidden;

    backface-visibility:
        hidden;

    -webkit-backface-visibility:
        hidden;

    border-radius:
        0 14px 14px 0;

    background:
        #f3ead8;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.18);

    user-select:
        none;

    -webkit-user-select:
        none;

    pointer-events:
        none;
}


/* =====================================================
   ARKA YUZ
   TAMAMEN BOS
   AYNALAMA YOK
   ===================================================== */

.turn-back {

    position: absolute;

    inset: 0;

    overflow:
        hidden;

    transform:
        rotateY(180deg);

    backface-visibility:
        hidden;

    -webkit-backface-visibility:
        hidden;

    border-radius:
        14px 0 0 14px;

    background:
        #f3ead8;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.18);

    pointer-events:
        none;

    user-select:
        none;

    -webkit-user-select:
        none;
}


/* =====================================================
   SAYFA KIVRIM ISIGI
   COK HAFIF
   ===================================================== */

.turn-front::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.08),
            transparent 16%,
            transparent 47%,
            rgba(255,255,255,.12) 50%,
            transparent 54%,
            transparent 84%,
            rgba(0,0,0,.10)
        );

    opacity:
        .75;
}


/* =====================================================
   SAYFA GOLGESI
   ===================================================== */

#turnShadow {

    position: absolute;

    z-index:
        80;

    top:
        0;

    left:
        49.5%;

    width:
        1px;

    height:
        100%;

    pointer-events:
        none;

    opacity:
        0;

    background:
        rgba(40,25,15,.20);

    filter:
        blur(7px);

    transform:
        translateX(-50%);
}


/* =====================================================
   ALT SAG KOSENIN TUTMA ALANI
   ===================================================== */

#pageHandle {

    position: absolute;

    z-index:
        200;

    right:
        0;

    bottom:
        0;

    width:
        125px;

    height:
        125px;

    cursor:
        grab;

    pointer-events:
        auto;

    border-radius:
        100% 0 0 0;

    background:
        radial-gradient(
            circle at bottom right,
            rgba(255,255,255,.20),
            transparent 70%
        );

    user-select:
        none;

    -webkit-user-select:
        none;
}

#pageHandle:active {

    cursor:
        grabbing;
}


/* =====================================================
   SURUKLEMEDE SECIM YOK
   ===================================================== */

body.dragging,
body.dragging * {

    user-select:
        none !important;

    -webkit-user-select:
        none !important;

    cursor:
        grabbing !important;
}


/* =====================================================
   KONTROLLER
   ===================================================== */

.controls {

    position:
        fixed;

    left:
        50%;

    bottom:
        20px;

    transform:
        translateX(-50%);

    display:
        none;

    gap:
        15px;

    z-index:
        500;
}

button {

    padding:
        10px 20px;

    border:
        1px solid #74614d;

    background:
        #211b16;

    color:
        #f5ead8;

    font-family:
        Georgia,
        serif;

    cursor:
        pointer;
}


/* =====================================================
   MOBIL
   ===================================================== */

@media(max-width:700px) {

    #closedBook {

        max-width:
            86vw;

        max-height:
            82vh;
    }

    .cover {

        width:
            280px;

        height:
            410px;

        max-width:
            86vw;

        max-height:
            82vh;
    }

    #book {

        width:
            96vw;

        aspect-ratio:
            1.40 / 1;
    }

    .contents {

        padding:
            6% 6%;
    }

    .contents h2 {

        font-size:
            20px;

        margin-bottom:
            18px;
    }

    .item {

        font-size:
            11px;

        margin:
            9px 0;
    }

    #pageHandle {

        width:
            90px;

        height:
            90px;
    }

    .poem-text {

        font-size:
            15px;

        line-height:
            1.4;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     KAPALI KITAP
     ===================================================== -->

<div
    id="closedBook"
    onclick="openBook()"
>

    <div class="cover"></div>

</div>


<!-- =====================================================
     ACIK KITAP
     ===================================================== -->

<div id="book">

    <div class="book-base">


        <!-- SOL SAYFA -->

        <div class="static-page left">

            <div class="picture">

                <div class="pictureText"></div>

            </div>

        </div>


        <!-- SAG SAYFA -->

        <div class="static-page right">

            <div class="contents">

                <h2>İçindekiler</h2>

                <div class="line"></div>

                <div class="item">
                    <span>Deneme 1</span>
                    <span class="dots"></span>
                    <span>1</span>
                </div>

                <div class="item">
                    <span>Deneme 2</span>
                    <span class="dots"></span>
                    <span>2</span>
                </div>

                <div class="item">
                    <span>Deneme 3</span>
                    <span class="dots"></span>
                    <span>3</span>
                </div>

                <div class="item">
                    <span>Deneme 4</span>
                    <span class="dots"></span>
                    <span>4</span>
                </div>

                <div class="item">
                    <span>Deneme 5</span>
                    <span class="dots"></span>
                    <span>5</span>
                </div>

                <div class="item">
                    <span>Deneme 6</span>
                    <span class="dots"></span>
                    <span>6</span>
                </div>

                <div class="item">
                    <span>Deneme 7</span>
                    <span class="dots"></span>
                    <span>7</span>
                </div>

                <div class="item">
                    <span>Deneme 8</span>
                    <span class="dots"></span>
                    <span>8</span>
                </div>

            </div>

        </div>


        <!-- =================================================
             CILT
             ================================================= -->

        <div class="binding"></div>


        <!-- =================================================
             CEVRILEN SAYFA
             ================================================= -->

        <div id="turnPage">

            <div class="turn-front">

                <div class="contents">

                    <h2>İçindekiler</h2>

                    <div class="line"></div>

                    <div class="item">
                        <span>Deneme 1</span>
                        <span class="dots"></span>
                        <span>1</span>
                    </div>

                    <div class="item">
                        <span>Deneme 2</span>
                        <span class="dots"></span>
                        <span>2</span>
                    </div>

                    <div class="item">
                        <span>Deneme 3</span>
                        <span class="dots"></span>
                        <span>3</span>
                    </div>

                    <div class="item">
                        <span>Deneme 4</span>
                        <span class="dots"></span>
                        <span>4</span>
                    </div>

                </div>

            </div>


            <!--
                 ARKA YUZ BILEREK BOS.
                 AYNALAMA OLMAYACAK.
            -->

            <div class="turn-back"></div>

        </div>


        <!-- GOLGE -->

        <div id="turnShadow"></div>


        <!-- ALT SAG KOSENIN TUTMA NOKTASI -->

        <div id="pageHandle"></div>

    </div>

</div>


<!-- =====================================================
     KONTROLLER
     ===================================================== -->

<div
    class="controls"
    id="controls"
>

    <button onclick="previousPage()">
        ‹ Önceki
    </button>

    <button onclick="nextPage()">
        Sonraki ›
    </button>

</div>


<script>

/* =====================================================
   DEGISKENLER
   ===================================================== */

const book =
    document.getElementById("book");

const turnPage =
    document.getElementById("turnPage");

const pageHandle =
    document.getElementById("pageHandle");

const turnShadow =
    document.getElementById("turnShadow");

let progress = 0;

let dragging = false;

let startX = 0;

let startProgress = 0;


/* =====================================================
   KITABI AC
   ===================================================== */

function openBook() {

    document.getElementById(
        "closedBook"
    ).style.display = "none";

    book.style.display = "block";

    document.getElementById(
        "controls"
    ).style.display = "flex";

    updatePage(0);
}


/* =====================================================
   SAYFAYI HAREKET ETTIR
   ===================================================== */

function updatePage(value) {

    progress =
        Math.max(
            0,
            Math.min(
                1,
                value
            )
        );


    /*
       -180 derece:
       sagdaki sayfa cilt merkezinden
       sola dogru kapanir.

       Sayfa cilt noktasindan ayrilmaz.

       Y ekseninde yukari kaldirma yok.
       Z ekseninde havaya kaldirma yok.
    */

    const angle =
        -180 * progress;


    /*
       Cok hafif orta kavis hissi.
       Fiziksel kaldirma yok.
       Sadece sayfa yuzeyinde cok hafif
       egim goruntusu.
    */

    const curve =
        Math.sin(
            progress * Math.PI
        );


    const slightCurve =
        curve * 1.4;


    turnPage.style.transform = `
        rotateY(${angle}deg)
        rotateX(${slightCurve}deg)
    `;


    /*
       Cilt cevresinde cok hafif golge.
    */

    turnShadow.style.opacity =
        curve * .35;
}


/* =====================================================
   SONRAKI SAYFA
   ===================================================== */

function nextPage() {

    animatePage(
        progress,
        1
    );
}


/* =====================================================
   ONCEKI SAYFA
   ===================================================== */

function previousPage() {

    animatePage(
        progress,
        0
    );
}


/* =====================================================
   ANIMASYON
   ===================================================== */

function animatePage(
    from,
    to
) {

    const duration =
        1000;

    const start =
        performance.now();


    function frame(now) {

        let t =
            (now - start) /
            duration;

        t =
            Math.min(
                t,
                1
            );


        const eased =
            t < .5
                ? 2 * t * t
                : 1 -
                  Math.pow(
                      -2 * t + 2,
                      2
                  ) / 2;


        const value =
            from +
            (to - from) *
            eased;


        updatePage(
            value
        );


        if (t < 1) {

            requestAnimationFrame(
                frame
            );

        }

    }

    requestAnimationFrame(
        frame
    );
}


/* =====================================================
   FARE ILE SAYFAYI TUT
   ===================================================== */

pageHandle.addEventListener(
    "mousedown",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        dragging = true;

        document.body.classList.add(
            "dragging"
        );

        startX =
            event.clientX;

        startProgress =
            progress;

    }
);


/* =====================================================
   FAREYI SURUKLE
   ===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();


        const width =
            book.offsetWidth / 2;


        const distance =
            startX -
            event.clientX;


        const movement =
            distance /
            width;


        updatePage(
            startProgress +
            movement
        );

    },
    true
);


/* =====================================================
   FAREYI BIRAK
   ===================================================== */

document.addEventListener(
    "mouseup",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        dragging = false;

        document.body.classList.remove(
            "dragging"
        );


        if (progress >= .5) {

            animatePage(
                progress,
                1
            );

        } else {

            animatePage(
                progress,
                0
            );

        }

    },
    true
);


/* =====================================================
   TELEFON / TABLET
   ===================================================== */

pageHandle.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        dragging = true;

        document.body.classList.add(
            "dragging"
        );

        startX =
            event.touches[0].clientX;

        startProgress =
            progress;

    },
    {
        passive: false
    }
);


/* =====================================================
   DOKUNMATIK SURUKLE
   ===================================================== */

document.addEventListener(
    "touchmove",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();


        const width =
            book.offsetWidth / 2;


        const distance =
            startX -
            event.touches[0].clientX;


        updatePage(
            startProgress +
            distance /
            width
        );

    },
    {
        passive: false,
        capture: true
    }
);


/* =====================================================
   DOKUNMATIK BIRAK
   ===================================================== */

document.addEventListener(
    "touchend",
    function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        dragging = false;

        document.body.classList.remove(
            "dragging"
        );


        if (progress >= .5) {

            animatePage(
                progress,
                1
            );

        } else {

            animatePage(
                progress,
                0
            );

        }

    },
    {
        capture: true
    }
);


/* =====================================================
   KLAVYE
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (dragging) {
            return;
        }


        if (
            event.key === "ArrowRight"
        ) {

            nextPage();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousPage();

        }

    }
);


/* =====================================================
   BASLANGIC
   ===================================================== */

updatePage(0);

</script>

</body>
</html>
