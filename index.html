<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;

    background-image: url("yeni_arka_plan0.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* 3D hareket alanı */
.kitap-alani {
    width: 39%;
    height: calc(82vh + 4cm);

    transform: translateX(8cm);

    perspective: 1800px;

    position: relative;
}

/* Kitap kapağı */
.kitap-kapagi {
    width: 100%;
    height: 100%;

    object-fit: fill;
    display: block;

    cursor: pointer;

    transform-origin: left center;

    transform: rotateY(0deg);

    transition:
        transform 1.4s cubic-bezier(0.22, 0.61, 0.36, 1);

    position: absolute;
    left: 0;
    top: 0;

    backface-visibility: hidden;
}

/* Kapak açıldığında sola doğru 3D döner */
.kitap-kapagi.acik {
    transform: rotateY(-180deg);
}

</style>
</head>

<body>

<div class="kitap-alani">

    <img
        src="kitap_kapagi.png"
        class="kitap-kapagi"
        id="kitapKapagi"
        alt="Şiir Nefestir"
    >

</div>

<script>

const kitapKapagi = document.getElementById("kitapKapagi");

kitapKapagi.addEventListener("click", function () {
    kitapKapagi.classList.toggle("acik");
});

</script>

</body>
</html>
