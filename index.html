<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<!-- Gerçekçi Sayfa Kıvrılma ve Çevirme Motoru (StPageFlip) -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
}

/* KİTAP ANA KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    transform: translateX(4cm);
    transform-style: preserve-3d;
    z-index: 2;
}

/* SAYFA YAPILARI (StPageFlip İçin) */
#gercek-kitap {
    display: none; /* Motor verileri okurken gizli tutar, hazırlanınca gösterir */
}

.sayfa-oge {
    background-color: #fdfbf7;
    overflow: hidden;
    width: 100%;
    height: 100%;
}

.sayfa-oge img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* ÖZEL KAPAK SAYFASI VE ÜZERİNDEKİ YAZI STİLİ */
.kapak-sayfa {
    position: relative;
    width: 100%;
    height: 100%;
}

.kapak-sayfa img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.1vw, 20px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    pointer-events: none;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<div class="kitap-kapsayici">
    <!-- SAYFALARIN TANIMLANDIĞI ALAN -->
    <div id="gercek-kitap">
        
        <!-- Sayfa 1: Ön Kapak (Sert Kapak - Kıvrılmaz, tek parça döner) -->
        <div class="sayfa-oge" data-density="hard">
            <div class="kapak-sayfa">
                <img src="kapak.jpg" alt="Ön Kapak">
                <div class="kapak-yazi">
                    Şiir'e hatıra<br><br>
                    kelimelerden..<br>
                    hayattan..<br>
                    babasından.<br><br><br>
                    <span class="imza">S.O.A</span>
                </div>
            </div>
        </div>

        <!-- Sayfa 2: Sol İç Sayfa (Yumuşak Kağıt - Kıvrılarak çevrilir) -->
        <div class="sayfa-oge" data-density="soft">
            <img src="sol_sayfa.png" alt="Sol İç Sayfa">
        </div>

        <!-- Sayfa 3: Sağ İç Sayfa (Yumuşak Kağıt - Kıvrılarak çevrilir) -->
        <div class="sayfa-oge" data-density="soft">
            <img src="sag_sayfa.png" alt="Sağ İç Sayfa">
        </div>

        <!-- Sayfa 4: Arka Kapak (Sert Kapak - Kıvrılmaz, tek parça döner) -->
        <div class="sayfa-oge" data-density="hard">
            <img src="kapak.jpg" alt="Arka Kapak">
        </div>

    </div>
</div>

<script>
window.addEventListener("load", function () {
    const testImg = new Image();
    testImg.src = "kapak.jpg";
    
    testImg.onload = function () {
        let hedefYukseklik = window.innerHeight * 0.75;
        let aspectRasyon = testImg.width / testImg.height;
        let hedefGenislik = hedefYukseklik * aspectRasyon;

        const pageFlip = new St.PageFlip(document.getElementById('gercek-kitap'), {
            width: Math.round(hedefGenislik),
            height: Math.round(hedefYukseklik),
            size: "fixed",
            minWidth: 300,
            maxWidth: 1000,
            minHeight: 400,
            maxHeight: 1200,
            showCover: true,
            mobileScrollSupport: false,
            maxShadowOpacity: 0.5,
            flippingTime: 1200
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.sayfa-oge'));
        document.getElementById('gercek-kitap').style.display = "block";
    };
});
</script>

</body>
</html>
