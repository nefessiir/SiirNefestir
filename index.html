<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background:
        radial-gradient(circle at center, #62584c 0%, #352f29 55%, #211e1a 100%);
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    color: #2d241b;
}

/* =========================================================
   ANA SAHNE
========================================================= */

.scene {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    perspective: 2200px;
}

/* =========================================================
   KAPALI KİTAP
========================================================= */

.closed-book {
    position: absolute;

    width: min(520px, 72vw);
    aspect-ratio: 0.70;

    cursor: pointer;

    transform-style: preserve-3d;

    transition:
        transform 1.3s cubic-bezier(.2,.8,.2,1),
        opacity .8s ease;
}

.closed-book:hover {
    transform:
        rotateY(-5deg)
        rotateX(2deg)
        scale(1.015);
}

.closed-book.opening {
    transform:
        rotateY(-75deg)
        scale(.92)
        translateX(-15%);
    opacity: 0;
    pointer-events: none;
}

/* Kitabın gövdesi */

.book-cover {
    position: absolute;
    inset: 0;

    border-radius: 5px 13px 13px 5px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            transparent 25%,
            rgba(0,0,0,.18)
        ),
        #403429;

    box-shadow:
        0 30px 70px rgba(0,0,0,.55),
        inset 4px 0 0 rgba(255,255,255,.06),
        inset -5px 0 0 rgba(0,0,0,.25);

    border: 1px solid rgba(255,255,255,.1);
}

/* Kapak içindeki görsel */

.cover-image {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.30)
        ),
        url("kapak-gorsel.jpg");

    background-size: cover;
    background-position: center;

    opacity: .88;
}

/* Kapak yazıları */

.cover-writing {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 40px;
    color: #f8eee0;

    text-shadow:
        0 2px 4px rgba(0,0,0,.65),
        0 0 15px rgba(0,0,0,.35);
}

.cover-title {
    font-size: clamp(32px, 5vw, 55px);
    letter-spacing: 4px;
    font-weight: normal;
    margin-bottom: 20px;
}

.cover-subtitle {
    font-size: clamp(15px, 2vw, 21px);
    font-style: italic;
    line-height: 1.6;
    max-width: 85%;
}

.cover-author {
    margin-top: 35px;
    font-size: 19px;
    letter-spacing: 2px;
}

/* =========================================================
   AÇIK KİTAP
========================================================= */

.book {
    position: relative;

    width: min(1100px, 94vw);
    height: min(720px, 82vh);

    display: flex;

    transform-style: preserve-3d;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 1s ease;
}

.book.visible {
    opacity: 1;
    pointer-events: auto;
}

/* =========================================================
   SAYFALAR
========================================================= */

.page {
    position: relative;

    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            rgba(90,65,40,.10),
            transparent 10%,
            transparent 90%,
            rgba(90,65,40,.08)
        ),
        #f4ead7;

    overflow: hidden;

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);

    backface-visibility: hidden;

    border-top: 1px solid rgba(70,45,20,.15);
    border-bottom: 1px solid rgba(70,45,20,.15);
}

.left-page {
    border-radius: 7px 0 0 7px;

    box-shadow:
        inset -18px 0 25px rgba(60,40,20,.12),
        -8px 10px 25px rgba(0,0,0,.25);
}

.right-page {
    border-radius: 0 7px 7px 0;

    box-shadow:
        inset 18px 0 25px rgba(60,40,20,.12),
        8px 10px 25px rgba(0,0,0,.25);
}

/* Kitabın ortası */

.book-spine {
    position: absolute;

    left: 50%;
    top: 0;

    width: 4px;
    height: 100%;

    transform: translateX(-50%);

    z-index: 50;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.20),
            rgba(255,255,255,.25),
            rgba(0,0,0,.20)
        );

    pointer-events: none;
}

/* =========================================================
   SAYFA İÇERİĞİ
========================================================= */

.page-content {
    width: 100%;
    height: 100%;

    padding: 55px 55px 45px;

    overflow: hidden;
}

.page-title {
    text-align: center;

    font-size: 30px;
    font-weight: normal;

    margin: 0 0 35px;

    letter-spacing: 2px;
}

.page-line {
    height: 1px;

    background: rgba(70,45,25,.25);

    margin: 15px 0 25px;
}

/* =========================================================
   SOL GÖRSEL SAYFA
========================================================= */

.visual-page {
    padding: 0;

    position: relative;
}

.visual-page::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.03),
            transparent 50%,
            rgba(0,0,0,.10)
        );

    pointer-events: none;
}

.visual-image {
    width: 100%;
    height: 100%;

    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.02),
            rgba(0,0,0,.20)
        ),
        url("kapak-gorsel.jpg");

    background-size: cover;
    background-position: center;
}

.visual-writing {
    position: absolute;

    left: 8%;
    right: 8%;
    bottom: 10%;

    text-align: center;

    color: #fff7eb;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8),
        0 0 15px rgba(0,0,0,.5);
}

.visual-writing h2 {
    margin: 0 0 12px;

    font-size: 32px;
    font-weight: normal;
    letter-spacing: 3px;
}

.visual-writing p {
    margin: 0;

    font-size: 17px;
    font-style: italic;
}

/* =========================================================
   İÇİNDEKİLER
========================================================= */

.contents {
    height: calc(100% - 75px);

    overflow: hidden;
}

.contents-item {
    display: flex;

    align-items: baseline;

    margin-bottom: 13px;

    font-size: 17px;

    cursor: pointer;

    transition: transform .2s ease;
}

.contents-item:hover {
    transform: translateX(5px);
}

.contents-name {
    white-space: nowrap;
}

.contents-dots {
    flex: 1;

    border-bottom: 1px dotted rgba(70,45,25,.45);

    margin: 0 10px;
}

/* =========================================================
   ŞİİR
========================================================= */

.poem-title {
    text-align: center;

    font-size: 26px;

    margin-bottom: 28px;

    font-weight: normal;
}

.poem {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 17px;

    line-height: 1.85;

    white-space: pre-line;

    height: calc(100% - 80px);

    overflow: hidden;
}

.poem-page-number {
    position: absolute;

    bottom: 17px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 13px;

    opacity: .55;
}

/* =========================================================
   BOŞ AYIRICI SAYFA
========================================================= */

.empty-page {
    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 14px;

    color: rgba(60,45,30,.3);

    font-style: italic;
}

/* =========================================================
   SAYFA ÇEVİRME ANİMASYONU
========================================================= */

.turning-page {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    z-index: 100;

    transform-style: preserve-3d;

    transform-origin: left center;

    transition:
        transform 1.15s cubic-bezier(.22,.61,.36,1),
        box-shadow 1.15s ease;

    pointer-events: none;
}

.turning-page.flip {
    transform:
        rotateY(-180deg)
        translateZ(1px);

    box-shadow:
        -20px 10px 45px rgba(0,0,0,.38);
}

.turning-front,
.turning-back {
    position: absolute;

    inset: 0;

    backface-visibility: hidden;

    background: #f4ead7;

    overflow: hidden;
}

.turning-back {
    transform: rotateY(180deg);
}

/* Sayfa kıvrım ışığı */

.turning-page::after {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 45px;

    right: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.16)
        );

    opacity: .5;

    pointer-events: none;
}

/* =========================================================
   KONTROLLER
========================================================= */

.controls {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 14px;

    z-index: 300;
}

.control-button {
    border: 1px solid rgba(255,255,255,.25);

    background: rgba(20,16,12,.65);

    color: #f6ead7;

    padding: 11px 19px;

    border-radius: 4px;

    cursor: pointer;

    font-family: Georgia, serif;

    transition:
        background .2s ease,
        transform .2s ease;
}

.control-button:hover {
    background: rgba(20,16,12,.9);
    transform: translateY(-2px);
}

.page-counter {
    color: #eadcc8;

    font-size: 13px;

    min-width: 90px;

    text-align: center;
}

/* =========================================================
   SES BUTONU
========================================================= */

.listen-button {
    display: block;

    margin: 20px auto 0;

    padding: 9px 18px;

    border: 1px solid rgba(70,45,25,.3);

    background: rgba(255,255,255,.25);

    color: #3d3024;

    border-radius: 3px;

    cursor: pointer;

    font-family: Georgia, serif;
}

/* =========================================================
   MOBİL
========================================================= */

@media (max-width: 800px) {

    .book {
        width: 96vw;
        height: 75vh;
    }

    .page-content {
        padding: 30px 25px;
    }

    .contents-item {
        font-size: 13px;
        margin-bottom: 9px;
    }

    .poem {
        font-size: 14px;
        line-height: 1.65;
    }

    .page-title {
        font-size: 23px;
    }

    .visual-writing h2 {
        font-size: 24px;
    }

    .visual-writing p {
        font-size: 13px;
    }
}

</style>
</head>


<body>

<div class="scene">

    <!-- =====================================================
         KAPALI KİTAP
    ====================================================== -->

    <div
        class="closed-book"
        id="closedBook"
        onclick="openBook()"
    >

        <div class="book-cover">

            <div class="cover-image"></div>

            <div class="cover-writing">

                <div class="cover-title">
                    ŞİİR NEFESTİR
                </div>

                <div class="cover-subtitle">
                    Kelimelerden kızıma,<br>
                    insanlara ve hayata...
                </div>

                <div class="cover-author">
                    Serdar
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         AÇIK KİTAP
    ====================================================== -->

    <div class="book" id="book">

        <div class="page left-page" id="leftPage">
        </div>

        <div class="page right-page" id="rightPage">
        </div>

        <div class="book-spine"></div>

    </div>

</div>


<!-- =========================================================
     KONTROLLER
========================================================= -->

<div class="controls">

    <button
        class="control-button"
        onclick="previousPage()"
    >
        ‹ Önceki
    </button>

    <div
        class="page-counter"
        id="pageCounter"
    >
        1 / 1
    </div>

    <button
        class="control-button"
        onclick="nextPage()"
    >
        Sonraki ›
    </button>

</div>


<!-- =========================================================
     SES
========================================================= -->

<audio id="poemAudio"></audio>


<script>

/* =========================================================
   ŞİİRLER

   Şimdilik sadece prototip şiirler.
   Daha sonra gerçek şiirleri buraya bağlayacağız.
========================================================= */

const poems = [

    {
        number: 1,

        title: "Deneme 1",

        text:
`Yoksam düşlerinde gecelerinde kayıpsam
Bakışların hep donuk
Belki de uzaklarda bir yerdeyim.

Şairler ağlamaz derler...
Ama bazen kelimeler
insanın söyleyemediği her şeyi anlatır.

Bekle…!
Geliyorum!`,

        date: "",

        audio: "sesler/deneme1.mp3"
    },


    {
        number: 2,

        title: "Deneme 2",

        text:
`Kırılgan bir şiirim şimdi
satır aralarında...

Belki ben henüz ölmemişimdir.

Belki bir kelimenin içinde
saklı kalmışımdır.

Belki de hâlâ
bir yerlerde nefes alıyorumdur.`,

        date: "",

        audio: "sesler/deneme2.mp3"
    }

];


/* =========================================================
   SAYFA SİSTEMİ
========================================================= */

let pages = [];

let currentPage = 0;

let bookOpened = false;


/* =========================================================
   SAYFALARI OLUŞTUR
========================================================= */

function createPages() {

    pages = [];


    /* -----------------------------------------------------
       SAYFA 1 — SOL GÖRSEL
    ------------------------------------------------------ */

    pages.push({

        type: "visual"

    });


    /* -----------------------------------------------------
       SAYFA 2 — İÇİNDEKİLER
    ------------------------------------------------------ */

    pages.push({

        type: "contents",

        start: 1

    });


    /* -----------------------------------------------------
       İÇİNDEKİLER DEVAMI
    ------------------------------------------------------ */

    pages.push({

        type: "contents",

        start: 2

    });


    /* -----------------------------------------------------
       BOŞ AYIRICI
    ------------------------------------------------------ */

    pages.push({

        type: "empty"

    });


    /* -----------------------------------------------------
       ŞİİRLER
    ------------------------------------------------------ */

    poems.forEach((poem, index) => {

        /*
           Şimdilik her şiiri iki sayfaya
           ayırıyoruz.

           Gerçek sistemde burada metnin
           sayfa yüksekliğini ölçüp
           otomatik böleceğiz.
        */

        pages.push({

            type: "poem",

            poemIndex: index,

            part: 1

        });


        pages.push({

            type: "poem",

            poemIndex: index,

            part: 2

        });


        /* Şiirler arasına boş sayfa */

        pages.push({

            type: "empty"

        });

    });

}


/* =========================================================
   SAYFA HTML'İ
========================================================= */

function pageHTML(page) {

    if (!page) {

        return `
            <div class="page-content"></div>
        `;

    }


    /* -----------------------------------------------------
       GÖRSEL
    ------------------------------------------------------ */

    if (page.type === "visual") {

        return `

            <div class="visual-page">

                <div class="visual-image"></div>

                <div class="visual-writing">

                    <h2>Şiir Nefestir</h2>

                    <p>
                        Kelimelerden kızıma,
                        insanlara ve hayata...
                    </p>

                </div>

            </div>

        `;

    }


    /* -----------------------------------------------------
       İÇİNDEKİLER
    ------------------------------------------------------ */

    if (page.type === "contents") {

        let html = `

            <div class="page-content">

                <h1 class="page-title">
                    İçindekiler
                </h1>

                <div class="page-line"></div>

                <div class="contents">
        `;


        let start = page.start || 1;

        let end = Math.min(start + 10, poems.length + 1);


        for (let i = start - 1; i < end - 1; i++) {

            const poem = poems[i];

            if (!poem) continue;


            html += `

                <div
                    class="contents-item"
                    onclick="goToPoem(${i})"
                >

                    <span class="contents-name">
                        ${poem.title}
                    </span>

                    <span class="contents-dots"></span>

                    <span>
                        ${i + 5}
                    </span>

                </div>
            `;

        }


        html += `

                </div>

            </div>

        `;

        return html;

    }


    /* -----------------------------------------------------
       BOŞ SAYFA
    ------------------------------------------------------ */

    if (page.type === "empty") {

        return `

            <div class="empty-page">

                <span></span>

            </div>

        `;

    }


    /* -----------------------------------------------------
       ŞİİR
    ------------------------------------------------------ */

    if (page.type === "poem") {

        const poem = poems[page.poemIndex];


        if (!poem) {

            return "";

        }


        return `

            <div class="page-content">

                <h2 class="poem-title">
                    ${poem.title}
                </h2>

                <div class="poem">
                    ${poem.text}
                </div>

                <button
                    class="listen-button"
                    onclick="playPoem(${page.poemIndex})"
                >
                    🎵 Şiiri Dinle
                </button>

                <div class="poem-page-number">
                    ${page.part}
                </div>

            </div>

        `;

    }


    return "";

}


/* =========================================================
   SAYFALARI GÖSTER
========================================================= */

function renderPages() {

    const left = pages[currentPage];

    const right = pages[currentPage + 1];


    document.getElementById("leftPage").innerHTML =
        pageHTML(left);

    document.getElementById("rightPage").innerHTML =
        pageHTML(right);


    document.getElementById("pageCounter").textContent =
        `${currentPage + 1} - ${Math.min(currentPage + 2, pages.length)}
         / ${pages.length}`;

}


/* =========================================================
   KİTABI AÇ
========================================================= */

function openBook() {

    const closedBook =
        document.getElementById("closedBook");

    const book =
        document.getElementById("book");


    closedBook.classList.add("opening");


    setTimeout(() => {

        createPages();

        currentPage = 0;

        renderPages();

        book.classList.add("visible");

        bookOpened = true;

    }, 700);

}


/* =========================================================
   SONRAKİ SAYFA
========================================================= */

function nextPage() {

    if (!bookOpened) return;


    if (currentPage + 2 >= pages.length) {

        return;

    }


    animateTurn(() => {

        currentPage += 2;

        renderPages();

    });

}


/* =========================================================
   ÖNCEKİ SAYFA
========================================================= */

function previousPage() {

    if (!bookOpened) return;


    if (currentPage <= 0) {

        return;

    }


    currentPage -= 2;

    renderPages();

}


/* =========================================================
   GERÇEK SAYFA KIVRILMA ANİMASYONU
========================================================= */

function animateTurn(callback) {

    const rightPage =
        document.getElementById("rightPage");


    const turning =
        document.createElement("div");


    turning.className = "turning-page";


    turning.innerHTML = `

        <div class="turning-front">

            ${rightPage.innerHTML}

        </div>

        <div class="turning-back">

            ${rightPage.innerHTML}

        </div>

    `;


    document.getElementById("book")
        .appendChild(turning);


    requestAnimationFrame(() => {

        turning.classList.add("flip");

    });


    setTimeout(() => {

        turning.remove();

        callback();

    }, 1150);

}


/* =========================================================
   İÇİNDEKİLERDEN ŞİİRE GİT
========================================================= */

function goToPoem(index) {

    /*
       Şiirin pages dizisindeki yerini buluyoruz.
    */

    const found =
        pages.findIndex(page =>
            page.type === "poem" &&
            page.poemIndex === index
        );


    if (found === -1) return;


    /*
       Çift sayfa düzeni nedeniyle
       başlangıcı çift sayıya getiriyoruz.
    */

    currentPage =
        found % 2 === 0
            ? found
            : found - 1;


    renderPages();

}


/* =========================================================
   ŞİİR SESİ
========================================================= */

function playPoem(index) {

    const poem = poems[index];

    if (!poem) return;


    const audio =
        document.getElementById("poemAudio");


    /*
       Aynı şiirin sesi çalıyorsa durdur.
    */

    if (
        audio.src &&
        audio.src.includes(poem.audio) &&
        !audio.paused
    ) {

        audio.pause();

        return;

    }


    audio.pause();

    audio.currentTime = 0;

    audio.src = poem.audio;

    audio.play().catch(() => {

        alert(
            "Bu şiire henüz ses dosyası eklenmedi."
        );

    });

}


/* =========================================================
   ŞİİR DEĞİŞTİĞİNDE SESİ KONTROL ET
========================================================= */

function stopAudioIfPoemChanged() {

    const audio =
        document.getElementById("poemAudio");

    if (!audio) return;

}


/* =========================================================
   KLAVYE
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!bookOpened) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                openBook();

            }

            return;

        }


        if (event.key === "ArrowRight") {

            nextPage();

        }


        if (event.key === "ArrowLeft") {

            previousPage();

        }

    }
);


/* =========================================================
   BAŞLANGIÇ
========================================================= */

createPages();

</script>

</body>
</html>
```
