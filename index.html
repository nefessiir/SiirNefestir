<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Nefestir</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background-image: url("arka_plan.jpg");
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* KİTAP KAPSAYICISI */
.kitap-kapsayici {
    position: relative;
    width: 20%;
    height: auto;
    transform: translateX(8cm);
    transform-style: preserve-3d;
    transform-origin: right bottom;
    z-index: 2;
}

/* 1. SAĞDA SABİT DURAN ALT KAPAK */
.sag-kapak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.sag-kapak img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTAP GÖVDESİ */
.acik-kitap-alan {
    position: absolute;
    top: 0.5cm;
    left: calc(-100% - 0.6cm);
    width: calc(200% - 1.3cm);
    height: calc(100% - 1cm);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.1882);
    transform-origin: left center;
    clip-path: inset(0 0 0 100%);
    transition: opacity 0.8s ease-in-out, clip-path 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.kitap-kapsayici.acildi .acik-kitap-alan {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transition: opacity 0.4s ease-in-out 0.6s, clip-path 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) 0.6s;
}

.acik-kitap-alan img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

/* AÇIK KİTABIN SOL KANAT YAZI ALANI */
.sol-kanat-yazi {
    position: absolute;
    top: 0.4cm;
    left: calc(0.75cm + 0.3cm + 1cm);
    width: calc(50% - 2.5cm);
    height: calc(100% - 0.8cm);
    font-family: 'Dancing Script', cursive, serif;
    font-size: 9.5pt;
    line-height: 1.25;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 3px rgba(26, 75, 130, 0.35), 0 0 1px rgba(26, 75, 130, 0.6);
    box-sizing: border-box;
    pointer-events: none;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    hyphens: none;
    white-space: pre-wrap;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
}

.sol-kanat-yazi.goster {
    opacity: 1;
}

/* BAŞLIKLARIN ORTALANMASI VE BÜYÜTÜLMESİ */
.sayfa-baslik {
    text-align: center;
    display: block;
    width: 100%;
    font-weight: 700;
    font-size: 1.15em;
    margin-top: 0.5em; 
    margin-bottom: 0.2em;
}

/* SAYFA NUMARASI STİLİ */
.sayfa-numara {
    position: absolute;
    bottom: 0.4cm;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Dancing Script', cursive, serif;
    font-size: 10pt;
    color: #1a4b82;
    text-shadow: 0 0 2px rgba(26, 75, 130, 0.3);
    pointer-events: none;
    letter-spacing: 2px;
}

/* ÇOKLU SAYFA KONTEYNERİ */
.sayfalar-kapsayici {
    position: absolute;
    top: 0.5cm;
    left: 0;
    width: 100%;
    height: calc(100% - 1cm);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-in-out;
}

.kitap-kapsayici.acildi .sayfalar-kapsayici {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.3s ease-in-out 1.1s;
}

/* HER BİR YAPRAK */
.sayfa-yaprak {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.0s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
}

.sayfa-yaprak.cevirdi {
    transform: rotateY(-180deg);
}

/* Sayfa İçerik Boyutu */
.sayfa-icerik {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% - 1.5cm);
    height: 100%;
    transform-style: preserve-3d;
}

.sayfa-on, .sayfa-arka {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

.sayfa-on img, .sayfa-arka img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.sayfa-arka {
    transform: rotateY(180deg);
}

/* SAYFA İÇİ YAZILAR */
.sayfa-yazi {
    position: absolute;
    top: 0.3cm;
    left: 0.3cm;
    width: calc(100% - 0.6cm);
    height: calc(100% - 1.1cm);
    font-family: 'Dancing Script', cursive, serif;
    line-height: 1.3;
    color: #1a4b82;
    text-align: left;
    text-shadow: 0 0 3px rgba(26, 75, 130, 0.35), 0 0 1px rgba(26, 75, 130, 0.6);
    box-sizing: border-box;
    pointer-events: none;
    backface-visibility: hidden;
    overflow: hidden;
    word-break: normal;
    overflow-wrap: break-word;
    hyphens: none;
    white-space: pre-wrap;
    font-size: 10.5pt;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
}

.sayfa-yazi.goster {
    opacity: 1;
}

/* ÜSTTEKİ HAREKETLİ KAPAK */
.kapak-alan {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    cursor: pointer;
    transition: transform 2.0s ease-in-out;
    z-index: 30;
}

.kapak-alan.dondu {
    transform: rotateY(-180deg);
    z-index: 1;
}

.kapak,
.kapak-arka-kapak {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    backface-visibility: hidden;
}

.kapak {
    position: relative;
}

.kapak-arka-kapak {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateY(180deg);
}

.kapak-yazi {
    position: absolute;
    top: 50%;
    left: calc(50% + 1cm);
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(10px, 1.25vw, 22px);
    line-height: 1.7;
    color: #d6ad38;
    text-shadow:
        -1px -1px 1px rgba(55, 32, 5, 0.95),
        1px 1px 0 rgba(255, 226, 120, 0.75),
        0 0 1px rgba(245, 198, 65, 0.8),
        0 1px 2px rgba(45, 25, 3, 0.9);
    letter-spacing: 0.3px;
    backface-visibility: hidden;
}

.kapak-yazi .imza {
    text-align: center;
    display: block;
    transform: translate(0.3cm, 1.7em);
}
</style>
</head>

<body>

<div class="kitap-kapsayici" id="kitapKapsayici">

    <!-- 1. ALT KAPAK -->
    <div class="sag-kapak">
        <img src="kapak.jpg" alt="Alt Kapak">
    </div>

    <!-- AÇIK KİTAP GÖVDESİ -->
    <div class="acik-kitap-alan" id="acikKitapAlan">
        <img src="acik_kitap1.png" alt="Açık Kitap Gövdesi">
        <!-- Sabit Sol Kanat Yazı Alanı -->
        <div class="sol-kanat-yazi" id="solKanatYazi"></div>
        <!-- Sabit Sol Sayfa Numarası (Sayfa 1) -->
        <div class="sayfa-numara">1</div>
    </div>

    <!-- DİNAMİK YAPRAKLAR KONTEYNERİ -->
    <div class="sayfalar-kapsayici" id="sayfalarKapsayici"></div>

    <!-- ÜSTTEKİ AÇILAN KAPAK -->
    <div class="kapak-alan" id="kapakAlan">
        <img src="kapak.jpg" class="kapak" alt="Ön Kapak">
        
        <div class="kapak-yazi">
            Şiir'e hatıra.<br><br>
            kelimelerden..<br>
            hayattan..<br>
            Babasından.<br><br><br>
            <span class="imza">S.O.A</span>
        </div>

        <img src="kapak.jpg" class="kapak-arka-kapak" alt="Arka Kapak">
    </div>

</div>

<script>
window.addEventListener("load", function () {
    const kapsayici = document.getElementById("kitapKapsayici");
    const kapakAlan = document.getElementById("kapakAlan");
    const sayfalarKapsayici = document.getElementById("sayfalarKapsayici");
    const solKanatYazi = document.getElementById("solKanatYazi");
    const kapakImg = document.querySelector(".kapak");

    const yukseklik = kapakImg.getBoundingClientRect().height;
    const ikiCm = 2 * 96 / 2.54;
    const oran = (yukseklik + ikiCm) / yukseklik;
    kapsayici.style.transform = "translateX(8cm) scale(" + oran + ")";

    const baslikMetni = "KIZIM'a…\n\n";
    
    const solSayfaMetni = 
`Sevgili Şiir,
Bu satırları belki bir gün yüzümüzde bir tebessümle beraber okuyacağız..
belki de .. gözlerinden akmamaya inat eden bir damla gözyaşı ile
ama yine de gülümseyerek tek başına okuyacaksın.
Sonuçta yine ,  güldüğünde yanaklarında beliren ve görmeyi en çok sevdiğim gamzelerini göreceğim... nerede olduğumun bir önemi yok.`;

    const sagSayfaMetni = 
`Bilmeni isterim ki;
Ben bu şiirleri birilerine bir şey anlatmak için değil,
içimde kopan fırtınaları , bir yağmur misali kağıda dökmek için yazdım.
Ve bazılarını yıllar sonra sen bul diye sakladım. Çünkü ben buldum.

Sana bırakabileceğim hatıralar arasından biri de , bu şiirlerim.
Ve bu şiirleri benim sesimden duymak isteyebileceğini düşündüm..
Ben çok isterdim..
Bir gün bu sayfalarda kendinden bir parça bulursan, bil ki ,
o şiir senden önce yazılmış olsa bile, sana aittir.
Çünkü sen benim , yani bu kocaman gövdenin altındaki çelimsiz çocuğun ,
beklediği yaşama sebebisin.

Çünkü sen benim , yazdığım en güzel şiirsin...

Beni hep gülen gözlerle ve sana deliler gibi aşık bir kalple hatırla…

Hasretle gamzelerinden ve o küçük çenenden öperim.

Baban.`;

    const toplamYaprak = 25;
    let yaprakElementleri = [];
    let isRewinding = false;

    // İçerikleri sol sayfaya yerleştir
    function solSayfayiHazirla() {
        solKanatYazi.innerHTML = `<span class="sayfa-baslik">${baslikMetni.replace(/\n/g, "<br>")}</span>${solSayfaMetni.replace(/\n/g, "<br>")}`;
    }
    solSayfayiHazirla();

    // SAYFALARI OLUŞTUR
    for (let i = 0; i < toplamYaprak; i++) {
        const yaprakDiv = document.createElement("div");
        yaprakDiv.className = "sayfa-yaprak";
        yaprakDiv.style.zIndex = toplamYaprak - i;

        let onSayfaNo = (i * 2) + 2;   // Ön yüz (Örn: 2, 4, 6...)
        let arkaSayfaNo = (i * 2) + 3; // Arka yüz (Örn: 3, 5, 7...)

        yaprakDiv.innerHTML = `
            <div class="sayfa-icerik">
                <div class="sayfa-on">
                    <img src="sag_sayfa.png" alt="Sayfa Ön">
                    <div class="sayfa-yazi" id="yazi-on-${i}"></div>
                    <div class="sayfa-numara">${onSayfaNo}</div>
                </div>
                <div class="sayfa-arka">
                    <img src="sol_sayfa.png" alt="Sayfa Arka">
                    <div class="sayfa-yazi" id="yazi-arka-${i}"></div>
                    <div class="sayfa-numara">${arkaSayfaNo}</div>
                </div>
            </div>
        `;

        const yaziOn = yaprakDiv.querySelector(`#yazi-on-${i}`);
        const yaziArka = yaprakDiv.querySelector(`#yazi-arka-${i}`);
        
        yaziOn.innerHTML = `<span class="sayfa-baslik">Şiir ${onSayfaNo} (Ön)</span>` + sagSayfaMetni.replace(/\n/g, "<br>");
        yaziArka.innerHTML = `<span class="sayfa-baslik">Şiir ${arkaSayfaNo} (Arka)</span>` + sagSayfaMetni.replace(/\n/g, "<br>");

        sayfalarKapsayici.appendChild(yaprakDiv);
        yaprakElementleri.push(yaprakDiv);
    }

    // TIKLAMA AKIŞ KONTROLÜ (Hangi tarafa tıklanırsa tıklansın ileri doğru açılır)
    let tiklamaAdimi = 0;

    kapsayici.addEventListener("click", function (e) {
        if (!kapsayici.classList.contains("acildi") || isRewinding) return;
        e.stopPropagation();
        ileriGit();
    });

    function ileriGit() {
        if (tiklamaAdimi === 0) {
            // 1. Tık: Sol sayfa yazısı açılır (Sayfa 1)
            solKanatYazi.classList.add("goster");
            tiklamaAdimi++;
        } else if (tiklamaAdimi === 1) {
            // 2. Tık: İlk yaprağın ÖN yüzü açılır (Sayfa 2)
            const ilkSagYazi = document.getElementById("yazi-on-0");
            if (ilkSagYazi) ilkSagYazi.classList.add("goster");
            tiklamaAdimi++;
        } else {
            // Sonraki adımlar: Yaprak çevirme ve arka/ön yüz geçişleri
            let aktifYaprakIndex = yaprakElementleri.findIndex(y => !y.classList.contains("cevirdi"));
            
            if (aktifYaprakIndex !== -1) {
                let yaprak = yaprakElementleri[aktifYaprakIndex];
                let arkaYazi = document.getElementById(`yazi-arka-${aktifYaprakIndex}`);
                let sonrakiOnYazi = document.getElementById(`yazi-on-${aktifYaprakIndex + 1}`);

                if (!yaprak.classList.contains("cevirdi")) {
                    yaprak.style.zIndex = 50 + aktifYaprakIndex;
                    yaprak.classList.add("cevirdi");
                    
                    setTimeout(() => {
                        if (arkaYazi) arkaYazi.classList.add("goster");
                    }, 500);

                    if (aktifYaprakIndex === toplamYaprak - 1) {
                        setTimeout(otomatikGeriyeSar, 1500);
                    }
                } else {
                    if (sonrakiOnYazi && !sonrakiOnYazi.classList.contains("goster")) {
                        sonrakiOnYazi.classList.add("goster");
                    }
                }
            }
        }
    }

    function otomatikGeriyeSar() {
        isRewinding = true;
        let index = yaprakElementleri.length - 1;

        let rewindInterval = setInterval(function () {
            if (index >= 0) {
                yaprakElementleri[index].style.zIndex = 100;
                yaprakElementleri[index].classList.remove("cevirdi");
                
                const yOn = document.getElementById(`yazi-on-${index}`);
                const yArka = document.getElementById(`yazi-arka-${index}`);
                if (yOn) yOn.classList.remove("goster");
                if (yArka) yArka.classList.remove("goster");

                yaprakElementleri[index].style.zIndex = toplamYaprak - index;
                index--;
            } else {
                clearInterval(rewindInterval);

                setTimeout(function () {
                    solKanatYazi.classList.remove("goster");
                    const ilkSagYazi = document.getElementById("yazi-on-0");
                    if (ilkSagYazi) ilkSagYazi.classList.remove("goster");

                    kapsayici.classList.remove("acildi");
                    kapakAlan.classList.remove("dondu");
                    isRewinding = false;
                    tiklamaAdimi = 0;
                }, 400);
            }
        }, 100);
    }

    // KAPAK TIKLAMA MANTIĞI
    kapakAlan.addEventListener("click", function (e) {
        e.stopPropagation();
        if (isRewinding) return;

        if (kapsayici.classList.contains("acildi")) {
            kapsayici.classList.remove("acildi");
            kapakAlan.classList.remove("dondu");
            solKanatYazi.classList.remove("goster");
            tiklamaAdimi = 0;
            
            yaprakElementleri.forEach((y, index) => {
                y.classList.remove("cevirdi");
                y.style.zIndex = toplamYaprak - index;
                const yOn = document.getElementById(`yazi-on-${index}`);
                const yArka = document.getElementById(`yazi-arka-${index}`);
                if (yOn) yOn.classList.remove("goster");
                if (yArka) yArka.classList.remove("goster");
            });
        } else {
            kapsayici.classList.add("acildi");
            kapakAlan.classList.add("dondu");
            tiklamaAdimi = 0;
        }
    });
});
</script>

</body>
</html>
