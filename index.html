<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
}


/* KITAP */

.page {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    position: relative;
}

.page img {
    display: block;

    width: auto;
    height: 100vh;

    max-width: 100vw;

    object-fit: contain;
}


/* SOL SAYFA */

.left-page {
    position: absolute;

    top: 0;
    left: 0;

    width: 50%;
    height: 100%;

    background-image: url("arkaplan1.jpeg");
    background-repeat: no-repeat;
    background-position: left center;
    background-size: auto 100%;

    z-index: 2;
}

</style>
</head>

<body>

<div class="page">

    <img
        src="arkaplan1.jpeg"
        alt="Şiir Nefestir"
    >

    <div class="left-page"></div>

</div>

</body>
</html>
