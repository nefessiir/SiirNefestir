<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   ANA KITAP
   ========================================================= */

.book-stage {
    position: relative;

    width: min(100vw, 150vh);
    height: min(100vh, 66.6667vw);

    background-image: url("arkaplan0.jpeg");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
}


/* =========================================================
   SAYFALAR
   ========================================================= */

.page {
    position: absolute;

    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-position: center;

    pointer-events: none;
}


/* SAG SAYFA */

.right-page {
    left: 48.828125%;
    top: 13.2%;

    width: 38.411458%;
    height: calc(100% - 27.5%);

    background-image: url("sag_sayfa_bos.png");
}


/* SOL SAYFA */

.left-page {
    left: 19%;
    top: 13.2%;

    width: 34%;
    height: calc(100% - 27.5%);

    background-image: url("sag_sayfa_bos.png");

    transform: scaleX(-1);
}


/* =========================================================
   SIIR ALANLARI
   ========================================================= */

.poem {
    position: absolute;

    /*
     * Baslangic yarim satir yukarida.
     * Alt bitis noktasi korunuyor.
     */

    top: calc(23% - 0.5em);

    width: 25%;

    height: calc(61% + 0.5em);

    overflow: hidden;

    font-family: "Caveat", cursive;

    /*
     * 11 punto
     */

    font-size: 11pt;

    font-weight: 500;

    /*
     * Satir araligi
     */

    line-height: 1.55;

    letter-spacing: 0;

    color: #174a82;

    white-space: pre-wrap;

    word-break: normal;

    overflow-wrap: normal;

    text-shadow:
        0.2px 0.2px 0 rgba(23, 74, 130, 0.22);

    opacity: 1;
}

.left-poem {
    left: 23%;
}

.right-poem {
    left: 53%;
}


/* =========================================================
   YAZAN TUYLU KALEM
   ========================================================= */

.writing-quill {
    position: absolute;

    width: 78px;
    height: auto;

    pointer-events: none;

    z-index: 20;

    opacity: 0;

    transform-origin: center center;

    transition:
        left 0.08s linear,
        top 0.08s linear;

    filter:
        drop-shadow(0 1px 1px rgba(0,0,0,0.18));
}


/* =========================================================
   SOL ALTTAKI MUREKKEP + KALEM
   ========================================================= */

.corner-quill {
    position: absolute;

    left: calc(1.5% + 1cm);
    bottom: calc(-1% + 1cm);

    width: 140px;
    height: auto;

    pointer-events: none;

    z-index: 10;

    filter:
        drop-shadow(0 2px 2px rgba(0,0,0,0.2));
}


/* =========================================================
   SAGDAKI ILERLEME OKU
   ========================================================= */

.next-arrow {
    position: absolute;

    /*
     * Sag sayfanin hemen yani.
     */

    right: 1.5%;
    top: 50%;

    transform: translateY(-50%);

    width: 45px;
    height: 80px;

    border: none;
    outline: none;

    background: transparent;

    color: rgba(255,255,255,0.68);

    font-family: Arial, sans-serif;

    font-size: 70px;
    font-weight: 200;

    line-height: 80px;

    cursor: pointer;

    z-index: 50;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}


/*
 * Uzerine gelince hafif belirginlesir.
 */

.next-arrow:hover {

    color: rgba(255,255,255,0.92);

    transform:
        translateY(-50%)
        scale(1.05);
}


/*
 * Basinca kisa beyaz isik.
 */

.next-arrow.arrow-flash {

    animation:
        arrowFlash 0.38s ease;
}


@keyframes arrowFlash {

    0% {

        color:
            rgba(255,255,255,0.68);

        text-shadow:
            0 0 0 rgba(255,255,255,0);
    }

    45% {

        color: #fff;

        text-shadow:
            0 0 7px rgba(255,255,255,0.95),
            0 0 16px rgba(255,255,255,0.75),
            0 0 28px rgba(255,255,255,0.45);
    }

    100% {

        color:
            rgba(255,255,255,0.68);

        text-shadow:
            0 0 0 rgba(255,255,255,0);
    }
}


/* =========================================================
   SAYFA GECISI
   ========================================================= */

.page-fade {

    animation:
        pageFade 0.55s ease;
}


@keyframes pageFade {

    0% {
        opacity: 1;
    }

    35% {
        opacity: 0;
    }

    100% {
        opacity: 1;
    }
}


/* =========================================================
   GIZLI OLCUM ALANI
   ========================================================= */

#measurePoem {

    position: absolute;

    left: -100000px;
    top: 0;

    visibility: hidden;

    white-space: pre-wrap;

    overflow-wrap: normal;

    word-break: normal;

    height: auto;

    min-height: 0;

    margin: 0;
    padding: 0;
}


/* =========================================================
   KUCUK EKRAN
   ========================================================= */

@media (max-width: 700px) {

    .next-arrow {

        right: 0.5%;

        font-size: 55px;
    }

    .corner-quill {

        width: 105px;
    }

    .writing-quill {

        width: 60px;
    }
}

</style>
</head>


<body>

<div
    class="book-stage"
    id="bookStage"
>


    <!-- SOL SAYFA -->

    <div
        class="page left-page">
    </div>


    <!-- SAG SAYFA -->

    <div
        class="page right-page">
    </div>


    <!-- SOL SIIR -->

    <div
        class="poem left-poem"
        id="leftPoem">
    </div>


    <!-- SAG SIIR -->

    <div
        class="poem right-poem"
        id="rightPoem">
    </div>


    <!-- SOL ALT MUREKKEP VE KALEM -->

    <img
        src="murekkep_kalem.png"
        class="corner-quill"
        alt=""
    >


    <!-- YAZIYI CEKEN TUYLU KALEM -->

    <img
        src="yazan_kalem3.png"
        class="writing-quill"
        id="writingQuill"
        alt=""
    >


    <!-- SAGDAKI ILERLEME OKU -->

    <button
        class="next-arrow"
        id="nextArrow"
        aria-label="Sonraki sayfa">
        ›
    </button>


    <!-- GIZLI OLCUM ALANI -->

    <div
        id="measurePoem">
    </div>

</div>


<script>

/* =========================================================
   TEST SIIRLERI
   =========================================================
   
   Burasi sadece TEST icindir.
   
   1. uzun test siiri
   2. Abbas
   
   Bunlar arsive alinmaz.
   ========================================================= */

const poems = [

    {
        title: "Test Siiri",
        text:
`BURAYA UZUN TEST SIIRINI YAPISTIR.`
    },

    {
        title: "Abbas",
        text:
`Haydi Abbas, vakit tamam;
Akşam diyordun işte oldu akşam.
Kur bakalım çilingir soframızı;
Dinsin artık bu kalb ağrısı.

Şu ağacın gölgesinde olsun;
Tam kenarında havuzun.
Aya haber sal çıksın bu gece;
Görünsün şöyle gönlümce.

Bas kırbacı sihirli seccadeye,
Göster hükmettiğini mesafeye
Ve zamana.

Katıp tozu dumana,
Var git,

Böyle ferman etti Cahit,

Al getir ilk sevgiliyi Beşiktaş'tan;
Yaşamak istiyorum gençliğimi yeni baştan.`
    }

];


/* =========================================================
   ELEMENTLER
   ========================================================= */

const stage =
    document.getElementById("bookStage");

const leftPoem =
    document.getElementById("leftPoem");

const rightPoem =
    document.getElementById("rightPoem");

const measurePoem =
    document.getElementById("measurePoem");

const writingQuill =
    document.getElementById("writingQuill");

const nextArrow =
    document.getElementById("nextArrow");


/* =========================================================
   DURUM
   ========================================================= */

let currentPoemIndex = 0;

let currentSpreadIndex = 0;

let poemPages = [];

let activeTypingToken = 0;

let activeTypingFinished = false;

let movingToNextPage = false;


/* =========================================================
   OLCUM ALANI
   ========================================================= */

function prepareMeasureArea() {

    const style =
        window.getComputedStyle(leftPoem);

    measurePoem.style.fontFamily =
        style.fontFamily;

    measurePoem.style.fontSize =
        style.fontSize;

    measurePoem.style.fontWeight =
        style.fontWeight;

    measurePoem.style.lineHeight =
        style.lineHeight;

    measurePoem.style.letterSpacing =
        style.letterSpacing;

    measurePoem.style.textShadow =
        style.textShadow;

    measurePoem.style.width =
        leftPoem.getBoundingClientRect().width
        + "px";

    measurePoem.style.padding =
        style.padding;

    measurePoem.style.margin =
        style.margin;
}


/* =========================================================
   METIN YUKSEKLIGI
   ========================================================= */

function measureTextHeight(text) {

    prepareMeasureArea();

    measurePoem.style.height =
        "auto";

    measurePoem.textContent =
        text;

    return measurePoem
        .getBoundingClientRect()
        .height;
}


/* =========================================================
   GERCEK SATIRLARI BUL
   ========================================================= */

function getWrappedLines(text) {

    prepareMeasureArea();

    const paragraphs =
        text.split("\n");

    const result = [];

    for (
        const paragraph of paragraphs
    ) {

        if (
            paragraph.trim() === ""
        ) {

            result.push("");

            continue;
        }

        const words =
            paragraph.split(/\s+/);

        let currentLine = "";

        for (
            const word of words
        ) {

            const candidate =
                currentLine === ""
                    ? word
                    : currentLine
                        + " "
                        + word;

            measurePoem.textContent =
                candidate;

            const candidateHeight =
                measurePoem
                    .getBoundingClientRect()
                    .height;

            if (
                currentLine !== "" &&
                candidateHeight >
                getPageHeight()
            ) {

                result.push(
                    currentLine
                );

                currentLine =
                    word;

            } else {

                currentLine =
                    candidate;
            }
        }

        if (
            currentLine !== ""
        ) {

            result.push(
                currentLine
            );
        }
    }

    return result;
}


/* =========================================================
   SAYFA YUKSEKLIGI
   ========================================================= */

function getPageHeight() {

    return leftPoem
        .getBoundingClientRect()
        .height;
}


/* =========================================================
   SATIRLARI SAYFALARA DAGIT
   ========================================================= */

function splitLinesIntoPages(lines) {

    prepareMeasureArea();

    const pageHeight =
        getPageHeight();

    const pages = [];

    let currentPage = [];

    for (
        const line of lines
    ) {

        const candidateLines =
            currentPage.concat([line]);

        const candidateText =
            candidateLines.join("\n");

        const candidateHeight =
            measureTextHeight(
                candidateText
            );

        if (
            currentPage.length > 0 &&
            candidateHeight >
            pageHeight + 1
        ) {

            pages.push(
                currentPage.join("\n")
            );

            currentPage = [line];

        } else {

            currentPage.push(line);
        }
    }

    if (
        currentPage.length > 0
    ) {

        pages.push(
            currentPage.join("\n")
        );
    }

    return pages;
}


/* =========================================================
   SIIRI SAYFALARA HAZIRLA
   ========================================================= */

function createPoemPages(text) {

    const wrappedLines =
        getWrappedLines(text);

    return splitLinesIntoPages(
        wrappedLines
    );
}


/* =========================================================
   KALEMI GERCEK HARFIN ONUNE GOTUR
   ========================================================= */

function moveWritingQuillToCharacter(
    element,
    startIndex
) {

    if (!element) {

        writingQuill.style.opacity =
            "0";

        return;
    }

    const textNode =
        element.firstChild;

    if (!textNode) {

        writingQuill.style.opacity =
            "0";

        return;
    }

    if (
        startIndex < 0 ||
        startIndex >=
        textNode.textContent.length
    ) {

        writingQuill.style.opacity =
            "0";

        return;
    }

    const range =
        document.createRange();

    range.setStart(
        textNode,
        startIndex
    );

    range.setEnd(
        textNode,
        startIndex + 1
    );

    const rect =
        range.getBoundingClientRect();

    const stageRect =
        stage.getBoundingClientRect();


    /*
     * Kalem kelimenin tam onunde.
     */

    writingQuill.style.left =
        (
            rect.left -
            stageRect.left -
            8
        ) + "px";


    /*
     * Kalemin ucu satir hizasinda.
     */

    writingQuill.style.top =
        (
            rect.top -
            stageRect.top -
            45
        ) + "px";


    writingQuill.style.opacity =
        "1";
}


/* =========================================================
   BIR KELIMEYI YAZ
   ========================================================= */

function typeWord(
    element,
    word,
    token
) {

    return new Promise(
        resolve => {

            let index = 0;

            /*
             * Kelimenin ilk harfinin
             * metin icindeki yeri.
             */

            const wordStart =
                element
                    .textContent
                    .length;


            function writeNextCharacter() {

                if (
                    token !==
                    activeTypingToken
                ) {

                    resolve(false);

                    return;
                }


                /*
                 * Kelimenin ilk harfini yaz.
                 */

                if (
                    index === 0
                ) {

                    element.textContent +=
                        word[index];


                    /*
                     * Ilk harf DOM'a girdikten
                     * sonra gercek koordinatini
                     * aliyoruz.
                     */

                    moveWritingQuillToCharacter(
                        element,
                        wordStart
                    );

                    index++;

                    setTimeout(
                        writeNextCharacter,
                        55
                    );

                    return;
                }


                /*
                 * Kelimenin kalan harfleri.
                 */

                if (
                    index >= word.length
                ) {

                    resolve(true);

                    return;
                }


                element.textContent +=
                    word[index];


                /*
                 * Kalem kelimenin basinda
                 * kalmaya devam ediyor.
                 */

                moveWritingQuillToCharacter(
                    element,
                    wordStart
                );

                index++;

                setTimeout(
                    writeNextCharacter,
                    55
                );
            }


            writeNextCharacter();
        }
    );
}


/* =========================================================
   METNI KELIME KELIME YAZ
   ========================================================= */

async function typeText(
    element,
    text,
    token
) {

    element.textContent = "";

    const parts =
        text.match(/\S+\s*|\s+/g)
        || [];


    for (
        const part of parts
    ) {

        if (
            token !==
            activeTypingToken
        ) {

            return false;
        }


        /*
         * Sadece bosluksa direkt ekle.
         */

        if (
            /^\s+$/.test(part)
        ) {

            element.textContent +=
                part;

            continue;
        }


        const match =
            part.match(
                /^(\S+)(\s*)$/
            );


        if (!match) {
            continue;
        }


        const word =
            match[1];

        const spaces =
            match[2];


        const finished =
            await typeWord(
                element,
                word,
                token
            );


        if (!finished) {
            return false;
        }


        /*
         * Kelime bittikten sonra
         * bosluklari ekle.
         */

        element.textContent +=
            spaces;
    }


    return true;
}


/* =========================================================
   TEK SAYFA YAZ
   ========================================================= */

async function typePage(
    element,
    text,
    token
) {

    if (!text) {

        element.textContent =
            "";

        writingQuill.style.opacity =
            "0";

        return true;
    }


    return await typeText(
        element,
        text,
        token
    );
}


/* =========================================================
   SPREAD YAZ
   ========================================================= */

async function typeSpread() {

    const token =
        ++activeTypingToken;

    activeTypingFinished =
        false;

    writingQuill.style.opacity =
        "0";

    leftPoem.textContent =
        "";

    rightPoem.textContent =
        "";


    const leftText =
        poemPages[
            currentSpreadIndex
        ] || "";


    const rightText =
        poemPages[
            currentSpreadIndex + 1
        ] || "";


    /*
     * Her spread soldan baslar.
     */

    const leftFinished =
        await typePage(
            leftPoem,
            leftText,
            token
        );


    if (!leftFinished) {
        return;
    }


    /*
     * Sonra saga devam eder.
     */

    const rightFinished =
        await typePage(
            rightPoem,
            rightText,
            token
        );


    if (!rightFinished) {
        return;
    }


    writingQuill.style.opacity =
        "0";

    activeTypingFinished =
        true;
}


/* =========================================================
   SIIRI HAZIRLA
   ========================================================= */

function prepareCurrentPoem() {

    const poem =
        poems[currentPoemIndex];

    if (!poem) {
        return;
    }


    poemPages =
        createPoemPages(
            poem.text
        );


    currentSpreadIndex =
        0;
}


/* =========================================================
   SIIRI BASLAT
   ========================================================= */

async function startPoem(index) {

    if (
        index < 0 ||
        index >= poems.length
    ) {
        return;
    }


    currentPoemIndex =
        index;


    prepareCurrentPoem();


    await typeSpread();
}


/* =========================================================
   SONRAKI SAYFA
   ========================================================= */

async function nextPage() {

    if (
        movingToNextPage
    ) {

        return;
    }


    if (
        !activeTypingFinished
    ) {

        return;
    }


    /*
     * OK BASINCA ISIK.
     */

    nextArrow.classList.remove(
        "arrow-flash"
    );

    void nextArrow.offsetWidth;

    nextArrow.classList.add(
        "arrow-flash"
    );


    /*
     * AYNI SIIRIN DEVAMI
     */

    if (
        currentSpreadIndex + 2
        < poemPages.length
    ) {

        movingToNextPage =
            true;


        leftPoem.classList.add(
            "page-fade"
        );

        rightPoem.classList.add(
            "page-fade"
        );


        setTimeout(
            async () => {

                leftPoem.classList.remove(
                    "page-fade"
                );

                rightPoem.classList.remove(
                    "page-fade"
                );


                currentSpreadIndex +=
                    2;


                movingToNextPage =
                    false;


                await typeSpread();

            },
            550
        );


        return;
    }


    /*
     * SIIR BITTIYSE
     * SONRAKI SIIR
     */

    if (
        currentPoemIndex + 1
        < poems.length
    ) {

        movingToNextPage =
            true;


        leftPoem.classList.add(
            "page-fade"
        );

        rightPoem.classList.add(
            "page-fade"
        );


        setTimeout(
            async () => {

                leftPoem.classList.remove(
                    "page-fade"
                );

                rightPoem.classList.remove(
                    "page-fade"
                );


                movingToNextPage =
                    false;


                await startPoem(
                    currentPoemIndex + 1
                );

            },
            550
        );
    }
}


/* =========================================================
   OKA TIKLAMA
   ========================================================= */

nextArrow.addEventListener(
    "click",
    nextPage
);


/* =========================================================
   BASLAT
   ========================================================= */

async function initializeBook() {

    if (
        document.fonts &&
        document.fonts.ready
    ) {

        await document.fonts.ready;
    }


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    startPoem(0);

                }
            );

        }
    );
}


initializeBook();

</script>

</body>
</html>
