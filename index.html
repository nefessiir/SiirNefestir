<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şiir Nefestir</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #110a04;
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* 1. TÜM SAHNE VE DUVAR DOKUSU (CSS İLE ESKİTME DUVAR) */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 75% 45%, rgba(255, 180, 80, 0.25) 0%, rgba(180, 90, 20, 0.1) 35%, transparent 70%),
                radial-gradient(circle at 50% 50%, rgba(140, 90, 35, 0.9) 0%, rgba(60, 35, 12, 0.95) 60%, rgba(15, 8, 3, 1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Duvar Lekeleri/Dokusu */
        .wall-texture {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(0,0,0,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.4) 0%, transparent 40%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 5px);
            pointer-events: none;
            z-index: 1;
        }

        /* 2. AHŞAP MASA YÜZEYİ */
        .table-surface {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 28%;
            background: linear-gradient(to bottom, #1d1008 0%, #100803 40%, #080401 100%);
            border-top: 2px solid rgba(80, 45, 18, 0.4);
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* 3. SAF CSS İLE GAZ LAMBASI (SOL/SAĞ UYUMLU, KÜÇÜLTÜLMÜŞ) */
        .oil-lamp {
            position: absolute;
            right: 12%;
            bottom: 18%;
            width: 90px;
            height: 270px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        /* Lamba Camı */
        .lamp-glass {
            width: 44px;
            height: 110px;
            background: linear-gradient(to right, rgba(255,255,255,0.05), rgba(255,255,255,0.25) 30%, rgba(255,255,255,0.05) 70%, rgba(255,255,255,0.2));
            border-radius: 40% 40% 15% 15% / 70% 70% 20% 20%;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            box-shadow: inset 0 0 10px rgba(255,200,120,0.2);
        }

        /* Alev ve Parlama */
        .flame {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 26px;
            background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffcc00 40%, #ff4500 80%, transparent 100%);
            border-radius: 50% 50% 35% 35%;
            box-shadow: 0 0 20px #ff9900, 0 0 40px #ff6600;
            animation: flameFlicker 0.15s infinite alternate;
        }

        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1) rotate(-1deg); opacity: 0.95; }
            100% { transform: translateX(-50%) scale(1.08) rotate(1deg); opacity: 1; }
        }

        /* Metal Mekanizma */
        .lamp-burner {
            width: 52px;
            height: 22px;
            background: linear-gradient(to right, #3d2b1f, #8c6339 50%, #2b1d14);
            border-radius: 3px;
            border: 1px solid #1a100a;
            margin-top: -2px;
        }

        /* Yağ Haznesi (Alt Cam Container) */
        .lamp-base {
            width: 76px;
            height: 80px;
            background: radial-gradient(circle at 40% 30%, rgba(212, 140, 65, 0.5), rgba(70, 40, 15, 0.8));
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            margin-top: -4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        .lamp-foot {
            width: 64px;
            height: 24px;
            background: linear-gradient(to right, #2b1d14, #6e4a27, #1a100a);
            border-radius: 50% 50% 10% 10%;
            margin-top: -6px;
        }

        /* Lambanın Etrafa Yaydığı Sıcak Işık */
        .lamp-glow {
            position: absolute;
            right: 8%;
            bottom: 22%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 170, 60, 0.28) 0%, rgba(200, 100, 20, 0.08) 50%, transparent 75%);
            border-radius: 50%;
            z-index: 4;
            pointer-events: none;
            animation: lightPulse 3s infinite alternate ease-in-out;
        }

        @keyframes lightPulse {
            0% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        /* 4. ANA KİTAP SAHNESİ (MASA ÜSTÜNDE DENGELİ) */
        .book-container {
            position: relative;
            z-index: 10;
            width: min(82vw, 860px);
            height: min(60vh, 520px);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            margin-top: 40px;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            background: #24140b;
            border-radius: 8px;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.95),
                inset 0 0 15px rgba(0,0,0,0.9);
            display: flex;
            padding: 14px;
            border: 1px solid rgba(90, 50, 20, 0.5);
        }

        .pages-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            background: #ebd8ac;
            background-image: 
                radial-gradient(circle at 50% 50%, #f3e3bc 0%, #cca973 100%),
                linear-gradient(to right, rgba(0,0,0,0.18) 0%, transparent 6%, transparent 94%, rgba(0,0,0,0.18) 100%);
            border-radius: 3px;
            box-shadow: inset 0 0 25px rgba(80, 45, 10, 0.4);
            overflow: hidden;
        }

        /* Kitap Omurga Gölgesi */
        .spine-shadow {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 8%;
            transform: translateX(-50%);
            background: linear-gradient(to right, 
                rgba(0,0,0,0.3) 0%, 
                rgba(0,0,0,0.05) 35%, 
                rgba(0,0,0,0.45) 50%, 
                rgba(0,0,0,0.05) 65%, 
                rgba(0,0,0,0.3) 100%);
            z-index: 15;
            pointer-events: none;
        }

        /* Sayfalar */
        .page {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .page-left {
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        /* Şiir Metni */
        .poem-content {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            line-height: 1.5;
            color: #261607;
            white-space: pre-line;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            text-shadow: 0 0 1px rgba(38, 22, 7, 0.2);
        }

        .poem-content.visible {
            opacity: 1;
        }

        /* Oklar */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(15, 10, 6, 0.75);
            border: 1px solid rgba(212, 133, 62, 0.4);
            color: #d4953e;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .nav-btn:hover {
            background: rgba(35, 20, 12, 0.95);
            color: #f5e0b8;
            border-color: rgba(212, 133, 62, 0.85);
            box-shadow: 0 0 15px rgba(212, 133, 62, 0.4);
        }

        .prev-btn { left: -60px; }
        .next-btn { right: -60px; }

        .page-number {
            font-size: 0.85rem;
            color: #6e5235;
            text-align: center;
            font-family: 'Cinzel', serif;
            opacity: 0.75;
        }

        @media (max-width: 768px) {
            .book-container {
                width: 94vw;
                height: 68vh;
            }
            .page {
                padding: 22px 16px;
            }
            .poem-content {
                font-size: 1.3rem;
            }
            .oil-lamp {
                right: 4%;
                scale: 0.75;
            }
            .nav-btn {
                top: auto;
                bottom: -50px;
                transform: none;
            }
            .prev-btn { left: 20%; }
            .next-btn { right: 20%; }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="wall-texture"></div>
        <div class="table-surface"></div>

        <!-- SAF CSS GAZ LAMBASI VE IŞIĞI -->
        <div class="lamp-glow"></div>
        <div class="oil-lamp">
            <div class="lamp-glass">
                <div class="flame"></div>
            </div>
            <div class="lamp-burner"></div>
            <div class="lamp-base"></div>
            <div class="lamp-foot"></div>
        </div>

        <!-- KİTAP VAKUMLU ALAN -->
        <div class="book-container">
            <button class="nav-btn prev-btn" onclick="prevPage()">&#10094;</button>

            <div class="book">
                <div class="pages-wrapper">
                    <div class="spine-shadow"></div>

                    <!-- SOL SAYFA -->
                    <div class="page page-left">
                        <div class="poem-content" id="leftPoem"></div>
                        <div class="page-number" id="leftPageNum">1</div>
                    </div>

                    <!-- SAĞ SAYFA -->
                    <div class="page page-right">
                        <div class="poem-content" id="rightPoem"></div>
                        <div class="page-number" id="rightPageNum">2</div>
                    </div>
                </div>
            </div>

            <button class="nav-btn next-btn" onclick="nextPage()">&#10095;</button>
        </div>
    </div>

    <script>
        const poemStanzas = [
            `Yoksam düşlerinde
Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor`,

            `Bir sessizlik büyüyor
İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor`,

            `Ben seni beklerken
Zaman ağır ağır geçiyor
Her geçen gün biraz daha
İçimde büyüyor özlemin`,

            `Bir gün dönersin diye
Penceremde ışık yanıyor
Gecenin en sessiz yerinde
Adını fısıldıyor rüzgar`,

            `Belki uzaklardasın
Belki hemen yanımdasın
Ama ben yine de seni
Kalbimin içinde arıyorum`,

            `Ne zaman gözlerimi kapatsam
Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun`
        ];

        let currentPagePair = 0;

        const leftPoem = document.getElementById('leftPoem');
        const rightPoem = document.getElementById('rightPoem');
        const leftPageNum = document.getElementById('leftPageNum');
        const rightPageNum = document.getElementById('rightPageNum');

        function renderPages() {
            leftPoem.classList.remove('visible');
            rightPoem.classList.remove('visible');

            setTimeout(() => {
                const leftIndex = currentPagePair * 2;
                const rightIndex = leftIndex + 1;

                leftPoem.textContent = poemStanzas[leftIndex] || '';
                rightPoem.textContent = poemStanzas[rightIndex] || '';

                leftPageNum.textContent = leftIndex + 1;
                rightPageNum.textContent = rightIndex + 1;

                leftPoem.classList.add('visible');
                rightPoem.classList.add('visible');
            }, 300);
        }

        function nextPage() {
            if ((currentPagePair + 1) * 2 < poemStanzas.length) {
                currentPagePair++;
                renderPages();
            }
        }

        function prevPage() {
            if (currentPagePair > 0) {
                currentPagePair--;
                renderPages();
            }
        }

        renderPages();
    </script>
</body>
</html>
