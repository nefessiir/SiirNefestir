<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şiir Nefestir</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #eee1c9 0%,
            #d5bea0 48%,
            #a88a68 100%
        );

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}

/* =========================================================
   SAHNE
   ========================================================= */

.scene {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    perspective: 3200px;
}

/* =========================================================
   KITAP
   ========================================================= */

.book {
    position: relative;

    width: min(
        94vw,
        calc(84vh * 1.40),
        1450px
    );

    aspect-ratio: 1.40;

    transform-style: preserve-3d;
}

/* =========================================================
   IC SAYFALAR
   ========================================================= */

.page {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.09),
            transparent 9%,
            transparent 91%,
            rgba(0,0,0,.06)
        ),
        #f3e8d1;

    box-shadow:
        0 12px 28px rgba(0,0,0,.22);
}

.page-left {
    left: 0;

    border-radius:
        18px 0 0 18px;

    z-index: 10;
}

.page-right {
    right: 0;

    border-radius:
        0 18px 18px 0;

    z-index: 10;
}

/* =========================================================
   SOL IC SAYFA - GUN BATIMI
   ========================================================= */

.sunset {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 72% 62%,
            rgba(255,224,146,.95) 0%,
            rgba(255,190,105,.65) 8%,
            transparent 24%
        ),
        linear-gradient(
            to bottom,
            #d68761 0%,
            #e6a073 28%,
            #efc08d 48%,
            #6e919f 49%,
            #486f7e 68%,
            #263f4b 100%
        );
}

.sunset::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 51%;

    background:
        repeating-linear-gradient(
            175deg,
            rgba(255,255,255,.13) 0px,
            rgba(255,255,255,.13) 2px,
            transparent 2px,
            transparent 12px
        );

    opacity: .45;
}

/* =========================================================
   YELKENLI
   ========================================================= */

.sailboat {
    position: absolute;

    left: 48%;
    top: 58%;

    width: 80px;
    height: 55px;

    z-index: 3;
}

.sailboat .mast {
    position: absolute;

    left: 39px;
    top: 0;

    width: 2px;
    height: 48px;

    background: #2e2a27;
}

.sailboat .sail {
    position: absolute;

    left: 4px;
    top: 7px;

    width: 36px;
    height: 35px;

    background: #eee4d0;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.sailboat .hull {
    position: absolute;

    left: 17px;
    top: 42px;

    width: 52px;
    height: 9px;

    background: #302823;

    border-radius:
        0 0 30px 30px;
}

/* =========================================================
   ICINDEKILER
   ========================================================= */

.contents {
    position: absolute;

    inset: 0;

    padding:
        11%
        10%
        10%
        12%;

    color: #3e2b20;
}

.contents h1 {
    margin: 0 0 8% 0;

    text-align: center;

    font-size:
        clamp(
            22px,
            2.4vw,
            38px
        );

    font-weight: normal;

    letter-spacing: 2px;
}

.contents-list {
    display: flex;
    flex-direction: column;

    gap: 12px;

    font-size:
        clamp(
            13px,
            1.25vw,
            21px
        );
}

.contents-row {
    display: flex;
    align-items: baseline;

    gap: 8px;
}

.contents-row .dots {
    flex: 1;

    border-bottom:
        1px dotted rgba(62,43,32,.45);

    transform:
        translateY(-4px);
}

/* =========================================================
   ORTA CILT
   ========================================================= */

.binding {
    position: absolute;

    top: 0;
    left: 50%;

    width: 28px;
    height: 100%;

    transform:
        translateX(-50%);

    z-index: 80;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.20),
            rgba(255,255,255,.16) 35%,
            rgba(0,0,0,.16) 65%,
            rgba(255,255,255,.08)
        );

    box-shadow:
        0 0 15px rgba(0,0,0,.15);
}

/* =========================================================
   KAPAK
   SADECE KAPALI KITAPTA GORUNUR
   ========================================================= */

.cover {
    position: absolute;

    top: 0;
    left: 0;

    width: 50%;
    height: 100%;

    z-index: 200;

    overflow: hidden;

    transform-origin: right center;

    transform-style: preserve-3d;

    border-radius:
        8px 0 0 8px;

    background: #3b2619;

    box-shadow:
        12px 15px 30px rgba(0,0,0,.35);

    transition: none;
}

/*
   GERCEK KAPAK GORSELI
*/

.cover-image {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    object-position: center;

    backface-visibility: hidden;
}

/*
   KAPAGIN IC TARAFI
   Acildiginda gorunen taraf budur.
*/

.cover-inside {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            #432918,
            #65422a 50%,
            #3b2417
        );

    transform:
        rotateY(180deg);

    backface-visibility: hidden;
}

/* =========================================================
   DONEN IC SAYFA
   ========================================================= */

.turn-page {
    position: absolute;

    top: 0;
    right: 0;

    width: 50%;
    height: 100%;

    z-index: 150;

    transform-origin: left center;

    transform-style: preserve-3d;

    pointer-events: none;
}

.page-front,
.page-back {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: #f3e8d1;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    border-radius:
        0 18px 18px 0;
}

.page-front {
    z-index: 2;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.10),
            transparent 10%,
            transparent 94%,
            rgba(0,0,0,.05)
        ),
        #f3e8d1;
}

.page-back {
    z-index: 3;

    transform:
        rotateY(180deg);

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.05),
            transparent 10%,
            transparent 90%,
            rgba(0,0,0,.08)
        ),
        #f3e8d1;
}

/* =========================================================
   DONEN SAYFA ICERIGI
   ========================================================= */

.page-title {
    position: absolute;

    top: 12%;
    left: 10%;
    right: 10%;

    text-align: center;

    color: #4b3426;

    font-size:
        clamp(
            20px,
            2vw,
            32px
        );

    font-weight: normal;

    letter-spacing: 1px;
}

.page-text {
    position: absolute;

    top: 23%;
    left: 12%;
    right: 12%;

    color: #4b3426;

    font-size:
        clamp(
            14px,
            1.25vw,
            21px
        );

    line-height: 1.8;
}

/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 800px) {

    .book {
        width: 96vw;
        aspect-ratio: 1.40;
    }

    .page {
        border-radius: 10px;
    }

    .binding {
        width: 18px;
    }

    .contents {
        padding: 8%;
    }

    .contents-list {
        gap: 7px;
    }

    .sailboat {
        transform: scale(.65);
        transform-origin: center;
    }
}

/* =========================================================
   TELEFON
   ========================================================= */

@media (max-width: 500px) {

    .book {
        width: 98vw;
    }

    .contents h1 {
        font-size: 20px;
    }

    .contents-list {
        font-size: 11px;
    }

    .page-text {
        font-size: 11px;
        line-height: 1.5;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="book" id="book">

        <!-- =================================================
             IC SOL SAYFA
             ================================================= -->

        <div class="page page-left">

            <div class="sunset"></div>

            <div class="sailboat">
                <div class="mast"></div>
                <div class="sail"></div>
                <div class="hull"></div>
            </div>

        </div>

        <!-- =================================================
             IC SAG SAYFA
             ================================================= -->

        <div class="page page-right">

            <div class="contents">

                <h1>İÇİNDEKİLER</h1>

                <div class="contents-list">

                    <div class="contents-row">
                        <span>Şairler Ağlamaz</span>
                        <span class="dots"></span>
                        <span>01</span>
                    </div>

                    <div class="contents-row">
                        <span>Kırılgan Bir Şiirim</span>
                        <span class="dots"></span>
                        <span>02</span>
                    </div>

                    <div class="contents-row">
                        <span>Bir Çiçek Sevdim</span>
                        <span class="dots"></span>
                        <span>09</span>
                    </div>

                    <div class="contents-row">
                        <span>Gidiyorum</span>
                        <span class="dots"></span>
                        <span>20</span>
                    </div>

                    <div class="contents-row">
                        <span>Bir Anlık Mutluluk</span>
                        <span class="dots"></span>
                        <span>21</span>
                    </div>

                </div>

            </div>

        </div>

        <!-- =================================================
             DONEN SAYFA
             ================================================= -->

        <div
            class="turn-page"
            id="turnPage"
        >

            <div class="page-front">

                <div class="page-title">
                    ŞİİR NEFESTİR
                </div>

                <div class="page-text">
                    Bazı kelimeler söylenmek için değil,
                    yıllar sonra yeniden bulunmak için yazılır.
                </div>

            </div>

            <div class="page-back"></div>

        </div>

        <!-- =================================================
             ORTA CILT
             ================================================= -->

        <div class="binding"></div>

        <!-- =================================================
             KAPAK
             SADECE KAPALIYKEN GORSEL
             ================================================= -->

        <div
            class="cover"
            id="cover"
        >

            <img
                class="cover-image"
                src="kapak-gorsel.jpg"
                alt="Şiir Nefestir"
            >

            <div class="cover-inside"></div>

        </div>

    </div>

</div>

<script>
const book =
    document.getElementById("book");

const cover =
    document.getElementById("cover");

const turnPage =
    document.getElementById("turnPage");

let progress = 0;

let dragging = false;

let startX = 0;

let startProgress = 0;

/* =========================================================
   RENDER
   ========================================================= */

function render() {

    /*
       Sayfanin donusu
    */

    const angle =
        -180 * progress;

    /*
       Ortada hafif dalga
    */

    const curve =
        Math.sin(
            progress * Math.PI
        );

    const rotateX =
        curve * 0.45;

    const rotateZ =
        curve * 0.20;

    turnPage.style.transform =
        "rotateY(" +
        angle +
        "deg) " +

        "rotateX(" +
        rotateX +
        "deg) " +

        "rotateZ(" +
        rotateZ +
        "deg)";

    /*
       Sayfa golgesi
    */

    const shadow =
        0.08 +
        curve * 0.14;

    turnPage.style.filter =
        "drop-shadow(" +
        "3px 6px 14px rgba(0,0,0," +
        shadow +
        "))";

    /*
       KAPAK HAREKETI

       Kapak sadece kendi ekseninde doner.
       Ic sayfalara karismaz.
    */

    const coverAngle =
        -180 * progress;

    cover.style.transform =
        "rotateY(" +
        coverAngle +
        "deg)";
}

/* =========================================================
   FARE / DOKUNMATIK
   ========================================================= */

book.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        startX =
            event.clientX;

        startProgress =
            progress;

        book.setPointerCapture(
            event.pointerId
        );
    }
);

book.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }

        const rect =
            book.getBoundingClientRect();

        const movement =
            (
                startX -
                event.clientX
            ) /
            (
                rect.width * 0.50
            );

        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    startProgress +
                    movement
                )
            );

        render();
    }
);

book.addEventListener(
    "pointerup",
    function(event) {

        if (!dragging) {
            return;
        }

        dragging = false;

        progress =
            progress > 0.5
            ? 1
            : 0;

        animateTo(progress);
    }
);

book.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

        progress =
            progress > 0.5
            ? 1
            : 0;

        animateTo(progress);
    }
);

/* =========================================================
   ANIMASYON
   ========================================================= */

function animateTo(target) {

    const start =
        progress;

    const duration =
        550;

    const startTime =
        performance.now();

    function animate(time) {

        const elapsed =
            time -
            startTime;

        const t =
            Math.min(
                1,
                elapsed /
                duration
            );

        const eased =
            1 -
            Math.pow(
                1 - t,
                3
            );

        progress =
            start +
            (
                target -
                start
            ) *
            eased;

        render();

        if (t < 1) {

            requestAnimationFrame(
                animate
            );

        } else {

            progress =
                target;

            render();
        }
    }

    requestAnimationFrame(
        animate
    );
}

/* =========================================================
   BASLANGIC
   ========================================================= */

progress = 0;

render();
</script>

</body>
</html>
