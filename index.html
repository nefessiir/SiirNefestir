<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Şiir Nefestir</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #080808;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

/* =========================================
   KITAP SAHNESI VE ARKA PLAN (Sıcak Ahşap/Masa Dokusu)
========================================= */

.book-stage {
    position: relative;
    width: min(98vw, 150vh);
    height: min(98vh, 66.6667vw);
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    /* Arka plan: Zengin sıcak ahşap/deri tonları */
    background: #1c1410;
    background-image: 
        radial-gradient(ellipse at 50% 50%, rgba(138, 90, 56, 0.25) 0%, rgba(0,0,0,0.85) 100%),
        linear-gradient(135deg, #2b1d14 0%, #170f0b 50%, #0d0806 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.95), inset 0 0 120px rgba(0,0,0,0.8);
    border-radius: 8px;
    border: 1px solid rgba(212, 175, 55, 0.15);
    overflow: hidden;
    container-type: inline-size;
}

/* 3D Sahne Konteyneri - Tam Omurga Hizalaması */
.book-3d-wrapper {
    position: absolute;
    top: 13.2%;
    left: 10%;
    width: 80%;
    height: calc(100% - 27.5%);
    perspective: 2500px;
}

/* =========================================
   SAYFA DOKUSU VE RENKLERİ (Eski Sıcak Parşömen)
========================================= */

.page-bg-texture {
    position: absolute;
    inset: 0;
    background-color: #f7eedc;
    background-image: 
        radial-gradient(ellipse at 50% 50%, #fbf6ea 0%, #ece1c9 80%, #dfcea8 100%),
        linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.02) 6%, rgba(0,0,0,0) 12%);
    box-shadow: inset 0 0 25px rgba(130, 95, 45, 0.22);
    border-radius: 2px 6px 6px 2px;
}

.left-page .page-bg-texture {
    background-image: 
        radial-gradient(ellipse at 50% 50%, #fbf6ea 0%, #ece1c9 80%, #dfcea8 100%),
        linear-gradient(to left, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.03) 6%, rgba(0,0,0,0) 12%);
    border-radius: 6px 2px 2px 6px;
}

/* OMURGA DERİNLİK GÖLGESİ */
.spine-shadow {
    position: absolute;
    left: 50%;
    top: -2%;
    bottom: -2%;
    width: 48px;
    transform: translateX(-50%);
    background: linear-gradient(to right, 
        rgba(0,0,0,0) 0%, 
        rgba(35,20,10,0.3) 30%, 
        rgba(0,0,0,0.55) 50%, 
        rgba(35,20,10,0.3) 70%, 
        rgba(0,0,0,0) 100%);
    z-index: 25;
    pointer-events: none;
}

/* =========================================
   SAYFALAR
========================================= */

.page {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    overflow: hidden;
}

.left-page {
    left: 0;
    z-index: 2;
}

.right-page {
    left: 50%;
    z-index: 2;
    cursor: grab;
}

.right-page:active {
    cursor: grabbing;
}

/* =========================================
   SAYFA İÇERİĞİ VE ŞİİR METNİ
========================================= */

.page-content {
    position: absolute;
    left: 12%;
    top: 10%;
    width: 76%;
    height: 80%;
    overflow: hidden;
    z-index: 5;
}

.poem {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 0;
    color: #174a82; /* Orijinal koyu mavi şiir rengi */
    font-family: "Caveat", cursive;
    font-size: 2.1cqw;
    font-weight: 500;
    line-height: 1.55;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: normal;
    opacity: 0;
    transition: opacity 0.8s ease;
}

/* =========================================
   FLIPPER (SÜRÜKLENEN SAYFA KATMANI)
========================================= */

.flipper {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    transform-origin: left center !important;
    transform-style: preserve-3d;
    z-index: 30;
    pointer-events: none;
    display: none;
}

.flipper.active {
    display: block;
}

.flipper-face {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    backface-visibility: hidden;
    overflow: hidden;
}

.flipper-front {
    z-index: 2;
    transform: rotateY(0deg);
}

.flipper-back {
    z-index: 1;
    transform: rotateY(180deg);
}

.curl-shadow-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.06) 70%, rgba(0,0,0,0.28) 100%);
}

/* =========================================
   ARKA PLAN TÜY KALEM SÜSLERİ (Açı & Duruş Düzeltildi)
========================================= */

.quill-watermark {
    position: absolute;
    width: 75%;
    height: 75%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-35deg);
    opacity: 0.18;
    pointer-events: none;
    z-index: 1;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));
}

.quill-watermark-flip {
    transform: translate(-50%, -50%) scaleX(-1) rotate(-35deg);
}

/* =========================================
   SOL ALT KÖŞE MÜREKKEPLİ TÜY KALEM
========================================= */

.ink-quill-wrapper {
    position: absolute;
    left: 3.5%;
    bottom: 2.5%;
    width: 8.5cqw;
    height: 8.5cqw;
    z-index: 40;
    pointer-events: none;
    filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.6));
}

/* =========================================
   KONTROLLER VE GEZİNTİ OKLARI
========================================= */

.nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 5cqw;
    height: 5cqw;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 4cqw;
    line-height: 1;
    cursor: pointer;
    z-index: 50;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-arrow:hover {
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.8);
    transform: translateY(-50%) scale(1.1);
}

.left-arrow { left: 2%; }
.right-arrow { right: 2%; }

.top-controls {
    position: absolute;
    top: 3%;
    left: 3%;
    z-index: 60;
    display: flex;
    gap: 1cqw;
}

.control-button {
    width: 4cqw;
    height: 4cqw;
    min-width: 28px;
    min-height: 28px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    background: rgba(0,0,0,0.3);
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    font-size: 1.8cqw;
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-button:hover {
    background: rgba(0,0,0,0.6);
    color: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
}

.equalizer {
    position: absolute;
    left: 50%;
    bottom: 2.5%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 0.4cqw;
    height: 2.5cqw;
    z-index: 40;
}

.equalizer span {
    display: block;
    width: 0.3cqw;
    min-width: 2px;
    height: 30%;
    background: rgba(255,255,255,0.45);
    border-radius: 2px;
}
</style>
</head>

<body>

<div class="book-stage" id="bookStage">

    <!-- ÜST KONTROLLER -->
    <div class="top-controls">
        <button class="control-button" title="Sesli dinle" onclick="toggleAudio()">🔊</button>
        <button class="control-button" title="Tam ekran" onclick="toggleFullscreen()">⛶</button>
    </div>

    <!-- 3D KİTAP ALANI -->
    <div class="book-3d-wrapper" id="bookWrapper">

        <!-- OMURGA DERİNLİK GÖLGESİ -->
        <div class="spine-shadow"></div>

        <!-- SOL SAYFA -->
        <div class="page left-page" id="leftPage">
            <div class="page-bg-texture"></div>
            <!-- Zengin Arka Plan Tüy Süsü -->
            <svg class="quill-watermark quill-watermark-flip" viewBox="0 0 100 100">
                <path d="M85 10 C60 20, 20 40, 15 85 C25 75, 45 55, 85 10 Z" fill="#174a82"/>
                <path d="M15 85 Q 40 50, 85 10" stroke="#174a82" stroke-width="1.5" fill="none"/>
                <path d="M35 60 Q 25 55, 20 62" stroke="#174a82" stroke-width="1" fill="none"/>
                <path d="M45 48 Q 35 42, 30 50" stroke="#174a82" stroke-width="1" fill="none"/>
                <path d="M55 36 Q 45 30, 40 38" stroke="#174a82" stroke-width="1" fill="none"/>
            </svg>
            <div class="page-content">
                <div class="poem" id="leftPoem"></div>
            </div>
        </div>

        <!-- SAĞ SAYFA -->
        <div class="page right-page" id="rightPage">
            <div class="page-bg-texture"></div>
            <!-- Zengin Arka Plan Tüy Süsü -->
            <svg class="quill-watermark" viewBox="0 0 100 100">
                <path d="M85 10 C60 20, 20 40, 15 85 C25 75, 45 55, 85 10 Z" fill="#174a82"/>
                <path d="M15 85 Q 40 50, 85 10" stroke="#174a82" stroke-width="1.5" fill="none"/>
                <path d="M35 60 Q 25 55, 20 62" stroke="#174a82" stroke-width="1" fill="none"/>
                <path d="M45 48 Q 35 42, 30 50" stroke="#174a82" stroke-width="1" fill="none"/>
                <path d="M55 36 Q 45 30, 40 38" stroke="#174a82" stroke-width="1" fill="none"/>
            </svg>
            <div class="page-content">
                <div class="poem" id="rightPoem"></div>
            </div>
        </div>

        <!-- SÜRÜKLENEN / DÖNEN SAYFA (FLIPPER) -->
        <div class="flipper" id="flipper">
            <!-- Ön Yüz -->
            <div class="flipper-face flipper-front">
                <div class="page-bg-texture"></div>
                <svg class="quill-watermark" viewBox="0 0 100 100">
                    <path d="M85 10 C60 20, 20 40, 15 85 C25 75, 45 55, 85 10 Z" fill="#174a82"/>
                    <path d="M15 85 Q 40 50, 85 10" stroke="#174a82" stroke-width="1.5" fill="none"/>
                </svg>
                <div class="page-content">
                    <div class="poem" id="flipperFrontPoem" style="opacity: 1;"></div>
                </div>
                <div class="curl-shadow-overlay"></div>
            </div>
            <!-- Arka Yüz -->
            <div class="flipper-face flipper-back">
                <div class="page-bg-texture" style="border-radius: 6px 2px 2px 6px;"></div>
                <svg class="quill-watermark quill-watermark-flip" viewBox="0 0 100 100">
                    <path d="M85 10 C60 20, 20 40, 15 85 C25 75, 45 55, 85 10 Z" fill="#174a82"/>
                    <path d="M15 85 Q 40 50, 85 10" stroke="#174a82" stroke-width="1.5" fill="none"/>
                </svg>
                <div class="page-content">
                    <div class="poem" id="flipperBackPoem" style="opacity: 1;"></div>
                </div>
                <div class="curl-shadow-overlay"></div>
            </div>
        </div>

    </div>

    <!-- KÖŞEDEKİ MÜREKKEP VE TÜY KALEM GÖRSELİ -->
    <div class="ink-quill-wrapper">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Mürekkep Hokkası -->
            <ellipse cx="30" cy="80" rx="18" ry="10" fill="#111" />
            <path d="M 20 80 L 22 68 L 38 68 L 40 80 Z" fill="#222" />
            <ellipse cx="30" cy="68" rx="8" ry="3" fill="#000" />
            <!-- Tüy Kalem -->
            <path d="M 30 70 C 40 50, 65 25, 90 5 C 75 25, 55 55, 30 70 Z" fill="#d4af37" />
            <path d="M 30 70 C 45 45, 70 20, 90 5" stroke="#8a5a38" stroke-width="1.5" fill="none" />
            <!-- Altın Kalem Ucu -->
            <path d="M 27 74 L 30 70 L 33 74 L 30 82 Z" fill="#d4af37" stroke="#8a5a38" stroke-width="0.5" />
        </svg>
    </div>

    <!-- GEZİNTİ OKLARI -->
    <button class="nav-arrow left-arrow" onclick="previousPage()">‹</button>
    <button class="nav-arrow right-arrow" onclick="nextPage()">›</button>

    <!-- EQUALIZER -->
    <div class="equalizer">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

</div>

<script>
/* ELEMANLAR */
const leftPoem = document.getElementById("leftPoem");
const rightPoem = document.getElementById("rightPoem");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const bookWrapper = document.getElementById("bookWrapper");

const flipper = document.getElementById("flipper");
const flipperFrontPoem = document.getElementById("flipperFrontPoem");
const flipperBackPoem = document.getElementById("flipperBackPoem");

/* ŞİİR METNİ */
const poemText =
`Yoksam düşlerinde
Bakışların hep donuk
Gözlerin uzaklarda
Sanki beni arıyor

Bir sessizlik büyüyor
İçinde sakladığın
Söyleyemediğin sözler
Dudaklarında kalıyor

Ben seni beklerken
Zaman ağır ağır geçiyor
Her geçen gün biraz daha
İçimde büyüyor özlemin

Bir gün dönersin diye
Penceremde ışık yanıyor
Gecenin en sessiz yerinde
Adını fısıldıyor rüzgar

Belki uzaklardasın
Belki hemen yanımdasın
Ama ben yine de seni
Kalbimin içinde arıyorum

Ne zaman gözlerimi kapatsam
Bir başka yol açılıyor
O yolların sonunda
Yine sen duruyorsun

Yoksam düşlerinde
Bir gün hatırla beni
Çünkü ben bu dünyada
Seni beklemek için vardım

Bekle…!
Geliyorum!`;

/* YAZI BOYUTU VE SAYFA HESAPLAMA */
const measurePoem = document.createElement("div");
measurePoem.style.position = "absolute";
measurePoem.style.visibility = "hidden";
measurePoem.style.pointerEvents = "none";
measurePoem.style.fontFamily = '"Caveat", cursive';
measurePoem.style.whiteSpace = "nowrap";
document.body.appendChild(measurePoem);

function measureTextWidth(text, fontSize) {
    measurePoem.style.fontSize = fontSize;
    measurePoem.textContent = text;
    return measurePoem.getBoundingClientRect().width;
}

function getWrappedLines() {
    const pageContent = document.querySelector(".left-page .page-content");
    const availableWidth = pageContent.getBoundingClientRect().width;
    const currentFontSize = window.getComputedStyle(leftPoem).fontSize;
    const rawLines = poemText.split("\n");
    const result = [];

    for (const rawLine of rawLines) {
        if (rawLine.trim() === "") {
            result.push("");
            continue;
        }
        const words = rawLine.split(/\s+/);
        let currentLine = "";
        for (const word of words) {
            const testLine = currentLine ? currentLine + " " + word : word;
            if (measureTextWidth(testLine, currentFontSize) <= availableWidth) {
                currentLine = testLine;
            } else {
                if (currentLine) result.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine) result.push(currentLine);
    }
    return result;
}

function buildPages() {
    const lines = getWrappedLines();
    const pageContent = document.querySelector(".left-page .page-content");
    const pageRect = pageContent.getBoundingClientRect();

    const test = document.createElement("div");
    test.style.position = "absolute";
    test.style.visibility = "hidden";
    test.style.pointerEvents = "none";
    test.style.width = pageRect.width + "px";
    test.style.fontFamily = '"Caveat", cursive';
    test.style.fontSize = window.getComputedStyle(leftPoem).fontSize;
    test.style.lineHeight = "1.55";
    test.style.whiteSpace = "pre-wrap";
    test.textContent = "A";

    document.body.appendChild(test);
    const lineHeight = test.getBoundingClientRect().height;
    test.remove();

    const linesPerPage = Math.max(1, Math.floor(pageRect.height / lineHeight));
    const pagesList = [];
    for (let i = 0; i < lines.length; i += linesPerPage) {
        pagesList.push(lines.slice(i, i + linesPerPage));
    }
    return pagesList;
}

/* DURUM DEĞİŞKENLERİ */
let pages = [];
let pageIndex = 0;
let stageState = "left";
let animating = false;

function fadeIn(element) {
    element.style.opacity = "0";
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            element.style.opacity = "1";
        });
    });
}

function fadeOut(element) {
    element.style.opacity = "0";
}

function startBook() {
    pages = buildPages();
    pageIndex = 0;
    stageState = "left";

    leftPoem.textContent = pages[0] ? pages[0].join("\n") : "";
    rightPoem.textContent = "";

    leftPoem.style.opacity = "0";
    rightPoem.style.opacity = "0";
}

/* OMURGAYA KİLİTLİ SÜRÜKLEME MANTIĞI */
let isDragging = false;
let startX = 0;
let currentProgress = 0;

function onPointerDown(e) {
    if (animating) return;
    
    const rightRect = rightPage.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    if (!clientX || !clientY) return;

    if (clientX >= rightRect.left && clientX <= rightRect.right + 20 &&
        clientY >= rightRect.top && clientY <= rightRect.bottom) {
        
        isDragging = true;
        startX = clientX;
        
        if (stageState === "spread") {
            const nextLeftIndex = pageIndex + 2;
            flipperFrontPoem.textContent = rightPoem.textContent;
            flipperBackPoem.textContent = pages[nextLeftIndex] ? pages[nextLeftIndex].join("\n") : "";
        } else if (stageState === "right") {
            flipperFrontPoem.textContent = rightPoem.textContent;
            flipperBackPoem.textContent = "";
        } else {
            flipperFrontPoem.textContent = "";
            flipperBackPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        }

        flipper.style.transition = "none";
        flipper.classList.add("active");
    }
}

function onPointerMove(e) {
    if (!isDragging) return;

    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    if (!clientX) return;

    const deltaX = startX - clientX;
    const maxDistance = bookWrapper.getBoundingClientRect().width * 0.5;
    
    currentProgress = Math.min(Math.max(deltaX / maxDistance, 0), 1);

    const angle = currentProgress * -180;
    const skew = Math.sin(currentProgress * Math.PI) * -3;
    const translateY = Math.sin(currentProgress * Math.PI) * -1.5;

    flipper.style.transform = `rotateY(${angle}deg) rotateZ(${skew}deg) translateY(${translateY}%)`;
}

async function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;

    flipper.style.transition = "transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)";

    if (currentProgress > 0.3) {
        flipper.style.transform = `rotateY(-180deg) rotateZ(0deg) translateY(0%)`;
        await wait(500);

        if (stageState === "spread") {
            pageIndex += 2;
            leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
            rightPoem.textContent = pages[pageIndex + 1] ? pages[pageIndex + 1].join("\n") : "";
            leftPoem.style.opacity = "1";
            rightPoem.style.opacity = pages[pageIndex + 1] ? "1" : "0";
            stageState = pages[pageIndex + 1] ? "spread" : "right";
        } else if (stageState === "right") {
            if (pageIndex + 1 < pages.length) {
                rightPoem.textContent = pages[pageIndex + 1].join("\n");
                fadeIn(rightPoem);
                stageState = "spread";
            }
        } else if (stageState === "left") {
            leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
            fadeIn(leftPoem);
            stageState = "right";
        }
    } else {
        flipper.style.transform = `rotateY(0deg) rotateZ(0deg) translateY(0%)`;
        await wait(500);
    }

    flipper.classList.remove("active");
    flipper.style.transform = "";
}

/* EVENT LISTENERS */
window.addEventListener("mousedown", onPointerDown);
window.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerUp);

window.addEventListener("touchstart", onPointerDown, { passive: true });
window.addEventListener("touchmove", onPointerMove, { passive: true });
window.addEventListener("touchend", onPointerUp);

/* BUTON İLE SAYFA ÇEVİRME */
async function nextPage() {
    if (animating) return;
    animating = true;

    if (stageState === "left") {
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        fadeIn(leftPoem);
        stageState = "right";
        await wait(1000);
        animating = false;
        return;
    }

    if (stageState === "right") {
        if (pageIndex + 1 < pages.length) {
            rightPoem.textContent = pages[pageIndex + 1].join("\n");
            fadeIn(rightPoem);
            stageState = "spread";
            await wait(1000);
            animating = false;
            return;
        }
        stageState = "spread";
        animating = false;
        return;
    }

    if (stageState === "spread") {
        const nextLeftIndex = pageIndex + 2;
        const nextRightIndex = pageIndex + 3;

        flipperFrontPoem.textContent = rightPoem.textContent;
        flipperBackPoem.textContent = pages[nextLeftIndex] ? pages[nextLeftIndex].join("\n") : "";

        flipper.style.transition = "transform 1.1s cubic-bezier(0.4, 0, 0.2, 1)";
        flipper.classList.add("active");

        requestAnimationFrame(() => {
            flipper.style.transform = "rotateY(-180deg)";
        });

        rightPoem.textContent = pages[nextRightIndex] ? pages[nextRightIndex].join("\n") : "";

        await wait(1100);

        pageIndex += 2;
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        leftPoem.style.opacity = "1";

        flipper.classList.remove("active");
        flipper.style.transform = "";

        if (pageIndex < pages.length) {
            stageState = "right";
        } else {
            stageState = "finished";
        }

        animating = false;
        return;
    }
}

async function previousPage() {
    if (animating || (pageIndex === 0 && stageState === "left")) return;
    animating = true;

    if (stageState === "right") {
        fadeOut(leftPoem);
        await wait(800);
        stageState = "left";
        animating = false;
        return;
    }

    if (stageState === "spread") {
        fadeOut(rightPoem);
        await wait(800);
        stageState = "right";
        animating = false;
        return;
    }

    if (stageState === "finished" || (stageState === "left" && pageIndex >= 2)) {
        pageIndex = Math.max(0, pageIndex - 2);
        leftPoem.textContent = pages[pageIndex] ? pages[pageIndex].join("\n") : "";
        rightPoem.textContent = pages[pageIndex + 1] ? pages[pageIndex + 1].join("\n") : "";
        fadeIn(leftPoem);
        if (pages[pageIndex + 1]) fadeIn(rightPoem);
        stageState = pages[pageIndex + 1] ? "spread" : "right";
        await wait(800);
    }

    animating = false;
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

function toggleAudio() {
    alert("Ses oynatma başlatıldı/durduruldu.");
}

let resizeTimer;
window.addEventListener("load", () => {
    setTimeout(startBook, 300);
});

window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        pages = buildPages();
    }, 200);
});
</script>
